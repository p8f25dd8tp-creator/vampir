:root {
  --bg: #05060c; --sys: #6ec8ff; --sys2: #bfe6ff; --sysbg: rgba(6, 16, 34, .92); --sysline: #3a8ad0;
  --blood: #ff3a4e; --gold: #e8c77a; --text: #eef2f8; --dim: #9aa6ba;
  --safe-t: env(safe-area-inset-top, 0px); --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-l: env(safe-area-inset-left, 0px); --safe-r: env(safe-area-inset-right, 0px);
}
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg); color: var(--text);
  overscroll-behavior: none; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  font-family: 'Cormorant Garamond', Georgia, serif; font-weight: 600; }
body { position: fixed; inset: 0; }
canvas#game { position: absolute; inset: 0; display: block; touch-action: none; }
#ui { position: absolute; inset: 0; pointer-events: none; z-index: 5; }
#ui .screen, #ui button, #ui .interactive { pointer-events: auto; }
.cinzel { font-family: 'Cinzel', serif; letter-spacing: .06em; }

/* ------------------------------------------------ Bildschirme */

/* ---- src/00-core.js ---- */
'use strict';
/* ==========================================================================
   MY VAMPIRE SYSTEM — Kern: Mathe, Farben, Speicherstand, Audio
   ========================================================================== */

const TAU = Math.PI * 2;
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(a + Math.random() * (b - a + 1));
const pick = (arr) => arr[(Math.random() * arr.length) | 0];
const dist2 = (ax, ay, bx, by) => { const dx = ax - bx, dy = ay - by; return dx * dx + dy * dy; };
const easeOut = (t) => 1 - (1 - t) * (1 - t);
const easeIn = (t) => t * t;
const easeInOut = (t) => (t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2);
const smooth = (t) => t * t * (3 - 2 * t);
function angDiff(a, b) { let d = (b - a) % TAU; if (d > Math.PI) d -= TAU; if (d < -Math.PI) d += TAU; return d; }

/* deterministischer Zufall (fuer Welt-Chunks und Texturen) */
function mulberry(seed) {
  let a = seed >>> 0;
  return function () {
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function hash2(x, y, s) {
  let h = (x * 374761393 + y * 668265263 + (s || 0) * 982451653) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return (h ^ (h >>> 16)) >>> 0;
}

/* Farbhilfen */
function hexRgb(h) {
  const n = parseInt(h.slice(1), 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}
function rgba(h, a) { const c = hexRgb(h); return `rgba(${c[0]},${c[1]},${c[2]},${a})`; }
function shade(h, f) {
  const c = hexRgb(h);
  const m = (v) => clamp(Math.round(f >= 0 ? v + (255 - v) * f : v * (1 + f)), 0, 255);
  return `rgb(${m(c[0])},${m(c[1])},${m(c[2])})`;
}

/* ------------------------------------------------------------ Speicherstand */
const SAVE_KEY = 'mvs.save.v1';
const DEFAULT_SAVE = {
  progress: {},        // missionId -> { done, best }
  quinn: { level: 1, exp: 0, points: 0, stats: { str: 10, agi: 10, sta: 10 }, skills: [], blood: {}, gear: {}, bank: 0, bloodFrom: {} },
  day: { n: 1, night: false, sun: 0, water: false },
  flags: {},
  credits: 10,
  settings: { sfx: 0.8, music: 0.5, shake: 1, easyCombo: false, wideDodge: false }
};
let SAVE = loadSave();
function loadSave() {
  let s = null;
  try { s = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null'); } catch (e) { s = null; }
  const base = JSON.parse(JSON.stringify(DEFAULT_SAVE));
  if (!s || typeof s !== 'object') return base;
  for (const k in base) {
    if (s[k] === undefined) s[k] = base[k];
    else if (typeof base[k] === 'object' && !Array.isArray(base[k])) for (const kk in base[k]) if (s[k][kk] === undefined) s[k][kk] = base[k][kk];
  }
  return s;
}
function writeSave() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(SAVE)); } catch (e) { /* privat/gesperrt */ } }
function resetSave() { SAVE = JSON.parse(JSON.stringify(DEFAULT_SAVE)); writeSave(); }

/* ------------------------------------------------------------------ Audio */
const AudioSys = (() => {
  let ac = null, master = null, sfxBus = null, musicBus = null, comp = null;
  let noiseBuf = null;
  const last = {};
  function init() {
    if (ac) { if (ac.state === 'suspended') ac.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    ac = new AC();
    comp = ac.createDynamicsCompressor();
    comp.threshold.value = -16; comp.knee.value = 10; comp.ratio.value = 5;
    master = ac.createGain(); master.gain.value = 0.9;
    sfxBus = ac.createGain(); musicBus = ac.createGain();
    sfxBus.connect(comp); musicBus.connect(master); comp.connect(master); master.connect(ac.destination);
    applyVolumes();
    noiseBuf = ac.createBuffer(1, ac.sampleRate * 1.5, ac.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  function applyVolumes() {
    if (!ac) return;
    sfxBus.gain.value = SAVE.settings.sfx * 0.55;
    musicBus.gain.value = SAVE.settings.music * 0.35;
  }
  function env(g, t, a, peak, d) {
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(peak, t + a);
    g.gain.exponentialRampToValueAtTime(0.0001, t + a + d);
  }
  function tone(type, f0, f1, dur, vol, when, bus) {
    const t = ac.currentTime + (when || 0);
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(f0, t);
    if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
    env(g, t, 0.006, vol, dur);
    o.connect(g); g.connect(bus || sfxBus); o.start(t); o.stop(t + dur + 0.05);
  }
  function noise(dur, vol, fType, f0, f1, q, when) {
    const t = ac.currentTime + (when || 0);
    const s = ac.createBufferSource(); s.buffer = noiseBuf;
    const f = ac.createBiquadFilter(); f.type = fType; f.Q.value = q || 1;
    f.frequency.setValueAtTime(f0, t);
    if (f1 && f1 !== f0) f.frequency.exponentialRampToValueAtTime(f1, t + dur);
    const g = ac.createGain(); env(g, t, 0.004, vol, dur);
    s.connect(f); f.connect(g); g.connect(sfxBus);
    s.start(t, Math.random() * 0.5); s.stop(t + dur + 0.05);
  }

function makePose(spec, st) {
  const run = st.run || 0, ph = st.phase || 0, t = st.t || 0;
  const cast = st.cast || 0, hurt = st.hurt || 0, dead = st.dead || 0, dodge = st.dodge || 0;

  const kneel = smooth(clamp(dead * 1.6, 0, 1));
  const crouch = (spec.crouch || 0) + rooted * 4 + dodge * 5;
  const stride = spec.stride * run * (1 - kneel);
  const lift = spec.lift * run * (1 - kneel);
  const bob = -(Math.abs(Math.cos(ph))) * 1.6 * run;
  P.hipX = 0;
  P.hipY = spec.hipY + bob + crouch + kneel * spec.legL * 0.75 + breathe * 0.3;
  P.lean = (spec.lean || 0) + 0.16 * run - hurt * 0.32 + cast * 0.06 + kneel * 0.45 + dodge * 0.35 - rooted * 0.05;
  const tor = spec.torso;

  P.neckY = P.hipY - Math.cos(P.lean) * tor + breathe;
  const hl = P.lean * 0.7 - hurt * 0.35 + kneel * 0.3;
  P.headX = P.neckX + Math.sin(hl) * spec.headOff;
  P.headY = P.neckY - Math.cos(hl) * spec.headOff;
  P.headA = hl;
  // Schultern (vorne / hinten, leichte 3/4-Sicht)
  const sa = P.lean;

  P.shB = [P.neckX - sx * spec.shoulderW * 0.5 - sy * shDrop, P.neckY - sy * spec.shoulderW * 0.5 + sx * shDrop];

  const legs = [];

    let fy = -Math.max(0, Math.cos(p)) * lift;
    if (rooted > 0) { fx = lerp(fx, hx + (i === 0 ? 7 : -7), rooted); fy = lerp(fy, 0, rooted); }
    if (dodge > 0) { fx = lerp(fx, hx + (i === 0 ? 6 : -9), dodge); fy = lerp(fy, i === 0 ? 0 : -2, dodge); }
    if (kneel > 0) { fx = lerp(fx, hx + (i === 0 ? 7 : -9), kneel); fy = lerp(fy, 0, kneel); }

    const swing = -Math.sin(p) * 0.75 * run;
    let ang = Math.PI / 2 + 0.15 + swing - P.lean * 0.4 + (spec.armRest || 0) * (i === 0 ? 1 : 0.6);

}

// Umhang / Band-Kurve, die im Lauf nach hinten weht (deterministisch)
function flowCurve(ax, ay, len, n, flow, t, seed, droop, lift) {
  const pts = [[ax, ay]];
  let x = ax, y = ay;
  const seg = len / n;
  for (let i = 1; i <= n; i++) {
    const s = i / n;
    const wave = Math.sin(t * (6 + flow * 5) - s * 5 + seed) * (0.18 + flow * 0.32) * s;
    const back = lerp(droop === undefined ? 0.12 : droop, 1.25 + (lift || 0), flow) * Math.pow(s, 0.7);
    const a = Math.PI / 2 + back + wave;
    x += Math.cos(a) * seg; y += Math.sin(a) * seg;
    pts.push([x, y]);
  }
  return pts;
}

const INPUT = { mx: 0, my: 0, keys: {}, events: [], atkHeld: false, stick: null };
function pushInput(type) { INPUT.events.push(type); }
function readMove() {
  let x = INPUT.mx, y = INPUT.my;
  const K = INPUT.keys;
  const kx = (K.ArrowRight || K.KeyD ? 1 : 0) - (K.ArrowLeft || K.KeyA ? 1 : 0);
  const ky = (K.ArrowDown || K.KeyS ? 1 : 0) - (K.ArrowUp || K.KeyW ? 1 : 0);
  if (kx || ky) { const l = Math.hypot(kx, ky); x = kx / l; y = ky / l; }
  return [x, y];
}
window.addEventListener('keydown', (e) => {
  if (e.repeat) return;
  INPUT.keys[e.code] = true;
  if (e.code === 'KeyJ') { INPUT.atkHeld = true; pushInput('atkDown'); }
  if (e.code === 'KeyK' || e.code === 'Space') pushInput('dodge');
  if (e.code === 'KeyI') pushInput('inspect');
  if (e.code === 'Enter') pushInput('advance');
});
window.addEventListener('keyup', (e) => {
  INPUT.keys[e.code] = false;
  if (e.code === 'KeyJ') { INPUT.atkHeld = false; pushInput('atkUp'); }
});

// Stick-Zone und Knoepfe werden vom HUD angelegt und hier verdrahtet
const STICK_R = 52;
function bindStick(zone, knobEl) {
  const base = knobEl.parentElement;
  zone.addEventListener('pointerdown', (e) => {
    if (INPUT.stick) return;
    e.preventDefault(); zone.setPointerCapture(e.pointerId);
    INPUT.stick = { id: e.pointerId, x: e.clientX, y: e.clientY };
    base.style.display = 'block'; base.style.left = e.clientX + 'px'; base.style.top = e.clientY + 'px';
    knobEl.style.transform = 'translate(0,0)';
  });
  zone.addEventListener('pointermove', (e) => {
    const S = INPUT.stick; if (!S || S.id !== e.pointerId) return;
    let dx = e.clientX - S.x, dy = e.clientY - S.y; const d = Math.hypot(dx, dy);
    if (d > STICK_R) { dx = dx / d * STICK_R; dy = dy / d * STICK_R; }
    const k = Math.min(1, d / STICK_R), dead = 0.15;
    const m = k < dead ? 0 : (k - dead) / (1 - dead);
    INPUT.mx = d ? dx / Math.min(d, STICK_R) * m : 0; INPUT.my = d ? dy / Math.min(d, STICK_R) * m : 0;
    knobEl.style.transform = `translate(${dx}px,${dy}px)`;
  });
  const end = (e) => {
    const S = INPUT.stick; if (!S || S.id !== e.pointerId) return;
    INPUT.stick = null; INPUT.mx = 0; INPUT.my = 0; base.style.display = 'none';
  };
  zone.addEventListener('pointerup', end); zone.addEventListener('pointercancel', end);
}
function bindButton(el, down, up) {
  el.addEventListener('pointerdown', (e) => { e.preventDefault(); el.setPointerCapture(e.pointerId); el.classList.add('on'); down && down(); AudioSys.init && AudioSys.init(); });
  const rel = (e) => { el.classList.remove('on'); up && up(); };
  el.addEventListener('pointerup', rel); el.addEventListener('pointercancel', rel);
}

/* ------------------------------------------------------------ Hauptzeichnung */
function renderFight() {
  const g = ctx;

  const cx = cv.width / 2 + rand(-sh, sh) * VIEW.dpr, cy = cv.height / 2 + rand(-sh, sh) * VIEW.dpr;
  g.setTransform(z, 0, 0, z, cx - G.cam.x * z, cy - G.cam.y * z);

  for (const r of A.sun || []) { g.save(); g.globalCompositeOperation = 'lighter'; g.fillStyle = 'rgba(255,230,160,0.18)'; g.fillRect(r.x, r.y, r.w, r.h); g.restore(); }

    g.save(); g.globalCompositeOperation = 'lighter'; g.globalAlpha = on ? 0.9 : 0.35 + pulse * 0.3;
    g.strokeStyle = P.col || '#8ad8ff'; g.lineWidth = 2; g.beginPath(); g.ellipse(P.x, P.y, 20, 8, 0, 0, TAU); g.stroke();
    g.drawImage(glowSprite(P.col || '#8ad8ff'), P.x - 22, P.y - 30, 44, 40);
    g.restore();
    g.font = '800 10px Cinzel, serif'; g.textAlign = 'center'; g.lineWidth = 3; g.strokeStyle = 'rgba(0,0,0,0.8)'; g.strokeText(P.label, P.x, P.y - 34); g.fillStyle = on ? '#ffffff' : (P.col || '#bfe6ff'); g.fillText(P.label, P.x, P.y - 34);
  }
  // Angriffsmarkierungen auf dem Boden

  // Schatten unter allen Figuren
  for (const e of G.ents) { if (e.draw) continue; g.fillStyle = 'rgba(0,0,0,0.3)'; g.beginPath(); g.ellipse(e.x, e.y + 1, 13, 4.5, 0, 0, TAU); g.fill(); }
  for (const f of G.fx) if (f.k === 'dust') { const k = f.t / f.life; g.globalAlpha = 0.35 * (1 - k); g.fillStyle = A.night ? '#8a90a8' : '#e8e0d0'; g.beginPath(); g.ellipse(f.x, f.y, f.size * (1 + k), f.size * 0.45 * (1 + k), 0, 0, TAU); g.fill(); }
  g.globalAlpha = 1;
  for (const f of G.fx) if (f.k === 'ghost') { const k = f.t / f.life; g.save(); g.translate(f.x, f.y); g.scale(f.face / f.px, 1 / f.px); g.globalAlpha = 0.4 * (1 - k); g.drawImage(flashSprite(f.img, f.col), -f.S / 2, -f.ay); g.restore(); }
  // Tische und Figuren nach Tiefe sortiert
  const list = [];
  for (const b of A.blocks || []) if (!b.invisible) list.push({ y: b.y + b.h, draw: () => drawTable(g, b) });
  for (const e of G.ents) list.push({ y: e.y, draw: () => (e.draw ? OBJ_ART[e.draw](g, e) : drawEnt(g, e)) });
  list.sort((a, b) => a.y - b.y);
  for (const it of list) it.draw();
  // Baumkronen

    g.fillStyle = 'rgba(10,30,10,0.28)'; g.beginPath(); g.ellipse(x + 8, y + 6, 30, 12, 0, 0, TAU); g.fill();
    g.fillStyle = '#4a3020'; g.fillRect(x - 3, y - 22, 6, 24);
    const sway = Math.sin(G.t * 1.2 + x) * 1.5;
    for (const [dx, dy, r, c] of [[0, -40, 22, '#2e5a28'], [-12, -32, 15, '#3a6a30'], [12, -34, 16, '#3a6a30'], [4, -46, 13, '#4a7a3a']]) { g.fillStyle = A.night ? shade(c, -0.55) : c; g.beginPath(); g.arc(x + dx + sway, y + dy, r, 0, TAU); g.fill(); }

    g.save(); g.translate(P.x, P.y - 22); g.rotate(P.a);
    if (P.kind === 'arrow') {
      g.strokeStyle = '#e8e0d0'; g.lineWidth = 1.6; g.beginPath(); g.moveTo(-14, 0); g.lineTo(6, 0); g.stroke();
      g.fillStyle = P.col; g.beginPath(); g.moveTo(6, -2.6); g.lineTo(12, 0); g.lineTo(6, 2.6); g.fill();
      g.globalCompositeOperation = 'lighter'; g.globalAlpha = 0.6; g.drawImage(glowSprite(P.col), -16, -8, 26, 16);
    } else if (P.kind === 'fire') {
      g.globalCompositeOperation = 'lighter';
      for (let k = 0; k < 4; k++) g.drawImage(glowSprite(k % 2 ? '#ffb040' : '#ff5a2a'), -10 - k * 7, -9 + Math.sin(G.t * 24 + k) * 3, 20, 18);
      g.fillStyle = 'rgba(255,240,200,0.9)'; g.beginPath(); g.arc(0, 0, 4, 0, TAU); g.fill();
    } else if (P.kind === 'spike') {
      g.fillStyle = lg(g, -12, 0, 8, 0, [0, '#5a6272', 1, '#e8eef8']); g.beginPath(); g.moveTo(-12, -1.4); g.lineTo(6, -1.4); g.lineTo(12, 0); g.lineTo(6, 1.4); g.lineTo(-12, 1.4); g.closePath(); g.fill();
      g.globalCompositeOperation = 'lighter'; g.globalAlpha = 0.4; g.drawImage(glowSprite('#c8d8f0'), -14, -7, 24, 14);
    } else if (P.kind === 'water') {
      g.globalCompositeOperation = 'lighter';
      for (let k = 0; k < 4; k++) g.drawImage(glowSprite('#6ec8ff'), -8 - k * 7, -8 + Math.sin(G.t * 20 + k) * 3, 18, 16);
      g.fillStyle = 'rgba(200,240,255,0.9)'; g.beginPath(); g.ellipse(0, 0, 8, 5, 0, 0, TAU); g.fill();
    } else {
      g.fillStyle = '#6a0010'; g.beginPath(); g.arc(-6, 0, 14, -1.2, 1.2); g.arc(-12, 0, 11, 1.1, -1.1, true); g.closePath(); g.fill();
      g.globalCompositeOperation = 'lighter'; g.fillStyle = 'rgba(255,40,70,0.85)'; g.beginPath(); g.arc(-6, 0, 13, -1.1, 1.1); g.arc(-11, 0, 11, 1.0, -1.0, true); g.closePath(); g.fill();

    const col = LOOKS[m.char].rim || '#fff';
    if (m === G.player) { g.fillStyle = col; g.beginPath(); g.moveTo(m.x - 5, m.y - 84); g.lineTo(m.x + 5, m.y - 84); g.lineTo(m.x, m.y - 78); g.fill(); }
    else { g.fillStyle = 'rgba(0,0,0,0.6)'; g.fillRect(m.x - 14, m.y - 80, 28, 4); g.fillStyle = col; g.fillRect(m.x - 14, m.y - 80, 28 * m.hp / m.maxHp, 4); }
  }
  // Schattengriff: dunkle Ranken um die Fuesse
  for (const e of G.ents) if (e.rootT > 0 && e.state !== 'down') {
    g.save(); g.fillStyle = 'rgba(10,0,20,0.75)'; g.beginPath(); g.ellipse(e.x, e.y + 1, e.r + 8, (e.r + 8) * 0.38, 0, 0, TAU); g.fill();
    g.strokeStyle = 'rgba(40,10,60,0.95)'; g.lineWidth = 2.2; g.lineCap = 'round';
    for (let k = 0; k < 5; k++) { const a = k / 5 * TAU + G.t, sx = e.x + Math.cos(a) * (e.r + 6), sy = e.y + Math.sin(a) * 4; g.beginPath(); g.moveTo(sx, sy); g.quadraticCurveTo(sx + Math.sin(G.t * 5 + k) * 5, sy - 10, e.x + Math.cos(a) * 3, e.y - 14 - k % 2 * 4); g.stroke(); }
    g.restore();
  }
  // Haertung (Rylee): graue Platte auf der gehaerteten Seite
  for (const e of G.ents) if (e.ai && e.ai.harden && e.state !== 'down') {
    const a = e.hardDir || 0, stag = e.state === 'stagger';
    g.save(); g.translate(e.x, e.y - 30); g.globalAlpha = stag ? 0.25 : 0.85;
    g.strokeStyle = '#d8e0ea'; g.lineWidth = 5; g.lineCap = 'round'; g.beginPath(); g.arc(0, 0, 20, a - 0.9, a + 0.9); g.stroke();
    g.strokeStyle = '#6a7686'; g.lineWidth = 2; g.beginPath(); g.arc(0, 0, 23, a - 0.9, a + 0.9); g.stroke();

    const k = f.t / f.life;
    if (f.k === 'spark') { g.globalAlpha = 1 - k; g.drawImage(glowSprite(f.col), f.x - f.size * 2, f.y - f.size * 2, f.size * 4, f.size * 4); }
    else if (f.k === 'swoosh') {

    g.fillStyle = 'rgba(50,10,80,0.32)'; g.fillRect(G.cam.x - VIEW.w, G.cam.y - VIEW.h, VIEW.w * 2, VIEW.h * 2);

  if (p && p.hp / p.maxHp < 0.35 && p.state !== 'down') { const a = 0.25 + Math.sin(G.t * 6) * 0.08; g.fillStyle = rg(g, W / 2, H / 2, Math.min(W, H) * 0.35, Math.max(W, H) * 0.8, [0, 'rgba(120,0,20,0)', 1, `rgba(140,0,20,${a})`]); g.fillRect(0, 0, W, H); }
}

function drawTele(g, T) {
  const k = clamp(T.t / T.dur, 0, 1), done = T.t >= T.dur;
  g.save(); g.translate(T.x, T.y);
  const col = done ? 'rgba(255,255,255,0.55)' : `rgba(255,60,40,${0.18 + k * 0.22})`;
  if (T.type === 'lunge' || T.type === 'beam') {
    const w = T.type === 'beam' ? T.w : 18;
    g.rotate(T.a);
    g.fillStyle = col; g.fillRect(0, -w / 2, T.r, w);
    g.fillStyle = 'rgba(255,90,60,0.55)'; g.fillRect(0, -w / 2, T.r * k, w);

function runScene(beats, done) {
  let i = -1, portrait = null, extra = null;

    i++;

      const b = beats[i];
      if (b.portrait !== undefined) { portrait = b.portrait; extra = b.extra || null; }
      if (b.bg) SCENE_BG.cur = b.bg;
      if (b.call) b.call();

    if (i >= beats.length) { done && done(); return; }
    const b = beats[i];
    let inner;
    if (b.sys) { inner = sysBox(b.sys) + '<div class="tap">TIPPEN</div>'; sfx('card'); }
    else if (b.narr) inner = `<div class="box narr"><div class="txt">${b.narr}</div><div class="tap">TIPPEN</div></div>`;

    if (C.goal !== gk) {
      C.goal = gk;
      $('#goal').innerHTML = `<div class="gh">TAG ${D.n}${D.night ? ' · NACHT' : ''}</div>${G.hubInfo.goal ? `<div class="gq">▸ ${G.hubInfo.goal}</div>` : ''}` +
        (SAVE.quinn.thirst ? `<div class="gd bad">Blutdurst · HP −${SAVE.quinn.thirst}</div>` : '') + (D.night ? '' : `<div class="gd">${D.water ? '✔' : '▫'} 2 Liter Wasser trinken</div><div class="gd ${D.sun >= 6 ? 'bad' : ''}">${D.sun < 6 ? '▫' : '✘'} Sonne meiden (${Math.min(6, D.sun).toFixed(0)} / 6 s)</div>`);
    }
  }
  const lowD = p.stam < 18;
  if (C.lowD !== lowD) { C.lowD = lowD; $('#bDodge').classList.toggle('cd', lowD); }
}
function banner(text) {
  if (!UI.hud) return;
  const el = document.createElement('div'); el.className = 'banner'; el.textContent = text;
  UI.hud.appendChild(el); setTimeout(() => el.remove(), 1200);
}
function sysMsg(S, ms) {
  const box = $('#sysmsg'); if (!box) return;
  box.innerHTML = sysBox(S); sfx('card');
  clearTimeout(sysMsg.tm); sysMsg.tm = setTimeout(() => { box.innerHTML = ''; }, ms || 3200);
}
function showPause() {
  if (!G || G.state !== 'play') return;
  G.paused = true;
  const el = document.createElement('div'); el.className = 'screen dim'; el.style.pointerEvents = 'auto';
  el.innerHTML = `${sysBox({ head: 'PAUSE', lines: [MISSION ? MISSION.title : ''], kv: [['Treffer gelandet', G.stats.hits], ['Perfekt ausgewichen', G.stats.perfect], ['Schaden erlitten', G.stats.taken]] })}
    <button class="btn" id="pRes">Weiter</button><button class="btn" id="pStat">Status${SAVE.quinn.points ? ' · +' + SAVE.quinn.points : ''}</button><button class="btn ghost" id="pRe">Kampf neu starten</button><button class="btn ghost" id="pMenu">Hauptmenü</button>`;
  UI.root.appendChild(el);
  el.querySelector('#pRes').onclick = () => { el.remove(); G.paused = false; };
  el.querySelector('#pStat').onclick = () => showStatus();
  el.querySelector('#pRe').onclick = () => { el.remove(); startMission(MISSION.id, true); };
  el.querySelector('#pMenu').onclick = () => { G = null; showTitle(); };
}

function testTick(G, dt) {
  const T = G.tut || (G.tut = { t: 0, best: 0, total: 0 });
  T.t += dt;
  const s = G.foe;
  s.meter = Math.max(0, (s.meter || 0) - dt * 0.6);
  const dealt = s.maxHp - s.hp;
  if (dealt > T.total) { s.meter = Math.min(1, s.meter + (dealt - T.total) * 0.12); T.total = dealt; }
  G.hint = { text: T.t < 12 ? `Messung läuft · ${Math.ceil(12 - T.t)} s<br><b>ANGRIFF</b> tippen oder halten` : 'Messung beendet' };
  if (T.t >= 12 && G.state === 'play') {
    G.state = 'won'; G.result = { total: T.total };
    sysMsg({ head: 'MESSUNG', kv: [['Gesamtwert', T.total.toFixed(1)], ['Einstufung', 'Stufe 1']] }, 2600);
    later(2.4, () => G.opt.onWin(G));
  }
}
function survivalTick(sec) {
  return function (G, dt) {
    const T = G.tut || (G.tut = { t: 0 });
    T.t += dt;
    G.hint = { text: T.t < sec ? `Durchhalten · ${Math.ceil(sec - T.t)} s` : '' };
    if (T.t >= sec && G.state === 'play') { G.state = 'won'; G.tele.length = 0; banner('GESCHAFFT'); later(1.2, () => G.opt.onWin(G)); }
  };
}
function monoTick(G, dt) {
  const T = G.tut || (G.tut = { t: 0 });
  T.t += dt;
  const ev = G.stats.evaded || 0;
  G.hint = { text: ev < 2 ? 'Greif Mono an' : T.inspected ? '' : 'Tippe <b>ANALYSE</b>' };
  if ((ev >= 6 && T.inspected) || T.t > 32) { if (G.state === 'play') { G.state = 'won'; G.tele.length = 0; later(0.8, () => G.opt.onWin(G)); } }
}

function tutorialTick(G, dt) {
  const T = G.tut || (G.tut = { step: 0, moved: 0, t: 0 });
  T.t += dt;
  const p = G.player;
  if (T.step === 0) {
    G.hint = { text: 'Links auf den Bildschirm tippen und ziehen, um zu laufen' };
    if (Math.hypot(p.vx, p.vy) > 40) T.moved += dt;
    if (T.moved > 0.6 || T.t > 7) { T.step = 1; T.t = 0; }
  } else if (T.step === 1) {
    G.hint = { text: '<b>ANGRIFF</b> tippen: drei Schläge in Folge' };
    if (G.stats.hits >= 3 || T.t > 10) { T.step = 2; T.t = 0; }
  } else if (T.step === 2) {
    G.hint = { text: 'Rote Fläche = Angriff kommt.<br>Im letzten Moment <b>AUSWEICHEN</b> → Konter' };
    if (G.stats.perfect >= 1) { T.step = 3; T.t = 0; }
    else if (T.t > 22) { T.step = 3; T.t = 0; }
  } else if (T.step === 3) {
    G.hint = { text: '<b>ANGRIFF</b> gedrückt halten: aufgeladener Schlag, bricht die Deckung' };
    if (T.t > 6) { T.step = 4; G.hint = null; }
  }
}

'use strict';
/* ==========================================================================
   FORTSCHRITT — EP, Stufen und Wertepunkte (frei, nicht an die Story gebunden)
   Jede Stufe gibt einen Wertepunkt (wie im Roman) fuer Staerke, Agilitaet
   oder Ausdauer. Evolutionen bleiben an die Story gebunden.
   ========================================================================== */

function expNeed(level) { return 100 + (level - 1) * 40; }
// EP gutschreiben; liefert die Zahl der Stufenaufstiege
function gainExp(n) {
  const Q = SAVE.quinn;
  n = Math.max(0, Math.round(n));
  Q.exp += n;
  let ups = 0;
  while (Q.exp >= expNeed(Q.level)) { Q.exp -= expNeed(Q.level); Q.level++; Q.points += Q.race === 'Vampir' ? 2 : 1; ups++; } // als Vampir 2 Punkte pro Stufe (Kap. 114)
  writeSave();
  return ups;
}
function addExp(n) {
  const ups = gainExp(n);
  if (ups && G && UI.hud) { banner('STUFE ' + SAVE.quinn.level); sfx('level'); sysMsg({ head: 'STUFENAUFSTIEG', lines: [`Stufe ${SAVE.quinn.level}`, `+${ups} Wertepunkt${ups > 1 ? 'e' : ''} – verteilen im Status`] }, 3200); }
  return ups;
}
// abgeleitete Werte
function quinnStats() {
  const S = SAVE.quinn.stats;
  const race = SAVE.quinn.race === 'Vampir' ? 15 : SAVE.quinn.race === 'Halbling' ? 5 : 0;
  const H = SAVE.quinn.gear.hands, gear = H === 'gauntlets' ? 3 : H === 'standard' ? 6 : 0; // Schwarzhorn-Handschuhe +3, Beste Standard-Handschuhe +6
  const feet = SAVE.quinn.gear.feet === 'wolf' ? 4 : 0; // Schwarzhorn-Wolfsstiefel: Agilitaet +4
  return { maxHp: 10 + race + (S.sta - 10), maxStam: 100 + (S.sta - 10) * 4, str: S.str + gear, agi: S.agi + feet };
}
const STAT_INFO = {
  str: { name: 'Stärke', desc: 'mehr Schaden pro Schlag' },
  agi: { name: 'Agilität', desc: 'schneller laufen und ausweichen' },

};

const SKILL_NAMES = { inspect: 'Analyse', bloodswipe: 'Blutschnitt', bloodbank: 'Blutbank', flashstep: 'Blitzschritt', hammer: 'Hammerschlag', bloodspray: 'Blutspray', daze: 'Betäubung', schatten: 'Schattenkontrolle', lager: 'Dimensionslager', mantel: 'Schattenmantel', hammerspray: 'Hammerspray', leere: 'Schattenleere', beeinflussung: 'Beeinflussung', sense: 'Schattensense', ritual: 'Blutritual (1/2)' };
// Blut trinken: jede Person gibt nur beim ersten Mal einen Wert (Roman: A Staerke, B Agilitaet, AB Ausdauer, 0 freier Punkt)
function drinkBlood(person, type) {
  const Q = SAVE.quinn;
  if (Q.bloodFrom[person]) return null;
  Q.bloodFrom[person] = type; Q.blood[type] = (Q.blood[type] || 0) + 1;
  const base = type.replace(/[+-]/, '');
  let gain;
  if (base === 'A') { Q.stats.str++; gain = 'Stärke +1'; }
  else if (base === 'B') { Q.stats.agi++; gain = 'Agilität +1'; }
  else if (base === 'AB') { Q.stats.sta++; gain = 'Ausdauer +1'; }
  else { Q.points++; gain = '1 freier Wertepunkt'; }
  if (Q.skills.includes('bloodbank')) Q.bank = Math.min(100, Q.bank + 30);
  writeSave();
  return gain;

function applyStats(p) {
  const D = quinnStats();
  const gain = D.maxHp - (p.maxHp || D.maxHp);
  p.maxHp = D.maxHp; p.hp = Math.min(D.maxHp, p.hp + Math.max(0, gain));
  p.maxStam = D.maxStam; p.str = D.str; p.agi = D.agi;
}

/* ------------------------------------------------------------ Kampfbericht */
function fightReport(G, won) {
  const lines = [], kv = [];
  let ep = Math.round(G.expGain || 0);
  if (G.opt.expBonus) ep += G.opt.expBonus(G, won);
  kv.push(['EP aus dem Kampf', '+' + ep]);
  if (G.stats.perfect) kv.push(['Perfekt ausgewichen', G.stats.perfect]);
  const lvl0 = SAVE.quinn.level;
  gainExp(ep);
  if (SAVE.quinn.level > lvl0) lines.push(`Stufenaufstieg! Stufe ${SAVE.quinn.level} · freie Wertepunkte: ${SAVE.quinn.points}`);
  return { head: won ? 'KAMPFBERICHT' : 'KAMPFBERICHT · NIEDERLAGE', lines, kv, up: SAVE.quinn.level > lvl0 };
}

}

// Blutspray (Kap. 66): Faecher aus Blut wie eine Schrotflinte, kostet 5 HP
function sprayFan(p, n, spread, dmg) {
  const f = nearestFoe(p, 200), [mx, my] = readMove();
  const a = f ? Math.atan2(f.y - p.y, f.x - p.x) : (mx || my) ? Math.atan2(my, mx) : (p.face > 0 ? 0 : Math.PI);
  p.face = Math.cos(a) >= 0 ? 1 : -1; p.anim.cast = 1; p.anim.aim = p.face > 0 ? a : Math.PI - a;
  const k = SAVE.quinn.gear.hands === 'standard' ? 1.05 : 1;
  for (let i = 0; i < n; i++) {
    const b = a + (n > 1 ? (i / (n - 1) - 0.5) * spread : 0);
    G.proj.push({ x: p.x + Math.cos(b) * 10, y: p.y + Math.sin(b) * 10, a: b, sp: 320, dist: 0, max: 95, dmg: dmg * k * (p.str * sunFactor(p) / 10), hit: new Set(), col: '#ff3a4e', kind: 'blood', kb: 60 });
  }
  sfx('splat', 0, 0.03); sfx('whip', 0, 0.05);
}
function castBloodSpray(p) {
  if (p.char !== 'quinn' || !hasSkill('bloodspray') || p.state === 'down' || p.state === 'hurt') return;
  if ((p.sprayCd || 0) > G.t) return;
  if (!G.opt.vr && p.hp <= 5) { floatText(p.x, p.y - 72, 'Zu wenig HP', '#ff8a8a'); return; }
  if (!G.opt.vr) { p.hp -= 5; floatText(p.x, p.y - 72, '-5 HP', '#ff5a6a'); }
  p.sprayCd = G.t + 0.9; G.stats.swipes = (G.stats.swipes || 0) + 1;
  sprayFan(p, 5, 1.0, 1.6);
}
// Hammerspray (Kap. 104): Hammerschlag plus Blutfaecher; frisst Ausdauer und etwas Blut
function hammerSpray(p) {
  if (p.stam < 12 || (!G.opt.vr && p.hp <= 3)) return;
  spendStam(p, 12, 0.4);
  if (!G.opt.vr) p.hp -= 2;
  sprayFan(p, 3, 0.6, 1.4);
  floatText(p.x, p.y - 86, 'HAMMERSPRAY', '#ff8a9a');
}
// Schattenkontrolle (Kap. 89–93): der Schatten packt die Beine des naechsten Gegners
function castShadow(p) {
  if (p.char !== 'quinn' || !hasSkill('schatten') || p.state === 'down') return;
  if (G.opt.vr) { floatText(p.x, p.y - 80, 'Im Spiel nicht verfügbar', '#c8a0ff'); return; }
  if (!p.maxMc || p.mc < 25) { floatText(p.x, p.y - 80, 'Zu wenig MC', '#c8a0ff'); return; }
  const f = nearestFoe(p, 180);
  if (!f) { floatText(p.x, p.y - 80, 'Kein Ziel', '#c8a0ff'); return; }
  p.mc -= 25; f.rootT = 1.8; p.anim.cast = 1;
  G.stats.shadow = (G.stats.shadow || 0) + 1;
  for (let k = 0; k < 10; k++) G.fx.push({ k: 'spark', x: f.x + rand(-14, 14), y: f.y + rand(-6, 2), vx: 0, vy: 0, life: 0.4, t: 0, col: '#8a4aff', size: 5 });
  floatText(f.x, f.y - 80, 'SCHATTEN', '#c8a0ff'); sfx('shadowstep');
  // Schattensense (Kap. 133): der Schatten fuehrt einen Blutschnitt als Klinge – trifft einmal, mit eigener Kraft
  if (hasSkill('sense')) later(0.15, () => { if (G && f.state !== 'down') { slash(f.x, f.y - 30, Math.atan2(f.y - p.y, f.x - p.x), 40, 1.2, '#8a4aff'); damageFoe(f, 3 * (p.str / 10), { kb: 80, ang: Math.atan2(f.y - p.y, f.x - p.x), poise: 2, heavy: true }); } });
}
function learn(...ids) { const Q = SAVE.quinn; for (const s of ids) if (!hasSkill(s)) Q.skills.push(s); writeSave(); }

/* ------------------------------------------------------------ Kampf-Hilfen */
function ratPack(n, spots, t0, dt) {
  return Array.from({ length: n }, (_, i) => ({ id: 'rat' + i, draw: 'rattaclaw', name: 'Rattenkralle', hp: 3, poise: 2, r: 13, at: spots[i % spots.length].map((v, j) => v + (j ? (i >> 2) * 12 : 0)), ai: AI_RAT, expRate: 1, expKill: 14,
    info: { name: 'Rattenkralle', race: 'Bestie · Basic-Stufe', ability: 'Rudeljäger, scharfe Krallen', blood: 'giftig – nicht trinkbar' } }));
}
function wakeTick(G, maxAwake) { // Rudel: hoechstens maxAwake greifen gleichzeitig an, die naechste folgt mit kurzem Abstand
  const rats = G.ents.filter((e) => e.team === 1 && e.ai && e.ai.pack);
  const busy = rats.filter((e) => e.state !== 'down' && !ratAsleep(e)).length;
  const next = rats.find((e) => e.state !== 'down' && e.wakeT === undefined);
  if (next && busy < maxAwake && G.t - (G.lastWake || -9) > 1.2) { next.wakeT = G.t; G.lastWake = G.t; }
}
function lowHpStart(frac) {
  return (G) => { if (G.lowSet) return; G.lowSet = true; const p = G.player; p.hp = Math.max(1, Math.ceil(p.maxHp * frac)); };
}

/* ------------------------------------------------------------ Szenen-Hintergrund und Arena */
SCENE_ART.wueste = function (g, W, H, u, t, glowField) {
  g.fillStyle = lg(g, 0, 0, 0, H * 0.6, [0, '#e8a860', 0.6, '#f8d8a0', 1, '#fff0d0']); g.fillRect(0, 0, W, H);
  g.globalCompositeOperation = 'lighter'; g.globalAlpha = 0.8; g.drawImage(glowSprite('#fff4c0'), W * 0.66 - u * 20, H * 0.14 - u * 20, u * 40, u * 40); g.globalAlpha = 1; g.globalCompositeOperation = 'source-over';
  g.fillStyle = '#fffbe8'; g.beginPath(); g.arc(W * 0.66, H * 0.14, u * 5, 0, TAU); g.fill();
  for (let k = 0; k < 4; k++) {
    const y = H * (0.5 + k * 0.12);
    g.fillStyle = shade('#d8a060', -k * 0.1); g.beginPath(); g.moveTo(0, H);
    for (let i = 0; i <= 10; i++) g.lineTo(W * i / 10, y + Math.sin(i * 1.3 + k * 2) * u * 4);
    g.lineTo(W, H); g.fill();
  }
  glowField('#fff0c0', 6);
};
// Wueste von Caladi: Sand, Duenen-Rippen, eine Oase, das verlassene Brunnenhaus
ARENA_ART.wueste = function (A) {
  const S = 2, c = mkCanvas(A.w * S, A.h * S), g = c.getContext('2d');
  g.scale(S, S);
  const rnd = mulberry(A.seed || 71);
  g.fillStyle = '#d8b07a'; g.fillRect(0, 0, A.w, A.h);
  for (let i = 0; i < 900; i++) { g.fillStyle = rnd() < 0.5 ? 'rgba(160,110,60,0.22)' : 'rgba(255,240,200,0.2)'; g.fillRect(rnd() * A.w, rnd() * A.h, 2, 2); }
  g.strokeStyle = 'rgba(150,100,50,0.28)'; g.lineWidth = 2;
  for (let y = 30; y < A.h; y += 46) { g.beginPath(); for (let x = 0; x <= A.w; x += 10) g.lineTo(x, y + Math.sin(x * 0.04 + y) * 6); g.stroke(); }
  if (A.oase) { // Oase
    const [ox, oy] = A.oase;
    g.fillStyle = '#6a8a4a'; g.beginPath(); g.ellipse(ox, oy, 70, 34, 0, 0, TAU); g.fill();
    g.fillStyle = lg(g, 0, oy - 20, 0, oy + 20, [0, '#4a9ac8', 1, '#2a6a9a']); g.beginPath(); g.ellipse(ox, oy, 52, 22, 0, 0, TAU); g.fill();
    g.fillStyle = 'rgba(255,255,255,0.3)'; g.fillRect(ox - 20, oy - 6, 24, 2);
  }
  for (const b of A.blocks || []) { // Mauerreste / Brunnenhaus
    g.fillStyle = '#9a7a5a'; g.fillRect(b.x, b.y + 8, b.w, b.h - 8); g.fillStyle = '#c8a07a'; g.fillRect(b.x, b.y, b.w, 10);
    g.strokeStyle = 'rgba(0,0,0,0.3)'; g.lineWidth = 1; g.strokeRect(b.x + 0.5, b.y + 0.5, b.w - 1, b.h - 1);
  }
  if (A.brunnen) { const [bx, by] = A.brunnen; g.fillStyle = '#7a6a5a'; g.beginPath(); g.arc(bx, by, 16, 0, TAU); g.fill(); g.fillStyle = '#1a1410'; g.beginPath(); g.arc(bx, by, 10, 0, TAU); g.fill(); }
  g.strokeStyle = 'rgba(0,0,0,0.2)'; g.lineWidth = 3; g.strokeRect(1.5, 1.5, A.w - 3, A.h - 3);
  return c;
};

/* ------------------------------------------------------------ Bestien von Caladi */
Object.assign(OBJ_ART, {
  zahnwurm(g, e) {
    const t = e.anim.t, up = e.state === 'wind' || e.state === 'active' ? 1 : e.state === 'down' ? 0 : 0.45 + Math.sin(t * 2 + e.id) * 0.08;
    const h = 8 + up * 30;
    g.fillStyle = 'rgba(120,80,40,0.5)'; g.beginPath(); g.ellipse(e.x, e.y, 18, 6, 0, 0, TAU); g.fill();
    g.fillStyle = '#b08858'; for (let k = 0; k < 6; k++) { const a = k / 6 * TAU + t * 0.3; g.beginPath(); g.arc(e.x + Math.cos(a) * 16, e.y + Math.sin(a) * 5, 3, 0, TAU); g.fill(); }
    if (e.state === 'down' && e.stateT > 0.8) return;
    g.save(); g.translate(e.x, e.y);
    if (e.state === 'down') g.globalAlpha = Math.max(0, 1 - e.stateT * 1.3);
    const sway = Math.sin(t * 3 + e.id) * 3 * up, lean = (e.face || 1) * up * 4;
    for (let k = 0; k < 6; k++) {
      const s = k / 5, x = sway * s + lean * s, y = -h * s;
      g.fillStyle = k % 2 ? '#c89a7a' : '#b8866a'; g.beginPath(); g.ellipse(x, y, 9 - s * 2, 5, 0, 0, TAU); g.fill();
      g.strokeStyle = 'rgba(80,40,30,0.5)'; g.lineWidth = 0.8; g.stroke();
    }
    // Maul mit Zahnkranz
    const mx = sway + lean, my = -h - 3;
    g.fillStyle = '#3a1010'; g.beginPath(); g.ellipse(mx, my, 7, 4.5, 0, 0, TAU); g.fill();
    g.fillStyle = '#f0e8d8'; for (let k = 0; k < 8; k++) { const a = k / 8 * TAU; g.beginPath(); g.moveTo(mx + Math.cos(a) * 7, my + Math.sin(a) * 4.5); g.lineTo(mx + Math.cos(a) * 4, my + Math.sin(a) * 2.5); g.lineTo(mx + Math.cos(a + 0.3) * 7, my + Math.sin(a + 0.3) * 4.5); g.fill(); }
    if (e.flash > 0) { g.globalCompositeOperation = 'lighter'; g.globalAlpha = Math.min(1, e.flash * 10) * 0.6; g.fillStyle = '#fff'; g.beginPath(); g.ellipse(mx * 0.5, -h * 0.5, 9, h * 0.6, 0, 0, TAU); g.fill(); }
    g.restore();
  },
  echse(g, e) {
    const t = e.anim.t, run = e.anim.run, ph = e.anim.phase;
    const shield = e.state !== 'stagger' && e.state !== 'down' && e.state !== 'active';
    g.fillStyle = 'rgba(0,0,0,0.3)'; g.beginPath(); g.ellipse(e.x, e.y + 1, 24, 6, 0, 0, TAU); g.fill();
    g.save(); g.translate(e.x, e.y); g.scale(e.face, 1);
    beastDown(g, e);
    g.strokeStyle = '#6a4a2a'; g.lineWidth = 3; g.lineCap = 'round';
    g.beginPath(); g.moveTo(-14, -10); g.quadraticCurveTo(-28, -6 + Math.sin(t * 4) * 3, -36, -12); g.stroke();
    for (const [lx, o] of [[-9, 0], [-4, Math.PI], [7, Math.PI * 0.5], [11, Math.PI * 1.5]]) { const s = Math.sin(ph + o) * 5 * run; g.beginPath(); g.moveTo(lx, -9); g.lineTo(lx + s, 0); g.stroke(); }
    // Rumpf mit hellem, weichem Bauch

function tree3d(scene, x, z, s, night) {

function building3d(scene, b, night) {
  const T = THREE, x = (b.x + b.w / 2) * S3, z = (b.y + b.h / 2) * S3, w = b.w * S3, d = b.h * S3, h = 6.2;

/* ------------------------------------------------------------ Pruefplatz: Sand, Linien, Tribuene, Kasernenwand, Sonne */
ARENA3D.pruefplatz = function (A, scene) {
  const T = THREE, W = A.w * S3, H = A.h * S3;

  groundPlane(scene, W + 20, H + 20, sand).position.set(W / 2, 0, H / 2);
  const line = new T.MeshBasicMaterial({ color: '#f4f0e6' });
  for (const [x, z, w, d] of [[W / 2, 60 * S3, W - 40 * S3, 0.06], [W / 2, (A.h - 30) * S3, W - 40 * S3, 0.06], [20 * S3, H / 2 + 15 * S3, 0.06, H - 90 * S3], [(A.w - 20) * S3, H / 2 + 15 * S3, 0.06, H - 90 * S3]]) { const m = new T.Mesh(new T.PlaneGeometry(w, d), line); m.rotation.x = -Math.PI / 2; m.position.set(x, 0.01, z); scene.add(m); }
  const ring = new T.Mesh(new T.RingGeometry(1.42, 1.5, 48), line); ring.rotation.x = -Math.PI / 2; ring.position.set(W / 2, 0.01, (A.h / 2 + 15) * S3); scene.add(ring);
  // Kasernenwand und Tribuene hinten
  box3(scene, W + 20, 5, 0.6, '#6a7488', W / 2, 2.5, -2.5);

  for (let r = 0; r < 3; r++) box3(scene, W + 6, 0.35, 0.7, r % 2 ? '#8a94a8' : '#9aa4b8', W / 2, 0.18 + r * 0.35, -1.6 + r * 0.7 - 1.4, { noOutline: true });
  for (const x of [1, W - 1]) { part(fgeo('flag', () => new T.CylinderGeometry(0.04, 0.05, 5, 8)), toonMat('#c8ccd4'), scene, x, 2.5, -0.6); const fl = new T.Mesh(new T.PlaneGeometry(1.1, 0.7), toonMat('#2a4a7a', { side: T.DoubleSide })); fl.position.set(x + 0.58, 4.5, -0.6); scene.add(fl); }
  // Seitliche Zuschauerbaenke

  box3(scene, W + 4, 6, 0.4, '#2e2838', W / 2, 3, -0.2, { noOutline: true });

  for (const x of [-0.25, W + 0.25]) box3(scene, 0.5, 2.4, H + 1, '#3a3246', x, 1.2, H / 2, { noOutline: true });
  // Geraeteregale und Matten an den Seiten
  for (let z = 3; z < H - 2; z += 4.5) { box3(scene, 0.5, 1.4, 1.6, '#4a3a2a', 0.35, 0.7, z); for (let k = 0; k < 3; k++) part(fgeo('ball', () => new T.SphereGeometry(0.14, 10, 8)), toonMat(['#c85a3a', '#3a7ac8', '#e8c040'][k]), scene, 0.35, 1.55, z - 0.5 + k * 0.5); box3(scene, 1.4, 0.12, 2.2, '#3a4a7a', W - 1.0, 0.06, z + 1, { noOutline: true }); }
  scene.background = new T.Color('#06070e'); scene.fog = new T.Fog('#06070e', 12, 30);
  scene.add(new T.HemisphereLight('#4a5a9a', '#1a1420', 0.7));
  sunLight(scene, W / 2, H / 2, 14, '#8aa8ff', 1.4, [-2, 10, -6]);
  for (const z of [H * 0.35, H * 0.7]) { const pl = new T.PointLight('#ffe0b0', 6, 8, 1.6); pl.position.set(W / 2, 4.5, z); scene.add(pl); const s = new T.Mesh(new T.CircleGeometry(1.6, 24), new T.MeshBasicMaterial({ map: R3.glowTex, color: '#8a6a40', transparent: true, opacity: 0.4, blending: T.AdditiveBlending, depthWrite: false })); s.rotation.x = -Math.PI / 2; s.position.set(W / 2, 0.02, z); scene.add(s); }
};

/* ------------------------------------------------------------ Akademiehof (Hub): Gebaeude, Wege, Rasen, Baeume, Tag/Nacht */
ARENA3D.hof = function (A, scene) {
  const T = THREE, W = A.w * S3, H = A.h * S3, night = !!A.night;
  const grass = noiseTex(night ? '#2a4a2a' : '#5e8a42', night ? ['rgba(0,0,0,0.25)', 'rgba(60,90,60,0.3)'] : ['rgba(30,60,20,0.35)', 'rgba(150,190,90,0.3)', 'rgba(90,130,50,0.3)'], 5, [(W + 30) / 3, (H + 30) / 3]);
  groundPlane(scene, W + 30, H + 30, grass).position.set(W / 2, 0, H / 2);
  const stone = noiseTex(night ? '#6a6660' : '#bab4a6', ['rgba(0,0,0,0.12)', 'rgba(255,255,255,0.12)'], 6, [1, 1], (g) => { g.strokeStyle = 'rgba(40,36,30,0.35)'; g.lineWidth = 2; for (let i = 0; i <= 256; i += 32) { g.beginPath(); g.moveTo(i, 0); g.lineTo(i, 256); g.stroke(); g.beginPath(); g.moveTo(0, i); g.lineTo(256, i); g.stroke(); } });
  for (const r of A.paths || []) { const t = stone.clone(); t.needsUpdate = true; t.repeat.set(r.w * S3 / 1.9, r.h * S3 / 1.9); const m = new T.Mesh(new T.PlaneGeometry(r.w * S3, r.h * S3), new T.MeshLambertMaterial({ map: t })); m.rotation.x = -Math.PI / 2; m.position.set((r.x + r.w / 2) * S3, 0.012, (r.y + r.h / 2) * S3); m.receiveShadow = true; scene.add(m); }
  for (const b of A.buildings || []) building3d(scene, b, night);
  // ueberdachter Hauptweg (wirft den Schatten, in dem Quinn sicher ist)
  const px = 220 * S3, z0 = 130 * S3, z1 = H;
  if (!A.noRoof) {
  const roof = new T.Mesh(new T.BoxGeometry(56 * S3 + 0.4, 0.1, z1 - z0), toonMat(night ? '#3a3a44' : '#8a3a3a', { transparent: true })); roof.position.set(px, 2.8, (z0 + z1) / 2); roof.castShadow = true; scene.add(roof);
  R3.fade.push({ mat: roof.material, x0: px - 1.2, x1: px + 1.2, z0: z0 - 1, z1: z1 + 2 });
  for (let z = z0 + 1; z < z1; z += 3) for (const s of [-1, 1]) part(fgeo('pillar', () => new T.CylinderGeometry(0.06, 0.06, 2.8, 6)), toonMat('#2a2a30'), scene, px + s * (28 * S3 + 0.15), 1.4, z);
  }
  for (const [x, y] of A.trees || []) tree3d(scene, x * S3, y * S3, 1.1, night);
  for (const [x, y] of A.benches || []) bench3d(scene, x * S3, y * S3, 0);
  // Mauer am Rand
  for (const [x, z, w, d] of [[-0.6, H / 2, 0.4, H + 2], [W + 0.6, H / 2, 0.4, H + 2]]) box3(scene, w, 1.2, d, '#8a8478', x, 0.6, z, { noOutline: true });
  if (night) {
    scene.background = new T.Color('#070b18'); scene.fog = new T.Fog('#070b18', 14, 34);
    scene.add(new T.HemisphereLight('#3a4a88', '#10141a', 0.8));
    sunLight(scene, W / 2, H / 2, 16, '#8aa0ff', 1.2, [-5, 18, -8]);
    for (const [x, z] of [[190 * S3, 200 * S3], [250 * S3, 420 * S3], [190 * S3, 560 * S3], [60 * S3, 470 * S3]]) { lampPost3d(scene, x, z, true); const pl = new T.PointLight('#ffd890', 7, 8, 1.6); pl.position.set(x, 3, z); scene.add(pl); }
    const moon = glowSprite3('#dfe8ff', 6, 0.9); moon.position.set(W * 0.8, 16, -14); scene.add(moon);
  } else {
    scene.background = new T.Color('#8ec4f0'); scene.fog = new T.Fog('#b4d8f4', 24, 60);
    scene.add(new T.HemisphereLight('#dcecff', '#6a7a4a', 1.25));
    sunLight(scene, W / 2, H / 2, 18, '#fff0d4', 3.0, [0, 22, -5]);

const OBJ3D = {

  },
  geraet(e) {
    const T = THREE, g = new T.Group();
    part(fgeo('gbase', () => new T.CylinderGeometry(0.5, 0.65, 0.5, 16)), toonMat('#3a4252'), g, 0, 0.25, 0);
    part(fgeo('gneck', () => new T.CylinderGeometry(0.14, 0.18, 0.7, 12)), toonMat('#5a6474'), g, 0, 0.85, 0);

'use strict';
/* ==========================================================================
   3D-ORTE ETAPPE 2 (eigene Gestaltung)
   Park bei Nacht (Kiesring, Laternen, Baeume, Hecken, Baenke) ·
   Kulisse fuer Kaempfe im Hof (Gebaeude hinter dem Kampffeld) ·

ARENA3D.park = function (A, scene) {
  const T = THREE, W = A.w * S3, H = A.h * S3;
  const grass = noiseTex('#24402a', ['rgba(0,0,0,0.3)', 'rgba(60,100,60,0.3)', 'rgba(20,40,20,0.3)'], 21, [(W + 30) / 3, (H + 30) / 3]);
  groundPlane(scene, W + 30, H + 30, grass).position.set(W / 2, 0, H / 2);
  const gravel = noiseTex('#7a746a', ['rgba(0,0,0,0.25)', 'rgba(255,255,255,0.15)', 'rgba(90,80,60,0.3)'], 22, [4, 4]);
  // Kiesring um die Mitte, Wege nach Norden und Sueden
  const ring = new T.Mesh(new T.RingGeometry(0.72, 1.0, 64), new T.MeshLambertMaterial({ map: gravel }));
  ring.rotation.x = -Math.PI / 2; ring.scale.set(W * 0.38, H * 0.3, 1); ring.position.set(W / 2, 0.012, H / 2); ring.receiveShadow = true; scene.add(ring);
  for (const [z, d] of [[H * 0.125, H * 0.25], [H * 0.875, H * 0.25]]) { const m = new T.Mesh(new T.PlaneGeometry(44 * S3, d), new T.MeshLambertMaterial({ map: gravel })); m.rotation.x = -Math.PI / 2; m.position.set(W / 2, 0.013, z); m.receiveShadow = true; scene.add(m); }
  // Hecken aussen, Blumenbeete, Baenke am Ring
  const hedge = toonMat('#1e3a22');
  for (const [x, z, w, d] of [[-0.8, H / 2, 0.9, H + 4], [W + 0.8, H / 2, 0.9, H + 4], [W * 0.2, -1.2, W * 0.4, 0.9], [W * 0.8, -1.2, W * 0.4, 0.9]]) { const m = new T.Mesh(new T.BoxGeometry(w, 1.1, d), hedge); m.position.set(x, 0.55, z); m.castShadow = true; m.receiveShadow = true; scene.add(m); addOutline(m, 0.02); }
  for (const [x, z] of [[W * 0.22, H * 0.5], [W * 0.78, H * 0.5]]) { const bed = new T.Mesh(new T.CylinderGeometry(0.7, 0.75, 0.25, 18), toonMat('#3a2a20')); bed.position.set(x, 0.12, z); scene.add(bed); for (let k = 0; k < 9; k++) { const f = new T.Mesh(fgeo('flower', () => new T.SphereGeometry(0.08, 6, 5)), toonMat(['#c84a6a', '#e8c040', '#8a6ad8'][k % 3])); f.position.set(x + Math.cos(k) * 0.45, 0.32, z + Math.sin(k) * 0.45); scene.add(f); } }
  for (const [x, z, r] of [[W * 0.5, H * 0.24, 0], [W * 0.5, H * 0.76, Math.PI]]) bench3d(scene, x + 1.6, z, r);
  for (const [x, y] of A.trees || []) tree3d(scene, x * S3, y * S3, 1.3, true);
  for (const [x, z] of [[-2.5, 3], [W + 2.5, 5], [-2.8, H - 4], [W + 2.6, H - 2]]) tree3d(scene, x, z, 1.5, true);

  // Stadtsilhouette hinter dem Park

function r3Harden(e, R) {
  if (!e.ai || !e.ai.harden) return;
  if (!R.shield) {
    const g = new THREE.CylinderGeometry(0.46, 0.46, 1.2, 20, 1, true, -0.95, 1.9);
    const m = new THREE.MeshStandardMaterial({ color: '#c8d4e4', metalness: 0.9, roughness: 0.25, transparent: true, opacity: 0.85, side: THREE.DoubleSide, emissive: new THREE.Color('#3a4a60') });
    R.shield = new THREE.Mesh(g, m); R.shield.position.y = 1.1; R.root.add(R.shield);
    const edge = new THREE.Mesh(new THREE.CylinderGeometry(0.48, 0.48, 1.24, 20, 1, true, -0.95, 1.9), new THREE.MeshBasicMaterial({ color: '#9ad8ff', transparent: true, opacity: 0.35, blending: THREE.AdditiveBlending, side: THREE.BackSide, depthWrite: false }));
    R.shield.add(edge);
  }
  const vis = e.state !== 'down' && e.state !== 'stagger' && e.hardDir !== undefined;
  R.shield.visible = vis; if (!vis) return;
  // Welt-Richtung -> lokal zur Figur (die Wurzel ist schon gedreht)
  const worldYaw = Math.atan2(Math.cos(e.hardDir), Math.sin(e.hardDir)) - Math.PI / 2;
  R.shield.rotation.y = worldYaw - R.root.rotation.y + Math.PI / 2;
  R.shield.material.emissiveIntensity = 0.6 + Math.min(1, e.flash * 10) * 2;
}

let REPLAY = false;
function startMission(id, skipScene, replay) {
  REPLAY = !!replay;
  if (id === 'ende') return showEnd();
  const M = MISSIONS[id]; MISSION = M; G = null;
  if (M.type === 'hub') return beginHub(M);
  const go = () => (M.fight ? beginFight(M) : finishMission(M, true));
  if (M.scene && !skipScene) runScene(M.scene, go); else go();
}
function beginFight(M) {
  INPUT.events.length = 0; INPUT.atkHeld = false;
  newFight(Object.assign({}, M.fight, {
    onWin: (G0) => finishMission(M, true, G0),
    onLose: (G0) => showLost(M, G0)
  }));
  G.showFoe = !M.fight.noFoeBar;
  buildHud(M.fight);
  banner(M.title.toUpperCase());
}
function beginHub(M) {
  INPUT.events.length = 0; INPUT.atkHeld = false;
  const opt = hubSetup();
  newFight(opt);
  G.showFoe = false;
  buildHud(opt);
  const key = SAVE.day.n + '' + SAVE.day.night;
  if (beginHub.shown !== key) { beginHub.shown = key; banner(SAVE.day.night ? 'NACHT' : 'TAG ' + SAVE.day.n); }
}
function finishMission(M, won, G0) {
  const P = SAVE.progress[M.id] || (SAVE.progress[M.id] = {});
  const first = !P.done;
  P.done = true;
  if (M.onWinExtra) M.onWinExtra();
  const rep = G0 ? fightReport(G0, true) : null;
  if (first && M.reward) {

    if (M.reward.exp) { const l0 = Q.level; gainExp(M.reward.exp); if (rep) { rep.kv.push(['Quest-Belohnung', '+' + M.reward.exp]); if (Q.level > l0) rep.up = true; } }

  writeSave();
  G = null;
  const after = () => (M.id === 'test3d' ? showTitle() : REPLAY ? showEnd() : M.next ? startMission(M.next) : showEnd(M));
  const story = () => (M.won && (first || !M.repeat) && !REPLAY ? runScene(M.won, after) : after());

}
function showReport(rep, done) {
  SCENE_BG.cur = 'system';

  el.querySelector('#rGo').onclick = done;

/* ------------------------------------------------------------ Schleife */
let _last = performance.now();
function frame(now) {
  const rdt = Math.min(0.05, (now - _last) / 1000); _last = now;
  try {
    if (G && !G.paused) updateFight(rdt);
    if (G && r3Wanted()) { try { render3d(rdt); } catch (err) { R3.errs = (R3.errs || 0) + 1; if (R3.errs > 30) { R3.failed = true; hide3d(); } throw err; } updateHud(); }
    else { hide3d(); if (G) { renderFight(); updateHud(); } else renderSceneBg(now / 1000); }
  } catch (err) { console.error(err); }
  AudioSys.musicTick && AudioSys.musicTick(rdt, G ? 0.4 : 0.1);
  requestAnimationFrame(frame);
}
document.addEventListener('visibilitychange', () => { if (document.hidden && G && G.state === 'play') showPause(); });
showTitle();
requestAnimationFrame(frame);
