:root {
  --bg: #05060c; --sys: #6ec8ff; --sys2: #bfe6ff; --sysbg: rgba(6, 16, 34, .92); --sysline: #3a8ad0;
  --blood: #ff3a4e; --gold: #e8c77a; --text: #eef2f8; --dim: #9aa6ba;
  --safe-t: env(safe-area-inset-top, 0px); --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-l: env(safe-area-inset-left, 0px); --safe-r: env(safe-area-inset-right, 0px);
}
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg); color: var(--text);
  overscroll-behavior: none; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  font-family: 'Cormorant Garamond', Georgia, serif; font-weight: 600; }
body { position: fixed; inset: 0; }
canvas#game { position: absolute; inset: 0; display: block; touch-action: none; }
#ui { position: absolute; inset: 0; pointer-events: none; z-index: 5; }
#ui .screen, #ui button, #ui .interactive { pointer-events: auto; }
.cinzel { font-family: 'Cinzel', serif; letter-spacing: .06em; }

/* ------------------------------------------------ Bildschirme */
.screen { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
  padding: calc(18px + var(--safe-t)) calc(18px + var(--safe-r)) calc(18px + var(--safe-b)) calc(18px + var(--safe-l)); }

<script>
/* ---- src/00-core.js ---- */
'use strict';
/* ==========================================================================
   MY VAMPIRE SYSTEM — Kern: Mathe, Farben, Speicherstand, Audio
   ========================================================================== */

const TAU = Math.PI * 2;
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(a + Math.random() * (b - a + 1));
const pick = (arr) => arr[(Math.random() * arr.length) | 0];
const dist2 = (ax, ay, bx, by) => { const dx = ax - bx, dy = ay - by; return dx * dx + dy * dy; };
const easeOut = (t) => 1 - (1 - t) * (1 - t);
const easeIn = (t) => t * t;
const easeInOut = (t) => (t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2);
const smooth = (t) => t * t * (3 - 2 * t);
function angDiff(a, b) { let d = (b - a) % TAU; if (d > Math.PI) d -= TAU; if (d < -Math.PI) d += TAU; return d; }

/* deterministischer Zufall (fuer Welt-Chunks und Texturen) */
function mulberry(seed) {
  let a = seed >>> 0;
  return function () {
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function hash2(x, y, s) {
  let h = (x * 374761393 + y * 668265263 + (s || 0) * 982451653) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return (h ^ (h >>> 16)) >>> 0;
}

/* Farbhilfen */
function hexRgb(h) {
  const n = parseInt(h.slice(1), 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}
function rgba(h, a) { const c = hexRgb(h); return `rgba(${c[0]},${c[1]},${c[2]},${a})`; }
function shade(h, f) {
  const c = hexRgb(h);
  const m = (v) => clamp(Math.round(f >= 0 ? v + (255 - v) * f : v * (1 + f)), 0, 255);
  return `rgb(${m(c[0])},${m(c[1])},${m(c[2])})`;
}

/* ------------------------------------------------------------ Speicherstand */
const SAVE_KEY = 'mvs.save.v1';
const DEFAULT_SAVE = {
  progress: {},        // missionId -> { done, best }
  quinn: { level: 1, exp: 0, points: 0, stats: { str: 10, agi: 10, sta: 10 }, skills: [], blood: {} },
  day: { n: 1, night: false, sun: 0, water: false },
  flags: {},
  credits: 10,
  settings: { sfx: 0.8, music: 0.5, shake: 1, easyCombo: false, wideDodge: false }
};
let SAVE = loadSave();
function loadSave() {
  let s = null;
  try { s = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null'); } catch (e) { s = null; }
  const base = JSON.parse(JSON.stringify(DEFAULT_SAVE));
  if (!s || typeof s !== 'object') return base;
  for (const k in base) {
    if (s[k] === undefined) s[k] = base[k];
    else if (typeof base[k] === 'object' && !Array.isArray(base[k])) for (const kk in base[k]) if (s[k][kk] === undefined) s[k][kk] = base[k][kk];
  }
  return s;
}
function writeSave() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(SAVE)); } catch (e) { /* privat/gesperrt */ } }
function resetSave() { SAVE = JSON.parse(JSON.stringify(DEFAULT_SAVE)); writeSave(); }

/* ------------------------------------------------------------------ Audio */
const AudioSys = (() => {
  let ac = null, master = null, sfxBus = null, musicBus = null, comp = null;
  let noiseBuf = null;
  const last = {};
  function init() {
    if (ac) { if (ac.state === 'suspended') ac.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    ac = new AC();
    comp = ac.createDynamicsCompressor();
    comp.threshold.value = -16; comp.knee.value = 10; comp.ratio.value = 5;
    master = ac.createGain(); master.gain.value = 0.9;
    sfxBus = ac.createGain(); musicBus = ac.createGain();
    sfxBus.connect(comp); musicBus.connect(master); comp.connect(master); master.connect(ac.destination);
    applyVolumes();
    noiseBuf = ac.createBuffer(1, ac.sampleRate * 1.5, ac.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  function applyVolumes() {
    if (!ac) return;
    sfxBus.gain.value = SAVE.settings.sfx * 0.55;
    musicBus.gain.value = SAVE.settings.music * 0.35;
  }
  function env(g, t, a, peak, d) {
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(peak, t + a);
    g.gain.exponentialRampToValueAtTime(0.0001, t + a + d);
  }
  function tone(type, f0, f1, dur, vol, when, bus) {
    const t = ac.currentTime + (when || 0);
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(f0, t);
    if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
    env(g, t, 0.006, vol, dur);
    o.connect(g); g.connect(bus || sfxBus); o.start(t); o.stop(t + dur + 0.05);
  }
  function noise(dur, vol, fType, f0, f1, q, when) {
    const t = ac.currentTime + (when || 0);
    const s = ac.createBufferSource(); s.buffer = noiseBuf;
    const f = ac.createBiquadFilter(); f.type = fType; f.Q.value = q || 1;
    f.frequency.setValueAtTime(f0, t);
    if (f1 && f1 !== f0) f.frequency.exponentialRampToValueAtTime(f1, t + dur);
    const g = ac.createGain(); env(g, t, 0.004, vol, dur);
    s.connect(f); f.connect(g); g.connect(sfxBus);
    s.start(t, Math.random() * 0.5); s.stop(t + dur + 0.05);
  }
  /* Soundbibliothek: alles synthetisch, keine Dateien */
  const S = {
    nova() { tone('sine', 120, 38, 0.45, 0.7); noise(0.35, 0.5, 'lowpass', 1400, 200, 0.8); tone('triangle', 260, 90, 0.18, 0.25); },
    bigNova() { tone('sine', 90, 28, 0.9, 0.9); noise(0.8, 0.6, 'lowpass', 900, 90, 0.7); tone('sawtooth', 70, 35, 0.6, 0.15); },
    whip() { noise(0.2, 0.45, 'bandpass', 900, 3500, 2.5); tone('triangle', 420, 160, 0.12, 0.12); },
    sickle() { noise(0.08, 0.12, 'highpass', 4000, 6000, 1); },
    flame() { noise(0.25, 0.22, 'bandpass', 500, 1600, 1.2); tone('sine', 220, 440, 0.2, 0.06); },
    palm() { tone('sine', 180, 60, 0.3, 0.6); noise(0.18, 0.35, 'lowpass', 2500, 300, 1); tone('sine', 880, 870, 0.5, 0.05, 0.02); tone('sine', 1320, 1310, 0.4, 0.03, 0.02); },
    chain() { noise(0.12, 0.25, 'highpass', 3000, 8000, 3); tone('square', 1200, 600, 0.08, 0.05); },
    rift() { tone('sine', 60, 40, 0.8, 0.3); noise(0.7, 0.18, 'lowpass', 400, 120, 2); },
    hit() { noise(0.05, 0.16, 'bandpass', 1800, 900, 1.5); },
    crit() { noise(0.07, 0.25, 'bandpass', 2400, 900, 2); tone('square', 900, 300, 0.07, 0.06); },
    kill() { noise(0.12, 0.18, 'lowpass', 1200, 200, 1); tone('sine', 140, 60, 0.12, 0.15); },
    splat() { noise(0.16, 0.3, 'lowpass', 900, 150, 0.8); tone('sine', 90, 45, 0.18, 0.3); },
    gem(p) { tone('sine', 900 + p * 60, 1300 + p * 60, 0.09, 0.08); },
    heal() { tone('sine', 520, 780, 0.35, 0.12); tone('sine', 780, 1040, 0.35, 0.08, 0.08); },
    hurt() { tone('sawtooth', 160, 70, 0.22, 0.3); noise(0.15, 0.3, 'lowpass', 900, 200, 1); },
    dodge() { noise(0.22, 0.3, 'bandpass', 600, 2400, 1.5); },
    shadowstep() { noise(0.3, 0.3, 'bandpass', 300, 2600, 3); tone('sine', 300, 900, 0.25, 0.08); },
    level() { [0, 4, 7, 12].forEach((s, i) => tone('triangle', 330 * Math.pow(2, s / 12), 330 * Math.pow(2, s / 12), 0.35, 0.12, i * 0.07)); },
    card() { tone('sine', 660, 990, 0.12, 0.1); },
    fusion() { [0, 3, 7, 10, 15].forEach((s, i) => { tone('sawtooth', 220 * Math.pow(2, s / 12), 220 * Math.pow(2, s / 12), 0.8, 0.05, i * 0.09); tone('sine', 440 * Math.pow(2, s / 12), 440 * Math.pow(2, s / 12), 1, 0.08, i * 0.09); }); tone('sine', 60, 30, 1.4, 0.6); },
    reaction(k) { const f = { b: 300, s: 200, q: 700, t: 500 }[k] || 400; tone('triangle', f, f * 2, 0.18, 0.12); noise(0.2, 0.2, 'bandpass', f * 3, f, 2); },
    ult() { tone('sawtooth', 55, 110, 0.8, 0.25); tone('sine', 110, 220, 0.8, 0.3); noise(0.9, 0.4, 'lowpass', 300, 3000, 1); },
    bell() { [1, 2.76, 5.4, 8.93].forEach((m, i) => tone('sine', 98 * m, 98 * m * 0.995, 2.4 - i * 0.4, 0.28 / (i + 1))); },
    roar() { tone('sawtooth', 90, 45, 1.1, 0.3); noise(1.1, 0.4, 'lowpass', 700, 150, 3); },
    stomp() { tone('sine', 70, 25, 0.6, 0.9); noise(0.4, 0.5, 'lowpass', 500, 60, 0.7); },
    enemyShot() { tone('sine', 500, 800, 0.15, 0.05); },
    click() { tone('triangle', 800, 600, 0.05, 0.08); },
    win() { [0, 4, 7, 12, 16, 19, 24].forEach((s, i) => tone('triangle', 262 * Math.pow(2, s / 12), 262 * Math.pow(2, s / 12), 0.9, 0.1, i * 0.12)); },
    lose() { [0, -3, -7, -12].forEach((s, i) => tone('sawtooth', 220 * Math.pow(2, s / 12), 220 * Math.pow(2, s / 12), 0.9, 0.06, i * 0.3)); }
  };
  function play(name, arg, minGap) {
    if (!ac || ac.state !== 'running' || SAVE.settings.sfx <= 0) return;
    const now = ac.currentTime, gap = minGap === undefined ? 0.035 : minGap;
    if (last[name] && now - last[name] < gap) return;
    last[name] = now;
    try { S[name](arg); } catch (e) { /* ignorieren */ }
  }
  /* sehr einfache prozedurale Ambient-Musik: tiefe Flaechen in Moll + ferne Glocke */
  let musicOn = false, musicTimer = 0, chordIdx = 0;
  const CHORDS = [[0, 3, 7], [-4, 0, 3], [-2, 2, 5], [-5, -1, 2]];
  function musicTick(dt, intensity) {
    if (!ac || !musicOn || SAVE.settings.music <= 0) return;
    musicTimer -= dt;
    if (musicTimer > 0) return;
    musicTimer = 6;
    const base = 55, ch = CHORDS[chordIdx++ % CHORDS.length];
    const t = ac.currentTime;

  P.neckY = P.hipY - Math.cos(P.lean) * tor + breathe;
  const hl = P.lean * 0.7 - hurt * 0.35 + kneel * 0.3;
  P.headX = P.neckX + Math.sin(hl) * spec.headOff;
  P.headY = P.neckY - Math.cos(hl) * spec.headOff;

  const legs = [];

    if (rooted > 0) { fx = lerp(fx, hx + (i === 0 ? 7 : -7), rooted); fy = lerp(fy, 0, rooted); }

    if (kneel > 0) { fx = lerp(fx, hx + (i === 0 ? 7 : -9), kneel); fy = lerp(fy, 0, kneel); }
    const k = ik(hx, P.hipY, fx, fy, spec.legL, spec.legL2 || spec.legL, -1);
    legs.push({ hx, hy: P.hipY, kx: k[0], ky: k[1], fx: k[2], fy: k[3], lift: -fy });
  }
  P.legF = legs[0]; P.legB = legs[1];
  // Arme
  const arms = [];
  for (let i = 0; i < 2; i++) {
    const sh = i === 0 ? P.shF : P.shB;
    const p = ph + i * Math.PI;
    const swing = -Math.sin(p) * 0.75 * run;
    let ang = Math.PI / 2 + 0.15 + swing - P.lean * 0.4 + (spec.armRest || 0) * (i === 0 ? 1 : 0.6);
    const reach = (spec.armL + spec.armL2) * 0.94;
    let hx = sh[0] + Math.cos(ang) * reach, hy = sh[1] + Math.sin(ang) * reach;
    if (st.guard !== undefined && i === 0) { hx = lerp(hx, sh[0] + 7, st.guard); hy = lerp(hy, sh[1] + 4, st.guard); }

    }
    if (rooted > 0 && !cast) { // Meditations-/Kampfhaltung: Handflaechen vor der Brust
      const cx = sh[0] + (i === 0 ? 8 : 5), cy = sh[1] + (i === 0 ? 3 : 8);
      hx = lerp(hx, cx, rooted); hy = lerp(hy, cy, rooted);
    }
    if (dodge > 0) { hx = lerp(hx, sh[0] - 8, dodge * 0.8); hy = lerp(hy, sh[1] + 4, dodge * 0.8); }
    if (hurt > 0) { hx = lerp(hx, sh[0] - 6, hurt * 0.6); hy = lerp(hy, sh[1] - 2, hurt * 0.6); }
    if (kneel > 0) { hx = lerp(hx, sh[0] + (i === 0 ? 5 : -2), kneel); hy = lerp(hy, sh[1] + reach * 0.95, kneel); }

    arms.push({ sx: sh[0], sy: sh[1], ex: e[0], ey: e[1], hx: e[2], hy: e[3] });
  }
  P.armF = arms[0]; P.armB = arms[1];
  return P;
}

// Umhang / Band-Kurve, die im Lauf nach hinten weht (deterministisch)
function flowCurve(ax, ay, len, n, flow, t, seed, droop, lift) {
  const pts = [[ax, ay]];
  let x = ax, y = ay;
  const seg = len / n;
  for (let i = 1; i <= n; i++) {
    const s = i / n;
    const wave = Math.sin(t * (6 + flow * 5) - s * 5 + seed) * (0.18 + flow * 0.32) * s;
    const back = lerp(droop === undefined ? 0.12 : droop, 1.25 + (lift || 0), flow) * Math.pow(s, 0.7);
    const a = Math.PI / 2 + back + wave;
    x += Math.cos(a) * seg; y += Math.sin(a) * seg;
    pts.push([x, y]);
  }
  return pts;
}

/* ------------------------------------------------------------ Gegner */
function updateFoe(e, dt) {
  e.stateT += dt;
  e.poiseT -= dt; if (e.poiseT <= 0) e.poise = e.maxPoise;
  const p = G.player, AI = e.ai;
  const dx = p.x - e.x, dy = p.y - e.y, d = Math.hypot(dx, dy) || 1;
  let tvx = 0, tvy = 0;
  if (e.state === 'down') { e.vx *= Math.exp(-dt * 5); e.vy *= Math.exp(-dt * 5); e.anim.hurt = 1; return; }
  if (G.state !== 'play') { e.vx *= Math.exp(-dt * 8); e.vy *= Math.exp(-dt * 8); return; }
  if (AI.onTick) AI.onTick(e, dt);
  const P = AI.params(e);
  if (e.state === 'idle' || e.state === 'approach') {

      tvx = -dy / d * P.speed * 0.35 * s; tvy = dx / d * P.speed * 0.35 * s;

    const A = e.atk;

    e.anim.cast = Math.min(1, e.stateT / A.wind) * 0.8; e.anim.aim = e.face > 0 ? e.aim : Math.PI - e.aim;
    if (e.stateT >= A.wind) { setState(e, 'active'); e.hitDone = false; }
  } else if (e.state === 'active') {
    const A = e.atk;
    e.anim.cast = 1;
    if (A.type === 'beam') {
      if (!e.hitDone) {
        e.hitDone = true;
        const L = A.len, ax = Math.cos(e.aim), ay = Math.sin(e.aim);
        const rx = p.x - e.x, ry = p.y - e.y, along = rx * ax + ry * ay, across = Math.abs(-rx * ay + ry * ax);
        if (along > 0 && along < L && across < A.width / 2 + p.r) damagePlayer(e, A.dmg, e.aim, 140);
        G.fx.push({ k: 'beam', x: e.x, y: e.y - 24, a: e.aim, len: L, w: A.width, col: A.col || '#ff6a4a', life: 0.2, t: 0 });
        sfx('enemyShot', 0, 0.02);
      }
      if (e.stateT >= A.act) setState(e, 'recover');
    } else if (A.type === 'lunge') {
      tvx = Math.cos(e.aim) * A.speed; tvy = Math.sin(e.aim) * A.speed;
      if (!e.hitDone && Math.hypot(p.x - e.x, p.y - e.y) < e.r + p.r + 10) { e.hitDone = true; damagePlayer(e, A.dmg, e.aim, 220); }
      if (e.stateT >= A.act) { setState(e, 'recover'); }
    } else {
      if (!e.hitDone) {
        e.hitDone = true;
        const pd = Math.hypot(p.x - e.x, p.y - e.y);
        if (pd <= A.reach + p.r && inArc(p.x, p.y, e.x, e.y, e.aim, A.arc)) damagePlayer(e, A.dmg, e.aim, 180);
        slash(e.x, e.y - 30, e.aim, A.reach, A.arc, A.col || '#ffb040');
        sfx('whip', 0, 0.02);
      }
      if (e.stateT >= A.act) {
        if (A.chain) { e.atk = A.chain; e.aim = Math.atan2(dy, dx); setState(e, 'wind'); e.tele = addTele(e, e.atk); }
        else setState(e, 'recover');

}
function startFoeAttack(e, A) {

  setState(e, 'wind');

}
function addTele(e, A) {

}
function updateNpc(e, dt) {

    const tg = n.path[n.i], dx = tg[0] - e.x, dy = tg[1] - e.y, d = Math.hypot(dx, dy);

/* ------------------------------------------------------------ Arena */
function collideArena(e) {
  const A = G.arena, m = e.r;
  e.x = clamp(e.x, m, A.w - m); e.y = clamp(e.y, m + 20, A.h - m);
  for (const b of A.blocks || []) {
    const cx = clamp(e.x, b.x, b.x + b.w), cy = clamp(e.y, b.y, b.y + b.h);
    const dx = e.x - cx, dy = e.y - cy, d = Math.hypot(dx, dy);
    if (d < m) { if (d > 0.01) { e.x = cx + dx / d * m; e.y = cy + dy / d * m; } else e.y = b.y - m; }
  }
}
function updateCamera(rdt) {
  const p = G.player, f = G.foe;
  let tx = p.x, ty = p.y - 20;
  if (f && f.state !== 'down') { tx = lerp(p.x, f.x, 0.3); ty = lerp(p.y, f.y, 0.3) - 20; }
  const A = G.arena, hw = VIEW.w / 2, hh = VIEW.h / 2;
  tx = A.w > VIEW.w ? clamp(tx, hw, A.w - hw) : A.w / 2;
  ty = A.h > VIEW.h ? clamp(ty, hh - 60, A.h - hh + 40) : A.h / 2;

  G.shake = Math.max(0, G.shake - rdt * 30);

/* ------------------------------------------------------------ Effekte */
function burst(x, y, n, col) {
  for (let i = 0; i < n; i++) { const a = rand(0, TAU), s = rand(60, 220); G.fx.push({ k: 'spark', x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 40, life: rand(0.18, 0.4), t: 0, col, size: rand(2, 4.5) }); }
}
function dust(x, y, n, s) { for (let i = 0; i < n; i++) G.fx.push({ k: 'dust', x: x + rand(-4, 4), y: y + rand(-2, 2), vx: rand(-20, 20), vy: rand(-8, 4), life: rand(0.35, 0.6), t: 0, size: rand(4, 7) * (s || 1) }); }
function slash(x, y, a, r, arc, col) { G.fx.push({ k: 'slash', x, y, a, r, arc, col, life: 0.18, t: 0 }); }

function updateFx(dt) {
  for (let i = G.fx.length - 1; i >= 0; i--) { const f = G.fx[i]; f.t += dt; if (f.k === 'spark') { f.x += f.vx * dt; f.y += f.vy * dt; f.vy += 300 * dt; f.vx *= Math.exp(-dt * 4); } else if (f.k === 'dust') { f.x += f.vx * dt; f.y += f.vy * dt; } if (f.t >= f.life) G.fx.splice(i, 1); }
  for (let i = G.texts.length - 1; i >= 0; i--) { const T = G.texts[i]; T.t += dt; T.y -= 34 * dt; if (T.t >= T.life) G.texts.splice(i, 1); }
}

/* ------------------------------------------------------------ Sonne, Inspect, Voraussicht, Hub */
function inRects(e, list) { for (const r of list || []) if (e.x > r.x && e.x < r.x + r.w && e.y > r.y && e.y < r.y + r.h) return true; return false; }

function doInspect(p) {
  if (!SAVE.quinn.skills.includes('inspect')) return;
  const f = nearestFoe(p, 260) || G.ents.find((e) => e.npc && e.npc.info && dist2(e.x, e.y, p.x, p.y) < 260 * 260);
  if (!f) { sysMsg({ head: 'INSPECT', lines: ['Kein Ziel in der Nähe.'] }, 1600); return; }
  sfx('card');
  if (G.inSun) { sysMsg({ head: 'INSPECT', lines: ['Im direkten Sonnenlicht nicht lesbar.'] }, 2400); if (G.opt.onInspect) G.opt.onInspect(G, f, false); return; }
  const I = f.info || (f.npc && f.npc.info) || {};
  sysMsg({ head: 'INSPECT', kv: [['Name', I.name || f.name || '?'], ['Rasse', I.race || 'Mensch'], ['Fähigkeit', I.ability || '?'], ['HP', f.team === 1 ? Math.ceil(f.hp) + ' / ' + f.maxHp : '—'], ['Blutgruppe', I.blood || '?']] }, 3400);

function foresee(e, p) {

  const a = Math.atan2(e.y - p.y, e.x - p.x) + (Math.random() < 0.5 ? 1.2 : -1.2);
  e.vx = Math.cos(a) * 260; e.vy = Math.sin(a) * 260;
  setState(e, 'evade');
  G.stats.evaded = (G.stats.evaded || 0) + 1;
  floatText(e.x, e.y - 76, 'ausgewichen', '#8ad8ff');
  sfx('dodge', 0, 0.05);
  if (G.opt.onEvade) G.opt.onEvade(G, e);
}
function updatePois() {
  const p = G.player; let best = null, bd = 1e9;
  for (const P of G.arena.pois || []) {
    if (P.hidden && P.hidden()) continue;
    const d = Math.hypot(p.x - P.x, p.y - P.y);
    if (d < (P.r || 34) && d < bd) { bd = d; best = P; }
  }
  G.poi = best;
}

/* ------------------------------------------------------------ Blood Swipe (ab Halbling)
   Roman: keine Abklingzeit, kostet 1 HP pro Einsatz, Reichweite etwa 5 Meter. */
function castBloodSwipe(p) {
  if (!SAVE.quinn.skills.includes('bloodswipe') || p.state === 'down' || p.state === 'hurt') return;
  if ((p.swipeCd || 0) > 0) return;
  if (p.hp <= 1) { floatText(p.x, p.y - 72, 'Zu wenig HP', '#ff8a8a'); return; }
  p.hp -= 1; p.swipeCd = 0.35; G.stats.swipes = (G.stats.swipes || 0) + 1;
  const f = nearestFoe(p, 200);
  const [mx, my] = readMove();
  const a = f ? Math.atan2(f.y - p.y, f.x - p.x) : (mx || my) ? Math.atan2(my, mx) : (p.face > 0 ? 0 : Math.PI);
  p.face = Math.cos(a) >= 0 ? 1 : -1; p.anim.cast = 1; p.anim.aim = p.face > 0 ? a : Math.PI - a;
  G.proj.push({ x: p.x + Math.cos(a) * 12, y: p.y + Math.sin(a) * 12, a, sp: 300, dist: 0, max: 70, dmg: 2 * (p.str * (G.inSun ? 0.5 : 1) / 10), hit: new Set() });
  floatText(p.x, p.y - 72, '-1 HP', '#ff5a6a');
  sfx('whip', 0, 0.03); sfx('splat', 0, 0.05);
}
function updateProj(dt) {
  const p = G.player;
  p.swipeCd = Math.max(0, (p.swipeCd || 0) - dt);
  for (let i = G.proj.length - 1; i >= 0; i--) {
    const P = G.proj[i];
    const step = P.sp * dt; P.x += Math.cos(P.a) * step; P.y += Math.sin(P.a) * step; P.dist += step;
    for (const e of G.ents) {
      if (e.team !== 1 || e.state === 'down' || P.hit.has(e.id)) continue;
      if (Math.hypot(e.x - P.x, e.y - P.y) < e.r + 12) { P.hit.add(e.id); damageFoe(e, P.dmg, { kb: 90, ang: P.a, poise: 1, heavy: false }); }
    }
    if (P.dist >= P.max) { G.proj.splice(i, 1); burst(P.x, P.y - 20, 4, '#ff3a4e'); }
  }
}

function renderFight() {

function drawTele(g, T) {
  const k = clamp(T.t / T.dur, 0, 1), done = T.t >= T.dur;
  g.save(); g.translate(T.x, T.y);

'use strict';
/* ==========================================================================
   STORY & OBERFLAECHE — Szenen (Dialog, Erzaehler, System-Fenster),
   Kampf-HUD mit Handy-Steuerung, System-Meldungen im Kampf.
   Alle Texte sind eigene Nacherzaehlungen, keine Zitate aus dem Roman.
   ========================================================================== */

const UI = { root: document.getElementById('ui'), hud: null, scene: null };
function uiShow(html, cls) {
  UI.root.innerHTML = `<div class="screen ${cls || ''}">${html}</div>`;
  UI.hud = null;
  return UI.root.firstElementChild;
}
function sysBox(S) {
  return `<div class="sys"><div class="head">[ ${S.head || 'SYSTEM'} ]</div>
    ${(S.lines || []).map((l) => `<div class="line">${l}</div>`).join('')}
    ${S.kv ? `<div class="kv">${S.kv.map(([k, v]) => `<span>${k}</span><span>${v}</span>`).join('')}</div>` : ''}
    ${(S.quests || []).map((q) => `<div class="quest">▸ ${q}</div>`).join('')}</div>`;
}

/* ------------------------------------------------------------ Szenen */
// beats: { who, text } | { narr } | { sys: {...} } | { portrait: lookId, extra } | { bg } | { call: fn }
function runScene(beats, done) {
  let i = -1, portrait = null, extra = null;
  UI.hud = null;
  const next = () => {
    i++;
    while (i < beats.length && (beats[i].portrait !== undefined || beats[i].bg || beats[i].call)) {
      const b = beats[i];
      if (b.portrait !== undefined) { portrait = b.portrait; extra = b.extra || null; }
      if (b.bg) SCENE_BG.cur = b.bg;
      if (b.call) b.call();
      i++;
    }
    if (i >= beats.length) { done && done(); return; }
    const b = beats[i];
    let inner;
    if (b.sys) { inner = sysBox(b.sys) + '<div class="tap">TIPPEN</div>'; sfx('card'); }
    else if (b.narr) inner = `<div class="box narr"><div class="txt">${b.narr}</div><div class="tap">TIPPEN</div></div>`;
    else inner = `<div class="box"><div class="who" style="color:${WHO_COL[b.who] || 'var(--gold)'}">${b.who}</div><div class="txt">${b.text}</div><div class="tap">TIPPEN</div></div>`;
    UI.root.innerHTML = `<div class="screen scene" style="justify-content:${b.sys ? 'center' : 'flex-end'}">${portrait && !b.sys ? '<canvas class="portrait"></canvas>' : ''}${inner}</div>`;
    const sc = UI.root.firstElementChild;
    if (portrait && !b.sys) drawPortrait(sc.querySelector('canvas'), portrait, extra, b.who);
    sc.addEventListener('pointerup', () => { AudioSys.init(); sfx('click'); next(); });
    UI.scene = { next };
  };
  next();
}
const WHO_COL = { Quinn: '#9ab0ff', Peter: '#9aff9a', Kyle: '#ffb040', Vorden: '#ffd27a', Layla: '#c8a0ff' };
function drawPortrait(c, id, extra, who) {
  const W = 360, H = 360; c.width = W * VIEW.dpr; c.height = H * VIEW.dpr;
  UI.portrait = { c, id, extra, talking: who && LOOKS[id] && who.toLowerCase() === id, spr: null, t0: performance.now() };
  paintPortrait(performance.now());
}
function paintPortrait(now) {
  const P = UI.portrait; if (!P || !P.c.isConnected) { UI.portrait = null; return; }
  const g = P.c.getContext('2d'), px = 5.2 * VIEW.dpr;
  const t = (now - P.t0) / 1000;
  // Atmen; wer spricht, gestikuliert leicht
  const cast = P.talking ? Math.max(0, Math.sin(t * 3.1)) * 0.35 : 0;
  P.spr = renderFigure(LOOKS[P.id], { t: 1 + t, run: 0, cast, aim: -0.2 }, px, P.spr, P.extra);
  g.setTransform(1, 0, 0, 1, 0, 0); g.clearRect(0, 0, P.c.width, P.c.height);
  const k = Math.min(1, t * 4);
  g.globalAlpha = k;
  g.drawImage(P.spr.out, P.c.width / 2 - P.spr.S / 2 + (1 - k) * 30, P.c.height * 0.98 - P.spr.anchorY);
  g.globalAlpha = 1;
}

const SCENE_BG = { cur: 'zimmer' };
function renderSceneBg(t) {
  const g = ctx, W = cv.width, H = cv.height, u = Math.min(W, H) / 100;
  g.setTransform(1, 0, 0, 1, 0, 0);
  const id = SCENE_BG.cur;
  const glowField = (col, n) => { g.globalCompositeOperation = 'lighter'; for (let i = 0; i < n; i++) { const x = (hash2(i, 1, 3) % 1000) / 1000 * W, y = ((hash2(i, 2, 3) % 1000) / 1000 * H - t * 10 * (1 + i % 3) + H * 10) % H; g.globalAlpha = 0.07 + 0.05 * Math.sin(t + i); g.drawImage(glowSprite(col), x - 3 * u, y - 3 * u, 6 * u, 6 * u); } g.globalAlpha = 1; g.globalCompositeOperation = 'source-over'; };
  if (id === 'zimmer') {
    // kleines Zimmer bei Nacht: Wand, Fenster, Schreibtisch mit dem schwarzen Buch
    g.fillStyle = lg(g, 0, 0, 0, H, [0, '#1c1826', 1, '#0c0a12']); g.fillRect(0, 0, W, H);
    g.fillStyle = '#16121e'; g.fillRect(0, H * 0.62, W, H * 0.38);
    const wx = W * 0.62, wy = H * 0.12, ww = W * 0.3, wh = H * 0.22;
    g.fillStyle = lg(g, 0, wy, 0, wy + wh, [0, '#1a2a4a', 1, '#2a3a5a']); g.fillRect(wx, wy, ww, wh);
    g.fillStyle = '#e8ecf8'; g.beginPath(); g.arc(wx + ww * 0.7, wy + wh * 0.35, u * 3, 0, TAU); g.fill();
    g.strokeStyle = '#0c0a12'; g.lineWidth = u; g.strokeRect(wx, wy, ww, wh); g.beginPath(); g.moveTo(wx + ww / 2, wy); g.lineTo(wx + ww / 2, wy + wh); g.stroke();
    g.globalCompositeOperation = 'lighter'; g.fillStyle = 'rgba(120,150,220,0.06)'; g.beginPath(); g.moveTo(wx, wy + wh); g.lineTo(wx + ww, wy + wh); g.lineTo(wx + ww * 0.6, H); g.lineTo(wx - ww * 0.7, H); g.fill(); g.globalCompositeOperation = 'source-over';
    const dx = W * 0.08, dy = H * 0.6; g.fillStyle = '#3a2a20'; g.fillRect(dx, dy, W * 0.44, u * 3); g.fillRect(dx + u * 2, dy, u * 2, H * 0.2); g.fillRect(dx + W * 0.44 - u * 4, dy, u * 2, H * 0.2);
    // das Buch
    const bx = dx + W * 0.14, by = dy - u * 2.4;
    g.fillStyle = '#08060a'; g.fillRect(bx, by, u * 14, u * 2.6); g.fillStyle = '#2a0a12'; g.fillRect(bx, by + u * 2, u * 14, u * 0.6);
    g.globalCompositeOperation = 'lighter'; g.globalAlpha = 0.25 + Math.sin(t * 2) * 0.1; g.drawImage(glowSprite('#ff2a40'), bx - u * 6, by - u * 8, u * 26, u * 18); g.globalAlpha = 1; g.globalCompositeOperation = 'source-over';
  } else if (id === 'bus') {
    // Transport: Fensterreihe, draussen zieht die Militaerstadt vorbei
    g.fillStyle = '#1a1c24'; g.fillRect(0, 0, W, H);
    const wy = H * 0.14, wh = H * 0.3;
    g.fillStyle = lg(g, 0, wy, 0, wy + wh, [0, '#8ab8e8', 1, '#e8d8b0']); g.fillRect(0, wy, W, wh);
    for (let i = 0; i < 14; i++) { const bw = W * (0.08 + (hash2(i, 5, 1) % 100) / 900), bh = wh * (0.3 + (hash2(i, 6, 1) % 100) / 160); const x = ((i * W * 0.14 - t * W * 0.12) % (W * 1.9) + W * 1.9) % (W * 1.9) - W * 0.3; g.fillStyle = i % 2 ? '#5a6a82' : '#4a5870'; g.fillRect(x, wy + wh - bh, bw, bh); g.fillStyle = 'rgba(255,240,200,0.5)'; for (let k = 0; k < 4; k++) g.fillRect(x + bw * 0.2, wy + wh - bh + k * bh / 4 + u, bw * 0.2, u * 0.8); }
    g.fillStyle = '#2a2e3a'; for (let x = 0; x < W; x += W / 3) g.fillRect(x - u, wy, u * 2.4, wh);
    g.fillStyle = '#12141a'; g.fillRect(0, wy + wh, W, H);
    for (let x = W * 0.05; x < W; x += W * 0.3) { g.fillStyle = '#3a2a4a'; g.fillRect(x, H * 0.62, W * 0.2, H * 0.12); g.fillStyle = '#2a1e36'; g.fillRect(x, H * 0.5, W * 0.2, H * 0.12); }
  } else if (id === 'kantine') {
    g.fillStyle = lg(g, 0, 0, 0, H, [0, '#4a5262', 1, '#2a2e38']); g.fillRect(0, 0, W, H * 0.5);
    for (let x = W * 0.05; x < W; x += W * 0.24) { g.fillStyle = '#9ec8e8'; g.fillRect(x, H * 0.08, W * 0.16, H * 0.16); g.strokeStyle = '#2a303c'; g.lineWidth = u; g.strokeRect(x, H * 0.08, W * 0.16, H * 0.16); }
    const T = u * 9; for (let y = H * 0.5; y < H; y += T) for (let x = 0; x < W; x += T) { g.fillStyle = ((x + y) / T | 0) % 2 ? '#9a9ea8' : '#8a8e98'; g.fillRect(x, y, T, T); }
    g.fillStyle = 'rgba(10,12,18,0.35)'; g.fillRect(0, 0, W, H);
    for (const [x, y] of [[0.05, 0.56], [0.6, 0.6], [0.2, 0.78]]) { g.fillStyle = '#6a4a30'; g.fillRect(W * x, H * y, W * 0.35, u * 4); }
  } else if (id === 'nacht') {
    g.fillStyle = lg(g, 0, 0, 0, H, [0, '#060a1c', 0.7, '#101a34', 1, '#1a2438']); g.fillRect(0, 0, W, H);
    for (let i = 0; i < 70; i++) { const x = (hash2(i, 9, 2) % 1000) / 1000 * W, y = (hash2(i, 8, 2) % 1000) / 1000 * H * 0.6; g.globalAlpha = 0.3 + 0.5 * Math.abs(Math.sin(t * 0.8 + i)); g.fillStyle = '#fff'; g.fillRect(x, y, u * 0.35, u * 0.35); }
    g.globalAlpha = 1;
    g.fillStyle = '#e8ecf8'; g.beginPath(); g.arc(W * 0.78, H * 0.14, u * 5, 0, TAU); g.fill(); glowField('#9ab0ff', 6);
    g.fillStyle = '#070912'; g.beginPath(); g.moveTo(0, H * 0.7);
    for (let i = 0; i <= 12; i++) { const x = W * i / 12, h = H * (0.08 + (hash2(i, 3, 3) % 100) / 700); g.lineTo(x, H * 0.7 - h); g.lineTo(x + W / 12, H * 0.7 - h); }
    g.lineTo(W, H); g.lineTo(0, H); g.fill();
    for (let i = 0; i < 26; i++) { g.fillStyle = 'rgba(255,220,150,0.6)'; g.fillRect((hash2(i, 4, 7) % 1000) / 1000 * W, H * (0.6 + (hash2(i, 5, 7) % 100) / 1000), u * 0.8, u * 0.8); }
  } else if (id === 'system') {
    g.fillStyle = rg(g, W / 2, H * 0.45, u * 4, Math.max(W, H) * 0.8, [0, '#0e2a54', 1, '#02060e']); g.fillRect(0, 0, W, H);
    g.strokeStyle = 'rgba(110,200,255,0.08)'; g.lineWidth = 1;
    const gs = u * 8, off = (t * u * 3) % gs;
    for (let x = -gs; x < W + gs; x += gs) { g.beginPath(); g.moveTo(x + off, 0); g.lineTo(x + off, H); g.stroke(); }
    for (let y = -gs; y < H + gs; y += gs) { g.beginPath(); g.moveTo(0, y + off); g.lineTo(W, y + off); g.stroke(); }
    glowField('#6ec8ff', 18);
  } else { g.fillStyle = '#08080e'; g.fillRect(0, 0, W, H); }
  if (id !== 'system') glowField(id === 'zimmer' ? '#ff6a7a' : '#aab8d8', 10);
  if (UI.portrait) paintPortrait(performance.now());
}

function updateHud() {
  if (!UI.hud || !G) return;
  const p = G.player, C = UI.cache;
  const hpK = p.hp + '/' + p.maxHp;
  if (C.hp !== hpK) { C.hp = hpK; $('#hpb').style.width = (p.hp / p.maxHp * 100) + '%'; $('#hpn').textContent = `HP ${Math.ceil(p.hp)} / ${p.maxHp}`; }
  const xk = SAVE.quinn.level + ':' + SAVE.quinn.exp + ':' + Math.round(G.expGain || 0);
  if (C.xp !== xk) { C.xp = xk; $('#lvl').textContent = 'Stufe ' + SAVE.quinn.level + (SAVE.quinn.points ? ' · +' + SAVE.quinn.points : ''); $('#xpb').style.width = Math.min(100, (SAVE.quinn.exp + (G.expGain || 0)) / expNeed(SAVE.quinn.level) * 100) + '%'; }
  const st = Math.round(p.stam);
  if (C.st !== st) { C.st = st; $('#stb').style.width = (p.stam / p.maxStam * 100) + '%'; $('#stbw').classList.toggle('low', st < 25); }
  const f = G.foe;
  if (f && G.showFoe) {
    const k = f.name + f.hp;
    if (C.foe !== k) { C.foe = k; $('#foe').style.display = ''; $('#foen').textContent = f.name; $('#foeb').style.width = (f.hp / f.maxHp * 100) + '%'; }
  }
  const h = G.hint ? G.hint.text : '';
  if (C.hint !== h) { C.hint = h; $('#hint').innerHTML = h; }
  const ch = p.state === 'charge' && p.stateT > 0.45;
  if (C.ch !== ch) { C.ch = ch; $('#bAtk').classList.toggle('charge', ch); }
  const atkTxt = G.poi ? (G.poi.btn || 'LOS') : 'ANGRIFF';
  if (C.atk !== atkTxt) { C.atk = atkTxt; $('#bAtk').textContent = atkTxt; $('#bAtk').classList.toggle('act', !!G.poi); }
  const sun = !!G.inSun;
  if (C.sun !== sun) { C.sun = sun; $('#sun').classList.toggle('on', sun); }
  if (G.hubInfo) {
    const D = SAVE.day, gk = G.hubInfo.goal + D.water + Math.round(D.sun) + D.n + D.night;
    if (C.goal !== gk) {
      C.goal = gk;
      $('#goal').innerHTML = `<div class="gh">TAG ${D.n}${D.night ? ' · NACHT' : ''}</div>${G.hubInfo.goal ? `<div class="gq">▸ ${G.hubInfo.goal}</div>` : ''}` +
        (SAVE.quinn.thirst ? `<div class="gd bad">Blutdurst · HP −${SAVE.quinn.thirst}</div>` : '') + (D.night ? '' : `<div class="gd">${D.water ? '✔' : '▫'} 2 Liter Wasser trinken</div><div class="gd ${D.sun >= 6 ? 'bad' : ''}">${D.sun < 6 ? '▫' : '✘'} Sonne meiden (${Math.min(6, D.sun).toFixed(0)} / 6 s)</div>`);
    }
  }
  const lowD = p.stam < 18;
  if (C.lowD !== lowD) { C.lowD = lowD; $('#bDodge').classList.toggle('cd', lowD); }
}
function banner(text) {
  if (!UI.hud) return;
  const el = document.createElement('div'); el.className = 'banner'; el.textContent = text;
  UI.hud.appendChild(el); setTimeout(() => el.remove(), 1200);
}
function sysMsg(S, ms) {
  const box = $('#sysmsg'); if (!box) return;
  box.innerHTML = sysBox(S); sfx('card');
  clearTimeout(sysMsg.tm); sysMsg.tm = setTimeout(() => { box.innerHTML = ''; }, ms || 3200);

function showPause() {
  if (!G || G.state !== 'play') return;
  G.paused = true;
  const el = document.createElement('div'); el.className = 'screen dim'; el.style.pointerEvents = 'auto';
  el.innerHTML = `${sysBox({ head: 'PAUSE', lines: [MISSION ? MISSION.title : ''], kv: [['Treffer gelandet', G.stats.hits], ['Perfekt ausgewichen', G.stats.perfect], ['Schaden erlitten', G.stats.taken]] })}
    <button class="btn" id="pRes">Weiter</button><button class="btn" id="pStat">Status${SAVE.quinn.points ? ' · +' + SAVE.quinn.points : ''}</button><button class="btn ghost" id="pRe">Kampf neu starten</button><button class="btn ghost" id="pMenu">Hauptmenü</button>`;
  UI.root.appendChild(el);
  el.querySelector('#pRes').onclick = () => { el.remove(); G.paused = false; };
  el.querySelector('#pStat').onclick = () => showStatus();
  el.querySelector('#pRe').onclick = () => { el.remove(); startMission(MISSION.id, true); };
  el.querySelector('#pMenu').onclick = () => { G = null; showTitle(); };
}

/* ------------------------------------------------------------ Kyle (Kap. 10–11)
   Schueler mit Faehigkeitsstufe 1, Tigerkrallen. Phase 2: Verwandlung. */
const KYLE_ATK = {
  swipe: { type: 'swipe', wind: 0.55, act: 0.1, rec: 0.55, reach: 44, arc: 1.0, dmg: 1 },
  lunge: { type: 'lunge', wind: 0.65, act: 0.24, rec: 0.7, speed: 320, dmg: 2, shout: '!' },
  swipe2: { type: 'swipe', wind: 0.4, act: 0.1, rec: 0.1, reach: 50, arc: 1.05, dmg: 1, col: '#ff8a2a',
    chain: { type: 'swipe', wind: 0.3, act: 0.1, rec: 0.55, reach: 52, arc: 1.15, dmg: 1, col: '#ff8a2a' } },
  lunge2: { type: 'lunge', wind: 0.45, act: 0.26, rec: 0.55, speed: 380, dmg: 2, shout: '!' }
};
const AI_KYLE = {
  params: (e) => (e.phase === 1 ? { range: 40, speed: 92, cd: 1.1 } : { range: 42, speed: 126, cd: 0.55 }),
  choose(e, d) {
    const two = e.phase === 2;
    if (d > 85) return Math.random() < (two ? 0.7 : 0.5) ? (two ? KYLE_ATK.lunge2 : KYLE_ATK.lunge) : null;
    if (d < 62) return two ? KYLE_ATK.swipe2 : KYLE_ATK.swipe;
    return null;
  },
  onHurt(e) {
    if (e.phase === 1 && e.hp <= e.maxHp * 0.5) {
      e.phase = 2; e.extra = { claws: 1, glow: true }; e.spr = null;
      setState(e, 'transform'); G.tele = G.tele.filter((T) => T.owner !== e);
      e.poise = e.maxPoise = 5;
      banner('VERWANDLUNG'); sfx('roar'); G.shake = 8;
      burst(e.x, e.y - 30, 18, '#ff9a3a');
      sysMsg({ head: 'SYSTEM', lines: ['Kyle setzt seine Fähigkeit ein: Tigerkrallen.', 'Seine Angriffe werden schneller und kommen doppelt.'] }, 3600);
    }
  }
};

   Faehigkeit Verhaertung: immer nur EINE Koerperstelle. Die gehaertete Seite dreht
   sich langsam zu Quinn; wer schnell die Seite wechselt (Ausweichen, Finte), trifft. */
const RYLEE_ATK = {
  punch: { type: 'swipe', wind: 0.45, act: 0.1, rec: 0.5, reach: 40, arc: 0.9, dmg: 1, col: '#c8d0dc' },
  rush: { type: 'lunge', wind: 0.6, act: 0.24, rec: 0.7, speed: 300, dmg: 2, shout: '!' }
};
const AI_RYLEE = {
  harden: true,
  params: () => ({ range: 42, speed: 88, cd: 1.0 }),
  choose: (e, d) => (d > 90 ? (Math.random() < 0.5 ? RYLEE_ATK.rush : null) : d < 60 ? RYLEE_ATK.punch : null),
  onTick(e, dt) {
    const p = G.player, want = Math.atan2(p.y - e.y, p.x - e.x);

    const turn = e.state === 'wind' || e.state === 'active' ? 1.2 : 2.2; // beim Angreifen dreht er langsamer
    e.hardDir += clamp(angDiff(e.hardDir, want), -turn * dt, turn * dt);
  }
};

/* ------------------------------------------------------------ Ablauf-Hilfen */
function testTick(G, dt) {
  const T = G.tut || (G.tut = { t: 0, best: 0, total: 0 });
  T.t += dt;
  const s = G.foe;
  s.meter = Math.max(0, (s.meter || 0) - dt * 0.6);
  const dealt = s.maxHp - s.hp;
  if (dealt > T.total) { s.meter = Math.min(1, s.meter + (dealt - T.total) * 0.12); T.total = dealt; }
  G.hint = { text: T.t < 12 ? `Messung läuft · ${Math.ceil(12 - T.t)} s<br><b>ANGRIFF</b> tippen oder halten` : 'Messung beendet' };
  if (T.t >= 12 && G.state === 'play') {
    G.state = 'won'; G.result = { total: T.total };
    sysMsg({ head: 'MESSUNG', kv: [['Gesamtwert', T.total.toFixed(1)], ['Einstufung', 'Stufe 1']] }, 2600);
    later(2.4, () => G.opt.onWin(G));
  }
}
function survivalTick(sec) {
  return function (G, dt) {
    const T = G.tut || (G.tut = { t: 0 });
    T.t += dt;
    G.hint = { text: T.t < sec ? `Durchhalten · ${Math.ceil(sec - T.t)} s` : '' };
    if (T.t >= sec && G.state === 'play') { G.state = 'won'; G.tele.length = 0; banner('GESCHAFFT'); later(1.2, () => G.opt.onWin(G)); }
  };
}
function monoTick(G, dt) {
  const T = G.tut || (G.tut = { t: 0 });
  T.t += dt;
  const ev = G.stats.evaded || 0;
  G.hint = { text: ev < 2 ? 'Greif Mono an' : T.inspected ? '' : 'Tippe <b>INSPECT</b>' };
  if ((ev >= 6 && T.inspected) || T.t > 32) { if (G.state === 'play') { G.state = 'won'; G.tele.length = 0; later(0.8, () => G.opt.onWin(G)); } }
}

  pois.push({ x: 335, y: 420, label: 'Trainingshalle', col: '#c8a0ff', hidden: () => !(night && F.kyle && !F.nacht), action: go('nacht') });
  const blocks = buildings.map((b) => ({ x: b.x, y: b.y, w: b.w, h: b.h - 8, invisible: true }));
  // Schatten: unter den Gebaeuden und unter dem ueberdachten Hauptweg (sicherer Weg durch den Hof)
  const shade = buildings.map((b) => ({ x: b.x - 4, y: b.y + b.h - 8, w: b.w + 8, h: 46 })).concat([{ x: 192, y: 130, w: 56, h: H - 130 }]);
  return {

      sun: night ? [] : [{ x: 0, y: 0, w: W, h: H }], shade, night,

    playerAt: [220, 620], foes: [],
    npcs: night ? [] : [
      { id: 's1', at: [60, 540], path: [[60, 540], [150, 600], [60, 620]] },
      { id: 's2', at: [380, 560], path: [[380, 560], [300, 640], [390, 620]], speed: 45 },

    ],
    inspect: SAVE.quinn.skills.includes('inspect'), hub: true, onTick: hubTick
  };
}
function canSleep() {
  const D = SAVE.day, F = SAVE.flags;
  if (D.n === 1) return F.book && F.room;
  if (D.n === 2) return F.kyle && F.nacht;
  if (D.n === 3) return F.rylee;
  return false;
}
function hubGoal() {
  const D = SAVE.day, F = SAVE.flags;
  if (D.n === 1) return !F.room ? 'Sieh dir Zimmer 23 im Wohnheim an' : !F.book ? 'Rundgang: Besuche die Bibliothek' : 'Geh schlafen (Zimmer 23)';
  if (D.n === 2 && !F.kyle) return 'Geh in die Kantine';
  if (D.n === 2 && !F.nacht) return 'Nacht: Schleich in die Trainingshalle';
  if (D.n === 2) return 'Geh schlafen (Zimmer 23)';
  if (!F.mono) return 'Geh in die Kantine';
  if (!F.vordenGift) return 'Geh ins Zimmer 23 (Vorden)';
  if (!F.mask) return `Kaufe im Laden eine Maske (${SAVE.credits} Credits)`;
  if (!F.rylee) return D.night ? 'Geh in den Park (unten)' : 'Warte im Zimmer 23 auf die Nacht';
  if (D.n === 3) return 'Geh schlafen (Zimmer 23)';
  if (!F.dan) return 'Geh in die Kantine';
  if (!F.biss) return 'Geh in die Bibliothek – der Hunger ist unerträglich';
  return '';
}
function hubTick(G, dt) {
  const D = SAVE.day;
  if (G.inSun) D.sun += dt;
  G.hint = null;
  G.hubInfo = { goal: hubGoal(), sun: G.inSun };
}
function leaveHub(fn) { G = null; writeSave(); fn(); }
function sleep() {
  const D = SAVE.day, sunOk = D.sun < 6, lines = [];
  let ep = 0;
  lines.push(D.water ? '✔ 2 Liter Wasser getrunken (+5 EP)' : '✘ Kein Wasser getrunken');
  if (D.water) ep += 5;
  lines.push(sunOk ? '✔ Die Sonne gemieden (+5 EP)' : `✘ Zu lange in der Sonne (${Math.round(D.sun)} s)`);
  if (sunOk) ep += 5;
  addExp(ep - (D.water ? 5 : 0)); // Wasser wurde schon beim Trinken gutgeschrieben
  const n = D.n;
  SAVE.day = { n: n + 1, night: false, sun: 0, water: false };
  SAVE.credits += 10; lines.push('+10 Credits');
  writeSave();
  SCENE_BG.cur = 'nacht';
  runScene([{ bg: 'system' }, { sys: { head: `TAG ${n} BEENDET`, lines } }, { sys: { head: 'NEUER TAG', lines: [`Tag ${n + 1}`], quests: ['Tagesquest: Trinke 2 Liter Wasser', 'Tagesquest: Meide die Sonne'] } }], () => startMission('akademie'));
}

/* ------------------------------------------------------------ Tutorial im ersten Kampf */
function tutorialTick(G, dt) {
  const T = G.tut || (G.tut = { step: 0, moved: 0, t: 0 });
  T.t += dt;
  const p = G.player;
  if (T.step === 0) {
    G.hint = { text: 'Links auf den Bildschirm tippen und ziehen, um zu laufen' };
    if (Math.hypot(p.vx, p.vy) > 40) T.moved += dt;
    if (T.moved > 0.6 || T.t > 7) { T.step = 1; T.t = 0; }
  } else if (T.step === 1) {
    G.hint = { text: '<b>ANGRIFF</b> tippen: drei Schläge in Folge' };
    if (G.stats.hits >= 3 || T.t > 10) { T.step = 2; T.t = 0; }
  } else if (T.step === 2) {
    G.hint = { text: 'Rote Fläche = Angriff kommt.<br>Im letzten Moment <b>AUSWEICHEN</b> → Konter' };
    if (G.stats.perfect >= 1) { T.step = 3; T.t = 0; }
    else if (T.t > 22) { T.step = 3; T.t = 0; }
  } else if (T.step === 3) {
    G.hint = { text: '<b>ANGRIFF</b> gedrückt halten: aufgeladener Schlag, bricht die Deckung' };
    if (T.t > 6) { T.step = 4; G.hint = null; }
  }
}

/* ---- src/09-progress.js ---- */
'use strict';
/* ==========================================================================
   FORTSCHRITT — EP, Stufen und Wertepunkte (frei, nicht an die Story gebunden)
   Jede Stufe gibt einen Wertepunkt (wie im Roman) fuer Staerke, Agilitaet
   oder Ausdauer. Evolutionen bleiben an die Story gebunden.
   ========================================================================== */

function expNeed(level) { return 100 + (level - 1) * 40; }
// EP gutschreiben; liefert die Zahl der Stufenaufstiege
function gainExp(n) {
  const Q = SAVE.quinn;
  n = Math.max(0, Math.round(n));
  Q.exp += n;
  let ups = 0;
  while (Q.exp >= expNeed(Q.level)) { Q.exp -= expNeed(Q.level); Q.level++; Q.points++; ups++; }
  writeSave();
  return ups;
}
function addExp(n) {
  const ups = gainExp(n);
  if (ups && G && UI.hud) { banner('STUFE ' + SAVE.quinn.level); sfx('level'); sysMsg({ head: 'STUFENAUFSTIEG', lines: [`Stufe ${SAVE.quinn.level}`, `+${ups} Wertepunkt${ups > 1 ? 'e' : ''} – verteilen im Status`] }, 3200); }
  return ups;
}
// abgeleitete Werte
function quinnStats() {
  const S = SAVE.quinn.stats;
  const race = SAVE.quinn.race === 'Halbling' ? 5 : 0;
  return { maxHp: 10 + race + (S.sta - 10), maxStam: 100 + (S.sta - 10) * 4, str: S.str, agi: S.agi };
}
const STAT_INFO = {
  str: { name: 'Stärke', desc: 'mehr Schaden pro Schlag' },
  agi: { name: 'Agilität', desc: 'schneller laufen und ausweichen' },
  sta: { name: 'Ausdauer', desc: '+1 HP und mehr Ausdauer' }
};

/* ------------------------------------------------------------ Status-Fenster */
function statusHtml() {
  const Q = SAVE.quinn, S = Q.stats, D = quinnStats();
  const rows = Object.keys(STAT_INFO).map((k) => `<div class="strow"><span>${STAT_INFO[k].name}<small>${STAT_INFO[k].desc}</small></span><b>${S[k]}</b>
    <button class="plus" data-stat="${k}" ${Q.points ? '' : 'disabled'}>+</button></div>`).join('');
  return `<div class="sys statuswin"><div class="head">[ STATUS ]</div>
    <div class="kv"><span>Name</span><span>Quinn Talen</span><span>Rasse</span><span>${Q.race || 'Mensch'}</span>
      <span>Stufe</span><span>${Q.level}</span><span>HP</span><span>${D.maxHp}</span></div>
    <div class="expbar"><i style="width:${(Q.exp / expNeed(Q.level) * 100).toFixed(0)}%"></i></div>
    <div class="expnum">EP ${Q.exp} / ${expNeed(Q.level)}</div>
    <div class="line" style="margin-top:4px;font-size:15px">Credits: <b>${SAVE.credits}</b>${Q.thirst ? ` · <span style="color:#ff8a8a">Blutdurst: −${Q.thirst} HP</span>` : ''}</div>
    <div class="line" style="margin-top:6px">Freie Wertepunkte: <b style="color:#ffe6a0">${Q.points}</b></div>
    ${rows}
    <div class="line" style="margin-top:8px;font-size:15px;color:#9ab">Fähigkeiten: ${Q.skills.length ? Q.skills.map((s) => SKILL_NAMES[s] || s).join(', ') : '—'}</div></div>`;
}
const SKILL_NAMES = { inspect: 'Inspect', bloodswipe: 'Blood Swipe' };
function showStatus(back) {
  const el = document.createElement('div');
  el.className = 'screen dim'; el.style.pointerEvents = 'auto'; el.style.zIndex = 20;
  const draw = () => {
    el.innerHTML = statusHtml() + '<button class="btn" id="stBack">Zurück</button>';
    el.querySelectorAll('.plus').forEach((b) => b.addEventListener('click', () => {
      const Q = SAVE.quinn; if (!Q.points) return;
      Q.points--; Q.stats[b.dataset.stat]++; writeSave(); sfx('card');
      if (G && G.player) applyStats(G.player);
      draw();
    }));
    el.querySelector('#stBack').onclick = () => { el.remove(); back && back(); };
  };
  draw();
  UI.root.appendChild(el);
}
function applyStats(p) {
  const D = quinnStats();
  const gain = D.maxHp - (p.maxHp || D.maxHp);
  p.maxHp = D.maxHp; p.hp = Math.min(D.maxHp, p.hp + Math.max(0, gain));
  p.maxStam = D.maxStam; p.str = D.str; p.agi = D.agi;
}

/* ------------------------------------------------------------ Kampfbericht */
function fightReport(G, won) {
  const lines = [], kv = [];
  let ep = Math.round(G.expGain || 0);
  if (G.opt.expBonus) ep += G.opt.expBonus(G, won);
  kv.push(['EP aus dem Kampf', '+' + ep]);
  if (G.stats.perfect) kv.push(['Perfekt ausgewichen', G.stats.perfect]);
  const lvl0 = SAVE.quinn.level;
  gainExp(ep);
  if (SAVE.quinn.level > lvl0) lines.push(`Stufenaufstieg! Stufe ${SAVE.quinn.level} · freie Wertepunkte: ${SAVE.quinn.points}`);
  return { head: won ? 'KAMPFBERICHT' : 'KAMPFBERICHT · NIEDERLAGE', lines, kv, up: SAVE.quinn.level > lvl0 };
}

/* ---- src/08-main.js ---- */
'use strict';
/* ==========================================================================
   HAUPTSCHLEIFE & ABLAUF — Titel, Missionen, Kampf, Ende
   ========================================================================== */

let MISSION = null;
buildParticleSprites();

function showTitle() {
  G = null; MISSION = null; SCENE_BG.cur = 'nacht';
  const started = Object.keys(SAVE.progress).length > 0;
  const el = uiShow(`
    <div class="title">MY VAMPIRE<br>SYSTEM</div>
    <div class="subtitle">AKT I · DER SCHWÄCHSTE SCHÜLER</div>
    <div style="height:18px"></div>
    <button class="btn" id="tNew">${started ? 'Von vorn beginnen' : 'Spiel starten'}</button>
    ${started ? '<button class="btn" id="tCont">Fortsetzen</button>' : ''}
    <button class="btn ghost" id="tSet">Einstellungen</button>
    <div class="foot">Private Fan-Umsetzung von „My Vampire System“.<br>Frühe Testversion · Etappe 3</div>`, '');
  el.querySelector('#tNew').onclick = () => { AudioSys.init(); if (started) resetSave(); startMission('prolog'); };
  if (started) el.querySelector('#tCont').onclick = () => { AudioSys.init(); startMission(nextMission()); };
  el.querySelector('#tSet').onclick = showSettings;
}
function nextMission() {
  if (!SAVE.progress.prolog) return 'prolog';
  if (!SAVE.progress.test) return 'test';
  return SAVE.flags.biss ? 'ende' : 'akademie';
}
function showSettings() {
  const S = SAVE.settings;
  const el = uiShow(`${sysBox({ head: 'EINSTELLUNGEN', lines: ['Tippe zum Umschalten.'] })}
    <button class="btn" id="sSfx">Ton: ${S.sfx > 0 ? 'an' : 'aus'}</button>
    <button class="btn" id="sDodge">Weites Ausweich-Fenster: ${S.wideDodge ? 'an' : 'aus'}</button>
    <button class="btn" id="sShake">Bildschirmwackeln: ${S.shake > 0 ? 'an' : 'aus'}</button>
    <button class="btn ghost" id="sBack">Zurück</button>`, 'dim');
  el.querySelector('#sSfx').onclick = () => { S.sfx = S.sfx > 0 ? 0 : 0.8; writeSave(); AudioSys.applyVolumes && AudioSys.applyVolumes(); showSettings(); };
  el.querySelector('#sDodge').onclick = () => { S.wideDodge = !S.wideDodge; writeSave(); showSettings(); };
  el.querySelector('#sShake').onclick = () => { S.shake = S.shake > 0 ? 0 : 1; writeSave(); showSettings(); };
  el.querySelector('#sBack').onclick = showTitle;
}

let REPLAY = false;
function startMission(id, skipScene, replay) {
  REPLAY = !!replay;
  if (id === 'ende') return showEnd();
  const M = MISSIONS[id]; MISSION = M; G = null;
  if (M.type === 'hub') return beginHub(M);
  const go = () => (M.fight ? beginFight(M) : finishMission(M, true));
  if (M.scene && !skipScene) runScene(M.scene, go); else go();
}
function beginFight(M) {
  INPUT.events.length = 0; INPUT.atkHeld = false;
  newFight(Object.assign({}, M.fight, {
    onWin: (G0) => finishMission(M, true, G0),
    onLose: (G0) => showLost(M, G0)
  }));
  G.showFoe = !M.fight.noFoeBar;
  buildHud(M.fight);
  banner(M.title.toUpperCase());
}
function beginHub(M) {
  INPUT.events.length = 0; INPUT.atkHeld = false;
  const opt = hubSetup();
  newFight(opt);
  G.showFoe = false;
  buildHud(opt);
  const key = SAVE.day.n + '' + SAVE.day.night;
  if (beginHub.shown !== key) { beginHub.shown = key; banner(SAVE.day.night ? 'NACHT' : 'TAG ' + SAVE.day.n); }
}
function finishMission(M, won, G0) {
  const P = SAVE.progress[M.id] || (SAVE.progress[M.id] = {});
  const first = !P.done;
  P.done = true;
  const rep = G0 ? fightReport(G0, true) : null;
  if (first && M.reward) {
    const Q = SAVE.quinn;
    if (M.reward.exp) { const l0 = Q.level; gainExp(M.reward.exp); if (rep) { rep.kv.push(['Quest-Belohnung', '+' + M.reward.exp]); if (Q.level > l0) rep.up = true; } }
    (M.reward.skills || []).forEach((s) => { if (!Q.skills.includes(s)) Q.skills.push(s); });
  }
  if (first && M.after) M.after();
  writeSave();
  G = null;
  const after = () => (REPLAY ? showEnd() : M.next ? startMission(M.next) : showEnd(M));
  const story = () => (M.won && (first || !M.repeat) && !REPLAY ? runScene(M.won, after) : after());
  if (rep) showReport(rep, story); else story();
}
function showReport(rep, done) {
  SCENE_BG.cur = 'system';
  const Q = SAVE.quinn;
  if (rep.up) { sfx('level'); rep.lines.unshift(`STUFENAUFSTIEG · Stufe ${Q.level}`); }
  rep.kv.push(['Stufe', Q.level], ['EP', Q.exp + ' / ' + expNeed(Q.level)]);
  const el = uiShow(`${sysBox(rep)}${Q.points ? `<button class="btn" id="rStat">Wertepunkte verteilen (${Q.points})</button>` : ''}<button class="btn ${Q.points ? 'ghost' : ''}" id="rGo">Weiter</button>`, 'dim');
  if (Q.points) el.querySelector('#rStat').onclick = () => showStatus(() => showReport({ head: rep.head, lines: [], kv: [] }, done));
  el.querySelector('#rGo').onclick = done;
}
function showLost(M, G0) {
  const rep = G0 ? fightReport(G0, false) : { kv: [] };
  G = null; SCENE_BG.cur = 'kantine';
  const el = uiShow(`${sysBox({ head: 'NIEDERLAGE', lines: ['Quinn ist zu Boden gegangen.', 'Tipp: Achte auf die rote Fläche. Wer im letzten Moment ausweicht, bekommt ein Konterfenster mit doppeltem Schaden. Mit mehr Stufen und Wertepunkten wird es leichter.'], kv: rep.kv })}
    ${SAVE.quinn.points ? `<button class="btn" id="lStat">Wertepunkte verteilen (${SAVE.quinn.points})</button>` : ''}
    <button class="btn" id="lRe">Noch einmal</button><button class="btn ghost" id="lMenu">Hauptmenü</button>`, 'dim');
  el.querySelector('#lRe').onclick = () => startMission(M.id, true);
  if (SAVE.quinn.points) el.querySelector('#lStat').onclick = () => showStatus();
  el.querySelector('#lMenu').onclick = showTitle;
}
function showEnd() {
  G = null; SCENE_BG.cur = 'nacht';
  const Q = SAVE.quinn;
  const el = uiShow(`${sysBox({ head: 'STATUS', kv: [['Name', 'Quinn Talen'], ['Rasse', Q.race || 'Mensch'], ['Stufe', Q.level], ['EP', Q.exp + ' / ' + expNeed(Q.level)], ['Fähigkeiten', Q.skills.map((k) => SKILL_NAMES[k] || k).join(', ') || '—']], quests: ['Hauptquest: Erreiche Stufe 10'] })}
    <div class="subtitle">Etappe 3 geschafft · Fortsetzung folgt</div>
    <div class="subtitle" style="font-size:13px">Kämpfe wiederholen (für EP):</div>
    <button class="btn" id="eK">Kyle</button><button class="btn" id="eM">Mono</button><button class="btn" id="eR">Rylee im Park</button><button class="btn" id="eT">Training</button>
    <button class="btn ghost" id="eStat">Status${SAVE.quinn.points ? ' · +' + SAVE.quinn.points : ''}</button><button class="btn ghost" id="eMenu">Hauptmenü</button>`, 'dim');
  el.querySelector('#eK').onclick = () => startMission('kyle', true, true);
  el.querySelector('#eM').onclick = () => startMission('mono', true, true);
  el.querySelector('#eR').onclick = () => startMission('rylee', true, true);
  el.querySelector('#eT').onclick = () => startMission('training', true, true);
  el.querySelector('#eStat').onclick = () => showStatus(showEnd);
  el.querySelector('#eMenu').onclick = showTitle;
}

/* ------------------------------------------------------------ Schleife */
let _last = performance.now();
function frame(now) {
  const rdt = Math.min(0.05, (now - _last) / 1000); _last = now;
  try {
    if (G && !G.paused) updateFight(rdt);
    if (G) { renderFight(); updateHud(); } else renderSceneBg(now / 1000);
  } catch (err) { console.error(err); }
  AudioSys.musicTick && AudioSys.musicTick(rdt, G ? 0.4 : 0.1);
  requestAnimationFrame(frame);
}
document.addEventListener('visibilitychange', () => { if (document.hidden && G && G.state === 'play') showPause(); });
showTitle();
requestAnimationFrame(frame);

</script>
