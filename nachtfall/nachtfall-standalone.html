const EPAL = {
  ghoul: { skin: '#7d8a6c', skinL: '#aab794', skinD: '#3b4432', rag: '#4a3a2c', eye: '#ffd54a', claw: '#e8dcc0' },
  bat: { fur: '#2a1c22', furL: '#5a3a44', wing: '#4a1a26', wingL: '#8a2a3a', eye: '#ff3040' },
  knight: { bone: '#ddd3bb', boneD: '#8f866f', iron: '#4a4650', ironL: '#8a8494', ironD: '#1c1a20', rust: '#7a4a2a', wood: '#4a3020', eye: '#6ef0ff', cloth: '#3a2a3a' },
  witch: { robe: '#3c4640', robeL: '#6c7a70', robeD: '#141a16', skin: '#9aa89a', flame: '#7dff9a', eye: '#b8ff7a' },
  brute: { skin: '#8a6a68', skinL: '#c09690', skinD: '#3e2828', stitch: '#2a1010', bone: '#e0d6c0', eye: '#ffb030' },
  captain: { bone: '#e4dac2', boneD: '#8f866f', iron: '#3a3440', ironL: '#8c7c90', ironD: '#141018', cape: '#7a0a1a', capeD: '#2a0208', eye: '#ff4a2a', gold: '#c9a24c' }
};

/* ------------------------------------------------------------- GHUL */
const SPEC_GHOUL = { hipY: -19, torso: 14, headOff: 6, shoulderW: 8, legL: 9.5, legL2: 10, armL: 9.5, armL2: 10, stride: 6.5, lift: 3.5, lean: 0.75, shoulderDrop: 2, armRest: -0.9, stance: 1.2 };
function drawGhoul(g, ph, o) {
  const C = EPAL.ghoul;
  const P = makePose(SPEC_GHOUL, { t: ph * 2, run: 1, phase: ph * TAU, guard: 0 });
  // Klauen nach vorne gestreckt
  const reach = (A, i) => { const k = ik(A.sx, A.sy, A.sx + 12 + Math.sin(ph * TAU + i * 3) * 3, A.sy + 6 + Math.cos(ph * TAU + i) * 2, 9.5, 10, 1); A.ex = k[0]; A.ey = k[1]; A.hx = k[2]; A.hy = k[3]; };
  reach(P.armF, 0); reach(P.armB, 1.5);
  const leg = (L, dk) => {
    limb(g, L.hx, L.hy, L.kx, L.ky, 2.4, 1.8); paint(g, shade(C.skin, dk), 'rgba(0,0,0,0.6)', 0.6);
    limb(g, L.kx, L.ky, L.fx, L.fy - 1, 1.8, 1.4); paint(g, shade(C.skinD, dk + 0.1), 'rgba(0,0,0,0.6)', 0.6);
    g.beginPath(); g.moveTo(L.fx - 2, L.fy - 1.5); g.lineTo(L.fx + 4.5, L.fy + 0.2); g.lineTo(L.fx - 2.2, L.fy + 0.2); g.closePath(); paint(g, shade(C.skinD, dk), null);
  };
  const arm = (A, dk) => {
    limb(g, A.sx, A.sy, A.ex, A.ey, 2, 1.5); paint(g, shade(C.skin, dk), 'rgba(0,0,0,0.6)', 0.6);
    limb(g, A.ex, A.ey, A.hx, A.hy, 1.5, 1.3); paint(g, shade(C.skinL, dk - 0.1), 'rgba(0,0,0,0.6)', 0.6);
    const a = Math.atan2(A.hy - A.ey, A.hx - A.ex);
    g.save(); g.translate(A.hx, A.hy); g.rotate(a);
    g.fillStyle = shade(C.claw, dk);
    for (let k = -1; k <= 1; k++) { g.beginPath(); g.moveTo(0.5, k * 0.9); g.quadraticCurveTo(4, k * 1.6, 5.5, k * 2.2 + 1.2); g.lineTo(1, k * 0.9 + 0.7); g.fill(); }
    g.restore();
  };
  leg(P.legB, -0.35); arm(P.armB, -0.35);
  // Rumpf (ausgemergelt, Rippen)
  g.save(); g.translate(P.hipX, P.hipY); g.rotate(P.lean);
  g.beginPath(); g.moveTo(-4, 1.5); g.bezierCurveTo(-5.5, -6, -5.5, -12, -3, -14.5); g.lineTo(3.5, -14.5); g.bezierCurveTo(5.5, -10, 4.5, -5, 3.5, 1.5); g.closePath();
  paint(g, lg(g, -4, -14, 5, 0, [0, C.skinL, 0.4, C.skin, 1, C.skinD]), 'rgba(0,0,0,0.6)', 0.6);
  g.strokeStyle = 'rgba(30,40,20,0.55)'; g.lineWidth = 0.6;
  for (let k = 0; k < 4; k++) { g.beginPath(); g.moveTo(-3.5, -11 + k * 2.4); g.quadraticCurveTo(0, -10 + k * 2.4, 4, -11.5 + k * 2.4); g.stroke(); }
  // Wirbelsaeule (Buckel)
  g.fillStyle = shade(C.skinL, 0.1);
  for (let k = 0; k < 4; k++) { g.beginPath(); g.arc(-4.8 + k * 0.2, -3 - k * 3, 0.9, 0, TAU); g.fill(); }
  // Lendentuch (Fetzen)
  g.beginPath(); g.moveTo(-4.5, -1); g.lineTo(4, -1); g.lineTo(3.5, 4 + Math.sin(ph * TAU) * 0.8); g.lineTo(1, 2.5); g.lineTo(-1.5, 5); g.lineTo(-4.5, 2.5); g.closePath();
  paint(g, C.rag, 'rgba(0,0,0,0.6)', 0.5);
  g.restore();
  leg(P.legF, 0);
  // Kopf: vorgestreckt, offener Kiefer
  g.save(); g.translate(P.headX + 2, P.headY + 3); g.rotate(P.lean * 0.3);
  g.beginPath(); g.moveTo(-3.5, -3); g.quadraticCurveTo(0, -6.5, 4, -4); g.quadraticCurveTo(5.8, -2.4, 5.5, 0); g.lineTo(3, 0.8); g.lineTo(-3, 2); g.closePath();
  paint(g, lg(g, 0, -6, 0, 2, [0, C.skinL, 1, C.skin]), 'rgba(0,0,0,0.6)', 0.55);
  const jaw = 1.5 + Math.sin(ph * TAU * 2) * 1;
  g.beginPath(); g.moveTo(-2.5, 1.5); g.lineTo(4.5, 0.5 + jaw); g.lineTo(3.5, 2.5 + jaw); g.lineTo(-2, 3); g.closePath();

  g.fillStyle = '#2a0808'; g.beginPath(); g.moveTo(-1, 1.6); g.lineTo(4.5, 0.5); g.lineTo(4.5, 0.4 + jaw); g.closePath(); g.fill();
  g.fillStyle = '#efe6cc'; for (let k = 0; k < 3; k++) { g.beginPath(); g.moveTo(1.4 + k * 1.1, 0.8); g.lineTo(1.9 + k * 1.1, 1.8); g.lineTo(2.4 + k * 1.1, 0.7); g.fill(); }
  eye(g, 2.6, -2.3, 0.8, C.eye);
  // duennes Haar
  g.strokeStyle = '#2a2a22'; g.lineWidth = 0.4;
  for (let k = 0; k < 4; k++) { g.beginPath(); g.moveTo(-2 + k, -4.6); g.quadraticCurveTo(-4 + k, -3, -5 + k * 0.5, 0 + Math.sin(ph * TAU + k)); g.stroke(); }
  g.restore();
  arm(P.armF, 0);
}

/* ------------------------------------------------------------- BLUTFLEDERMAUS */
function drawBat(g, ph, o) {
  const C = EPAL.bat;
  const flap = Math.sin(ph * TAU);           // -1 .. 1
  const y0 = -22 + Math.sin(ph * TAU + 1) * 2;
  g.save(); g.translate(0, y0);
  const wing = (dir, dk) => {
    g.save(); g.scale(dir, 1);
    const up = flap * 11;
    const tipX = 17 - Math.abs(flap) * 3, tipY = -up - 2;
    const midX = 9, midY = -up * 0.55 - 3;
    g.beginPath();
    g.moveTo(1.5, -1.5);
    g.quadraticCurveTo(midX - 2, midY - 3, midX, midY);
    g.lineTo(tipX, tipY);
    // Membranbuchten
    g.quadraticCurveTo(tipX - 1, tipY + 6, tipX - 3, tipY + 9 + flap * 2);
    g.quadraticCurveTo(12, 3 - up * 0.2, 10, 4 - up * 0.2);
    g.quadraticCurveTo(7, 3.5, 6, 5.5 - up * 0.1);
    g.quadraticCurveTo(4, 3, 1.5, 2.5);
    g.closePath();
    paint(g, lg(g, 0, midY, tipX, tipY + 8, [0, shade(C.wingL, dk), 0.6, shade(C.wing, dk), 1, shade('#1a060a', dk)]), 'rgba(0,0,0,0.7)', 0.6);
    g.strokeStyle = shade('#1a0a10', dk); g.lineWidth = 0.7;
    g.beginPath(); g.moveTo(1.5, -1); g.lineTo(midX, midY); g.lineTo(tipX, tipY);
    g.moveTo(midX, midY); g.lineTo(tipX - 3, tipY + 9 + flap * 2);
    g.moveTo(midX, midY); g.lineTo(10, 4 - up * 0.2);
    g.moveTo(midX, midY); g.lineTo(6, 5.5 - up * 0.1); g.stroke();
    g.restore();
  };
  wing(-1, -0.25);
  wing(1, 0);
  // Koerper
  g.beginPath(); g.ellipse(0, 1, 4.2, 5.5, 0, 0, TAU);
  paint(g, rg(g, -1, -1, 0, 6, [0, C.furL, 1, C.fur]), 'rgba(0,0,0,0.7)', 0.6);
  // Kopf mit Ohren
  g.beginPath(); g.moveTo(-3.2, -3); g.lineTo(-3.8, -9); g.lineTo(-1.2, -5); g.lineTo(1.2, -5); g.lineTo(3.8, -9); g.lineTo(3.2, -3); g.quadraticCurveTo(0, 0.5, -3.2, -3); g.closePath();
  paint(g, lg(g, 0, -9, 0, -1, [0, C.furL, 1, C.fur]), 'rgba(0,0,0,0.7)', 0.5);
  eye(g, -1.4, -3.4, 0.7, C.eye); eye(g, 1.4, -3.4, 0.7, C.eye);
  g.fillStyle = '#fff'; g.beginPath(); g.moveTo(-0.8, -1.6); g.lineTo(-0.5, -0.4); g.lineTo(-0.2, -1.6); g.moveTo(0.8, -1.6); g.lineTo(0.5, -0.4); g.lineTo(0.2, -1.6); g.fill();
  // Fuesse
  g.strokeStyle = '#140a0e'; g.lineWidth = 0.8;
  g.beginPath(); g.moveTo(-1.5, 6); g.lineTo(-2, 8.5); g.moveTo(1.5, 6); g.lineTo(2, 8.5); g.stroke();
  g.restore();
}

/* ------------------------------------------------------------- GRABRITTER (Skelettritter) */
const SPEC_KNIGHT = { hipY: -25, torso: 18, headOff: 8, shoulderW: 11, legL: 12, legL2: 12.5, armL: 10, armL2: 10, stride: 5.5, lift: 3, lean: 0.08, shoulderDrop: 3, armRest: 0.1, stance: 1.2 };
function drawKnight(g, ph, o) {
  const cap = o && o.captain;
  const C = cap ? EPAL.captain : EPAL.knight;
  const atk = (o && o.atk) || 0; // 0..1 Ausholen
  const P = makePose(SPEC_KNIGHT, { t: ph * 2, run: o && o.idle ? 0 : 1, phase: ph * TAU, guard: 0.8 });
  // Schwertarm hinten: erhoben
  {
    const A = P.armB;
    const up = lerp(-1.9, -2.6, atk) + Math.sin(ph * TAU) * 0.08;
    const tx = A.sx + Math.cos(up) * 16, ty = A.sy + Math.sin(up) * 16;
    const k = ik(A.sx, A.sy, tx, ty, 10, 10, -1); A.ex = k[0]; A.ey = k[1]; A.hx = k[2]; A.hy = k[3];
  }
  if (cap) { // Umhang
    const cp = flowCurve(P.neckX - 2, P.neckY + 1, 30, 6, 0.8, ph * 3, 0, 0.2, 0);
    const cp2 = flowCurve(P.neckX + 3, P.neckY + 1, 28, 6, 0.6, ph * 3, 1, 0.05, -0.1);
    const poly = cp.map((p, i) => [p[0] - i, p[1]]).concat(cp2.reverse().map((p, i) => [p[0] + 2, p[1]]));
    blobPath(g, poly, 0.3); paint(g, lg(g, 0, -45, -10, 0, [0, C.cape, 1, C.capeD]), 'rgba(0,0,0,0.6)', 0.7);
  }
  // Schwert (hinter dem Kopf erhoben)
  const sword = (A) => {
    const a = Math.atan2(A.hy - A.ey, A.hx - A.ex);
    g.save(); g.translate(A.hx, A.hy); g.rotate(a);
    g.fillStyle = '#2a1a10'; g.fillRect(-2, -0.8, 4, 1.6);
    g.fillStyle = cap ? C.gold : '#6a5a40'; g.fillRect(1.5, -3.5, 1.4, 7);
    g.beginPath(); g.moveTo(2.9, -1.3); g.lineTo(cap ? 26 : 20, -0.5); g.lineTo(cap ? 28 : 22, 0.2); g.lineTo(2.9, 1.3); g.closePath();
    paint(g, lg(g, 3, -1.3, 3, 1.3, [0, cap ? '#e8e0f0' : '#a8a098', 0.5, cap ? '#9a90a8' : '#6a625c', 1, cap ? '#4a4050' : '#3a322c']), 'rgba(0,0,0,0.8)', 0.5);
    if (!cap) { g.fillStyle = 'rgba(120,60,20,0.7)'; g.beginPath(); g.arc(9, 0.3, 1, 0, TAU); g.arc(14, -0.2, 0.8, 0, TAU); g.fill(); }
    else { g.save(); g.globalCompositeOperation = 'lighter'; g.strokeStyle = rgba('#ff5a2a', 0.8); g.lineWidth = 0.7; g.beginPath(); g.moveTo(4, 0); g.lineTo(26, 0); g.stroke(); g.restore(); }
    g.restore();
  };
  const boneArm = (A, dk) => {
    limb(g, A.sx, A.sy, A.ex, A.ey, 1.3, 1.1); paint(g, shade(C.bone, dk), 'rgba(0,0,0,0.7)', 0.5);
    limb(g, A.ex, A.ey, A.hx, A.hy, 1.1, 1); paint(g, shade(C.bone, dk - 0.05), 'rgba(0,0,0,0.7)', 0.5);
    g.beginPath(); g.arc(A.ex, A.ey, 1.7, 0, TAU); paint(g, shade(C.boneD, dk), 'rgba(0,0,0,0.7)', 0.4);
    // Armschiene
    g.beginPath(); g.ellipse(lerp(A.ex, A.hx, 0.5), lerp(A.ey, A.hy, 0.5), 3, 2.2, Math.atan2(A.hy - A.ey, A.hx - A.ex), 0, TAU);
    paint(g, shade(C.iron, dk), 'rgba(0,0,0,0.7)', 0.5);
  };
  const boneLeg = (L, dk) => {
    limb(g, L.hx, L.hy, L.kx, L.ky, 1.5, 1.2); paint(g, shade(C.bone, dk), 'rgba(0,0,0,0.7)', 0.5);
    limb(g, L.kx, L.ky, L.fx, L.fy - 2, 2.6, 2.2); paint(g, lg(g, L.kx, L.ky, L.fx, L.fy, [0, shade(C.ironL, dk), 1, shade(C.ironD, dk)]), 'rgba(0,0,0,0.7)', 0.5);
    g.beginPath(); g.arc(L.kx, L.ky, 2.2, 0, TAU); paint(g, shade(C.iron, dk), 'rgba(0,0,0,0.7)', 0.5);
    g.beginPath(); g.moveTo(L.fx - 3, L.fy - 3); g.lineTo(L.fx + 2.5, L.fy - 3); g.lineTo(L.fx + 5, L.fy + 0.2); g.lineTo(L.fx - 3.2, L.fy + 0.2); g.closePath();
    paint(g, shade(C.ironD, dk), 'rgba(0,0,0,0.8)', 0.5);
  };
  boneLeg(P.legB, -0.35);
  boneArm(P.armB, -0.3);
  sword(P.armB);
  // Rumpf: Kettenhemd, Brustplatte, freiliegende Rippen
  g.save(); g.translate(P.hipX, P.hipY); g.rotate(P.lean);
  const T = SPEC_KNIGHT.torso;
  // Kettenrock
  g.beginPath(); g.moveTo(-6, -3); g.lineTo(6, -3); g.lineTo(7, 8); g.lineTo(-7, 8); g.closePath();
  paint(g, lg(g, 0, -3, 0, 8, [0, shade(C.iron, 0.1), 1, C.ironD]), 'rgba(0,0,0,0.7)', 0.6);
  g.strokeStyle = 'rgba(0,0,0,0.35)'; g.lineWidth = 0.35;
  for (let k = 0; k < 5; k++) { g.beginPath(); g.moveTo(-6.5, -1 + k * 2); g.lineTo(6.5, -1 + k * 2); g.stroke(); }
  g.fillStyle = C.cloth || '#3a2a3a';
  g.beginPath(); g.moveTo(-2, -3); g.lineTo(2.5, -3); g.lineTo(2, 12); g.lineTo(0, 10.5); g.lineTo(-2.2, 12); g.closePath(); g.fill();
  // Brustplatte (vorne) mit Loch, durch das Rippen sichtbar sind
  g.beginPath(); g.moveTo(-6, -2); g.bezierCurveTo(-8, -T * 0.5, -7, -T * 0.85, -5.5, -T); g.lineTo(5.5, -T); g.bezierCurveTo(8.5, -T * 0.6, 7, -T * 0.3, 6, -2); g.closePath();
  paint(g, lg(g, -6, -T, 6, 0, [0, C.ironL, 0.4, C.iron, 1, C.ironD]), 'rgba(0,0,0,0.7)', 0.7);
  g.beginPath(); g.ellipse(1, -T * 0.55, 3.2, 4, 0.2, 0, TAU); g.fillStyle = '#0c080a'; g.fill();
  g.strokeStyle = C.bone; g.lineWidth = 0.8;
  for (let k = 0; k < 3; k++) { g.beginPath(); g.moveTo(-1.5, -T * 0.55 - 2.4 + k * 2); g.quadraticCurveTo(1, -T * 0.55 - 1.4 + k * 2, 3.8, -T * 0.55 - 2.4 + k * 2); g.stroke(); }
  if (!cap) { g.fillStyle = rgba(C.rust, 0.7); g.beginPath(); g.arc(-3.5, -T * 0.3, 1.6, 0, TAU); g.arc(4.2, -T * 0.8, 1.1, 0, TAU); g.fill(); }
  else { g.strokeStyle = C.gold; g.lineWidth = 0.8; g.beginPath(); g.moveTo(-5.5, -T + 0.6); g.lineTo(5.5, -T + 0.6); g.stroke(); }
  g.restore();
  boneLeg(P.legF, 0);
  // Kopf: Topfhelm mit Sehschlitz, Totenschaedel dahinter
  g.save(); g.translate(P.headX, P.headY); g.rotate(P.headA);
  g.beginPath(); g.moveTo(-5, 4.5); g.lineTo(-5.5, -4); g.quadraticCurveTo(-5, -7.5, 0, -7.8); g.quadraticCurveTo(5, -7.5, 5.8, -4); g.lineTo(5.5, 4.5); g.closePath();
  paint(g, lg(g, -4, -8, 5, 4, [0, C.ironL, 0.45, C.iron, 1, C.ironD]), 'rgba(0,0,0,0.8)', 0.7);
  g.fillStyle = '#050305'; g.fillRect(0, -2.4, 6, 1.6);
  g.fillStyle = '#050305'; for (let k = 0; k < 3; k++) g.fillRect(2.4 + k * 1.2, 0.6, 0.6, 2.4);
  eye(g, 3.4, -1.6, 0.7, C.eye);
  g.strokeStyle = 'rgba(0,0,0,0.6)'; g.lineWidth = 0.5; g.beginPath(); g.moveTo(0, -7.8); g.lineTo(0.4, 4.5); g.stroke();
  if (cap) { // Hoerner
    g.fillStyle = lg(g, 0, -8, 0, -16, [0, '#8a7a60', 1, '#f0e6cc']);
    g.beginPath(); g.moveTo(-4, -6); g.quadraticCurveTo(-9, -10, -6, -16); g.quadraticCurveTo(-6, -10, -1.5, -7.5); g.fill();
    g.beginPath(); g.moveTo(3.5, -6.5); g.quadraticCurveTo(8, -11, 6, -17); g.quadraticCurveTo(5, -11, 1, -7.5); g.fill();
  } else { // zerfetzter Helmbusch
    g.fillStyle = '#5a1a22';
    g.beginPath(); g.moveTo(-1, -7.6); g.quadraticCurveTo(-7, -10, -11, -6 + Math.sin(ph * TAU) * 1.5); g.quadraticCurveTo(-6, -7, -2, -6); g.fill();
  }
  g.restore();
  boneArm(P.armF, 0);
  // Turmschild vorne
  {
    const A = P.armF;
    g.save(); g.translate(A.hx + 2, A.hy - 4); g.rotate(0.06);
    g.beginPath(); g.moveTo(-4.5, -9); g.quadraticCurveTo(0, -11, 5, -9); g.lineTo(5, 6); g.quadraticCurveTo(0, 13, -4.5, 6); g.closePath();
    paint(g, lg(g, -4, -9, 5, 9, [0, cap ? '#5a0a14' : '#6a4a30', 1, cap ? '#200208' : '#2a1a10']), 'rgba(0,0,0,0.85)', 0.9);
    g.strokeStyle = cap ? C.gold : '#7a7684'; g.lineWidth = 1.1;
    g.beginPath(); g.moveTo(-4.5, -9); g.quadraticCurveTo(0, -11, 5, -9); g.lineTo(5, 6); g.quadraticCurveTo(0, 13, -4.5, 6); g.closePath(); g.stroke();
    // Wappen: verblasster Totenkopf / Krone
    g.fillStyle = cap ? rgba(C.gold, 0.9) : 'rgba(210,200,170,0.55)';
    g.beginPath(); g.arc(0.3, -1.5, 2.4, 0, TAU); g.fill();
    g.fillRect(-1, 0.3, 2.6, 2);
    g.fillStyle = cap ? '#300008' : '#3a2616';
    g.beginPath(); g.arc(-0.6, -1.6, 0.7, 0, TAU); g.arc(1.2, -1.6, 0.7, 0, TAU); g.fill();
    g.restore();
  }
}

/* ------------------------------------------------------------- LATERNENWITWE (schwebt, schiesst Seelenfeuer) */
function drawWitch(g, ph, o) {
  const C = EPAL.witch;
  const bob = Math.sin(ph * TAU) * 2;
  const atk = (o && o.atk) || 0;
  g.save(); g.translate(0, -8 + bob);
  // zerfetzter Robensaum (wehende Streifen nach unten)
  for (let k = 0; k < 6; k++) {
    const x0 = -7 + k * 2.6;
    const pts = [];
    for (let i = 0; i <= 5; i++) pts.push([x0 - i * 1.2 + Math.sin(ph * TAU * 2 + k + i * 0.9) * i * 0.5, -6 + i * 2.6]);
    ribbon(g, pts, (s) => 1.6 * (1 - s));
    paint(g, k % 2 ? C.robeD : shade(C.robe, -0.3), null);
  }
  // Robe
  g.beginPath();
  g.moveTo(-8, 2); g.quadraticCurveTo(-9, -18, -4, -34); g.quadraticCurveTo(2, -38, 6, -32); g.quadraticCurveTo(9, -16, 8, 2);
  g.quadraticCurveTo(4, -1, 2, 3); g.quadraticCurveTo(-2, -1, -4, 3); g.quadraticCurveTo(-6, 0, -8, 2); g.closePath();
  paint(g, lg(g, -6, -36, 6, 2, [0, C.robeL, 0.35, C.robe, 1, C.robeD]), 'rgba(0,0,0,0.7)', 0.7);
  g.strokeStyle = 'rgba(0,0,0,0.35)'; g.lineWidth = 0.6;
  g.beginPath(); g.moveTo(-3, -28); g.quadraticCurveTo(-4, -12, -5, 0); g.moveTo(2, -28); g.quadraticCurveTo(3, -14, 3, 0); g.stroke();
  // Kapuze mit leerem Gesicht
  g.beginPath(); g.moveTo(-6, -28); g.quadraticCurveTo(-7, -40, 0, -43); g.quadraticCurveTo(-3, -46, -8, -48); g.quadraticCurveTo(3, -48, 6, -40); g.quadraticCurveTo(8, -33, 6, -28); g.closePath();
  paint(g, lg(g, 0, -48, 0, -28, [0, C.robeL, 1, C.robe]), 'rgba(0,0,0,0.7)', 0.6);
  g.beginPath(); g.ellipse(2.5, -35, 3.5, 5, 0.2, 0, TAU); g.fillStyle = '#040604'; g.fill();
  eye(g, 1.8, -36, 0.7, C.eye); eye(g, 4, -35.6, 0.6, C.eye);
  // Klauenarm vorne mit Laterne
  const ax = 4, ay = -27;
  const lx = 12 + atk * 4, ly = -18 - atk * 8 + Math.sin(ph * TAU + 1) * 1.2;
  limb(g, ax, ay, lx, ly - 3, 1.6, 1.1); paint(g, C.skin, 'rgba(0,0,0,0.7)', 0.5);
  // Aermel
  g.beginPath(); g.moveTo(1, -30); g.quadraticCurveTo(8, -28, 9, -22); g.lineTo(5, -21); g.quadraticCurveTo(3, -25, 0, -24); g.closePath(); paint(g, C.robe, 'rgba(0,0,0,0.6)', 0.5);
  // Kette + Laterne
  g.strokeStyle = '#2a2a2a'; g.lineWidth = 0.5; g.beginPath(); g.moveTo(lx, ly - 3); g.lineTo(lx, ly); g.stroke();
  g.beginPath(); g.moveTo(lx - 2.6, ly); g.lineTo(lx + 2.6, ly); g.lineTo(lx + 2, ly + 6); g.lineTo(lx - 2, ly + 6); g.closePath();
  g.fillStyle = rgba(C.flame, 0.35); g.fill(); g.strokeStyle = '#1a1a14'; g.lineWidth = 0.8; g.stroke();
  g.beginPath(); g.moveTo(lx, ly); g.lineTo(lx, ly + 6); g.stroke();
  const fl = 1 + Math.sin(ph * TAU * 3) * 0.2 + atk * 0.8;
  g.fillStyle = rg(g, lx, ly + 3.5, 0, 2.6 * fl, [0, '#ffffff', 0.35, C.flame, 1, rgba(C.flame, 0)]);
  g.beginPath(); g.arc(lx, ly + 3.5, 2.6 * fl, 0, TAU); g.fill();
  glowDot(g, lx, ly + 3, 9 * fl, C.flame, 0.5);
  g.restore();
}

/* ------------------------------------------------------------- AASBROCKEN (Fleischkoloss, zerplatzt in Ghule) */
const SPEC_BRUTE = { hipY: -22, torso: 20, headOff: 5, shoulderW: 16, legL: 10, legL2: 11, armL: 12, armL2: 12, stride: 5, lift: 2.5, lean: 0.25, shoulderDrop: 4, armRest: 0.2, hipSpread: 1.6, stance: 1.5 };
function drawBrute(g, ph, o) {
  const C = EPAL.brute;
  const P = makePose(SPEC_BRUTE, { t: ph * 2, run: 1, phase: ph * TAU });
  const leg = (L, dk) => {
    limb(g, L.hx, L.hy, L.kx, L.ky, 4.5, 3.6); paint(g, shade(C.skin, dk), 'rgba(0,0,0,0.6)', 0.7);
    limb(g, L.kx, L.ky, L.fx, L.fy - 1.5, 3.6, 3); paint(g, shade(C.skinD, dk + 0.15), 'rgba(0,0,0,0.6)', 0.7);
    g.beginPath(); g.ellipse(L.fx + 1.5, L.fy - 1, 4.5, 2, 0, 0, TAU); paint(g, shade(C.skinD, dk), null);
  };
  const arm = (A, dk) => {
    limb(g, A.sx, A.sy, A.ex, A.ey, 4, 3.4); paint(g, shade(C.skin, dk), 'rgba(0,0,0,0.6)', 0.7);
    limb(g, A.ex, A.ey, A.hx, A.hy, 3.6, 4.2); paint(g, shade(C.skinL, dk - 0.1), 'rgba(0,0,0,0.6)', 0.7);
    // Knochenspiess im Unterarm
    g.fillStyle = shade(C.bone, dk);
    g.beginPath(); g.moveTo(A.ex, A.ey - 2); g.lineTo(A.ex - 4, A.ey - 7); g.lineTo(A.ex + 1.5, A.ey - 1); g.fill();
  };
  leg(P.legB, -0.35); arm(P.armB, -0.35);
  g.save(); g.translate(P.hipX, P.hipY); g.rotate(P.lean);
  // aufgeblaehter Leib
  g.beginPath(); g.moveTo(-8, 3); g.bezierCurveTo(-13, -8, -11, -20, -5, -22); g.lineTo(7, -22); g.bezierCurveTo(15, -16, 15, -2, 8, 4); g.quadraticCurveTo(0, 7, -8, 3); g.closePath();
  paint(g, rg(g, 2, -12, 2, 16, [0, C.skinL, 0.5, C.skin, 1, C.skinD]), 'rgba(0,0,0,0.6)', 0.8);
  // Naehte
  g.strokeStyle = C.stitch; g.lineWidth = 0.8;
  g.beginPath(); g.moveTo(3, -20); g.quadraticCurveTo(9, -10, 4, 2); g.stroke();
  g.lineWidth = 0.5;
  for (let k = 0; k < 7; k++) { const tt = k / 6; const x = lerp(3, 4, tt) + Math.sin(tt * Math.PI) * 5, y = lerp(-20, 2, tt); g.beginPath(); g.moveTo(x - 1.4, y); g.lineTo(x + 1.4, y + 0.3); g.stroke(); }
  // pulsierende Beule
  const pb = 2.5 + Math.sin(ph * TAU * 2) * 0.5;
  g.beginPath(); g.arc(-3, -8, pb, 0, TAU); paint(g, rg(g, -3.5, -8.5, 0, pb, [0, '#e8a0a0', 1, '#7a3a3a']), 'rgba(0,0,0,0.5)', 0.5);
  g.restore();
  leg(P.legF, 0);
  // kleiner Kopf tief zwischen den Schultern
  g.save(); g.translate(P.headX + 1, P.headY + 3);
  g.beginPath(); g.ellipse(0, 0, 4, 3.6, 0, 0, TAU); paint(g, lg(g, 0, -4, 0, 4, [0, C.skinL, 1, C.skin]), 'rgba(0,0,0,0.6)', 0.6);
  eye(g, 2, -0.8, 0.7, C.eye);
  g.fillStyle = '#2a0a0a'; g.fillRect(0.5, 1.2, 3.2, 1);
  g.restore();
  arm(P.armF, 0);
}

/* ------------------------------------------------------------- Vorrendern */
const ENEMY_ART = {
  ghoul: { draw: drawGhoul, frames: 8, box: 64, anchor: 0.82, rim: '#c8ff9a', h: 42 },
  bat: { draw: drawBat, frames: 6, box: 56, anchor: 0.9, rim: '#ff5a6a', h: 30, fly: true },
  knight: { draw: drawKnight, frames: 8, box: 80, anchor: 0.82, rim: '#8af0ff', h: 58 },
  witch: { draw: drawWitch, frames: 8, box: 76, anchor: 0.86, rim: '#a8ff9a', h: 56, fly: true },
  brute: { draw: drawBrute, frames: 8, box: 84, anchor: 0.84, rim: '#ffb07a', h: 54 },
  captain: { draw: (g, ph, o) => drawKnight(g, ph, Object.assign({ captain: true }, o)), frames: 8, box: 90, anchor: 0.8, rim: '#ff5a3a', h: 64 }
};
const ENEMY_SPR = {};
let ENEMY_PX = 2;
// einzelne Gegnerfigur vorrendern (bei Bedarf)
function ensureArt(id) {
  if (ENEMY_SPR[id]) return ENEMY_SPR[id];
  const A = ENEMY_ART[id];
  const px = ENEMY_PX * (id === 'captain' || id === 'h_waechter' || id === 'g_diener' ? 1.9 : 1);
  const S = Math.ceil(A.box * px);
  const frames = [], flashes = [], atk = [];
  const bake = (ph, o) => {
    const raw = mkCanvas(S, S), g = raw.getContext('2d');
    g.setTransform(px, 0, 0, px, S / 2, S * A.anchor);
    g.lineCap = 'round'; g.lineJoin = 'round';
    A.draw(g, ph, o);
    return finishSprite(raw, { outline: Math.max(1.2, px * 0.6), rim: A.rim, rimW: px * 0.7, rimA: 0.55, moonW: px * 0.5 });
  };
  for (let f = 0; f < A.frames; f++) { const fin = bake(f / A.frames, {}); frames.push(fin); flashes.push(flashSprite(fin, '#ffffff')); }
  for (let f = 0; f < 4; f++) atk.push(bake(f / 4, { atk: 1, idle: true }));
  return (ENEMY_SPR[id] = { frames, flashes, atk, S, px, ax: S / 2, ay: S * A.anchor });
}
function bakeEnemies(px) {
  ENEMY_PX = px;
  for (const id of ['ghoul', 'bat', 'knight', 'witch', 'brute', 'captain']) ensureArt(id);
}

/* ============================================================ BOSS: VAELGOR, DER GRUFTKOLOSS
   Ein aus Leichen genaehter Riese mit einer Kirchenglocke auf dem Ruecken,
   Ketten und einem gluehenden Herz. Live gemalt (nur einer auf dem Feld). */
const SPEC_BOSS = { hipY: -62, torso: 58, headOff: 12, shoulderW: 40, legL: 30, legL2: 33, armL: 34, armL2: 36, stride: 14, lift: 8, lean: 0.3, shoulderDrop: 10, hipSpread: 3, stance: 3, armRest: 0.25 };
const BPAL = { skin: '#6a5a5e', skinL: '#a08c8c', skinD: '#2a1e22', bone: '#e2d8c0', boneD: '#8a7e66', iron: '#3a3638', ironL: '#7a7478', bell: '#6a5a3a', bellL: '#b09a60', heart: '#ff5a1a', chain: '#4a4448' };
function drawBoss(g, st) {
  const C = BPAL, t = st.t;
  const slam = st.slam || 0;      // 0..1 Ausholen (Arme hoch), >1 = Aufschlag
  const P = makePose(SPEC_BOSS, { t, run: st.run || 0, phase: st.phase || 0, hurt: st.hurt || 0, dead: st.dead || 0 });
  // Arme: bei Slam ueber den Kopf, dann herunter
  const armPose = (A, i) => {
    let tx, ty;
    const up = slam <= 1 ? easeOut(slam) : 1 - easeIn(clamp((slam - 1) * 4, 0, 1));
    const down = slam > 1 ? 1 : 0;
    const restX = A.sx + 14 + i * -8 + Math.sin(t * 2 + i) * 2, restY = A.sy + 58;
    const upX = A.sx + 10, upY = A.sy - 50;
    const dnX = A.sx + 40, dnY = 0;
    tx = lerp(restX, upX, up); ty = lerp(restY, upY, up);
    if (down) { const d = clamp((slam - 1) * 4, 0, 1); tx = lerp(upX, dnX, d); ty = lerp(upY, dnY, d); }
    const k = ik(A.sx, A.sy, tx, ty, 34, 36, 1);
    A.ex = k[0]; A.ey = k[1]; A.hx = k[2]; A.hy = k[3];
  };
  armPose(P.armF, 0); armPose(P.armB, 1);
  // Glocke auf dem Ruecken (hinter allem)
  g.save(); g.translate(P.neckX - 26, P.neckY + 10); g.rotate(-0.25 + P.lean * 0.5 + Math.sin(t * 1.5) * 0.04 + (st.bell || 0) * Math.sin(t * 20) * 0.1);
  g.beginPath(); g.moveTo(-10, -18); g.quadraticCurveTo(-12, 2, -20, 16); g.lineTo(20, 16); g.quadraticCurveTo(12, 2, 10, -18); g.quadraticCurveTo(0, -24, -10, -18); g.closePath();
  paint(g, lg(g, -18, -20, 18, 16, [0, C.bellL, 0.4, C.bell, 1, '#2a2010']), 'rgba(0,0,0,0.8)', 1.2);
  g.strokeStyle = 'rgba(0,0,0,0.5)'; g.lineWidth = 1.2; g.beginPath(); g.moveTo(-17, 10); g.quadraticCurveTo(0, 13, 17, 10); g.stroke();
  g.fillStyle = 'rgba(60,110,90,0.5)'; g.beginPath(); g.arc(-6, -4, 3, 0, TAU); g.arc(5, 6, 2.2, 0, TAU); g.fill();
  g.fillStyle = '#2a2418'; g.beginPath(); g.arc(0, 18, 3.5, 0, TAU); g.fill();
  g.restore();
  // Ketten
  g.strokeStyle = C.chain; g.lineWidth = 2;
  g.beginPath(); g.moveTo(P.neckX - 30, P.neckY - 6); g.quadraticCurveTo(P.neckX - 5, P.neckY + 22, P.hipX + 16, P.hipY - 12); g.stroke();
  g.setLineDash([2.2, 1.6]); g.strokeStyle = '#8a8488'; g.lineWidth = 1.1; g.stroke(); g.setLineDash([]);
  const leg = (L, dk) => {
    limb(g, L.hx, L.hy, L.kx, L.ky, 10, 8); paint(g, lg(g, L.hx, L.hy, L.kx, L.ky, [0, shade(C.skin, dk), 1, shade(C.skinD, dk)]), 'rgba(0,0,0,0.6)', 1.1);
    limb(g, L.kx, L.ky, L.fx, L.fy - 4, 8, 6.5); paint(g, lg(g, L.kx, L.ky, L.fx, L.fy, [0, shade(C.skin, dk - 0.05), 1, shade(C.skinD, dk)]), 'rgba(0,0,0,0.6)', 1.1);
    g.beginPath(); g.ellipse(L.kx + 2, L.ky, 7, 8, 0, 0, TAU); paint(g, lg(g, L.kx, L.ky - 8, L.kx, L.ky + 8, [0, shade(C.bone, dk), 1, shade(C.boneD, dk)]), 'rgba(0,0,0,0.7)', 1);
    g.beginPath(); g.moveTo(L.fx - 8, L.fy - 6); g.lineTo(L.fx + 8, L.fy - 6); g.lineTo(L.fx + 14, L.fy + 0.5); g.lineTo(L.fx - 9, L.fy + 0.5); g.closePath();
    paint(g, shade(C.skinD, dk), 'rgba(0,0,0,0.8)', 1);
    g.fillStyle = shade(C.bone, dk); for (let k = 0; k < 3; k++) { g.beginPath(); g.moveTo(L.fx + 8 + k * 2, L.fy - 1.5); g.lineTo(L.fx + 12 + k * 2, L.fy + 0.5); g.lineTo(L.fx + 8 + k * 2, L.fy + 0.5); g.fill(); }
  };
  const arm = (A, dk) => {
    limb(g, A.sx, A.sy, A.ex, A.ey, 9.5, 8); paint(g, lg(g, A.sx, A.sy, A.ex, A.ey, [0, shade(C.skinL, dk - 0.1), 1, shade(C.skin, dk)]), 'rgba(0,0,0,0.6)', 1.1);
    limb(g, A.ex, A.ey, A.hx, A.hy, 8.5, 11); paint(g, lg(g, A.ex, A.ey, A.hx, A.hy, [0, shade(C.skin, dk), 1, shade(C.skinD, dk)]), 'rgba(0,0,0,0.6)', 1.1);
    // Eisenmanschette
    const mx = lerp(A.ex, A.hx, 0.4), my = lerp(A.ey, A.hy, 0.4), a = Math.atan2(A.hy - A.ey, A.hx - A.ex);
    g.save(); g.translate(mx, my); g.rotate(a);
    g.beginPath(); g.rect(-4, -10, 8, 20); paint(g, lg(g, 0, -10, 0, 10, [0, shade(C.ironL, dk), 1, shade(C.iron, dk)]), 'rgba(0,0,0,0.8)', 1);
    g.fillStyle = shade('#a8a0a4', dk); for (let k = -1; k <= 1; k++) { g.beginPath(); g.arc(0, k * 6, 1.1, 0, TAU); g.fill(); }
    g.restore();
    // Faust mit Knochenstacheln
    g.save(); g.translate(A.hx, A.hy); g.rotate(a);
    g.beginPath(); g.ellipse(4, 0, 11, 10, 0, 0, TAU); paint(g, rg(g, 2, -3, 1, 12, [0, shade(C.skinL, dk), 1, shade(C.skinD, dk)]), 'rgba(0,0,0,0.7)', 1.1);
    g.fillStyle = shade(C.bone, dk);
    for (let k = -1; k <= 1; k++) { g.beginPath(); g.moveTo(9, k * 5 - 2); g.lineTo(19, k * 7); g.lineTo(9, k * 5 + 2); g.fill(); }
    g.restore();
  };
  leg(P.legB, -0.35); arm(P.armB, -0.35);
  // Rumpf
  g.save(); g.translate(P.hipX, P.hipY); g.rotate(P.lean);
  const T = SPEC_BOSS.torso;
  g.beginPath();
  g.moveTo(-20, 6); g.bezierCurveTo(-34, -20, -32, -48, -20, -T - 4); g.quadraticCurveTo(0, -T - 12, 22, -T - 4);
  g.bezierCurveTo(36, -40, 30, -12, 18, 8); g.quadraticCurveTo(0, 14, -20, 6); g.closePath();
  paint(g, rg(g, 4, -T * 0.6, 6, 55, [0, C.skinL, 0.5, C.skin, 1, C.skinD]), 'rgba(0,0,0,0.6)', 1.3);
  // Rippenkaefig um das Herz
  const hb = 1 + Math.sin(t * 5) * 0.12 + (st.enrage ? 0.2 : 0);
  glowDot(g, 4, -T * 0.55, 30 * hb, C.heart, 0.55);
  g.beginPath(); g.ellipse(4, -T * 0.55, 11, 13, 0, 0, TAU); g.fillStyle = '#1a0806'; g.fill();
  g.fillStyle = rg(g, 4, -T * 0.55, 0, 10 * hb, [0, '#ffffff', 0.25, '#ffcc40', 0.6, C.heart, 1, '#5a1004']);
  g.beginPath(); g.ellipse(4, -T * 0.55, 7.5 * hb, 8.5 * hb, 0, 0, TAU); g.fill();
  g.strokeStyle = C.bone; g.lineWidth = 2.6;
  for (let k = 0; k < 4; k++) { const y = -T * 0.55 - 10 + k * 6.5; g.beginPath(); g.moveTo(-10, y + 2); g.quadraticCurveTo(4, y - 4, 18, y + 2); g.stroke(); }
  g.strokeStyle = 'rgba(0,0,0,0.6)'; g.lineWidth = 0.8;
  for (let k = 0; k < 4; k++) { const y = -T * 0.55 - 10 + k * 6.5; g.beginPath(); g.moveTo(-10, y + 3.3); g.quadraticCurveTo(4, y - 2.7, 18, y + 3.3); g.stroke(); }
  // Naehte
  g.strokeStyle = '#1a0a0a'; g.lineWidth = 1.2;
  g.beginPath(); g.moveTo(-22, -40); g.quadraticCurveTo(-12, -20, -18, 2); g.stroke();
  g.lineWidth = 0.8;
  for (let k = 0; k < 8; k++) { const tt = k / 7; const x = lerp(-22, -18, tt) + Math.sin(tt * Math.PI) * 7, y = lerp(-40, 2, tt); g.beginPath(); g.moveTo(x - 2.5, y); g.lineTo(x + 2.5, y + 0.5); g.stroke(); }
  // Lendenschurz aus Ketten und Leichentuch
  g.beginPath(); g.moveTo(-20, 2); g.lineTo(20, 4); g.lineTo(16, 22); g.lineTo(6, 16); g.lineTo(-2, 24); g.lineTo(-10, 16); g.lineTo(-19, 20); g.closePath();
  paint(g, lg(g, 0, 0, 0, 24, [0, '#5a4a40', 1, '#1a1410']), 'rgba(0,0,0,0.7)', 1);
  g.restore();
  leg(P.legF, 0);
  // Schaedelkopf mit Hoernern (tief zwischen den Schultern)
  g.save(); g.translate(P.headX + 6, P.headY + 12); g.rotate(P.headA * 0.5);
  g.fillStyle = lg(g, 0, -10, 0, -34, [0, '#6a5a40', 1, '#f0e6cc']);
  g.beginPath(); g.moveTo(-8, -6); g.quadraticCurveTo(-24, -14, -18, -34); g.quadraticCurveTo(-16, -20, -4, -11); g.fill();
  g.beginPath(); g.moveTo(6, -8); g.quadraticCurveTo(22, -18, 14, -36); g.quadraticCurveTo(14, -20, 0, -11); g.fill();
  g.beginPath(); g.moveTo(-10, 2); g.quadraticCurveTo(-11, -13, 1, -14); g.quadraticCurveTo(13, -13, 12, 0); g.lineTo(9, 8); g.lineTo(-7, 8); g.closePath();
  paint(g, lg(g, 0, -14, 0, 8, [0, '#f4ecd6', 0.5, C.bone, 1, C.boneD]), 'rgba(0,0,0,0.8)', 1);
  const ec = st.enrage ? '#ff2a1a' : C.heart;
  g.fillStyle = '#0a0404'; g.beginPath(); g.ellipse(-3, -3, 3.3, 3, 0, 0, TAU); g.ellipse(6, -3, 3.3, 3, 0, 0, TAU); g.fill();
  eye(g, -3, -3, 1.4, ec); eye(g, 6, -3, 1.4, ec);
  g.fillStyle = '#0a0404'; g.beginPath(); g.moveTo(1.5, 1); g.lineTo(0, 4); g.lineTo(3, 4); g.fill();
  const jaw = 2 + (st.roar || 0) * 6;
  g.beginPath(); g.moveTo(-6, 6); g.lineTo(9, 6); g.lineTo(8, 10 + jaw); g.lineTo(-5, 10 + jaw); g.closePath();
  paint(g, C.boneD, 'rgba(0,0,0,0.8)', 0.8);
  g.fillStyle = '#f4ecd6'; for (let k = 0; k < 5; k++) g.fillRect(-5 + k * 2.8, 5.5, 1.6, 2.4);
  g.restore();
  arm(P.armF, 0);
}

/* ---------------------------------------------------------------- Boden */
function buildGroundTheme(th) {
  const G0 = th.ground;
  const T = WORLD.tileSize, PX = 2, S = T * PX;
  const N = 256;
  const seed = th.name.length * 13;
  const n1 = tileNoise(N, 4, 11 + seed, 4), n2 = tileNoise(N, 8, 23 + seed, 3), n3 = tileNoise(N, 16, 5 + seed, 2);
  const low = mkCanvas(N, N), lg0 = low.getContext('2d');
  const img = lg0.createImageData(N, N);
  const mA = G0.mossAmt === undefined ? 1 : G0.mossAmt;
  for (let i = 0; i < N * N; i++) {
    const moss = smooth(clamp((n1[i] - 0.45) * 3.2, 0, 1)) * mA;
    const dirt = n2[i], grain = n3[i];
    let r = G0.base[0] + dirt * G0.vary[0] + grain * 10, gg = G0.base[1] + dirt * G0.vary[1] + grain * 8, b = G0.base[2] + dirt * G0.vary[2] + grain * 8;
    r = lerp(r, G0.moss[0] + grain * G0.mossVar[0], moss); gg = lerp(gg, G0.moss[1] + grain * G0.mossVar[1] + dirt * 10, moss); b = lerp(b, G0.moss[2] + grain * G0.mossVar[2], moss);
    img.data[i * 4] = r; img.data[i * 4 + 1] = gg; img.data[i * 4 + 2] = b; img.data[i * 4 + 3] = 255;
  }
  lg0.putImageData(img, 0, 0);
  const c = mkCanvas(S, S), g = c.getContext('2d');
  g.imageSmoothingEnabled = true;
  for (let oy = -1; oy <= 1; oy++) for (let ox = -1; ox <= 1; ox++) g.drawImage(low, ox * S, oy * S, S, S);
  const rnd = mulberry(99 + seed);
  const wrapDraw = (x, y, r, fn) => {
    for (let oy = -1; oy <= 1; oy++) for (let ox = -1; ox <= 1; ox++) {
      const xx = x + ox * S, yy = y + oy * S;
      if (xx + r < 0 || yy + r < 0 || xx - r > S || yy - r > S) continue;
      fn(xx, yy);
    }
  };
  // Grundstruktur je nach Art
  if (G0.detail === 'concrete') { // Betonplatten mit Fugen und Markierungen
    const P = 128;
    g.strokeStyle = 'rgba(20,20,26,0.5)'; g.lineWidth = 2;
    for (let x = 0; x <= S; x += P) { g.beginPath(); g.moveTo(x, 0); g.lineTo(x, S); g.stroke(); }
    for (let y = 0; y <= S; y += P) { g.beginPath(); g.moveTo(0, y); g.lineTo(S, y); g.stroke(); }
    g.strokeStyle = 'rgba(200,200,210,0.08)'; g.lineWidth = 1;
    for (let x = 2; x <= S; x += P) { g.beginPath(); g.moveTo(x, 0); g.lineTo(x, S); g.stroke(); }
    for (let i = 0; i < 20; i++) { const x = (rnd() * 8 | 0) * P, y = (rnd() * 8 | 0) * P; g.fillStyle = rgba('#000000', 0.05 + rnd() * 0.08); g.fillRect(x, y, P, P); }
  } else if (G0.detail === 'tiles' || G0.detail === 'marble') {
    const tc = G0.tile;
    const P = G0.detail === 'marble' ? 96 : 72;
    for (let y = 0; y < S; y += P / 2) for (let x = ((y / (P / 2)) % 2) * P / 2; x < S; x += P) {
      const v = (rnd() - 0.5) * (G0.detail === 'marble' ? 20 : 26);
      g.fillStyle = `rgba(${tc[0] + v},${tc[1] + v},${tc[2] + v},0.55)`;
      g.fillRect(x + 1.5, y + 1.5, P - 3, P / 2 - 3);
      g.strokeStyle = 'rgba(0,0,0,0.35)'; g.lineWidth = 1.5; g.strokeRect(x + 1, y + 1, P - 2, P / 2 - 2);
      if (G0.detail === 'marble') { g.strokeStyle = 'rgba(120,110,140,0.25)'; g.lineWidth = 1; g.beginPath(); g.moveTo(x + rnd() * P, y); g.bezierCurveTo(x + rnd() * P, y + 10, x + rnd() * P, y + 20, x + rnd() * P, y + P / 2); g.stroke(); }
    }
    if (G0.gold) { g.strokeStyle = rgba(G0.gold, 0.55); g.lineWidth = 2.5; for (let i = 0; i < 6; i++) { const cx = rnd() * S, cy = rnd() * S, r = 60 + rnd() * 60; wrapDraw(cx, cy, r + 4, (xx, yy) => { g.beginPath(); g.arc(xx, yy, r, 0, TAU); g.stroke(); g.beginPath(); g.arc(xx, yy, r * 0.7, 0, TAU); g.stroke(); }); } }
  } else if (G0.detail === 'stars') {
    for (let i = 0; i < 900; i++) { const x = rnd() * S, y = rnd() * S, r = rnd() * rnd() * 2.4 + 0.4; g.fillStyle = rgba(pick(['#ffffff', '#c8b8ff', '#9ad8ff', '#ffe6a0']), 0.3 + rnd() * 0.6); g.beginPath(); g.arc(x, y, r, 0, TAU); g.fill(); }
  } else if (G0.detail === 'scorched') {
    for (let i = 0; i < 60; i++) { const x = rnd() * S, y = rnd() * S, r = 20 + rnd() * 60; wrapDraw(x, y, r, (xx, yy) => { g.fillStyle = rg(g, xx, yy, 0, r, [0, 'rgba(10,6,4,0.35)', 1, 'rgba(0,0,0,0)']); g.fillRect(xx - r, yy - r, r * 2, r * 2); }); }
  }
  // Grasbueschel
  const grassN = G0.detail === 'grass' ? 1400 : G0.detail === 'concrete' ? 260 : G0.detail === 'scorched' ? 200 : 60;
  for (let i = 0; i < grassN; i++) {
    const x = rnd() * S, y = rnd() * S;
    const mossy = n1[((y / S * N) | 0) * N + ((x / S * N) | 0)] > 0.48;
    if (!mossy && rnd() < 0.7) continue;
    const len = 6 + rnd() * 12, cnt = 3 + (rnd() * 5 | 0);
    const col = pick(G0.grass);
    wrapDraw(x, y, 30, (xx, yy) => {
      g.strokeStyle = col; g.lineWidth = 1.6; g.lineCap = 'round';
      for (let k = 0; k < cnt; k++) {
        const a = -Math.PI / 2 + (rnd() - 0.5) * 1.2;
        g.beginPath(); g.moveTo(xx + (k - cnt / 2) * 2, yy);
        g.quadraticCurveTo(xx + (k - cnt / 2) * 2 + Math.cos(a) * len * 0.5, yy + Math.sin(a) * len * 0.5, xx + (k - cnt / 2) * 2 + Math.cos(a) * len, yy + Math.sin(a) * len);
        g.stroke();
      }
    });
  }
  // Steinchen
  const pv = G0.pebble;
  for (let i = 0; i < (G0.detail === 'stars' ? 200 : 700); i++) {
    const x = rnd() * S, y = rnd() * S, r = 1.5 + rnd() * rnd() * 7;
    const v = rnd() * 40;
    wrapDraw(x, y, r + 4, (xx, yy) => {
      g.fillStyle = 'rgba(0,0,0,0.35)'; g.beginPath(); g.ellipse(xx + r * 0.3, yy + r * 0.35, r, r * 0.7, 0, 0, TAU); g.fill();
      g.fillStyle = `rgb(${pv[0] + v},${pv[1] + v - 4},${pv[2] + v + 6})`; g.beginPath(); g.ellipse(xx, yy, r, r * 0.72, rnd(), 0, TAU); g.fill();
      g.fillStyle = 'rgba(220,220,240,0.18)'; g.beginPath(); g.ellipse(xx - r * 0.3, yy - r * 0.3, r * 0.45, r * 0.3, 0, 0, TAU); g.fill();
    });
  }
  // Blaetter / Sporen
  if (G0.leaves) for (let i = 0; i < 500; i++) {
    const x = rnd() * S, y = rnd() * S, r = 2.5 + rnd() * 3, a = rnd() * TAU;
    const col = pick(G0.leaves);
    wrapDraw(x, y, 8, (xx, yy) => {
      g.save(); g.translate(xx, yy); g.rotate(a);
      g.fillStyle = col; g.beginPath(); g.ellipse(0, 0, r, r * 0.45, 0, 0, TAU); g.fill();
      g.restore();
    });
  }
  // Risse (optional gluehend)
  for (let i = 0; i < 40; i++) {
    let x = rnd() * S, y = rnd() * S, a = rnd() * TAU;
    const pts = [[x, y]];
    for (let k = 0; k < 6; k++) { a += (rnd() - 0.5) * 1.2; x += Math.cos(a) * 10; y += Math.sin(a) * 10; pts.push([x, y]); }
    const glowIt = G0.glowCracks && rnd() < 0.4;
    wrapDraw(pts[0][0], pts[0][1], 80, (xx, yy) => {
      const dx = xx - pts[0][0], dy = yy - pts[0][1];
      g.strokeStyle = G0.cracks; g.lineWidth = glowIt ? 3 : 1.4;
      g.beginPath(); g.moveTo(pts[0][0] + dx, pts[0][1] + dy); for (const p of pts) g.lineTo(p[0] + dx, p[1] + dy); g.stroke();
      if (glowIt) { g.strokeStyle = rgba(G0.glowCracks, 0.75); g.lineWidth = 1.2; g.stroke(); }
    });
  }
  // Tiefenflecken
  for (let i = 0; i < 26; i++) {
    const x = rnd() * S, y = rnd() * S, r = 60 + rnd() * 140;
    const dark = rnd() < 0.6;
    wrapDraw(x, y, r, (xx, yy) => {
      g.fillStyle = rg(g, xx, yy, 0, r, [0, dark ? 'rgba(0,0,0,0.22)' : 'rgba(160,160,200,0.06)', 1, 'rgba(0,0,0,0)']);
      g.fillRect(xx - r, yy - r, r * 2, r * 2);
    });
  }
  return c;
}

function buildFogTheme(th) {
  const S = 256, c = mkCanvas(S, S), g = c.getContext('2d');
  const n = tileNoise(S, 4, 71, 4);
  const img = g.createImageData(S, S);
  const f = th.fog, fa = th.fogA || 1;
  for (let i = 0; i < S * S; i++) {
    const v = smooth(clamp((n[i] - 0.42) * 2.4, 0, 1));
    img.data[i * 4] = f[0]; img.data[i * 4 + 1] = f[1]; img.data[i * 4 + 2] = f[2]; img.data[i * 4 + 3] = Math.min(255, v * 200 * fa);
  }
  g.putImageData(img, 0, 0);
  return c;
}

/* Thema aktivieren (Boden, Flecken, Requisiten, Nebel, Licht) */
function setTheme(id) {
  if (WORLD.theme === id) return;
  const th = THEMES[id] || THEMES.friedhof;
  let C = WORLD.cache[id];
  if (!C) {
    C = WORLD.cache[id] = {
      ground: buildGroundTheme(th),
      patches: th.patches.map((p) => PATCH_MAKERS[p]()),
      fog: buildFogTheme(th)
    };
  }
  for (const [type] of th.props) if (!WORLD.props[type] && NEW_PROPS[type]) WORLD.props[type] = NEW_PROPS[type]();
  WORLD.theme = id;
  WORLD.groundTile = C.ground; WORLD.patches = C.patches; WORLD.fog = C.fog;
  WORLD.props.list = th.props; WORLD.cluster = th.cluster;
  WORLD.ambient = th.ambient;
  _chunkCache.clear();
}

/* Requisiten pro Chunk (deterministisch, unendliche Welt) */
const CHUNK = 420;
const _chunkCache = new Map();
function chunkProps(cx, cy) {
  const key = cx * 100000 + cy;
  let list = _chunkCache.get(key);
  if (list) return list;
  list = [];
  const rnd = mulberry(hash2(cx, cy, 5 + (WORLD.theme || '').length));
  const near = Math.abs(cx) <= 0 && Math.abs(cy) <= 0;
  const weights = WORLD.props.list;
  const total = weights.reduce((s, w) => s + w[1], 0);
  const n = near ? 3 : 4 + (rnd() * 5 | 0);
  const cluster = rnd() < 0.35;
  const clx = rnd() * CHUNK, cly = rnd() * CHUNK;
  for (let i = 0; i < n; i++) {
    let r = rnd() * total, type = weights[0][0];
    for (const w of weights) { r -= w[1]; if (r <= 0) { type = w[0]; break; } }
    let x = cx * CHUNK + rnd() * CHUNK, y = cy * CHUNK + rnd() * CHUNK;
    if (cluster && type === WORLD.cluster) { x = cx * CHUNK + clx + (i % 3) * 42 - 42; y = cy * CHUNK + cly + Math.floor(i / 3) * 46; }
    if (near && Math.hypot(x, y) < 160) continue;
    const vars = WORLD.props[type];
    if (!vars) continue;
    list.push({ type, v: vars[(rnd() * vars.length) | 0], x, y, flip: rnd() < 0.5, seed: rnd() * 10 });
  }
  const pn = 1 + (rnd() * 2 | 0);
  list.patches = [];
  for (let i = 0; i < pn; i++) list.patches.push({ c: WORLD.patches[(rnd() * WORLD.patches.length) | 0], x: cx * CHUNK + rnd() * CHUNK, y: cy * CHUNK + rnd() * CHUNK, rot: (rnd() - 0.5) * 0.4 });
  if (_chunkCache.size > 400) _chunkCache.clear();
  _chunkCache.set(key, list);
  return list;
}

'use strict';
/* ==========================================================================
   EFFEKTE — Partikel (mit Hoehe/Schwerkraft), Boden-Decals, Lichter,
   Schadenszahlen und frei programmierbare Effekt-Objekte.
   ========================================================================== */

const FX = {
  parts: [], decals: [], lights: [], texts: [], effects: [],
  maxParts: 900, maxDecals: 110
};
let FXQ = 1; // Qualitaetsfaktor (wird bei schwacher Leistung reduziert)

/* layer 0 = normal (wird vom Licht beeinflusst), 1 = additiv (leuchtet) */
function spawnPart(o) {
  if (FX.parts.length >= FX.maxParts) { if (o.layer === 1 && Math.random() < 0.5) return; FX.parts.shift(); }
  const p = {
    x: o.x, y: o.y, z: o.z || 0, vx: o.vx || 0, vy: o.vy || 0, vz: o.vz || 0,
    g: o.g === undefined ? 0 : o.g, drag: o.drag === undefined ? 1.5 : o.drag,
    life: o.life || 0.6, max: o.life || 0.6, s0: o.size || 4, s1: o.size1 === undefined ? (o.size || 4) : o.size1,
    spr: o.spr, a0: o.alpha === undefined ? 1 : o.alpha, a1: o.alpha1 === undefined ? 0 : o.alpha1,
    rot: o.rot || 0, vr: o.vr || 0, layer: o.layer || 0, splat: o.splat || 0, stretch: o.stretch || 0
  };
  FX.parts.push(p);
  return p;
}
function addDecal(x, y, spr, size, alpha, life, rot) {
  if (FX.decals.length >= FX.maxDecals) FX.decals.shift();
  FX.decals.push({ x, y, spr, size, alpha: alpha || 1, life: life || 18, max: life || 18, rot: rot === undefined ? Math.random() * TAU : rot });
}
function addLight(x, y, r, col, a) {
  if (FX.lights.length > 90) return;
  FX.lights.push({ x, y, r, col, a: a === undefined ? 1 : a });
}
const _labelT = {};
function addText(x, y, txt, col, size, opts) {
  if (!SAVE.settings.dmgNumbers && !(opts && opts.always)) return;
  if (opts && opts.label) { const now = performance.now(); if (_labelT[txt] && now - _labelT[txt] < 450) return; _labelT[txt] = now; }
  if (FX.texts.length > 70) FX.texts.shift();
  FX.texts.push({ x: x + rand(-5, 5), y, vy: -46, txt, col, size: size || 13, life: (opts && opts.life) || 0.75, max: (opts && opts.life) || 0.75, crit: opts && opts.crit, label: opts && opts.label });
}
/* Effekt-Objekt: { x, y, t, dur, layer, update?(e,dt), draw(g,e,k) } */
function addEffect(e) { e.t = 0; FX.effects.push(e); return e; }

/* -------------------------------------------------- vorgefertigte Ausbrueche */
function burstBlood(x, y, n, power, dir) {

  }
}

    if (i % 2 === 0) spawnPart({ x, y, z: rand(4, 26), vx: Math.cos(a) * sp * 1.4, vy: Math.sin(a) * sp, vz: rand(20, 80), g: -20, drag: 2, life: rand(0.4, 0.9), size: rand(3, 5), size1: 0, spr: tinted('spark', '#b58cff'), alpha: 1, alpha1: 0, layer: 1 });

function burstSparks(x, y, n, col, power) {

  for (let i = 0; i < n; i++) {

  }
}
function burstAsh(x, y, n, col) {
  n = Math.ceil(n * FXQ);
  for (let i = 0; i < n; i++) {
    const a = Math.random() * TAU, sp = rand(10, 60);
    spawnPart({ x: x + rand(-6, 6), y: y + rand(-4, 4), z: rand(5, 30), vx: Math.cos(a) * sp, vy: Math.sin(a) * sp * 0.5, vz: rand(20, 60), g: -10, drag: 1.2, life: rand(0.6, 1.3), size: rand(6, 12), size1: rand(12, 20), spr: tinted('smoke', col || '#3a3238'), alpha: 0.6, alpha1: 0 });
  }

function splat(x, y, size, alpha) { addDecal(x + rand(-4, 4), y + rand(-3, 3), PART.splat, size || rand(16, 30), alpha || rand(0.55, 0.85), rand(14, 24)); }

function shake(a) { if (GAME) GAME.shake = Math.min(18, Math.max(GAME.shake, a * SAVE.settings.shake)); }
function hitstop(t) { if (GAME) GAME.hitstop = Math.max(GAME.hitstop, t); }

/* -------------------------------------------------- Update */
function updateFX(dt) {
  const P = FX.parts;
  let w = 0;
  for (let i = 0; i < P.length; i++) {
    const p = P[i];
    p.life -= dt;
    if (p.life <= 0) continue;
    const d = Math.max(0, 1 - p.drag * dt);
    p.vx *= d; p.vy *= d;
    p.x += p.vx * dt; p.y += p.vy * dt;
    if (p.g) {
      p.vz -= p.g * dt; p.z += p.vz * dt;
      if (p.z <= 0 && p.g > 0) {
        p.z = 0;
        if (p.splat && p.splat > 0) { addDecal(p.x, p.y, PART.splat, p.s0 * 3.2, 0.7, rand(10, 18)); p.life = 0; continue; }
        p.vz *= -0.25; p.vx *= 0.5; p.vy *= 0.5;
      }
    } else p.z += p.vz * dt;
    p.rot += p.vr * dt;
    P[w++] = p;
  }
  P.length = w;
  const D = FX.decals;
  w = 0;
  for (let i = 0; i < D.length; i++) { const d = D[i]; d.life -= dt; if (d.life > 0) D[w++] = d; }
  D.length = w;
  const T = FX.texts;
  w = 0;
  for (let i = 0; i < T.length; i++) { const t = T[i]; t.life -= dt; t.y += t.vy * dt; t.vy *= 0.92; if (t.life > 0) T[w++] = t; }
  T.length = w;
  const E = FX.effects;
  w = 0;
  for (let i = 0; i < E.length; i++) {
    const e = E[i]; e.t += dt;
    if (e.update) e.update(e, dt);
    if (e.t < e.dur && !e.dead) E[w++] = e;
  }
  E.length = w;
}
function clearFX() { FX.parts.length = 0; FX.decals.length = 0; FX.texts.length = 0; FX.effects.length = 0; FX.lights.length = 0; }

/* -------------------------------------------------- Zeichnen */
function drawParts(g, layer, cam) {
  const P = FX.parts;
  const x0 = cam.x - cam.w / 2 - 40, x1 = cam.x + cam.w / 2 + 40, y0 = cam.y - cam.h / 2 - 60, y1 = cam.y + cam.h / 2 + 60;
  if (layer === 1) g.globalCompositeOperation = 'lighter';
  for (let i = 0; i < P.length; i++) {
    const p = P[i];
    if (p.layer !== layer || p.x < x0 || p.x > x1 || p.y < y0 || p.y > y1) continue;
    const k = 1 - p.life / p.max;
    const s = lerp(p.s0, p.s1, k);
    const a = lerp(p.a0, p.a1, k);
    if (a <= 0.01 || s <= 0.1) continue;
    g.globalAlpha = a;
    const sx = p.x, sy = p.y - p.z;
    if (p.stretch) {
      const sp = Math.hypot(p.vx, p.vy - p.vz * 0.5);
      const st = clamp(sp / 120, 1, 3);
      const ang = Math.atan2(p.vy - p.vz * 0.6, p.vx);
      g.save(); g.translate(sx, sy); g.rotate(ang);
      g.drawImage(p.spr, -s * st, -s, s * 2 * st, s * 2);
      g.restore();
    } else if (p.rot) {
      g.save(); g.translate(sx, sy); g.rotate(p.rot);
      g.drawImage(p.spr, -s, -s, s * 2, s * 2);
      g.restore();
    } else g.drawImage(p.spr, sx - s, sy - s, s * 2, s * 2);
  }
  g.globalAlpha = 1;
  g.globalCompositeOperation = 'source-over';
}
function drawDecals(g, cam) {
  const D = FX.decals;
  for (let i = 0; i < D.length; i++) {
    const d = D[i];
    if (Math.abs(d.x - cam.x) > cam.w / 2 + 60 || Math.abs(d.y - cam.y) > cam.h / 2 + 60) continue;
    const k = d.life / d.max;
    g.globalAlpha = d.alpha * Math.min(1, k * 3);
    // Spritzer sind rund-chaotisch: gespiegelt statt gedreht (billiger)
    const w = d.size, h = d.size * 0.62;
    g.drawImage(d.spr, d.x - w / 2, d.y - h / 2, w, h);
  }
  g.globalAlpha = 1;
}
function drawEffects(g, layer) {
  const E = FX.effects;
  for (let i = 0; i < E.length; i++) {
    const e = E[i];
    if ((e.layer || 0) !== layer) continue;
    e.draw(g, e, clamp(e.t / e.dur, 0, 1));
  }
  g.globalAlpha = 1; g.globalCompositeOperation = 'source-over';
}
function drawTexts(g) {
  const T = FX.texts;
  g.textAlign = 'center'; g.textBaseline = 'middle';
  for (let i = 0; i < T.length; i++) {
    const t = T[i];
    const k = t.life / t.max;
    const pop = t.crit ? 1 + Math.max(0, (k - 0.75)) * 3 : 1;
    g.globalAlpha = Math.min(1, k * 3);
    const size = t.size * pop;
    g.font = `${t.label ? 800 : 700} ${size}px ${t.label ? 'Cinzel, serif' : '"Cormorant Garamond", Georgia, serif'}`;
    g.lineWidth = t.label ? 4 : 3.2; g.strokeStyle = 'rgba(8,2,10,0.9)';
    g.strokeText(t.txt, t.x, t.y);
    g.fillStyle = t.col; g.fillText(t.txt, t.x, t.y);
  }
  g.globalAlpha = 1;
}

/* -------------------------------------------------- Standard-Effekte */
// sich ausbreitender Ring (z. B. Schockwellen)
function fxRing(x, y, r0, r1, dur, col, width, layer) {
  return addEffect({ x, y, dur, layer: layer === undefined ? 1 : layer, draw(g, e, k) {
    const r = lerp(r0, r1, easeOut(k));
    g.globalCompositeOperation = e.layer === 1 ? 'lighter' : 'source-over';
    g.globalAlpha = (1 - k) * 0.9;
    g.strokeStyle = col; g.lineWidth = width * (1 - k * 0.6);
    g.beginPath(); g.ellipse(e.x, e.y, r, r * 0.62, 0, 0, TAU); g.stroke();
  } });
}
// kurzer Lichtblitz (additiv)
function fxFlash(x, y, r, col, dur) {
  return addEffect({ x, y, dur: dur || 0.18, layer: 1, draw(g, e, k) {
    g.globalCompositeOperation = 'lighter';
    g.globalAlpha = (1 - k);
    const s = glowSprite(col, true), rr = r * (0.8 + k * 0.5);
    g.drawImage(s, e.x - rr, e.y - rr * 0.8, rr * 2, rr * 1.6);
  }, update(e) { addLight(e.x, e.y, r * 2.2, col, 1 - e.t / e.dur); } });
}
// Warnmarkierung am Boden (Boss-Angriffe): gut lesbar, pulsierend
function fxTelegraphCircle(x, y, r, dur, col) {
  return addEffect({ x, y, dur, layer: 0, draw(g, e, k) {
    const pulse = 0.5 + 0.5 * Math.sin(e.t * 18);
    g.globalAlpha = 0.25 + k * 0.25;
    g.fillStyle = col || '#ff2a2a';
    g.beginPath(); g.ellipse(e.x, e.y, r, r * 0.62, 0, 0, TAU); g.fill();
    g.globalAlpha = 0.7 + pulse * 0.3;
    g.strokeStyle = '#ffd0c0'; g.lineWidth = 2.5; g.setLineDash([10, 6]);
    g.beginPath(); g.ellipse(e.x, e.y, r, r * 0.62, 0, 0, TAU); g.stroke(); g.setLineDash([]);
    g.globalAlpha = 0.55;
    g.fillStyle = col || '#ff2a2a';
    g.beginPath(); g.ellipse(e.x, e.y, r * k, r * 0.62 * k, 0, 0, TAU); g.fill();
  } });
}
function fxTelegraphLine(x, y, ang, len, w, dur) {
  return addEffect({ x, y, dur, layer: 0, draw(g, e, k) {
    const pulse = 0.5 + 0.5 * Math.sin(e.t * 18);
    g.save(); g.translate(e.x, e.y); g.rotate(ang);
    g.globalAlpha = 0.25 + k * 0.2; g.fillStyle = '#ff2a2a';
    g.fillRect(0, -w / 2, len, w);
    g.globalAlpha = 0.5; g.fillRect(0, -w / 2, len * k, w);
    g.globalAlpha = 0.6 + pulse * 0.4; g.strokeStyle = '#ffd0c0'; g.lineWidth = 2; g.setLineDash([12, 8]);
    g.strokeRect(0, -w / 2, len, w); g.setLineDash([]);
    g.restore();
  } });
}

'use strict';
/* ==========================================================================
   FAEHIGKEITEN — Logik und Optik aller Karten, Fusionen und Ultimates.
   Blut: wuchtig, koerperlich, spritzt.  Schatten: fliessend, unheimlich,
   verschluckt Licht.  Qi: kontrolliert, klare Formen, Jade & Gold.
   ========================================================================== */

const ASPR = {};
function buildAbilitySprites() {
  const mk = (w, h, fn) => { const c = mkCanvas(w, h); const g = c.getContext('2d'); g.lineCap = 'round'; g.lineJoin = 'round'; fn(g, w, h); return c; };
  // Blutsichel (Bluternte) — Klinge zeigt nach +x
  ASPR.sickle = mk(96, 96, (g) => {
    g.translate(48, 48);
    g.beginPath(); g.moveTo(-6, 10); g.bezierCurveTo(10, 16, 34, 4, 38, -22); g.bezierCurveTo(26, -4, 8, 2, -8, 2); g.closePath();
    g.fillStyle = lg(g, -6, 8, 38, -22, [0, '#4a0010', 0.4, '#c0102a', 0.8, '#ff5064', 1, '#ffd0d6']); g.fill();
    g.strokeStyle = '#1a0006'; g.lineWidth = 2.5; g.stroke();
    g.strokeStyle = 'rgba(255,220,220,0.9)'; g.lineWidth = 1.6; g.beginPath(); g.moveTo(-4, 9); g.bezierCurveTo(12, 14, 33, 3, 37, -20); g.stroke();
    g.fillStyle = '#2a0a10'; g.beginPath(); g.arc(-8, 6, 6, 0, TAU); g.fill();
    g.fillStyle = '#ff3a50'; g.beginPath(); g.arc(-8, 6, 3, 0, TAU); g.fill();
  });
  // Blutmond (Fusion) — gewaltige Mondsichel
  ASPR.moon = mk(160, 160, (g) => {
    g.translate(80, 80);
    g.beginPath(); g.arc(0, 0, 62, -1.2, 1.2 + Math.PI * 0.4); g.arc(18, -4, 50, 1.2 + Math.PI * 0.35, -1.25, true); g.closePath();
    g.fillStyle = rg(g, -10, 0, 10, 70, [0, '#ffb0b8', 0.3, '#ff2a44', 0.75, '#8a0018', 1, '#300006']); g.fill();
    g.strokeStyle = '#1a0006'; g.lineWidth = 3; g.stroke();
    g.strokeStyle = 'rgba(255,230,230,0.9)'; g.lineWidth = 2.2; g.beginPath(); g.arc(0, 0, 60, -1.1, 1.1 + Math.PI * 0.38); g.stroke();
  });
  // Qi-Handflaeche — geisterhafte offene Hand, Finger nach +x
  ASPR.palm = mk(160, 128, (g, w, h) => {
    g.translate(56, 64);
    const hand = () => {
      g.beginPath();
      g.moveTo(-40, -18); g.quadraticCurveTo(-10, -30, 8, -26);
      const fingers = [[-26, 46, 7], [-10, 58, 7.5], [6, 54, 7], [20, 42, 6]];
      g.lineTo(10, -30);
      for (const f of fingers) { g.lineTo(f[1] - 4, f[0] - f[2]); g.arc(f[1], f[0], f[2], -Math.PI / 2, Math.PI / 2); g.lineTo(12, f[0] + f[2]); }
      g.quadraticCurveTo(26, 36, 4, 44); g.quadraticCurveTo(-14, 50, -24, 30); g.lineTo(-40, 18); g.closePath();
    };
    hand();

/* -------------------------------------------------------- Hilfsfunktionen */
function abLvl(id) { const a = GAME.p.ab[id]; return a ? a.lvl : 0; }
function cdOf(base) { return base * GAME.p.st.cd; }
function areaOf(school) { const p = GAME.p; return p.st.area * (school === 'blood' && p.hero === 'vorian' ? 1.15 : 1); }
function aimDir(p, range) {
  const e = nearestEnemy(p.x, p.y, range || 260);
  if (e) return Math.atan2(e.y - p.y, e.x - p.x);
  if (Math.abs(p.lastMoveX) + Math.abs(p.lastMoveY) > 0.1) return Math.atan2(p.lastMoveY, p.lastMoveX);
  return p.face > 0 ? 0 : Math.PI;
}
function castAnim(p, ang, dur) {
  p.castT = dur || 0.28; p.castMax = p.castT;
  if (ang !== undefined) { p.castAim = ang; if (Math.abs(Math.cos(ang)) > 0.2) p.face = Math.cos(ang) >= 0 ? 1 : -1; }
}
// Sektor-Pruefung
function inArc(ex, ey, x, y, ang, half) { return Math.abs(angDiff(ang, Math.atan2(ey - y, ex - x))) <= half; }

/* ======================================================== BLUTNOVA */
function novaBurst(x, y, r, dmg, src, opts) {
  opts = opts || {};
  const hit = new Set();
  const dur = opts.dur || 0.3;
  sfx(opts.big ? 'bigNova' : 'nova');
  shake(opts.big ? 7 : 2.4);
  burstBlood(x, y, (opts.big ? 40 : 18), opts.big ? 1.6 : 1.1);
  for (let i = 0; i < (opts.big ? 12 : 6); i++) { const a = Math.random() * TAU, d = r * rand(0.4, 1); splat(x + Math.cos(a) * d, y + Math.sin(a) * d * 0.62, rand(14, 30)); }
  const col = opts.col || '#ff2a40';
  addEffect({
    x, y, dur, layer: 0, school: 'blood',
    update(e) {
      const k = clamp(e.t / dur, 0, 1), cr = lerp(r * 0.15, r, easeOut(k));
      forEnemiesInRadius(x, y, cr + 6, (en) => {
        if (hit.has(en.id)) return;
        hit.add(en.id);
        const a = Math.atan2(en.y - y, en.x - x);
        dealDamage(en, dmg, opts.school || 'blood', src, { kb: opts.kb || 70, kx: Math.cos(a), ky: Math.sin(a), extraMarks: opts.extraMarks });
      });
      addLight(x, y, r * 1.8, col, (1 - k) * 1.2);
    },
    draw(g, e, k) {
      const cr = lerp(r * 0.15, r, easeOut(k));
      // dicke Blutwelle mit unregelmaessigem Rand
      g.save(); g.translate(x, y); g.scale(1, 0.62);
      g.globalAlpha = (1 - k * k) * 0.6;
      g.fillStyle = rg(g, 0, 0, cr * 0.55, cr, [0, 'rgba(120,0,20,0)', 0.6, 'rgba(160,0,24,0.55)', 0.88, 'rgba(90,0,14,0.95)', 1, 'rgba(40,0,6,0)']);
      g.beginPath();
      const N = 28;
      for (let i = 0; i <= N; i++) {
        const a = i / N * TAU, wob = 1 + Math.sin(a * 5 + e.t * 20) * 0.04 + Math.sin(a * 11 - e.t * 13) * 0.03;
        const px = Math.cos(a) * cr * wob, py = Math.sin(a) * cr * wob;
        i ? g.lineTo(px, py) : g.moveTo(px, py);
      }
      g.fill();
      g.restore();
    }
  });
  // die eigentliche Blutwelle: dicker, zackiger Ring UEBER den Figuren
  const seed = Math.random() * 10;
  addEffect({ x, y, dur: dur * 1.25, layer: 2, draw(g, e, k) {
    const kk = clamp(k * 1.25, 0, 1);
    const cr = lerp(r * 0.2, r * 1.02, easeOut(kk));
    const th = (1 - kk) * 15 + 3;
    const N = 36;
    const ringPath = (rr, jag) => {
      g.beginPath();
      for (let i = 0; i <= N; i++) {
        const a = i / N * TAU, w = 1 + Math.sin(a * 7 + seed) * 0.05 * jag + Math.sin(a * 13 - seed * 2) * 0.035 * jag;
        const px = x + Math.cos(a) * rr * w, py = y - 10 + Math.sin(a) * rr * w * 0.62;
        i ? g.lineTo(px, py) : g.moveTo(px, py);
      }
    };
    g.globalAlpha = (1 - kk * kk) * 0.95;
    g.lineJoin = 'round';
    ringPath(cr, 1); g.strokeStyle = '#3a0008'; g.lineWidth = th + 4; g.stroke();
    ringPath(cr, 1); g.strokeStyle = '#a0081e'; g.lineWidth = th; g.stroke();
    ringPath(cr - th * 0.25, 1); g.strokeStyle = '#ff3a50'; g.lineWidth = th * 0.35; g.stroke();
    ringPath(cr - th * 0.45, 1); g.strokeStyle = 'rgba(255,200,205,0.8)'; g.lineWidth = 1.5; g.stroke();
    // Blutstacheln an der Wellenfront
    g.fillStyle = '#b0102a';
    for (let i = 0; i < 20; i++) {
      const a = i / 20 * TAU + seed, len = (10 + (i * 7 % 9)) * (1 - kk);
      const bx = x + Math.cos(a) * cr, by = y - 10 + Math.sin(a) * cr * 0.62;
      const nx = Math.cos(a), ny = Math.sin(a) * 0.62;
      g.beginPath(); g.moveTo(bx - ny * 3, by + nx * 3); g.lineTo(bx + nx * len, by + ny * len); g.lineTo(bx + ny * 3, by - nx * 3); g.fill();
    }
    g.globalAlpha = 1;
  } });
  addEffect({ x, y, dur: dur * 1.3, layer: 1, draw(g, e, k) {
    const cr = lerp(r * 0.2, r * 1.02, easeOut(clamp(k * 1.25, 0, 1)));
    g.globalCompositeOperation = 'lighter';
    g.globalAlpha = (1 - k) * 0.5;
    g.strokeStyle = col; g.lineWidth = 10 * (1 - k) + 2;
    g.beginPath(); g.ellipse(x, y - 10, cr, cr * 0.62, 0, 0, TAU); g.stroke();
    if (k < 0.35) { const s = glowSprite(col, true), rr = r * 0.55 * (1 - k * 2.5); g.globalAlpha = 1 - k * 2.8; g.drawImage(s, x - rr, y - rr * 0.8 - 14, rr * 2, rr * 1.6); }
  } });
}
function tickBlutnova(p, ab, dt) {
  ab.t -= dt;
  if (ab.t > 0) return;
  const L = ab.lvl;
  ab.t = cdOf(L >= 4 ? 1.8 : 2.2);
  const dmg = 16 * (1 + (L >= 2 ? 0.3 : 0) + (L >= 4 ? 0.3 : 0));
  const r = 88 * (1 + (L >= 2 ? 0.15 : 0) + (L >= 4 ? 0.2 : 0)) * areaOf('blood');
  castAnim(p, -Math.PI / 2, 0.3);

  if (L >= 5) bloodPool(p.x, p.y, r * 0.6, 2.6, 6 * (1 + 0.6), 'blutnova');
}
function bloodPool(x, y, r, dur, dmg, src) {
  let tick = 0;

  }, draw(g, e, k) {

    g.fillStyle = rg(g, -r * 0.2, -r * 0.2, 0, r, [0, '#a0102a', 0.6, '#6a0012', 0.92, '#3a0008', 1, 'rgba(30,0,5,0)']);
    g.beginPath(); for (let i = 0; i <= 20; i++) { const an = i / 20 * TAU, w = 1 + Math.sin(an * 4 + x) * 0.08; i ? g.lineTo(Math.cos(an) * r * w, Math.sin(an) * r * w) : g.moveTo(Math.cos(an) * r * w, Math.sin(an) * r * w); } g.fill();
    g.fillStyle = 'rgba(255,160,170,0.25)'; g.beginPath(); g.ellipse(-r * 0.25, -r * 0.3, r * 0.3, r * 0.12, -0.3, 0, TAU); g.fill();
    // Blasen
    g.fillStyle = 'rgba(255,90,110,0.5)';
    for (let i = 0; i < 3; i++) { const bb = (e.t * 1.7 + i * 0.33) % 1; g.beginPath(); g.arc(Math.cos(i * 2.1 + x) * r * 0.5, Math.sin(i * 2.1 + y) * r * 0.5, bb * 4, 0, TAU); g.fill(); }
    g.restore();
  } });
}

/* ======================================================== BLUTWISCH */
function swipe(p, ang, range, arc, dmg, src, opts) {
  opts = opts || {};
  const hit = new Set();
  const dur = 0.16;
  sfx('whip');
  const dir = opts.dir || 1;
  const x0 = p.x, y0 = p.y - 14;
  addEffect({ x: x0, y: y0, dur: dur + 0.14, layer: 2, update(e) {
    const k = clamp(e.t / dur, 0, 1);
    if (k < 1) {
      const px = GAME.p.x, py = GAME.p.y;
      forEnemiesInRadius(px, py, range + 14, (en) => {
        if (hit.has(en.id)) return;
        if (!inArc(en.x, en.y, px, py, ang, arc / 2 + 0.2)) return;
        const rel = angDiff(ang - dir * arc / 2, Math.atan2(en.y - py, en.x - px)) * dir;
        if (rel > arc * k + 0.25) return; // erst treffen, wenn die Klinge vorbeizieht
        hit.add(en.id);
        const a = Math.atan2(en.y - py, en.x - px);
        dealDamage(en, dmg, 'blood', src, { kb: 110, kx: Math.cos(a), ky: Math.sin(a), bleed: opts.bleed });
        burstBlood(en.x, en.y, 3, 0.8, a);
      });
    }
  }, draw(g, e, k0) {
    const k = clamp(e.t / dur, 0, 1), fade = clamp((e.t - dur) / 0.14, 0, 1);
    const px = GAME.p.x, py = GAME.p.y - 14;
    const a0 = ang - dir * arc / 2, a1 = a0 + dir * arc * easeOut(k);
    const tail = Math.max(a0, a1 - dir * arc * 0.7);
    g.save(); g.translate(px, py); g.scale(1, 0.7);
    g.globalAlpha = 1 - fade;
    // gefuellter Halbmond mit Verlauf (Blut)
    const segs = 16;
    g.beginPath();
    for (let i = 0; i <= segs; i++) { const a = lerp(dir > 0 ? tail : a1, dir > 0 ? a1 : tail, i / segs); const rr = range * (0.55 + 0.45 * (i / segs)); i ? g.lineTo(Math.cos(a) * rr, Math.sin(a) * rr) : g.moveTo(Math.cos(a) * rr, Math.sin(a) * rr); }
    for (let i = segs; i >= 0; i--) { const a = lerp(dir > 0 ? tail : a1, dir > 0 ? a1 : tail, i / segs); const rr = range * (0.45 + 0.3 * (i / segs)); g.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); }
    g.closePath();
    g.fillStyle = rg(g, 0, 0, range * 0.4, range, [0, 'rgba(90,0,16,0.2)', 0.6, 'rgba(180,10,36,0.9)', 1, 'rgba(255,90,110,0.95)']);
    g.fill();
    g.globalCompositeOperation = 'lighter';
    g.strokeStyle = 'rgba(255,200,205,0.9)'; g.lineWidth = 3;
    g.beginPath(); g.arc(0, 0, range * 0.98, dir > 0 ? tail : a1, dir > 0 ? a1 : tail); g.stroke();
    g.restore();
    if (k < 1 && Math.random() < 0.8) {
      const a = a1, rr = range * rand(0.7, 1);
      spawnPart({ x: GAME.p.x + Math.cos(a) * rr, y: GAME.p.y + Math.sin(a) * rr * 0.7, z: 14, vx: -Math.sin(a) * dir * 160, vy: Math.cos(a) * dir * 110, vz: rand(30, 90), g: 500, drag: 1, life: 0.6, size: rand(2, 4), size1: 1.5, spr: PART.drop, stretch: 1, splat: Math.random() < 0.3 ? 1 : 0 });
    }
    addLight(GAME.p.x, GAME.p.y, range * 1.6, '#ff3048', 0.6 * (1 - fade));
  } });
}
function tickBlutwisch(p, ab, dt) {
  ab.t -= dt * p.rageSpeed;
  if (ab.t > 0) return;
  const L = ab.lvl;
  ab.t = cdOf(1.15);
  const dmg = 20 * (L >= 2 ? 1.35 : 1);
  const range = 92 * (L >= 4 ? 1.25 : 1) * areaOf('blood');
  const ang = aimDir(p, 220);
  const bleed = L >= 4 ? 4 : 0;
  castAnim(p, ang, 0.22);
  ab.n = (ab.n || 0) + 1;
  swipe(p, ang, range, 2.6, dmg, 'blutwisch', { bleed, dir: ab.n % 2 ? 1 : -1 });
  if (L >= 3) GAME.later(0.13, () => swipe(GAME.p, ang + Math.PI, range * 0.9, 2.4, dmg * 0.8, 'blutwisch', { bleed, dir: -1 }));
  if (p.buffAder > 0) GAME.later(0.22, () => swipe(GAME.p, ang + 0.3, range * 1.1, 2.8, dmg, 'blutwisch', { bleed, dir: 1 }));
  if (L >= 5 && ab.n % 3 === 0) bloodCrescent(p.x, p.y, ang, dmg * 0.9, 'blutwisch');
}
function bloodCrescent(x, y, ang, dmg, src) {
  const hit = new Set(), sp = 430;
  addEffect({ x, y, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp, dur: 1.0, layer: 2, update(e, dt) {
    e.x += e.vx * dt; e.y += e.vy * dt;
    forEnemiesInRadius(e.x, e.y, 34, (en) => { if (hit.has(en.id)) return; hit.add(en.id); dealDamage(en, dmg, 'blood', src, { kb: 90, kx: Math.cos(ang), ky: Math.sin(ang) }); burstBlood(en.x, en.y, 4, 0.8, ang); });
    addLight(e.x, e.y, 90, '#ff3048', 0.8);
    if (Math.random() < 0.6) spawnPart({ x: e.x, y: e.y, z: 12, vx: rand(-30, 30), vy: rand(-30, 30), vz: 20, g: 400, life: 0.5, size: 3, size1: 1, spr: PART.drop, splat: Math.random() < 0.2 ? 1 : 0 });
  }, draw(g, e, k) {
    g.save(); g.translate(e.x, e.y - 12); g.rotate(ang); g.globalAlpha = 1 - k * k;
    g.drawImage(ASPR.crescent, -40, -40, 80, 80);
    g.globalCompositeOperation = 'lighter'; g.globalAlpha = 0.5 * (1 - k);
    g.drawImage(glowSprite('#ff3048'), -50, -50, 100, 100);
    g.restore();
  } });
}

/* ======================================================== BLUTERNTE & BLUTMONDSICHELN */
function tickBluternte(p, ab, dt, moon) {
  const L = ab.lvl;
  const n = moon ? 3 : 2 + (L >= 2 ? 1 : 0) + (L >= 4 ? 1 : 0);
  const spd = moon ? 2.4 : (L >= 4 ? 4.3 : 3.3);
  ab.rot = (ab.rot || 0) + spd * dt;
  const baseR = (moon ? 95 + Math.sin(GAME.t * 2.2) * 38 : (L >= 3 ? 84 : 72)) * areaOf('blood');
  const dmg = moon ? 24 : 9 * (L >= 3 ? 1.4 : 1);
  const hr = moon ? 30 : 16;
  ab.pos = ab.pos || [];
  ab.pos.length = n;
  ab.sndT = (ab.sndT || 0) - dt;
  for (let i = 0; i < n; i++) {
    const a = ab.rot + i * TAU / n;
    const x = p.x + Math.cos(a) * baseR, y = p.y + Math.sin(a) * baseR * 0.7;
    ab.pos[i] = { x, y, a };
    forEnemiesInRadius(x, y, hr, (en) => {
      const key = moon ? 'hitMoon' : 'hitErnte';
      if ((en[key] || 0) > GAME.t) return;
      en[key] = GAME.t + (moon ? 0.35 : 0.42);

    addEffect({ x: x0, y: y0, dur: 0.35, layer: 1, draw(g, e, k) {

      g.beginPath(); g.moveTo(x0, y0 - 20); g.lineTo(x0 + dx * len, y0 + dy * len - 20); g.stroke();

    if (abLvl('spiegel')) spawnAfterimage(p, 5.5, 'mirror');

  if (trail) {
    const x0 = p.x - dx * 60, y0 = p.y - dy * 60, slowT = (p.passives.nebelgang || 0) >= 5;

    } });
  }
  return true;
}

const SHOT_COL = { soul: '#7dff9a', bell: '#ffa040', acid: '#b8ff3a', spike: '#d8dce8', blood: '#ff3a4e', light: '#ffe6a0', void: '#c08aff' };

/* ==========================================================================

/* -------------------------------------------------------- Raumraster */
const GRID = { cell: 56, map: new Map(), pool: [] };
function gkey(cx, cy) { return (cx + 32768) * 65536 + (cy + 32768); }
function gridBuild() {
  for (const a of GRID.map.values()) { a.length = 0; GRID.pool.push(a); }
  GRID.map.clear();
  const C = GRID.cell;
  for (const e of GAME.enemies) {
    if (e.dead) continue;
    const k = gkey(Math.floor(e.x / C), Math.floor(e.y / C));
    let a = GRID.map.get(k);
    if (!a) { a = GRID.pool.pop() || []; GRID.map.set(k, a); }
    a.push(e);
  }
}
function forEnemiesInRadius(x, y, r, cb) {
  const C = GRID.cell;
  const x0 = Math.floor((x - r - 48) / C), x1 = Math.floor((x + r + 48) / C);
  const y0 = Math.floor((y - r - 48) / C), y1 = Math.floor((y + r + 48) / C);
  for (let cy = y0; cy <= y1; cy++) for (let cx = x0; cx <= x1; cx++) {
    const a = GRID.map.get(gkey(cx, cy));
    if (!a) continue;
    for (let i = 0; i < a.length; i++) {
      const e = a[i];
      if (e.dead) continue;
      const rr = r + e.r;
      if (dist2(x, y, e.x, e.y) <= rr * rr) cb(e);
    }
  }
}
function nearestEnemy(x, y, maxR, exclude) {
  let best = null, bd = maxR * maxR;
  for (const e of GAME.enemies) {
    if (e.dead || (exclude && exclude.has(e.id))) continue;
    const d = dist2(x, y, e.x, e.y);
    if (d < bd) { bd = d; best = e; }
  }
  return best;
}
function nearestEnemies(x, y, maxR, n) {
  const out = [];
  const m2 = maxR * maxR;
  for (const e of GAME.enemies) {
    if (e.dead) continue;
    const d = dist2(x, y, e.x, e.y);
    if (d > m2) continue;
    if (out.length < n) { out.push([d, e]); out.sort((a, b) => a[0] - b[0]); }
    else if (d < out[n - 1][0]) { out[n - 1] = [d, e]; out.sort((a, b) => a[0] - b[0]); }
  }
  return out.map((o) => o[1]);
}
function randomEnemyNear(x, y, r) {
  const list = GAME.enemies;
  if (!list.length) return null;
  for (let k = 0; k < 12; k++) {
    const e = list[(Math.random() * list.length) | 0];
    if (!e.dead && dist2(x, y, e.x, e.y) < r * r) return e;
  }
  return nearestEnemy(x, y, r);
}

    hp: 0, maxHp: 0,
    spd: D.spd * rand(0.9, 1.1) * (1 + Math.min(0.25, GAME.t / 2400)),
    r: D.r * (elite ? 1.45 : 1), dmg: D.dmg * (1 + GAME.t / 540) * (elite ? 1.5 : 1) * (GAME.diffDmg || 1),
    mass: D.mass * (elite ? 6 : 1), armor: (D.armor || 0) * (1 + GAME.t / 600),
    scale: D.scale * (elite ? 1.5 : 1), elite,
    face: 1, animT: Math.random() * 10, flash: 0, dead: false, deathT: 0,
    slowT: 0, slowF: 1, stunT: 0, bleedT: 0, bleedDps: 0, corruptT: 0, bstack: 0,
    mk: { b: -9, s: -9, q: -9 }, rcd: 0, touchT: 0, shootT: rand(1.5, 3),
    boss: !!D.boss, mini: !!D.miniboss, state: 'walk', stT: 0, wob: Math.random() * TAU
  };

function spawnPosAround(px, py, bias) {
  const rx = VIEW.w / 2 + 50, ry = VIEW.h / 2 + 70;
  let a = Math.random() * TAU;
  if (bias !== undefined && Math.random() < 0.55) a = bias + rand(-1.3, 1.3);
  const c = Math.cos(a), s = Math.sin(a);
  // Punkt auf dem Rechteckrand statt Ellipse (Ecken sind sonst leer)
  const k = Math.min(rx / Math.abs(c || 1e-6), ry / Math.abs(s || 1e-6));
  return [px + c * k + rand(-20, 20), py + s * k + rand(-20, 20)];
}
function pickMix(mix) {
  let tot = 0; for (const k in mix) tot += mix[k];
  let r = Math.random() * tot;
  for (const k in mix) { r -= mix[k]; if (r <= 0) return k; }
  return 'ghoul';
}
