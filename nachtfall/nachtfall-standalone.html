function updateSpawns(dt) {
  const G = GAME, p = G.p;
  while (G.waveIdx + 1 < WAVES.length && WAVES[G.waveIdx + 1].t <= G.t) G.waveIdx++;
  const W = WAVES[G.waveIdx];
  let alive = 0;
  for (const e of G.enemies) if (!e.dead && !e.boss && !e.mini) alive++;
  G.alive = alive;
  const target = W.target * (G.diffCount || 1) * (G.bossAlive ? 0.6 : 1);
  if (alive < target) {
    G.spawnAcc += W.rate * (alive < target * 0.5 ? 2.2 : 1) * dt;
    const bias = Math.hypot(p.vx, p.vy) > 20 ? Math.atan2(p.vy, p.vx) : undefined;
    while (G.spawnAcc >= 1) {
      G.spawnAcc -= 1;
      const pos = spawnPosAround(p.x, p.y, bias);
      makeEnemy(pickMix(W.mix), pos[0], pos[1]);
    }
  }
  const EV = G.events || EVENTS;
  while (G.eventIdx < EV.length && EV[G.eventIdx].t <= G.t) runEvent(EV[G.eventIdx++]);
}
function runEvent(ev) {
  const G = GAME, p = G.p;
  if (ev.text) UI.announce(ev.text, ev.kind === 'boss' || ev.kind === 'miniboss' ? 'boss' : '');
  if (ev.kind === 'swarm') {
    const a = Math.random() * TAU;
    const pos = spawnPosAround(p.x, p.y, a);
    for (let i = 0; i < ev.n; i++) {
      const e = makeEnemy(ev.type, pos[0] + rand(-70, 70), pos[1] + rand(-70, 70));
      e.spd *= 1.25; e.swarm = 3;
    }
    sfx('flame');
  } else if (ev.kind === 'ring') {
    const rx = VIEW.w * 0.62, ry = VIEW.h * 0.52;
    for (let i = 0; i < ev.n; i++) {
      const a = i / ev.n * TAU;
      makeEnemy(ev.type, p.x + Math.cos(a) * rx, p.y + Math.sin(a) * ry);
    }
  } else if (ev.kind === 'elite') {
    const pos = spawnPosAround(p.x, p.y);
    makeEnemy(ev.type, pos[0], pos[1], { elite: true });
    UI.announce('Ein Elite-Gegner naht!', '');
  } else if (ev.kind === 'miniboss') {
    const pos = spawnPosAround(p.x, p.y);
    const e = makeEnemy('captain', pos[0], pos[1]);
    if (!ev.text) UI.announce(e.def.name + ' erscheint!', 'boss');
    e.stT = 3; G.mini = e;
    sfx('roar');
  } else if (ev.kind === 'boss') {
    const e = makeEnemy('boss', p.x, p.y - VIEW.h * 0.55);
    if (!ev.text) UI.announce(e.def.name + ' erscheint!', 'boss');
    e.stT = 2.5; e.state = 'intro';
    G.boss = e; G.bossAlive = true;
    sfx('bell'); sfx('roar'); shake(6);
    // Schwaechere Gegner weichen dem Boss (lesbarer Kampf)
    for (const o of G.enemies) if (!o.boss && !o.mini && !o.elite && Math.random() < 0.5 && dist2(o.x, o.y, p.x, p.y) > 200 * 200) { o.dead = true; o.deathT = 0.3; o.silent = true; }
  }
}

/* -------------------------------------------------------- KI & Bewegung */
function updateEnemies(dt) {
  const G = GAME, p = G.p;
  const ts = G.slowmo > 0 ? 0.4 : 1;
  const edt = dt * ts;
  const farX = VIEW.w * 0.85, farY = VIEW.h * 0.8;
  const decoys = G.images.filter((i) => i.taunt).concat((G.comps || []).filter((c) => c.id === 'peter'));
  for (const e of G.enemies) {
    if (e.dead) { e.deathT += dt; continue; }
    e.animT += edt;
    e.flash = Math.max(0, e.flash - dt);
    e.touchT -= edt;
    if (e.boss) { updateBoss(e, edt, dt); continue; }
    if (e.mini) { updateCaptain(e, edt); }
    // Statuseffekte
    if (e.bleedT > 0) { e.bleedT -= dt; e.bleedAcc = (e.bleedAcc || 0) + dt; if (e.bleedAcc >= 0.5) { e.bleedAcc = 0; dealDamage(e, e.bleedDps * 0.5, 'none', 'blutung', { quiet: true, noMark: true }); if (e.dead) continue; if (Math.random() < 0.5) spawnPart({ x: e.x, y: e.y - 10, z: 10, vx: rand(-20, 20), vy: 0, vz: 20, g: 400, life: 0.5, size: 2, spr: PART.drop, splat: 1 }); } }
    if (e.corruptT > 0) { e.corruptT -= dt; e.corAcc = (e.corAcc || 0) + dt; if (e.corAcc >= 0.5) { e.corAcc = 0; dealDamage(e, e.corDps * 0.5, 'none', 'verderbnis', { quiet: true, noMark: true }); if (e.dead) continue; } }
    if (e.slowT > 0) e.slowT -= dt; else e.slowF = 1;
    if (e.stunT > 0) { e.stunT -= edt; }
    // Ziel: Spieler oder Koeder (Nachbild)
    let tx = p.x, ty = p.y;
    if (decoys.length && !e.mini) {
      let bd = 190 * 190;
      for (const d of decoys) { const dd = dist2(e.x, e.y, d.x, d.y); if (dd < bd) { bd = dd; tx = d.x; ty = d.y; } }
    }
    let dx = tx - e.x, dy = ty - e.y;
    const d = Math.hypot(dx, dy) || 1;
    dx /= d; dy /= d;
    let sp = e.spd * e.slowF;
    if (e.stunT > 0 || e.state === 'wind') sp = 0;
    if (e.role === 'witch') {
      // haelt Abstand und schiesst Seelenfeuer
      if (d < 170) sp *= -0.7; else if (d < 240) sp *= 0.15;
      e.shootT -= edt;
      if (e.shootT <= 0 && d < 360 && e.stunT <= 0) {
        e.shootT = e.elite ? 1.6 : rand(3.4, 4.4);
        e.atkT = 0.4;
        const lead = 0.35;
        const ax = p.x + p.vx * lead - e.x, ay = p.y + p.vy * lead - e.y, ad = Math.hypot(ax, ay) || 1;
        const n = e.elite ? 5 : 1;
        for (let i = 0; i < n; i++) {
          const a = Math.atan2(ay, ax) + (i - (n - 1) / 2) * 0.22;
          enemyShot(e.x + e.face * 12, e.y - 26, Math.cos(a) * 128, Math.sin(a) * 128, e.dmg * 0.85, e.def.shot || 'soul');
        }
        sfx('enemyShot', 0, 0.1);
      }
      if (e.atkT > 0) e.atkT -= edt;
    }
    if (e.def.flier && e.role === 'bat') {
      const w = Math.sin(e.animT * 3 + e.wob) * 0.6;
      const ndx = dx - dy * w, ndy = dy + dx * w; dx = ndx; dy = ndy;
    }
    if (e.swarm > 0) { e.swarm -= edt; sp *= 1.2; }
    e.x += (dx * sp + e.kvx) * edt;
    e.y += (dy * sp + e.kvy) * edt;
    const kd = Math.exp(-edt * 9);
    e.kvx *= kd; e.kvy *= kd;
    if (Math.abs(dx) > 0.2 && sp !== 0) e.face = dx * Math.sign(sp) > 0 ? 1 : -1;
    // Kontakt mit dem Spieler
    const pr = e.r + 11;
    if (e.touchT <= 0 && e.stunT <= 0 && dist2(e.x, e.y, p.x, p.y) < pr * pr) {
      if (p.ultT > 0 && p.hero === 'nyx') { /* Mitternacht: unberuehrbar */ }
      else if (damagePlayer(e.dmg, e)) e.touchT = 0.7;
    }
    // Mitternacht: Beruehrung schneidet
    if (p.ultT > 0 && p.hero === 'nyx' && (e.nyxT || 0) < G.t && dist2(e.x, e.y, p.x, p.y) < (e.r + 24) * (e.r + 24)) {
      e.nyxT = G.t + 0.25; dealDamage(e, 12, 'shadow', 'mitternacht', { kb: 60, kx: e.x - p.x, ky: e.y - p.y, norm: true }); e.slowT = 1; e.slowF = 0.5;
    }
    // zu weit weg -> wieder am Rand einsetzen (keine "verlorenen" Gegner)
    if (!e.mini && !e.elite && (Math.abs(e.x - p.x) > farX || Math.abs(e.y - p.y) > farY)) {
      const bias = Math.hypot(p.vx, p.vy) > 20 ? Math.atan2(p.vy, p.vx) : undefined;
      const pos = spawnPosAround(p.x, p.y, bias); e.x = pos[0]; e.y = pos[1];
    }
  }
  // Abstossung (damit Horden als Masse wirken, nicht als Punkt)
  const C = GRID.cell;
  for (const a of GRID.map.values()) {
    const n = Math.min(a.length, 14);
    for (let i = 0; i < n; i++) {
      const e = a[i]; if (e.dead) continue;
      for (let j = i + 1; j < n; j++) {
        const o = a[j]; if (o.dead) continue;
        const dx = o.x - e.x, dy = o.y - e.y, rr = (e.r + o.r) * 0.85;
        const d2 = dx * dx + dy * dy;
        if (d2 >= rr * rr || d2 < 0.01) continue;
        const d = Math.sqrt(d2), push = (rr - d) / d * 0.5;
        const mt = e.mass + o.mass, we = o.mass / mt, wo = e.mass / mt;
        e.x -= dx * push * we; e.y -= dy * push * we;
        o.x += dx * push * wo; o.y += dy * push * wo;
      }
    }
  }
  // Leichen entfernen
  let w = 0;
  const E = G.enemies;
  for (let i = 0; i < E.length; i++) { const e = E[i]; if (!(e.dead && e.deathT > (e.boss ? 3 : 0.55))) E[w++] = e; }
  E.length = w;
}

/* -------------------------------------------------------- Gegnergeschosse */
function enemyShot(x, y, vx, vy, dmg, kind) {
  GAME.eproj.push({ x, y, vx, vy, dmg, kind, r: kind === 'bell' ? 9 : 7, life: 5, t: 0 });
}
function updateEnemyShots(dt) {
  const G = GAME, p = G.p;
  const ts = G.slowmo > 0 ? 0.4 : 1;
  let w = 0;
  for (const s of G.eproj) {
    s.t += dt; s.life -= dt;
    s.x += s.vx * dt * ts; s.y += s.vy * dt * ts;
    if (s.life <= 0) continue;
    if (dist2(s.x, s.y, p.x, p.y - 14) < (s.r + 9) * (s.r + 9) && p.alive) {
      if (damagePlayer(s.dmg, s)) { burstSparks(s.x, s.y, 6, SHOT_COL[s.kind] || '#7dff9a'); continue; }
    }
    addLight(s.x, s.y, 60, SHOT_COL[s.kind] || '#7dff9a', 0.8);
    G.eproj[w++] = s;
  }
  G.eproj.length = w;
}

/* -------------------------------------------------------- Hauptmann Kharn */
function updateCaptain(e, dt) {
  const p = GAME.p;
  e.stT -= dt;
  if (e.state === 'walk' && e.stT <= 0 && dist2(e.x, e.y, p.x, p.y) < 420 * 420) {
    e.state = 'wind'; e.stT = 0.85;
    e.chA = Math.atan2(p.y - e.y, p.x - e.x);
    fxTelegraphLine(e.x, e.y, e.chA, 380, 56, 0.85);
    sfx('roar', 0, 0.5);
  } else if (e.state === 'wind' && e.stT <= 0) {
    e.state = 'charge'; e.stT = 0.55;
    e.kvx = Math.cos(e.chA) * 700; e.kvy = Math.sin(e.chA) * 700;
  } else if (e.state === 'charge') {
    if (Math.random() < 0.6) burstAsh(e.x, e.y, 1, '#5a4a44');
    if (e.stT <= 0) { e.state = 'walk'; e.stT = rand(3.5, 5); }
  }
}

/* -------------------------------------------------------- Vaelgor, der Gruftkoloss */
function updateBoss(e, dt, rdt) {
  const G = GAME, p = G.p;
  e.stT -= dt;
  e.slam = e.slam || 0;
  e.bell = Math.max(0, (e.bell || 0) - rdt);
  e.roar = Math.max(0, (e.roar || 0) - rdt * 1.5);
  const enr = e.hp < e.maxHp * 0.5;
  if (enr && !e.enrage) { e.enrage = true; UI.announce(e.def.enrageText || e.def.name.split(',')[0] + ' rast!', 'boss'); sfx('roar'); e.roar = 1; shake(6); }
  const spd = e.def.spd * (enr ? 1.35 : 1);
  const dx = p.x - e.x, dy = p.y - e.y, d = Math.hypot(dx, dy) || 1;
  if (e.stunT > 0) e.stunT -= dt;
  e.run = 0;
  switch (e.state) {
    case 'intro':
      e.y += 40 * dt; e.run = 0.5; e.roar = 1;
      if (e.stT <= 0) { e.state = 'walk'; e.stT = 1.5; }
      break;
    case 'walk': {
      if (d > 90) { e.x += dx / d * spd * dt; e.y += dy / d * spd * dt; e.run = 1; }
      e.face = dx > 0 ? 1 : -1;
      if (e.stT <= 0) {
        const opts = ['slam', 'slam', 'charge', 'bell', 'summon'];
        let pick0 = pick(opts);
        if (pick0 === e.last && Math.random() < 0.7) pick0 = pick(opts);
        e.last = pick0;
        if (pick0 === 'slam') { e.state = 'slamWind'; e.stT = enr ? 0.85 : 1.1; e.tx = p.x; e.ty = p.y; fxTelegraphCircle(p.x, p.y, 118, e.stT, '#ff2a2a'); }
        else if (pick0 === 'charge') { e.state = 'chargeWind'; e.stT = enr ? 0.8 : 1.0; e.chA = Math.atan2(dy, dx); fxTelegraphLine(e.x, e.y, e.chA, 520, 90, e.stT); e.roar = 1; sfx('roar'); }
        else if (pick0 === 'bell') { e.state = 'bell'; e.stT = 0.6; e.bells = enr ? 3 : 2; e.bellT = 0; }
        else { e.state = 'summon'; e.stT = 0.8; e.roar = 1; sfx('roar'); }
      }
      break;
    }
    case 'slamWind': {
      e.slam = Math.min(1, e.slam + dt / 0.6);
      const ddx = e.tx - e.x, ddy = e.ty - e.y, dd = Math.hypot(ddx, ddy) || 1;
      if (dd > 70) { e.x += ddx / dd * spd * 1.8 * dt; e.y += ddy / dd * spd * 1.8 * dt; e.run = 1; }
      e.face = ddx > 0 ? 1 : -1;
      if (e.stT <= 0) {
        e.state = 'slamHit'; e.stT = 0.6; e.slam = 1.001;
        sfx('stomp'); shake(10); hitstop(0.05);
        if (dist2(p.x, p.y, e.tx, e.ty) < 118 * 118) damagePlayer(e.dmg * 1.2, e, true);
        fxRing(e.tx, e.ty, 20, 150, 0.45, '#ff8a4a', 10); fxRing(e.tx, e.ty, 10, 118, 0.35, '#ffd0a0', 4, 1);
        burstAsh(e.tx, e.ty, 16, '#5a4a44');
        for (let i = 0; i < 10; i++) { const a = Math.random() * TAU; spawnPart({ x: e.tx, y: e.ty, z: 5, vx: Math.cos(a) * rand(60, 200), vy: Math.sin(a) * rand(40, 140), vz: rand(100, 220), g: 500, life: 1, size: rand(3, 6), size1: 3, spr: tinted('ash', '#6a6064') }); }
        addDecal(e.tx, e.ty, PART.splat, 60, 0.35, 20);
        if (enr) for (let i = 0; i < 10; i++) { const a = i / 10 * TAU; enemyShot(e.tx, e.ty - 10, Math.cos(a) * 170, Math.sin(a) * 170, 12 * (GAME.diffDmg || 1), e.def.bellShot || 'bell'); }
      }
      break;
    }
    case 'slamHit':
      e.slam = 1 + (1 - e.stT / 0.6) * 0.25 + 0.001;
      if (e.stT <= 0) { e.state = 'walk'; e.slam = 0; e.stT = enr ? rand(1.2, 1.8) : rand(1.8, 2.6); }
      break;
    case 'chargeWind':
      e.face = Math.cos(e.chA) > 0 ? 1 : -1;
      if (e.stT <= 0) { e.state = 'charge'; e.stT = 0.75; e.hitDone = false; }
      break;
    case 'charge':
      e.x += Math.cos(e.chA) * 690 * dt; e.y += Math.sin(e.chA) * 690 * dt; e.run = 1.6;
      if (Math.random() < 0.9) burstAsh(e.x, e.y, 2, '#5a4a44');
      shake(2);
      if (!e.hitDone && dist2(p.x, p.y, e.x, e.y) < (e.r + 16) * (e.r + 16)) { if (damagePlayer(e.dmg * 1.3, e, true)) { e.hitDone = true; p.kvx = Math.cos(e.chA) * 500; p.kvy = Math.sin(e.chA) * 500; } }
      if (e.stT <= 0) { e.state = 'walk'; e.stT = enr ? 1.2 : 2; }
      break;
    case 'bell':
      e.bellT -= dt;
      if (e.bellT <= 0 && e.bells > 0) {
        e.bells--; e.bellT = 0.7; e.bell = 0.6;
        sfx('bell'); shake(3);
        const n = enr ? 18 : 14, off = Math.random() * TAU;
        for (let i = 0; i < n; i++) { const a = off + i / n * TAU; enemyShot(e.x + Math.cos(a) * 40, e.y - 60 + Math.sin(a) * 20, Math.cos(a) * 135, Math.sin(a) * 135, 13 * (GAME.diffDmg || 1), e.def.bellShot || 'bell'); }
        fxRing(e.x, e.y - 40, 20, 200, 0.6, '#ffc060', 5);
      }
      if (e.bells <= 0 && e.bellT <= 0) { e.state = 'walk'; e.stT = rand(1.4, 2.2); }
      break;
    case 'summon':
      if (e.stT <= 0) {
        for (let i = 0; i < (enr ? 16 : 10); i++) { const a = Math.random() * TAU; makeEnemy(i % 3 ? 'bat' : 'ghoul', e.x + Math.cos(a) * 90, e.y + Math.sin(a) * 60); }
        burstAsh(e.x, e.y, 12, '#3a2a30');
        e.state = 'walk'; e.stT = 2.2;
      }
      break;
  }
  e.x += e.kvx * dt; e.y += e.kvy * dt; e.kvx *= 0.85; e.kvy *= 0.85;
  e.phase = (e.phase || 0) + dt * (e.run > 0 ? 3.2 * e.run : 0);
  if (dist2(e.x, e.y, p.x, p.y) < (e.r + 8) * (e.r + 8) && e.touchT <= 0 && damagePlayer(e.dmg * 0.7, e)) e.touchT = 0.8;
  addLight(e.x, e.y - 60, 170, e.enrage ? '#ff3a1a' : '#ff7a2a', 0.9);
}

      g.fillStyle = lg(g, q.x - 14, 0, q.x + 14, 0, [0, 'rgba(255,40,60,0)', 0.5, 'rgba(255,90,110,0.8)', 1, 'rgba(255,40,60,0)']);

      g.restore();
      g.fillStyle = 'rgba(0,0,0,0.45)'; g.beginPath(); g.ellipse(q.x, q.y, 14, 4, 0, 0, TAU); g.fill();
      g.save(); g.translate(q.x, by); g.rotate(Math.sin(time * 1.5) * 0.08);
      g.fillStyle = '#2a0a10'; g.fillRect(-12, -9, 24, 17);
      g.fillStyle = lg(g, -11, -8, 11, 8, [0, '#6a1020', 1, '#3a0610']); g.fillRect(-11, -8, 22, 15);
      g.strokeStyle = '#c9a24c'; g.lineWidth = 1; g.strokeRect(-9, -6, 18, 11);
      g.fillStyle = '#e8d8c0'; g.fillRect(-11, 6, 22, 2);
      g.save(); g.globalCompositeOperation = 'lighter'; g.fillStyle = '#ff5a6a'; g.font = '700 9px serif'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText('ᛟ', 0, -0.5); g.restore();
      g.restore();
      addLight(q.x, q.y, 180, '#ff3048', 1);
    } else if (q.kind === 'chest') {
      g.fillStyle = 'rgba(0,0,0,0.45)'; g.beginPath(); g.ellipse(q.x, q.y, 16, 5, 0, 0, TAU); g.fill();
      g.fillStyle = lg(g, 0, y - 16, 0, y + 4, [0, '#8a5a2a', 1, '#3a200a']); g.fillRect(q.x - 14, y - 14, 28, 18);
      g.fillStyle = '#c9a24c'; g.fillRect(q.x - 14, y - 8, 28, 3); g.fillRect(q.x - 2, y - 10, 4, 6);
      g.strokeStyle = '#1a0a04'; g.lineWidth = 1.5; g.strokeRect(q.x - 14, y - 14, 28, 18);
      addLight(q.x, q.y, 110, '#ffd070', 1);
    }
  }
}

/* ------------------------------------------------------------ Nebel */
function drawFog(g, x0, y0, time) {
  if (!WORLD.fog || FXQ < 0.6) return;
  const T = 700;
  g.globalCompositeOperation = 'screen';
  for (let layer = 0; layer < 2; layer++) {
    const par = layer ? 1.15 : 1.35;
    const ox = (x0 * (par - 1) + time * (layer ? 9 : -6)) % T, oy = (y0 * (par - 1) + time * (layer ? 3 : 5)) % T;
    g.globalAlpha = layer ? 0.1 : 0.14;
    const bx = Math.floor((x0 - ox) / T) * T + ox, by = Math.floor((y0 - oy) / T) * T + oy;
    for (let y = by - T; y < y0 + VIEW.h + T; y += T) for (let x = bx - T; x < x0 + VIEW.w + T; x += T) {
      if (x + T < x0 || y + T < y0 || x > x0 + VIEW.w || y > y0 + VIEW.h) continue;
      g.drawImage(WORLD.fog, x, y, T + 1, T + 1);
    }
  }
  g.globalAlpha = 1; g.globalCompositeOperation = 'source-over';
}

/* ------------------------------------------------------------ Bildschirm-Overlays */
function drawOffscreenMarkers(g, G, x0, y0) {
  const S = VIEW.scale;
  const list = [];
  if (G.boss && !G.boss.dead) list.push([G.boss, '#ff5a2a', 16]);
  if (G.mini && !G.mini.dead) list.push([G.mini, '#ffb040', 12]);
  for (const q of G.pickups) if (q.kind === 'chest' || q.kind === 'book') list.push([q, q.kind === 'book' ? '#ff4a5a' : '#ffe070', 14]);
  for (const [o, col, sz] of list) {
    const sx = (o.x - x0) * S, sy = (o.y - 40 - y0) * S;
    const m = 30 * VIEW.dpr;
    if (sx > m && sx < cv.width - m && sy > m && sy < cv.height - m) continue;
    const cx = cv.width / 2, cy = cv.height / 2;
    const a = Math.atan2(sy - cy, sx - cx);
    const k = Math.min((cv.width / 2 - m) / Math.abs(Math.cos(a) || 1e-6), (cv.height / 2 - m) / Math.abs(Math.sin(a) || 1e-6));
    const x = cx + Math.cos(a) * k, y = cy + Math.sin(a) * k;
    const s = sz * VIEW.dpr;
    g.save(); g.translate(x, y); g.rotate(a);
    g.fillStyle = col; g.strokeStyle = '#1a0006'; g.lineWidth = 2 * VIEW.dpr;
    g.beginPath(); g.moveTo(s, 0); g.lineTo(-s * 0.7, s * 0.7); g.lineTo(-s * 0.3, 0); g.lineTo(-s * 0.7, -s * 0.7); g.closePath(); g.fill(); g.stroke();
    g.restore();
  }
}
function drawJoystick(g) {
  const j = INPUT.joy;
  if (!j.active) return;
  const d = VIEW.dpr;
  g.save();
  g.globalAlpha = 0.35;
  g.fillStyle = 'rgba(20,6,20,0.6)'; g.strokeStyle = 'rgba(255,220,230,0.6)'; g.lineWidth = 2 * d;
  g.beginPath(); g.arc(j.ox * d, j.oy * d, JOY_R * d, 0, TAU); g.fill(); g.stroke();
  g.globalAlpha = 0.75;
  const kx = j.ox + (j.x - j.ox), ky = j.oy + (j.y - j.oy);
  g.fillStyle = rg(g, kx * d, ky * d, 0, 24 * d, [0, 'rgba(255,220,230,0.9)', 1, 'rgba(160,40,70,0.7)']);
  g.beginPath(); g.arc(kx * d, ky * d, 24 * d, 0, TAU); g.fill();
  g.restore();
}

  root: document.getElementById('ui'),

    this.clear();

    this.root.appendChild(d);

  clear() { if (this.cur) { this.cur.remove(); this.cur = null; } this.previews = []; },
  act(a, ds) {
    switch (a) {
      case 'play': return this.showSelect();
      case 'title': return this.showTitle();
      case 'altar': return this.showAltar();
      case 'codex': return this.showCodex();
      case 'settings': return this.showSettings();
      case 'hero': this.selHero = ds.id; return this.renderSelectDetail();
      case 'start': return startGame(this.selHero);
      case 'finnform': this.finnPick = +ds.t; return this.renderSelectDetail();
      case 'buyhero': {
        const H = HEROES[this.selHero];
        if (SAVE.souls >= H.unlock.cost) { SAVE.souls -= H.unlock.cost; SAVE.unlocked[this.selHero] = true; writeSave(); sfx('fusion'); this.showSelect(); }
        return;
      }
      case 'card': return chooseCard(+ds.i);
      case 'reroll': return rerollCards();
      case 'resume': return togglePause(false);

        const M = META[ds.id], lv = SAVE.meta[ds.id] || 0;

  tickPreviews(dt) {

      g.fillRect(0, 0, w, h);
      const px = h / 88;
      const cyc = pv.t % 6;
      const st = { t: pv.t, run: sel ? 1 : 0, phase: pv.t * 9, cast: sel && cyc > 4.2 && cyc < 5 ? Math.sin((cyc - 4.2) / 0.8 * Math.PI) : 0, aim: 0.1, rooted: pv.id === 'shen' && !sel ? 1 : 0 };
      const look = { glow: 0.6, rage: 0.4, flow: sel ? 0.8 : 0.2, qi: 0.6, crown: 1 };

      pv.spr = renderHero(pv.id, st, look, px, pv.spr, { glow: sel });
      g.drawImage(pv.spr.out, w / 2 - pv.spr.S / 2, h * 0.86 - pv.spr.anchorY);
    }
  },

  hideHud() { if (this.hud) { this.hud.remove(); this.hud = null; } },
  set(id, v, prop) { if (this.cache[id + (prop || '')] === v) return; this.cache[id + (prop || '')] = v; const el = document.getElementById(id); if (!el) return; if (prop) el.style[prop] = v; else el.textContent = v; },
  updateHud() {
    if (!this.hud || !GAME) return;
    const G = GAME, p = G.p, H = HEROES[p.hero];
    if (!this._hintMoved && G.t > 1.5 && Math.hypot(p.vx, p.vy) > 30) { this._hintMoved = true; const h = $('#hint'); if (h) setTimeout(() => { h.style.opacity = '0'; }, 1500); }
    this.set('xpf', (G.xp / G.xpNext * 100).toFixed(1) + '%', 'width');
    this.set('lvl', 'STUFE ' + G.level);
    this.set('timer', fmtTime(G.t));
    this.set('kills', String(G.kills));
    this.set('souls', String(G.souls));
    // Faehigkeiten
    const key = Object.keys(p.ab).map((k) => k + p.ab[k].lvl).join() + '|' + Object.keys(p.passives).map((k) => k + p.passives[k]).join();
    if (this.cache.slots !== key) {
      this.cache.slots = key;
      $('#slots').innerHTML = Object.keys(p.ab).map((k) => `<div class="slot ${FUSIONS[k] || !CARDS[k] ? 'fus' : ''}"><img src="${icon(k)}"><span class="lv">${FUSIONS[k] || !CARDS[k] ? '★' : p.ab[k].lvl}</span></div>`).join('');
      $('#pslots').innerHTML = Object.keys(p.passives).map((k) => `<div class="slot pas"><img src="${icon(k)}"><span class="lv">${p.passives[k]}</span></div>`).join('');
    }
    // Aktionen
    this.cdRing('dcd', p.dodgeCd / (H.dodgeCd * p.st.dodgeCdMul), '#ffffff');
    this.set('dcdt', p.dodgeCd > 0.05 ? p.dodgeCd.toFixed(1) : '');
    let ultFrac = p.ultCd / (H.ult.cd * (p.hero === 'shen' ? 1 : p.st.cd));
    if (p.hero === 'shen' && p.qi < 1) ultFrac = 1 - p.qi;
    this.cdRing('ucd', ultFrac, '#ffffff');
    this.set('ucdt', p.hero === 'shen' ? (Math.floor(p.qi) > 0 ? '☯' + Math.floor(p.qi) : '') : (p.ultCd > 0.05 ? Math.ceil(p.ultCd).toString() : ''));
    const ready = ultFrac <= 0;
    if (this.cache.ready !== ready) { this.cache.ready = ready; $('#ubtn').classList.toggle('ready', ready); }
    // Heldenmechanik-Anzeige
    let mv = 0, mc = '#ff3a4e', mt = H.mech.name;
    if (p.hero === 'vorian') { let n = 0; for (const e of G.enemies) if (!e.dead && e.bstack > 0) n += e.bstack; mv = Math.min(1, n / 60); mt = 'Blutmale: ' + n; }
    if (p.hero === 'liora') { mv = clamp((1 - p.hp / p.st.maxHp) / 0.72, 0, 1); mt = 'Blutrausch +' + Math.round(clamp((1 - p.hp / p.st.maxHp) * 1.25, 0, 0.9) * 100) + '%' + (p.buffAder > 0 ? ' · ADERLASS' : ''); }
    if (p.hero === 'nyx') { mv = p.flow; mc = '#a77bff'; mt = 'Schattenfluss +' + Math.round(p.flow * 45) + '%' + (p.ultT > 0 ? ' · MITTERNACHT' : ''); }
    if (p.hero === 'finn') { const T = FINN_TIERS[p.tier || 0], F = finnSave(), N = FINN_TIERS[F.tier + 1]; mc = T.col; const run = finnRunEssence(G, false); if (!p.tier) { mv = 0; mt = 'Mensch · finde das Buch!'; } else if (G.finnTest) { mv = 1; mt = T.name + ' (Testform)'; } else if (N && N.req.essence) { mv = clamp((F.essence + run) / N.req.essence, 0, 1); mt = T.name + ' · Essenz +' + run; } else { mv = 1; mt = T.name + ' · Essenz +' + run; } }
    if (p.hero === 'shen') { mv = p.qi / 5; mc = '#4ff0cc'; mt = 'Qi ' + Math.floor(p.qi) + '/5' + (p.rooted > 0.5 ? ' · Wurzelstand' : ''); }
    this.set('mfill', (mv * 100).toFixed(0) + '%', 'width');
    this.set('mfill', mc, 'background');
    this.set('mechname', mt);
    // Boss
    const B = G.boss && !G.boss.dead ? G.boss : (G.mini && !G.mini.dead ? G.mini : null);
    this.set('bossbar', B ? 'block' : 'none', 'display');

    this.set('lowhp', p.alive && p.hp < p.st.maxHp * 0.3 ? '1' : '0', 'opacity');
  },
  cdRing(id, frac, col) {
    const k = Math.round(clamp(frac, 0, 1) * 60);
    if (this.cache[id] === k) return;
    this.cache[id] = k;
    const c = document.getElementById(id); if (!c) return;
    const g = c.getContext('2d'), w = c.width;

    g.fillStyle = 'rgba(0,0,0,0.62)';
    g.beginPath(); g.moveTo(w / 2, w / 2); g.arc(w / 2, w / 2, w / 2, -Math.PI / 2, -Math.PI / 2 + TAU * k / 60); g.closePath(); g.fill();
  },

function finnReqHtml(T, F) {
  if (!T.req) return '';
  if (!T.req.essence) return T.req.text;

  return `${T.req.text} · Blutessenz <b style="color:${ok ? '#7dff9a' : '#ffb0b0'}">${Math.min(F.essence, T.req.essence)} / ${T.req.essence}</b>`;
}
function finnSelectHtml() {
  const F = finnSave(), cur = FINN_TIERS[F.tier], N = FINN_TIERS[F.tier + 1];

  if (UI.finnPick === undefined || (!test && UI.finnPick !== F.tier)) UI.finnPick = F.tier;
  const chips = FINN_TIERS.map((T, i) => {

      <p>${cur.desc}</p>
      ${N ? `<p style="margin-top:4px">Nächste Form: <b style="color:${N.col}">${N.name}</b> — ${finnReqHtml(N, F)}</p>${bar}` : '<p>Höchste Form erreicht.</p>'}
      <div style="color:var(--dim);font-size:13.5px">Blutessenz gesamt: ${F.essence} · Läufe: ${F.runs} · Siege: ${F.wins}</div></div>

}
function finnEndHtml(x) {
  const F = finnSave();
  if (x.test) return `<div class="codex"><h3>Evolution</h3><p>${x.note}</p></div>`;
  let h = `<div class="codex"><h3>Evolution</h3><p>Blutessenz: <b style="color:#ff8a96">+${x.gain}</b> (gesamt ${F.essence})</p>`;
  if (x.evolved) h += `<div style="text-align:center;margin:8px 0"><div class="cinzel" style="font-size:12px;letter-spacing:.4em;color:var(--gold2)">DAUERHAFTE EVOLUTION</div><div class="cinzel" style="font-size:24px;font-weight:800;color:${x.evolved.col};text-shadow:0 0 16px currentColor">${x.evolved.name}</div><p>${x.evolved.desc}</p></div>`;
  const N = x.next;
  if (N && N.req.essence) h += `<p>Nächste Form <b style="color:${N.col}">${N.name}</b>:<br>Prüfung: ${N.req.text} ${x.evolved ? '' : x.trial ? '<b style="color:#7dff9a">✓ bestanden</b>' : '<b style="color:#ffb0b0">✗ noch nicht</b>'}<br>Blutessenz ${Math.min(F.essence, N.req.essence)} / ${N.req.essence}</p>`;
  return h + '</div>';
}

function tickBlutspray(p, ab, dt) {
  ab.t -= dt;
  if (ab.t > 0) return;
  const L = ab.lvl;
  ab.t = cdOf(L >= 4 ? 1.1 : 1.4);
  const n = 5 + (L >= 2 ? 2 : 0) + (L >= 4 ? 2 : 0);
  const dmg = 8 * (L >= 3 ? 1.35 : 1);
  const ang = aimDir(p, 300);
  castAnim(p, ang, 0.22);
  sfx('whip', 0, 0.05); sfx('splat', 0, 0.05);
  const spread = 0.95;
  for (let i = 0; i < n; i++) {
    const a = ang + (i / (n - 1) - 0.5) * spread + rand(-0.05, 0.05);
    bloodBolt(p.x + Math.cos(ang) * 12, p.y - 2 + Math.sin(ang) * 8, a, rand(360, 430), dmg, L >= 3 ? 1 : 0, L >= 5);
  }
  burstBlood(p.x + Math.cos(ang) * 16, p.y + Math.sin(ang) * 10, 6, 0.8, ang);
}
function bloodBolt(x, y, a, sp, dmg, pierce, pop) {
  const hit = new Set();
  let left = pierce;
  addEffect({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, dur: 0.7, layer: 2, update(e, dt) {
    e.x += e.vx * dt; e.y += e.vy * dt;
    let done = false;
    forEnemiesInRadius(e.x, e.y, 8, (en) => {
      if (done || hit.has(en.id)) return;
      hit.add(en.id);
      dealDamage(en, dmg, 'blood', 'blutspray', { kb: 50, kx: e.vx, ky: e.vy });
      splat(en.x, en.y, 12);
      if (pop) bloodBurstAt(en.x, en.y, 30 * GAME.p.st.area, dmg * 0.6, 'blutspray');
      if (--left < 0) done = true;
    });
    if (done) e.dead = true;
    if (Math.random() < 0.35 * FXQ) spawnPart({ x: e.x, y: e.y, z: 12, vx: e.vx * 0.1, vy: e.vy * 0.1, vz: 10, g: 400, life: 0.4, size: 2, size1: 1, spr: PART.drop, splat: Math.random() < 0.2 ? 1 : 0 });
  }, draw(g, e, k) {
    const ang = Math.atan2(e.vy, e.vx);
    g.save(); g.translate(e.x, e.y - 14); g.rotate(ang);
    g.globalAlpha = 1 - k * k;
    g.drawImage(PART.drop, -12, -4, 20, 8);
    g.globalCompositeOperation = 'lighter'; g.globalAlpha = 0.5 * (1 - k);
    g.drawImage(glowSprite('#ff2a40'), -14, -8, 22, 16);
    g.restore();
  } });
}
function tickHammerschlag(p, ab, dt) {
  ab.t -= dt;
  if (ab.t > 0) return;
  const L = ab.lvl;
  const tgt = nearestEnemy(p.x, p.y, 170);
  if (!tgt) { ab.t = 0.3; return; }
  ab.t = cdOf(L >= 4 ? 2.3 : 3);
  const ang = Math.atan2(tgt.y - p.y, tgt.x - p.x);
  const reach = 46;
  const x = p.x + Math.cos(ang) * reach, y = p.y + Math.sin(ang) * reach * 0.8;
  const r = (L >= 3 ? 88 : 70) * p.st.area;
  const dmg = 40 * (L >= 2 ? 1.4 : 1);
  castAnim(p, ang + 0.6, 0.35);
  // kurzes Ausholen, dann Einschlag
  GAME.later(0.1, () => {
    sfx('stomp'); shake(6); hitstop(0.05);
    forEnemiesInRadius(x, y, r, (en) => dealDamage(en, dmg, 'none', 'hammerschlag', { kb: 300, kx: en.x - p.x, ky: en.y - p.y, norm: true, stun: 0.6 }));
    addDecal(x, y, ASPR.crack, r * 1.6, 0.9, 6, 0);
    fxRing(x, y, 10, r * 1.1, 0.3, '#ffd0a0', 7); fxFlash(x, y - 6, r * 0.6, '#ffb070', 0.18);
    burstAsh(x, y, 10, '#6a6064');
    for (let i = 0; i < 12; i++) { const a = Math.random() * TAU; spawnPart({ x, y, z: 4, vx: Math.cos(a) * rand(60, 180), vy: Math.sin(a) * rand(40, 120), vz: rand(120, 240), g: 600, life: 0.9, size: rand(2.5, 5), size1: 2.5, spr: tinted('ash', '#7a7074') }); }
    if (L >= 3) {
      const hit = new Set();

/* ------------------------------------------------------------- Buch & Evolution
   Die Form ist DAUERHAFT (Speicherstand). Im Lauf kaempft Finn nur mit den
   Kraeften seiner Form; die naechste Form wird nach dem Lauf verdient. */
function finnSave() {
  if (!SAVE.finn) SAVE.finn = { tier: 0, essence: 0, wins: 0, runs: 0 };
  return SAVE.finn;
}
function finnGrant(p, tier) {
  for (const c of FINN_TIERS[tier].grants) {
    if (p.ab[c]) continue;
    if (!CARDS[c]) { p.ab[c] = { lvl: 1, t: 0.5, fusion: c === 'siegel' }; continue; }
    if (Object.keys(FUSIONS).some((f) => p.ab[f] && FUSIONS[f].consumes.includes(c))) continue;
    p.ab[c] = { lvl: 1, t: 0.4 }; p.order.push(c);
  }
}
function finnDodge(tier) {
  if (tier >= 2 && typeof finnSkills === 'function' && finnSkills().has('schatten')) return 'shadowstep';
  return tier >= 3 ? 'shadowstep' : tier >= 2 ? 'blink' : undefined;
}
function finnStart() {
  const G = GAME, p = G.p, F = finnSave();
  const tier = clamp(G.finnTier !== undefined ? G.finnTier : F.tier, 0, FINN_TIERS.length - 1);
  p.tier = tier;
  G.finnStartTier = tier;
  for (let t = 1; t <= tier; t++) finnGrant(p, t);
  p.dodgeKind = finnDodge(tier);
  recomputeStats(); p.hp = p.st.maxHp;
  if (tier === 0) {
    const a = Math.random() * TAU;
    G.pickups.push({ kind: 'book', x: Math.cos(a) * 150, y: Math.sin(a) * 120, v: 1, magnet: false, vx: 0, vy: 0, t: 0, z: 0, vz: 0 });
    GAME.later(0.8, () => UI.announce('Finde das Buch!', ''));
  } else GAME.later(0.8, () => UI.announce(FINN_TIERS[tier].name.toUpperCase(), ''));
}
// nur fuer das Buch: die Verwandlung Mensch -> Halbling passiert im Lauf
function finnEvolve(tier) {
  const G = GAME, p = G.p, T = FINN_TIERS[tier];
  p.tier = tier;
  finnGrant(p, tier);
  p.dodgeKind = finnDodge(tier);
  recomputeStats();
  p.hp = p.st.maxHp;
  p.iframes = Math.max(p.iframes, 1.5);
  const F = finnSave();
  if (tier === 1 && F.tier < 1 && !G.finnTest) { F.tier = 1; writeSave(); }
  sfx('fusion'); shake(10); hitstop(0.2); G.slowmo = Math.max(G.slowmo, 1.2);
  const col = T.col;
  addEffect({ x: p.x, y: p.y, dur: 1.2, layer: 1, draw(g, e, k) {
    const q = GAME.p;
    g.globalCompositeOperation = 'lighter';
    const w = 50 * (1 - k * 0.5);
    g.globalAlpha = 1 - k;
    g.fillStyle = lg(g, q.x - w, 0, q.x + w, 0, [0, rgba(col, 0), 0.4, rgba(col, 0.8), 0.5, 'rgba(255,255,255,1)', 0.6, rgba(col, 0.8), 1, rgba(col, 0)]);
    g.fillRect(q.x - w, q.y - 600, w * 2, 600);
  }, update() { addLight(GAME.p.x, GAME.p.y, 400, col, 1); } });
  fxRing(p.x, p.y, 10, 280, 0.7, col, 12); fxRing(p.x, p.y, 10, 200, 0.6, '#ffffff', 4);
  forEnemiesInRadius(p.x, p.y, 240, (en) => { if (!en.boss) { const a = Math.atan2(en.y - p.y, en.x - p.x); en.kvx += Math.cos(a) * 500 / Math.sqrt(en.mass); en.kvy += Math.sin(a) * 500 / Math.sqrt(en.mass); } });
  burstBlood(p.x, p.y, 24, 1.5);
  UI.evolution(T, FINN_TIERS[tier + 1]);
}
// Essenz dieses Laufs (wird laufend im HUD gezeigt)
function finnRunEssence(G, won) {
  return Math.round(G.kills * 0.25 + G.t * 0.9 + G.level * 12 + (G.miniKilled ? 150 : 0) + (won ? 500 : 0));
}
// nach dem Lauf: Essenz gutschreiben, Pruefung auswerten, evtl. dauerhaft entwickeln
function finnEndRun(won) {
  const G = GAME, p = G.p, F = finnSave();
  const res = { gain: finnRunEssence(G, won), evolved: null, test: !!G.finnTest };
  if (G.finnTest) { res.note = 'Testform gewählt — dieser Lauf zählt nicht für die Evolution.'; return res; }
  F.runs++; F.essence += res.gain; if (won) F.wins++;
  const N = FINN_TIERS[F.tier + 1];
  res.next = N;
  if (N && F.tier >= 1) {
    const r = { t: G.t, level: G.level, won, miniKilled: !!G.miniKilled, wins: F.wins, hpFrac: p.hp / p.st.maxHp, tier: G.finnStartTier };
    const formOk = G.finnStartTier === F.tier;          // Pruefung muss in der aktuellen Form bestanden werden
    res.trial = formOk && N.req.check(r);
    res.enough = F.essence >= N.req.essence;
    if (res.trial && res.enough) { F.tier++; res.evolved = N; res.next = FINN_TIERS[F.tier + 1]; }
  }
  return res;
}

  g.save(); g.translate(P.hipX, P.hipY); g.rotate(P.lean);
  const T = SPEC_DALKI.torso;
  g.beginPath(); g.moveTo(-6.5, 1); g.bezierCurveTo(-10, -T * 0.4, -11, -T * 0.85, -7, -T - 1); g.lineTo(8, -T - 1); g.bezierCurveTo(12, -T * 0.7, 9, -T * 0.35, 6.5, 1); g.closePath();
  paint(g, lg(g, -8, -T, 8, 0, [0, C.skinL, 0.4, C.skin, 1, C.skinD]), 'rgba(0,0,0,0.6)', 0.8);
  // Muskelzeichnung
  g.strokeStyle = rgba('#000000', 0.3); g.lineWidth = 0.7;
  g.beginPath(); g.moveTo(1, -T + 2); g.lineTo(1, -4); g.moveTo(-5, -T * 0.62); g.quadraticCurveTo(1, -T * 0.52, 8, -T * 0.64); g.moveTo(-3, -T * 0.35); g.lineTo(6, -T * 0.35); g.stroke();
  if (D.fur) { g.fillStyle = C.fur; for (let k = 0; k < 7; k++) { g.beginPath(); g.moveTo(-8 + k * 2.4, -T - 1); g.lineTo(-9 + k * 2.4, -T + 5 + (k % 2) * 2); g.lineTo(-6 + k * 2.4, -T - 1); g.fill(); } }
  // Lendenschurz / Riemen
  g.fillStyle = C.cloth; g.beginPath(); g.moveTo(-6.5, -2); g.lineTo(6.5, -2); g.lineTo(5, 8); g.lineTo(0, 6); g.lineTo(-5, 8); g.closePath(); g.fill();
  if (D.armor) { g.strokeStyle = '#1a1414'; g.lineWidth = 1.6; g.beginPath(); g.moveTo(-7, -T + 1); g.lineTo(7, -4); g.stroke(); }
  g.restore();
  leg(P.legF, 0);
  // Kopf: kahl, schwere Brauen, rote Augen, ab 3 Stacheln Kopfstachel
  g.save(); g.translate(P.headX + 1, P.headY + 2); g.rotate(P.headA * 0.5);
  if (n >= 3) spike(-2, -5, -0.7, 8 + n, 1.8);
  if (D.fur) { g.beginPath(); g.moveTo(-5, 4); g.quadraticCurveTo(-8, -4, -2, -7); g.quadraticCurveTo(-8, -1, -6, 5); g.closePath(); paint(g, C.fur, null); }
  g.beginPath(); g.moveTo(-4.5, -4); g.quadraticCurveTo(0, -7.5, 4, -4.8); g.lineTo(5.2, -1.2); g.lineTo(D.fur ? 9 : 5.5, D.fur ? 1 : 0.8); g.lineTo(4.5, 3.8); g.quadraticCurveTo(0, 6, -4, 3); g.closePath();
  paint(g, lg(g, 0, -7, 0, 5, [0, C.skinL, 1, C.skin]), 'rgba(0,0,0,0.7)', 0.6);
  g.fillStyle = rgba('#000000', 0.35); g.fillRect(0.5, -3.4, 5, 1.2);
  eye(g, 3, -1.8, 0.95, C.eye);
  g.fillStyle = '#f4ecd6'; for (let k = 0; k < 3; k++) { g.beginPath(); g.moveTo(1.5 + k * 1.3, 2.4); g.lineTo(2 + k * 1.3, 3.8); g.lineTo(2.5 + k * 1.3, 2.4); g.fill(); }
  g.restore();
  // Schulterstacheln
  if (n >= 4) { spike(P.shF[0] - 1, P.shF[1] - 2, -0.4, 10, 2); }
  if (n >= 6) { spike(P.shB[0], P.shB[1] - 2, -0.9, 10, 2); spike(P.shF[0] + 2, P.shF[1] - 1, 0.2, 9, 1.8); }
  if (n >= 7) spike(P.neckX - 2, P.neckY - 2, -1.2, 13, 2.2);
  if (n >= 8) spike(P.neckX + 1, P.neckY - 3, -0.2, 14, 2.4);
  arm(P.armF, 0, true);
}

/* ---------------------------------------------------------------- Heldenfiguren als Gegner */
function heroAsEnemy(heroId, look) {
  return (g, ph, o) => {
    const art = HERO_ART[heroId];
    const P = makePose(art.spec, { t: ph * 2, run: o && o.idle ? 0.2 : 1, phase: ph * TAU, cast: o && o.atk ? 1 : 0, aim: 0.1 });
    art.draw(g, P, look || {});
  };
}
// Palettenwechsel waehrend des Malens (fuer Varianten derselben Figur)
function withPal(pairs, fn) {
  const saved = pairs.map(([obj, ov]) => { const old = {}; for (const k in ov) old[k] = obj[k]; Object.assign(obj, ov); return [obj, old]; });
  try { return fn(); } finally { for (const [obj, old] of saved) Object.assign(obj, old); }
}

/* ---------------------------------------------------------------- Bosse (live gemalt) */
function humanBoss(g, st, hero, pal, look, sc) {
  g.scale(sc, sc);
  const SP = { vorian: SPEC_VORIAN, liora: SPEC_LIORA, nyx: SPEC_NYX, shen: SPEC_SHEN }[hero];
  const DR = { vorian: drawVorian, liora: drawLiora, nyx: drawNyx, shen: drawShen }[hero];
  withPal(pal, () => { const P = makePose(SP, { t: st.t, run: st.run || 0, phase: st.phase || 0, cast: Math.min(1, st.slam || 0), aim: -1.1, hurt: st.hurt || 0, dead: st.dead || 0 }); DR(g, P, look || {}); });
}
// Eigener Drache: schwarze Schuppen, goldene Glut, vier Beine, Schwingen, langer Hals
function drawDrache(g, st) {
  const t = st.t, run = st.run || 0, flap = Math.sin(t * 3.2), atk = Math.min(1, (st.slam || 0) + (st.roar || 0));

// welche Kraefte eine Form mindestens voraussetzt (Testmodus / alte Spielstaende)
const SKILLS_BY_TIER = { 2: ['technik', 'schatten'], 3: ['ghoul', 'blut', 'qi'], 4: ['fraktion'], 5: ['absolut', 'qi2'], 7: ['asura', 'daemon'] };
function finnSkills() {
  const S = storySave(), F = finnSave(), out = new Set((S.skills || []).filter((k) => FINN_SKILLS[k]));
  const tier = GAME && GAME.p && GAME.p.hero === 'finn' ? (GAME.p.tier || 0) : F.tier;
  for (const t in SKILLS_BY_TIER) if (tier >= +t || F.tier >= +t) SKILLS_BY_TIER[t].forEach((k) => out.add(k));
  if (SAVE.settings.testUnlock && (UI.finnPick || 0) >= 2) Object.keys(FINN_SKILLS).forEach((k) => out.add(k));
  return out;
}

/* ---------------------------------------------------------------- Bestienausruestung (dauerhaft) */
const GEAR = {
  handschuhe: { name: 'Bestienhandschuhe', desc: '+8 % Schaden je Stufe', max: 5, cost: [30, 80, 160, 300, 500] },
  stiefel: { name: 'Bestienstiefel', desc: '+5 % Tempo, −6 % Ausweich-Abklingzeit je Stufe', max: 5, cost: [30, 80, 160, 300, 500] },
  panzer: { name: 'Bestienpanzer', desc: '+10 % Leben je Stufe', max: 5, cost: [40, 100, 200, 360, 600] },
  amulett: { name: 'Kristallamulett', desc: '+12 % Sammelradius, +5 % Erfahrung je Stufe', max: 5, cost: [25, 60, 120, 240, 420] }
};
function storySave() {
  if (!SAVE.story) SAVE.story = {};
  const S = SAVE.story;
  S.cleared = S.cleared || {}; S.gear = S.gear || {}; S.best = S.best || {}; S.skills = S.skills || [];
  if (S.crystals === undefined) S.crystals = 0;
  if (!S.v3) { // Kapitelgrenzen nach dem Recherche-Dossier: Kraefte aus geschafften Kapiteln neu berechnen
    S.v2 = S.v3 = true;
    if (!Object.keys(S.cleared).length && (SAVE.finn && SAVE.finn.tier) >= 2) { const t = SAVE.finn.tier; for (let n = 1; n <= [0, 0, 2, 5, 7, 10, 11, 12][Math.min(7, t)]; n++) S.cleared[n] = true; }
    S.skills = [];
    for (let n = 1; n <= CHAPTERS.length; n++) if (S.cleared[n]) (CHAPTERS[n - 1].reward.skills || []).forEach((k) => { if (!S.skills.includes(k)) S.skills.push(k); });
  }
  return S;
}

/* ---------------------------------------------------------------- Lauf einrichten */
function storySetup(G, ch) {
  G.story = ch;
  G.roles = ch.roles;
  G.diffHp = ch.diff.hp; G.diffCount = ch.diff.count; G.diffDmg = ch.diff.dmg;
  G.events = EVENTS.map((ev) => {
    const e2 = Object.assign({}, ev);
    if (ev.kind === 'swarm') e2.text = ch.texts.swarm;
    else if (ev.kind === 'ring') e2.text = ch.texts.ring;
    else if (ev.kind === 'boss') e2.text = ch.texts.boss;
    else if (ev.kind === 'miniboss') e2.text = null;
    return e2;
  });
  G.quests = ch.quests.map((q) => ({ q, prog: 0, done: false }));
  G.questRoleKills = {};
  G.onKill = storyOnKill;
  G.schoolMul = finnSkills().has('absolut') ? { blood: 1.25, shadow: 1.25 } : null;
  spawnCompanions(G);
  const S = storySave(), gr = S.gear, sk = finnSkills();
  const asura = sk.has('asura') ? 1.15 : 1, daemon = sk.has('daemon') ? 1.15 : 1;
  G.statMod = (st) => {
    st.might *= (1 + 0.08 * (gr.handschuhe || 0) + (S.king ? 0.1 : 0)) * asura * daemon;
    st.maxHp *= asura;
    st.speed *= 1 + 0.05 * (gr.stiefel || 0);
    st.dodgeCdMul *= Math.pow(0.94, gr.stiefel || 0);
    st.maxHp *= 1 + 0.1 * (gr.panzer || 0) + (S.king ? 0.1 : 0);
    st.pickup *= 1 + 0.12 * (gr.amulett || 0);
    st.xpMul *= 1 + 0.05 * (gr.amulett || 0);
  };
  // Kristalle vorrendern, damit waehrend des Laufs nichts ruckelt
  for (const r in ch.roles) { const d = ENEMIES[ch.roles[r]]; if (d.art && ENEMY_ART[d.art]) ensureArt(d.art); }
}
function storyOnKill(e) {
  const G = GAME, ch = G.story, n = ch.n;
  // Bestienkristalle
  let c = 0;
  if (e.boss) c = 40 * n; else if (e.mini) c = 15 * n; else if (e.elite) c = 5 * n; else if (Math.random() < 0.03) c = Math.ceil(n / 2);
  if (c) { const k = Math.min(8, c); for (let i = 0; i < k; i++) dropPickup(e.x + rand(-20, 20), e.y + rand(-14, 14), 'crystal', Math.round(c / k)); }
  G.questRoleKills[e.role] = (G.questRoleKills[e.role] || 0) + 1;
  if (e.mini) G.miniKilled = true;
}
function storyQuestTick() {
  const G = GAME;
  if (!G.quests) return;
  for (const Q of G.quests) {
    if (Q.done) continue;
    const q = Q.q;
    if (q.type === 'kill') Q.prog = G.questRoleKills[q.role] || 0;
    else if (q.type === 'survive') Q.prog = Math.floor(G.t);
    else if (q.type === 'level') Q.prog = G.level;
    else if (q.type === 'crystals') Q.prog = G.crystals || 0;
    else if (q.type === 'mini') Q.prog = G.miniKilled ? 1 : 0;
    const goal = q.type === 'mini' ? 1 : q.n;
    if (Q.prog >= goal) {
      Q.done = true;
      G.crystals = (G.crystals || 0) + q.reward.crystals;
      if (q.reward.bonus === 'level') G.pendingLevels++;
      if (q.reward.bonus === 'heal') healPlayer(G.p.st.maxHp * 0.4);
      sfx('level');
      UI.sysWindow('QUEST ABGESCHLOSSEN', q.text, `Belohnung: ${q.reward.crystals} Bestienkristalle${q.reward.bonus === 'level' ? ' · Stufenaufstieg' : ' · Heilung'}`);
    }
  }
}

/* ---------------------------------------------------------------- Laufende */
function storyEnd(won) {
  const G = GAME, ch = G.story, S = storySave(), F = finnSave();
  const res = { story: true, ch, crystals: G.crystals || 0, firstClear: false, reward: null, test: !!G.finnTest };
  S.crystals += res.crystals;
  S.best[ch.n] = Math.max(S.best[ch.n] || 0, G.t);
  if (won) {
    if (!S.cleared[ch.n]) { S.cleared[ch.n] = true; res.firstClear = true; }
    const R = ch.reward;
    if (!G.finnTest) {
      if (R.tier && F.tier < R.tier) { F.tier = R.tier; res.reward = R; res.evolved = FINN_TIERS[R.tier]; }
      if (R.king && !S.king) { S.king = true; res.reward = R; }
      const neu = (R.skills || []).filter((k) => !S.skills.includes(k));
      if (neu.length) { S.skills.push(...neu); res.reward = R; res.skills = neu; }
    }
  }
  return res;
}
// Finn: im Story-Modus zaehlt das Kapitel, nicht mehr die Essenz
const _finnEndOld = HEROES.finn.onEnd;
HEROES.finn.onEnd = function (won) { return GAME.story ? storyEnd(won) : _finnEndOld(won); };

// Finn gehoert in den Story-Modus, nicht in die Arcade-Heldenwahl
(function () { const i = HERO_ORDER.indexOf('finn'); if (i >= 0) HERO_ORDER.splice(i, 1); })();

function storyStart(chN) {

}

const _ui = { showTitle: UI.showTitle, act: UI.act, showEnd: UI.showEnd, showPause: UI.showPause, showHud: UI.showHud, updateHud: UI.updateHud, showLevelUp: UI.showLevelUp };

UI.act = function (a, ds, e) {
  switch (a) {
    case 'story': return this.showStory();
    case 'chapter': this.selChapter = +ds.n; return this.showStory();
    case 'chapterGo': return this.showChapterIntro(this.selChapter);
    case 'chapterStart': return storyStart(this.selChapter);
    case 'storyform': this.finnPick = +ds.t; return this.showStory();
    case 'comp': { const P0 = companionParty(); const i = P0.indexOf(ds.id); if (i >= 0) P0.splice(i, 1); else { if (P0.length >= partyMax()) P0.shift(); P0.push(ds.id); } writeSave(); return this.showStory(); }
    case 'gear': return this.showGear();
    case 'buygear': {
      const S = storySave(), G0 = GEAR[ds.id], lv = S.gear[ds.id] || 0;
      if (lv < G0.max && S.crystals >= G0.cost[lv]) { S.crystals -= G0.cost[lv]; S.gear[ds.id] = lv + 1; writeSave(); sfx('level'); }
      return this.showGear();
    }
    case 'again': if (GAME && GAME.story) return storyStart(GAME.story.n); break;
    case 'nextch': return (this.selChapter = Math.min(CHAPTERS.length, GAME.story.n + 1), this.showStory());
  }
  return _ui.act.call(this, a, ds, e);
};

function chapterOpen(n) { const S = storySave(); return n === 1 || S.cleared[n - 1] || SAVE.settings.testUnlock; }
UI.showStory = function () {

  if (this.finnPick === undefined || !test) this.finnPick = F.tier;

// Finn-Vorschau im Statusfenster (ueberschreibt die Heldenvorschau nur fuer diese Leinwand)
const _tickPrev = UI.tickPreviews;
UI.tickPreviews = function (dt) {
  const pv = this.previews[0];
  if (pv && pv.finn) {
    pv.t += dt;
    const g = pv.c.getContext('2d'), w = pv.c.width, h = pv.c.height;
    g.setTransform(1, 0, 0, 1, 0, 0); g.clearRect(0, 0, w, h);
    const tier = this.finnPick !== undefined ? this.finnPick : finnSave().tier;
    g.fillStyle = rg(g, w / 2, h * 0.7, 4, w * 0.8, [0, rgba(FINN_TIERS[tier].rim, 0.35), 1, 'rgba(0,0,0,0)']); g.fillRect(0, 0, w, h);
    pv.spr = renderHero('finn', { t: pv.t, run: 0, phase: 0, cast: (pv.t % 4) > 3.2 ? Math.sin(((pv.t % 4) - 3.2) / 0.8 * Math.PI) : 0, aim: 0.2 }, { tier, rim: FINN_TIERS[tier].rim }, h / 90, pv.spr, { glow: true });
    g.drawImage(pv.spr.out, w / 2 - pv.spr.S / 2, h * 0.92 - pv.spr.anchorY);
    return;

function spawnCompanions(G) {

}
function compPower(G) { return Math.pow(G.story ? G.story.diff.hp : 1, 0.85) * (1 + G.level * 0.035); }
function peterPower() { const S = storySave(); return S.cleared[10] ? 2.2 : S.cleared[4] ? 1.7 : S.cleared[3] ? 1.3 : 1; }
function updateCompanions(dt) {

}
function compAttack(c, tgt, pw) {

let MENU = null;
let PENDING_FINN;           // Hintergrundszene fuer die Menues
let lastT = 0, perfAcc = 0, perfN = 0, perfSlow = 0;

function applyQuality() {
  const q = SAVE.settings.quality;
  if (q === 'hoch') { VIEW.dprCap = 2; FXQ = 1; }
  else if (q === 'mittel') { VIEW.dprCap = 1.5; FXQ = 0.75; }
  else if (q === 'niedrig') { VIEW.dprCap = 1.1; FXQ = 0.5; }
  else { VIEW.dprCap = Math.min(2, window.devicePixelRatio || 1); FXQ = 1; }
  FX.maxParts = Math.round(900 * FXQ);
  resizeCanvas();
}
function autoQuality(dt) {
  if (SAVE.settings.quality !== 'auto' || !GAME || GAME.state !== 'play') return;
  perfAcc += dt; perfN++;
  if (perfAcc < 2) return;
  const avg = perfAcc / perfN;
  perfAcc = 0; perfN = 0;
  if (avg > 0.024) { // unter ~42 FPS: Aufloesung und Partikel senken
    perfSlow++;
    if (VIEW.dprCap > 1.25) { VIEW.dprCap = Math.max(1.25, VIEW.dprCap - 0.35); resizeCanvas(); }
    else if (FXQ > 0.5) { FXQ = Math.max(0.5, FXQ - 0.2); FX.maxParts = Math.round(900 * FXQ); }
  }
}

function menuScene() {
  if (MENU) return;
  MENU = { state: 'menu', t: 0, cam: { x: 820, y: 400, w: VIEW.w, h: VIEW.h }, enemies: [], images: [], pickups: [], eproj: [], shake: 0, slowmo: 0, p: null, boss: null, mini: null };
  for (let i = 0; i < 14; i++) {
    const type = i < 9 ? 'ghoul' : i < 12 ? 'bat' : 'witch';
    MENU.enemies.push({ id: -i - 1, type, def: ENEMIES[type], x: 820 + rand(-300, 300), y: 400 + rand(-500, 500), r: ENEMIES[type].r, scale: 1, face: Math.random() < 0.5 ? 1 : -1, animT: Math.random() * 5, spd: ENEMIES[type].spd * 0.5, flash: 0, dead: false, bstack: 0, stunT: 0, corruptT: 0, a: Math.random() * TAU });
  }
}
function updateMenuScene(dt) {
  const M = MENU;
  M.t += dt;
  M.cam.x = 820 + Math.sin(M.t * 0.07) * 260 + M.t * 12;
  M.cam.y = 400 + Math.cos(M.t * 0.05) * 160;
  M.cam.w = VIEW.w; M.cam.h = VIEW.h;
  FX.lights.length = 0;
  for (const e of M.enemies) {
    e.animT += dt;
    e.a += (Math.random() - 0.5) * dt;
    const vx = Math.cos(e.a) * e.spd, vy = Math.sin(e.a) * e.spd * 0.6;
    e.x += vx * dt; e.y += vy * dt;
    e.face = vx > 0 ? 1 : -1;
    if (Math.abs(e.x - M.cam.x) > VIEW.w * 0.6 || Math.abs(e.y - M.cam.y) > VIEW.h * 0.6) { e.x = M.cam.x + rand(-VIEW.w * 0.45, VIEW.w * 0.45); e.y = M.cam.y + rand(-VIEW.h * 0.45, VIEW.h * 0.45); }

}

function startGame(hero, opts) {
  AudioSys.init();
  MENU = null;
  UI.clear();
  applyQuality();
  PENDING_FINN = hero === 'finn' ? (UI.finnPick !== undefined ? UI.finnPick : finnSave().tier) : undefined;
  newRun(hero, opts);
  UI.showHud();
}
function togglePause(on) {
  if (!GAME) return;
  if (on === undefined) on = GAME.state === 'play';
  if (on && GAME.state === 'play') { GAME.state = 'pause'; INPUT.joy.active = false; UI.showPause(); }
  else if (!on && GAME.state === 'pause') { GAME.state = 'play'; UI.clear(); lastT = performance.now(); }
}
function autoPause() { if (GAME && GAME.state === 'play') togglePause(true); }
function giveUp() { if (!GAME) return; UI.clear(); GAME.state = 'play'; endRun(false); }

function frame(now) {
  requestAnimationFrame(frame);
  let dt = (now - lastT) / 1000;
  lastT = now;
  if (!(dt > 0)) dt = 0.016;
  const rawDt = dt;
  dt = Math.min(dt, 0.05);
  if (MENU) {
    updateMenuScene(dt);
    renderWorld(MENU, MENU.t);
    UI.tickPreviews(dt);
    return;
  }
  if (!GAME) return;
  if (GAME.state === 'play') updateGame(dt);
  else if (GAME.state === 'over') { updateFX(dt * 0.3); }
  renderWorld(GAME, GAME.realT);
  UI.updateHud();
  autoQuality(rawDt);
}

async function boot() {
  const msg = (t) => { const m = document.getElementById('bootMsg'); if (m) m.textContent = t; };
  const tick = () => new Promise((r) => setTimeout(r, 0));
  applyQuality();
  try { await Promise.race([Promise.all([document.fonts.load('800 20px Cinzel'), document.fonts.load('700 20px "Cormorant Garamond"')]), new Promise((r) => setTimeout(r, 1500))]); } catch (e) { /* Schriften optional */ }
  msg('Blut wird vergossen …'); await tick();
  buildParticleSprites(); buildAbilitySprites();
  msg('Die Toten erheben sich …'); await tick();
  bakeEnemies(clamp(VIEW.scale * 1.2, 1.6, 3));
  msg('Der Friedhof von Varn …'); await tick();
  buildGround(); buildPatches(); await tick();
  buildProps(); buildFog();
  msg('Die Nacht bricht herein …'); await tick();
  document.getElementById('boot').classList.add('hide');
  setTimeout(() => { const b = document.getElementById('boot'); if (b) b.remove(); }, 800);
  UI.showTitle();
  lastT = performance.now();
  requestAnimationFrame(frame);
  // erste Beruehrung schaltet Ton frei (iOS)
  const unlock = () => { AudioSys.init(); window.removeEventListener('pointerdown', unlock); };
  window.addEventListener('pointerdown', unlock);
}
resizeCanvas();
boot();
