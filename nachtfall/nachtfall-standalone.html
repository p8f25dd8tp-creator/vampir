:root {
  --bg: #07040a; --panel: #150b16; --panel2: #1f1020; --line: #5a2a36; --gold: #d8b36a; --gold2: #f3dfa6;
  --blood: #ff3a4e; --shadow: #a77bff; --qi: #4ff0cc; --text: #efe3d6; --dim: #a8969c;
  --safe-t: env(safe-area-inset-top, 0px); --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-l: env(safe-area-inset-left, 0px); --safe-r: env(safe-area-inset-right, 0px);
}
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg); color: var(--text);
  overscroll-behavior: none; touch-action: none; -webkit-user-select: none; user-select: none;
  font-family: 'Cormorant Garamond', Georgia, serif; font-weight: 600; }
body { position: fixed; inset: 0; }
canvas#game { position: absolute; inset: 0; display: block; touch-action: none; }
#ui { position: absolute; inset: 0; pointer-events: none; z-index: 5; }
#ui .screen, #ui button, #ui .interactive { pointer-events: auto; }
h1, h2, h3, .cinzel { font-family: 'Cinzel', serif; letter-spacing: .06em; }

/* ------------------------------------------------ Boot */
#boot { position: absolute; inset: 0; z-index: 50; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
  background: radial-gradient(120% 80% at 50% 30%, #2a0a18 0%, #0b0410 55%, #040206 100%); transition: opacity .6s; }
#boot.hide { opacity: 0; pointer-events: none; }
.boot-title { font-family: 'Cinzel', serif; font-weight: 800; font-size: 44px; letter-spacing: .18em;
  background: linear-gradient(180deg, #fff1d8 0%, #e0b060 45%, #8a1020 100%); -webkit-background-clip: text; background-clip: text; color: transparent;
  filter: drop-shadow(0 0 18px rgba(255,40,70,.45)); }
.boot-sub { color: var(--dim); letter-spacing: .12em; font-size: 16px; }

/* ------------------------------------------------ Grundbausteine */
.screen { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; overflow-y: auto; -webkit-overflow-scrolling: touch;
  padding: calc(16px + var(--safe-t)) calc(16px + var(--safe-r)) calc(16px + var(--safe-b)) calc(16px + var(--safe-l)); touch-action: pan-y; }
.screen.dim { background: radial-gradient(120% 90% at 50% 20%, rgba(40,6,20,.72) 0%, rgba(6,2,8,.9) 70%); backdrop-filter: blur(2px); -webkit-backdrop-filter: blur(2px); }
.btn { font-family: 'Cinzel', serif; font-weight: 700; letter-spacing: .08em; color: var(--gold2); font-size: 17px;
  background: linear-gradient(180deg, #3a1420 0%, #1e0a12 100%); border: 1.5px solid #8a5a3a; border-radius: 10px;
  padding: 13px 22px; min-height: 50px; box-shadow: 0 0 0 1px #1a0508 inset, 0 6px 18px rgba(0,0,0,.5), 0 0 22px rgba(255,40,70,.12);
  cursor: pointer; transition: transform .08s, box-shadow .2s, filter .2s; text-shadow: 0 1px 0 #000; }
.btn:active { transform: scale(.97); filter: brightness(1.25); }
.btn.primary { background: linear-gradient(180deg, #8a1020 0%, #4a0612 100%); border-color: #e0b060; color: #fff4dc;
  box-shadow: 0 0 0 1px #2a0006 inset, 0 8px 22px rgba(0,0,0,.6), 0 0 28px rgba(255,40,70,.35); }
.btn.small { font-size: 13px; padding: 8px 12px; min-height: 38px; }
.btn.ghost { background: rgba(20,8,16,.6); }
.btn[disabled] { opacity: .45; filter: grayscale(.6); }
.panel { background: linear-gradient(180deg, rgba(34,14,26,.94), rgba(14,6,12,.96)); border: 1px solid #5a3040; border-radius: 14px;
  box-shadow: 0 0 0 1px rgba(0,0,0,.6) inset, 0 12px 40px rgba(0,0,0,.6); }
.tag { display: inline-block; font-family: 'Cinzel', serif; font-size: 10.5px; letter-spacing: .1em; padding: 2px 7px; border-radius: 20px; border: 1px solid currentColor; font-weight: 700; }
.t-blood { color: var(--blood); } .t-shadow { color: var(--shadow); } .t-qi { color: var(--qi); } .t-none { color: var(--gold); }
.row { display: flex; gap: 10px; align-items: center; }

/* ------------------------------------------------ Titel */
#title { justify-content: space-between; background: linear-gradient(180deg, rgba(6,2,8,.2) 0%, rgba(6,2,8,0) 30%, rgba(6,2,8,.55) 70%, rgba(6,2,8,.92) 100%); }
.logo { margin-top: 5vh; text-align: center; }
.logo h1 { font-size: clamp(46px, 13vw, 84px); font-weight: 800; letter-spacing: .14em; line-height: 1;
  background: linear-gradient(180deg, #fff6e4 0%, #f0c070 38%, #b01830 72%, #4a0610 100%); -webkit-background-clip: text; background-clip: text; color: transparent;
  filter: drop-shadow(0 0 22px rgba(255,30,60,.5)) drop-shadow(0 4px 0 rgba(0,0,0,.8)); }
.logo .sub { margin-top: 10px; font-family: 'Cinzel', serif; font-size: 13px; letter-spacing: .5em; color: #e8d0b0; }
.logo .sub b { color: var(--blood); } .logo .sub i { color: var(--shadow); font-style: normal; } .logo .sub u { color: var(--qi); text-decoration: none; }
.menu { display: flex; flex-direction: column; gap: 12px; width: min(340px, 86vw); margin-bottom: 4vh; }
.souls { font-family: 'Cinzel', serif; color: #d8c0ff; letter-spacing: .08em; font-size: 15px; text-align: center; }
.souls b { color: #fff; }
.foot { color: #6a5a60; font-size: 12px; text-align: center; letter-spacing: .06em; }

/* ------------------------------------------------ Heldenauswahl */
#select { gap: 12px; }
#select h2 { font-size: 22px; color: var(--gold2); margin-top: 4px; }
.heroes { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; width: min(640px, 100%); }
.hcard { position: relative; border-radius: 12px; overflow: hidden; border: 1.5px solid #4a2a34; background: linear-gradient(180deg, #1c0e1a, #0c050a);
  aspect-ratio: 3 / 4.2; cursor: pointer; transition: transform .12s, border-color .2s, box-shadow .2s; }
.hcard canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.hcard .nm { position: absolute; left: 0; right: 0; bottom: 0; padding: 6px 4px 7px; text-align: center; font-family: 'Cinzel', serif; font-size: 10px; font-weight: 700;
  background: linear-gradient(0deg, rgba(0,0,0,.9), rgba(0,0,0,0)); letter-spacing: .04em; }
.hcard.sel { border-color: var(--gold); box-shadow: 0 0 0 1px #000 inset, 0 0 22px rgba(255,190,100,.35); transform: translateY(-2px); }
.hcard.locked canvas { filter: brightness(0) drop-shadow(0 0 1px #6a4a5a); }
.hcard .lock { position: absolute; top: 6px; right: 6px; font-size: 14px; }
.hdetail { width: min(560px, 100%); padding: 14px 14px 12px; }
.hdetail .ht { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.hdetail h3 { font-size: 21px; color: #fff0dc; }
.hdetail .title2 { color: var(--dim); font-style: italic; font-size: 16px; }
.hdetail .role { font-family: 'Cinzel', serif; font-size: 11px; letter-spacing: .12em; color: var(--gold); margin: 2px 0 8px; }
.hdetail p { font-size: 16px; line-height: 1.32; color: #e6d8cc; }
.hdetail .blk { margin-top: 9px; }
.hdetail .blk b.lbl { font-family: 'Cinzel', serif; font-size: 11.5px; letter-spacing: .1em; color: var(--gold2); display: block; margin-bottom: 2px; }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin: 8px 0 2px; }
.stat { background: rgba(0,0,0,.35); border: 1px solid #3a2230; border-radius: 8px; padding: 5px 6px; text-align: center; }
.stat .k { font-family: 'Cinzel', serif; font-size: 9.5px; color: var(--dim); letter-spacing: .08em; }
.stat .v { font-size: 17px; color: #fff; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.two ul { list-style: none; font-size: 15px; line-height: 1.3; }
.two .plus li::before { content: '+ '; color: #7dff9a; } .two .minus li::before { content: '− '; color: #ff7a7a; }
.builds { display: flex; flex-direction: column; gap: 4px; font-size: 15px; }
.builds span { color: var(--gold2); font-family: 'Cinzel', serif; font-size: 12px; letter-spacing: .05em; }
.selbar { display: flex; gap: 10px; width: calc(100% + 32px); position: sticky; bottom: calc(-16px - var(--safe-b)); padding: 12px 16px calc(14px + var(--safe-b)); margin: 0 -16px calc(-16px - var(--safe-b)); background: rgb(10,3,10); box-shadow: 0 -18px 18px rgb(10,3,10); z-index: 2; }
.selbar > * { max-width: 280px; }
.selbar .btn.ghost { background: #1e0a14; }
.selbar .btn { flex: 1; }
.diff { color: var(--gold); letter-spacing: 2px; }

/* ------------------------------------------------ HUD */
#hud { position: absolute; inset: 0; pointer-events: none; }
.topbar { position: absolute; left: 0; right: 0; top: 0; padding: calc(6px + var(--safe-t)) calc(10px + var(--safe-r)) 0 calc(10px + var(--safe-l)); }
.xpbar { height: 12px; border-radius: 7px; background: rgba(8,2,8,.85); border: 1px solid #6a4a3a; overflow: hidden; position: relative; box-shadow: 0 2px 8px rgba(0,0,0,.6); }
.xpfill { position: absolute; left: 0; top: 0; bottom: 0; width: 0%; background: linear-gradient(90deg, #6a0a2a, #d0183a 60%, #ff7a8a); box-shadow: 0 0 10px rgba(255,40,70,.8); transition: width .15s; }
.lvl { position: absolute; right: 6px; top: -1px; font-family: 'Cinzel', serif; font-size: 10.5px; font-weight: 800; color: #fff; text-shadow: 0 1px 2px #000; }
.hudrow { display: flex; justify-content: space-between; align-items: flex-start; margin-top: 6px; }
.hudrow > div:first-child { width: 36%; }
.slots { display: flex; flex-wrap: wrap; gap: 4px; }
.slot { width: 34px; height: 34px; border-radius: 7px; border: 1px solid #5a3a3a; background: rgba(10,4,10,.8); position: relative; overflow: hidden; }
.slot img { width: 100%; height: 100%; display: block; }
.slot .lv { position: absolute; right: 1px; bottom: 0; font-family: 'Cinzel', serif; font-size: 9.5px; font-weight: 800; color: #fff; text-shadow: 0 0 3px #000, 0 0 2px #000; }
.slot.fus { border-color: var(--gold); box-shadow: 0 0 8px rgba(255,200,100,.6); }
.slot.pas { width: 22px; height: 22px; border-radius: 50%; }
.timer { font-family: 'Cinzel', serif; font-weight: 800; font-size: 22px; color: #fff; text-shadow: 0 2px 6px #000, 0 0 12px rgba(255,60,80,.4); letter-spacing: .06em; text-align: center; }
.counts { text-align: right; font-family: 'Cinzel', serif; font-size: 13px; color: #e8dccf; text-shadow: 0 1px 3px #000; line-height: 1.35; }
.counts b { color: #fff; }
.pausebtn { pointer-events: auto; width: 40px; height: 40px; border-radius: 10px; border: 1px solid #6a4a3a; background: rgba(12,4,10,.7); color: var(--gold2); font-size: 16px; margin-top: 4px; }
.bossbar { position: absolute; left: 50%; transform: translateX(-50%); top: calc(118px + var(--safe-t)); width: min(420px, 78vw); display: none; text-align: center; }
.bossbar .bn { font-family: 'Cinzel', serif; font-size: 12.5px; font-weight: 800; letter-spacing: .12em; color: #ffd0b0; text-shadow: 0 1px 4px #000; margin-bottom: 3px; }
.bossbar .bb { height: 12px; border: 1px solid #b06a3a; background: rgba(10,2,4,.9); border-radius: 6px; overflow: hidden; }
.bossbar .bf { height: 100%; width: 100%; background: linear-gradient(90deg, #6a0a0a, #ff4a1a, #ffb040); box-shadow: 0 0 12px rgba(255,90,30,.8); transition: width .1s; }
.actions { position: absolute; right: calc(14px + var(--safe-r)); bottom: calc(18px + var(--safe-b)); display: flex; flex-direction: column; align-items: flex-end; gap: 12px; pointer-events: none; }
.abtn { pointer-events: auto; position: relative; border-radius: 50%; border: 2px solid #c9a24c; display: flex; align-items: center; justify-content: center;
  background: radial-gradient(circle at 40% 35%, #3a1624, #12060c); box-shadow: 0 6px 18px rgba(0,0,0,.6), 0 0 18px rgba(255,60,80,.25); touch-action: none; }
.abtn img { width: 62%; height: 62%; pointer-events: none; }
.abtn.ult { width: 78px; height: 78px; }
.abtn.dodge { width: 64px; height: 64px; margin-right: 44px; }
.abtn .cd { position: absolute; inset: -2px; border-radius: 50%; pointer-events: none; }
.abtn .cdt { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-family: 'Cinzel', serif; font-weight: 800; font-size: 18px; color: #fff; text-shadow: 0 0 4px #000, 0 0 2px #000; pointer-events: none; }
.abtn.ready { animation: readyPulse 1.6s infinite; }
.abtn .lbl { position: absolute; bottom: -15px; left: 50%; transform: translateX(-50%); white-space: nowrap; font-family: 'Cinzel', serif; font-size: 9.5px; letter-spacing: .08em; color: #e8d0b0; text-shadow: 0 1px 2px #000; pointer-events: none; }
@keyframes readyPulse { 0%,100% { box-shadow: 0 6px 18px rgba(0,0,0,.6), 0 0 12px rgba(255,200,120,.3); } 50% { box-shadow: 0 6px 18px rgba(0,0,0,.6), 0 0 26px rgba(255,200,120,.75); } }
.mech { position: absolute; left: calc(12px + var(--safe-l)); bottom: calc(20px + var(--safe-b)); font-family: 'Cinzel', serif; font-size: 11px; letter-spacing: .08em; color: #e8d8c8; text-shadow: 0 1px 3px #000; pointer-events: none; opacity: .92; }
.mech .mbar { width: 120px; height: 7px; border-radius: 4px; background: rgba(0,0,0,.7); border: 1px solid #5a3a3a; overflow: hidden; margin-top: 3px; }
.mech .mfill { height: 100%; width: 0%; }
.hint { position: absolute; left: 50%; bottom: calc(26% + var(--safe-b)); transform: translateX(-50%); font-size: 17px; color: #f0e0d0; text-shadow: 0 2px 6px #000; text-align: center; pointer-events: none; transition: opacity .6s; width: 90%; }
#hurt { position: absolute; inset: 0; pointer-events: none; opacity: 0; box-shadow: inset 0 0 90px 30px rgba(200,0,20,.75); transition: opacity .35s; }
#lowhp { position: absolute; inset: 0; pointer-events: none; opacity: 0; box-shadow: inset 0 0 70px 10px rgba(160,0,20,.6); animation: lowPulse 1s infinite; }
@keyframes lowPulse { 50% { box-shadow: inset 0 0 90px 24px rgba(200,0,30,.75); } }

/* ------------------------------------------------ Ansagen */
.announce { position: absolute; left: 0; right: 0; top: 24%; text-align: center; pointer-events: none; font-family: 'Cinzel', serif; font-weight: 800; letter-spacing: .1em;
  font-size: clamp(20px, 6vw, 30px); color: #fff0dc; text-shadow: 0 0 20px rgba(255,40,70,.8), 0 3px 0 #000; opacity: 0; transform: scale(.9); transition: opacity .3s, transform .3s; padding: 0 16px; }
.announce.show { opacity: 1; transform: scale(1); }
.announce.boss { color: #ffb070; text-shadow: 0 0 24px rgba(255,90,30,.9), 0 3px 0 #000; }
.announce.fusion { color: #ffe6a0; text-shadow: 0 0 24px rgba(255,200,100,.9), 0 3px 0 #000; }
.announce.qi { color: #9affe6; text-shadow: 0 0 24px rgba(80,240,200,.9), 0 3px 0 #000; }
.toast { position: absolute; left: 50%; top: calc(96px + var(--safe-t)); transform: translateX(-50%); background: rgba(14,4,10,.88); border: 1px solid #6a4a3a; border-radius: 10px; padding: 7px 14px;
  font-size: 15px; color: #f0e0d0; opacity: 0; transition: opacity .3s; pointer-events: none; white-space: nowrap; max-width: 92vw; overflow: hidden; text-overflow: ellipsis; }
.toast.show { opacity: 1; }

/* ------------------------------------------------ Stufenaufstieg */
#levelup { justify-content: center; gap: 10px; }
#levelup h2 { font-size: 26px; color: #ffe6c0; text-shadow: 0 0 18px rgba(255,60,80,.8); }
#levelup .lsub { color: var(--dim); font-size: 15px; margin-top: -6px; }
.cards { display: flex; flex-direction: column; gap: 10px; width: min(520px, 100%); }
@media (min-aspect-ratio: 5/4) { .cards { flex-direction: row; width: min(900px, 100%); } .card { flex: 1; flex-direction: column; text-align: center; } .card .ci { margin: 0 auto; } }
.card { display: flex; gap: 12px; align-items: flex-start; padding: 12px; border-radius: 14px; cursor: pointer; position: relative; text-align: left;
  background: linear-gradient(180deg, rgba(40,16,28,.97), rgba(16,6,12,.97)); border: 1.5px solid #6a3a44; color: var(--text); font: inherit;
  box-shadow: 0 10px 30px rgba(0,0,0,.6); transform: translateY(14px); opacity: 0; animation: cardIn .35s forwards; }
.card:nth-child(2) { animation-delay: .07s; } .card:nth-child(3) { animation-delay: .14s; }
@keyframes cardIn { to { transform: none; opacity: 1; } }
.card:active { filter: brightness(1.2); transform: scale(.98); }
.card .ci { width: 64px; height: 64px; flex: 0 0 64px; border-radius: 12px; border: 1px solid #5a3a3a; background: #0a0408; overflow: hidden; }
.card .ci img { width: 100%; height: 100%; }
.card .cb { flex: 1; min-width: 0; }
.card .cn { font-family: 'Cinzel', serif; font-weight: 800; font-size: 17px; color: #fff0dc; letter-spacing: .04em; }
.card .cm { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; margin: 4px 0 5px; }
.card .cd { font-size: 16.5px; line-height: 1.28; color: #eadccf; }
.card .stars { color: #e0b060; letter-spacing: 2px; font-size: 13px; }
.card .stars i { color: #4a3a3a; font-style: normal; }
.card .new { color: #7dff9a; border-color: #7dff9a; }
.card.fusion { border: 2px solid #e0b060; background: linear-gradient(180deg, rgba(70,40,14,.97), rgba(26,10,8,.97)); box-shadow: 0 0 30px rgba(255,190,90,.45), 0 10px 30px rgba(0,0,0,.6); }
.card.fusion::before { content: ''; position: absolute; inset: -2px; border-radius: 15px; padding: 2px; background: conic-gradient(from var(--a, 0deg), #ff3a4e, #a77bff, #4ff0cc, #ffe6a0, #ff3a4e);
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; animation: spin 3s linear infinite; }
@property --a { syntax: '<angle>'; initial-value: 0deg; inherits: false; }
@keyframes spin { to { --a: 360deg; } }
.card .next { font-size: 13.5px; color: var(--dim); margin-top: 4px; font-style: italic; }
.lvbar { display: flex; gap: 10px; }

/* ------------------------------------------------ Pause / Ende / Altar / Chronik */
.box { width: min(560px, 100%); padding: 16px; margin: auto 0; }
.box h2 { font-size: 24px; color: #ffe6c0; text-align: center; margin-bottom: 8px; }
.box .btns { display: flex; flex-direction: column; gap: 10px; margin-top: 14px; }
.buildlist { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
.bl { display: flex; gap: 10px; align-items: center; font-size: 15.5px; }
.bl img { width: 34px; height: 34px; border-radius: 8px; border: 1px solid #5a3a3a; flex: 0 0 34px; }
.bl .bn2 { font-family: 'Cinzel', serif; font-size: 13px; color: #fff0dc; }
.kv { display: grid; grid-template-columns: 1fr auto; gap: 3px 12px; font-size: 16px; margin: 8px 0; }
.kv span:nth-child(even) { color: #fff; text-align: right; font-family: 'Cinzel', serif; font-size: 14px; }
.dmgrow { display: grid; grid-template-columns: 110px 1fr 56px; gap: 8px; align-items: center; font-size: 14.5px; margin: 3px 0; }
.dmgrow .bar { height: 8px; border-radius: 4px; background: rgba(0,0,0,.6); overflow: hidden; }
.dmgrow .bar i { display: block; height: 100%; }
.dmgrow .n { text-align: right; font-family: 'Cinzel', serif; font-size: 12px; }
.bigres { font-family: 'Cinzel', serif; font-weight: 800; font-size: clamp(30px, 9vw, 46px); text-align: center; letter-spacing: .1em; }
.bigres.win { color: #ffe6a0; text-shadow: 0 0 30px rgba(255,200,100,.8); }
.bigres.lose { color: #ff5a6a; text-shadow: 0 0 30px rgba(255,30,60,.8); }
.meta { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }
.mrow { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 10px; background: rgba(0,0,0,.3); border: 1px solid #3a2230; }
.mrow .mt { flex: 1; }
.mrow .mt b { font-family: 'Cinzel', serif; font-size: 13.5px; color: #fff0dc; display: block; }
.mrow .mt small { color: var(--dim); font-size: 14px; }
.pips { color: #e0b060; letter-spacing: 2px; font-size: 12px; }
.codex h3 { font-size: 15px; color: var(--gold2); margin: 12px 0 5px; }
.codex p, .codex li { font-size: 15.5px; line-height: 1.3; color: #e6d8cc; }
.codex ul { list-style: none; display: flex; flex-direction: column; gap: 5px; }
.codex li b { font-family: 'Cinzel', serif; font-size: 12.5px; }
.setrow { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #2a1822; font-size: 16px; gap: 10px; }
.setrow input[type=range] { width: 50%; accent-color: #d0183a; }
.toggle { width: 52px; height: 30px; border-radius: 16px; background: #2a1820; border: 1px solid #6a4a3a; position: relative; flex: 0 0 52px; }
.toggle::after { content: ''; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #8a7a70; transition: left .15s, background .15s; }
.toggle.on { background: #5a0a1a; } .toggle.on::after { left: 25px; background: #ffd0a0; }
.hidden { display: none !important; }

.evo { position: absolute; left: 50%; top: calc(150px + var(--safe-t)); transform: translateX(-50%); width: min(360px, 88vw); text-align: center; pointer-events: none;
  background: radial-gradient(ellipse at 50% 0%, rgba(80,20,30,.92), rgba(10,4,10,.9)); border: 1px solid #c9a24c; border-radius: 14px; padding: 12px 14px;
  box-shadow: 0 0 40px rgba(255,190,100,.35); animation: evoIn .45s ease-out; transition: opacity .6s, transform .6s; }
.evo.out { opacity: 0; transform: translateX(-50%) translateY(-12px); }
@keyframes evoIn { from { opacity: 0; transform: translateX(-50%) scale(.8); } to { opacity: 1; transform: translateX(-50%) scale(1); } }
.evo .evk { font-family: 'Cinzel', serif; font-size: 11px; letter-spacing: .4em; color: var(--gold2); }
.evo .evn { font-family: 'Cinzel', serif; font-weight: 800; font-size: 21px; letter-spacing: .06em; text-shadow: 0 0 18px currentColor; margin: 2px 0 4px; }
.evo .evd { font-size: 15.5px; color: #eadccf; line-height: 1.3; }
.evo .evd.small { font-size: 13.5px; color: var(--dim); margin-top: 6px; }
.evo .evg { display: flex; justify-content: center; gap: 8px; margin-top: 8px; }
.evo .evg img { width: 34px; height: 34px; border-radius: 9px; border: 1px solid #c9a24c; }

.evo { padding: 8px 12px; }
.evo .evd { font-size: 14.5px; }
.mech #mechname { max-width: 52vw; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* ------------------------------------------------ System-Fenster (Story) */
.syswin { background: linear-gradient(180deg, rgba(8,26,52,.93), rgba(4,12,28,.95)); border: 1px solid #4aa8ff; border-radius: 6px; padding: 12px 14px;
  box-shadow: 0 0 0 1px rgba(0,0,0,.6) inset, 0 0 24px rgba(60,160,255,.28); color: #d8ecff; }

<script>
/* ---- src/00-core.js ---- */
'use strict';
/* ==========================================================================
   NACHTFALL — Kern: Mathe, Zufall, Speicherstand, Audio, Eingabe, Canvas
   ========================================================================== */

const TAU = Math.PI * 2;
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(a + Math.random() * (b - a + 1));
const pick = (arr) => arr[(Math.random() * arr.length) | 0];
const dist2 = (ax, ay, bx, by) => { const dx = ax - bx, dy = ay - by; return dx * dx + dy * dy; };
const easeOut = (t) => 1 - (1 - t) * (1 - t);
const easeIn = (t) => t * t;
const easeInOut = (t) => (t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2);
const smooth = (t) => t * t * (3 - 2 * t);
function angDiff(a, b) { let d = (b - a) % TAU; if (d > Math.PI) d -= TAU; if (d < -Math.PI) d += TAU; return d; }

/* deterministischer Zufall (fuer Welt-Chunks und Texturen) */
function mulberry(seed) {
  let a = seed >>> 0;
  return function () {
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function hash2(x, y, s) {
  let h = (x * 374761393 + y * 668265263 + (s || 0) * 982451653) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return (h ^ (h >>> 16)) >>> 0;
}

/* Farbhilfen */
function hexRgb(h) {
  const n = parseInt(h.slice(1), 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}
function rgba(h, a) { const c = hexRgb(h); return `rgba(${c[0]},${c[1]},${c[2]},${a})`; }
function shade(h, f) {
  const c = hexRgb(h);
  const m = (v) => clamp(Math.round(f >= 0 ? v + (255 - v) * f : v * (1 + f)), 0, 255);
  return `rgb(${m(c[0])},${m(c[1])},${m(c[2])})`;
}

/* ------------------------------------------------------------ Speicherstand */
const SAVE_KEY = 'nachtfall.save.v1';
const DEFAULT_SAVE = {
  souls: 0,
  totalSouls: 0,
  unlocked: { vorian: true },
  meta: {},            // dauerhafte Verbesserungen: id -> Stufe
  stats: { runs: 0, kills: 0, bestTime: 0, bossKills: 0, maxLevel: 0, fusions: 0 },
  heroStats: {},       // heroId -> { runs, best, wins }
  seenFusions: {},
  finn: { tier: 0, essence: 0, wins: 0, runs: 0 },
  settings: { sfx: 0.8, music: 0.5, shake: 1, quality: 'auto', testUnlock: true, dmgNumbers: true }
};
let SAVE = loadSave();
function loadSave() {
  let s = null;
  try { s = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null'); } catch (e) { s = null; }
  const base = JSON.parse(JSON.stringify(DEFAULT_SAVE));
  if (!s || typeof s !== 'object') return base;
  for (const k in base) {
    if (s[k] === undefined) s[k] = base[k];
    else if (typeof base[k] === 'object' && !Array.isArray(base[k])) {
      for (const kk in base[k]) if (s[k][kk] === undefined) s[k][kk] = base[k][kk];
    }
  }
  return s;
}
function writeSave() {
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(SAVE)); } catch (e) { /* privat/gesperrt: dann eben nur fuer diese Sitzung */ }
}

/* ------------------------------------------------------------------ Audio */
const AudioSys = (() => {
  let ac = null, master = null, sfxBus = null, musicBus = null, comp = null;
  let noiseBuf = null;
  const last = {};
  function init() {
    if (ac) { if (ac.state === 'suspended') ac.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    ac = new AC();
    comp = ac.createDynamicsCompressor();
    comp.threshold.value = -16; comp.knee.value = 10; comp.ratio.value = 5;
    master = ac.createGain(); master.gain.value = 0.9;
    sfxBus = ac.createGain(); musicBus = ac.createGain();
    sfxBus.connect(comp); musicBus.connect(master); comp.connect(master); master.connect(ac.destination);
    applyVolumes();
    noiseBuf = ac.createBuffer(1, ac.sampleRate * 1.5, ac.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  function applyVolumes() {
    if (!ac) return;
    sfxBus.gain.value = SAVE.settings.sfx * 0.55;
    musicBus.gain.value = SAVE.settings.music * 0.35;
  }
  function env(g, t, a, peak, d) {
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(peak, t + a);
    g.gain.exponentialRampToValueAtTime(0.0001, t + a + d);
  }
  function tone(type, f0, f1, dur, vol, when, bus) {
    const t = ac.currentTime + (when || 0);
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(f0, t);
    if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
    env(g, t, 0.006, vol, dur);
    o.connect(g); g.connect(bus || sfxBus); o.start(t); o.stop(t + dur + 0.05);
  }
  function noise(dur, vol, fType, f0, f1, q, when) {
    const t = ac.currentTime + (when || 0);
    const s = ac.createBufferSource(); s.buffer = noiseBuf;
    const f = ac.createBiquadFilter(); f.type = fType; f.Q.value = q || 1;
    f.frequency.setValueAtTime(f0, t);
    if (f1 && f1 !== f0) f.frequency.exponentialRampToValueAtTime(f1, t + dur);
    const g = ac.createGain(); env(g, t, 0.004, vol, dur);
    s.connect(f); f.connect(g); g.connect(sfxBus);
    s.start(t, Math.random() * 0.5); s.stop(t + dur + 0.05);
  }
  /* Soundbibliothek: alles synthetisch, keine Dateien */
  const S = {
    nova() { tone('sine', 120, 38, 0.45, 0.7); noise(0.35, 0.5, 'lowpass', 1400, 200, 0.8); tone('triangle', 260, 90, 0.18, 0.25); },
    bigNova() { tone('sine', 90, 28, 0.9, 0.9); noise(0.8, 0.6, 'lowpass', 900, 90, 0.7); tone('sawtooth', 70, 35, 0.6, 0.15); },
    whip() { noise(0.2, 0.45, 'bandpass', 900, 3500, 2.5); tone('triangle', 420, 160, 0.12, 0.12); },
    sickle() { noise(0.08, 0.12, 'highpass', 4000, 6000, 1); },
    flame() { noise(0.25, 0.22, 'bandpass', 500, 1600, 1.2); tone('sine', 220, 440, 0.2, 0.06); },
    palm() { tone('sine', 180, 60, 0.3, 0.6); noise(0.18, 0.35, 'lowpass', 2500, 300, 1); tone('sine', 880, 870, 0.5, 0.05, 0.02); tone('sine', 1320, 1310, 0.4, 0.03, 0.02); },
    chain() { noise(0.12, 0.25, 'highpass', 3000, 8000, 3); tone('square', 1200, 600, 0.08, 0.05); },
    rift() { tone('sine', 60, 40, 0.8, 0.3); noise(0.7, 0.18, 'lowpass', 400, 120, 2); },
    hit() { noise(0.05, 0.16, 'bandpass', 1800, 900, 1.5); },
    crit() { noise(0.07, 0.25, 'bandpass', 2400, 900, 2); tone('square', 900, 300, 0.07, 0.06); },
    kill() { noise(0.12, 0.18, 'lowpass', 1200, 200, 1); tone('sine', 140, 60, 0.12, 0.15); },
    splat() { noise(0.16, 0.3, 'lowpass', 900, 150, 0.8); tone('sine', 90, 45, 0.18, 0.3); },
    gem(p) { tone('sine', 900 + p * 60, 1300 + p * 60, 0.09, 0.08); },
    heal() { tone('sine', 520, 780, 0.35, 0.12); tone('sine', 780, 1040, 0.35, 0.08, 0.08); },
    hurt() { tone('sawtooth', 160, 70, 0.22, 0.3); noise(0.15, 0.3, 'lowpass', 900, 200, 1); },
    dodge() { noise(0.22, 0.3, 'bandpass', 600, 2400, 1.5); },
    shadowstep() { noise(0.3, 0.3, 'bandpass', 300, 2600, 3); tone('sine', 300, 900, 0.25, 0.08); },
    level() { [0, 4, 7, 12].forEach((s, i) => tone('triangle', 330 * Math.pow(2, s / 12), 330 * Math.pow(2, s / 12), 0.35, 0.12, i * 0.07)); },
    card() { tone('sine', 660, 990, 0.12, 0.1); },
    fusion() { [0, 3, 7, 10, 15].forEach((s, i) => { tone('sawtooth', 220 * Math.pow(2, s / 12), 220 * Math.pow(2, s / 12), 0.8, 0.05, i * 0.09); tone('sine', 440 * Math.pow(2, s / 12), 440 * Math.pow(2, s / 12), 1, 0.08, i * 0.09); }); tone('sine', 60, 30, 1.4, 0.6); },
    reaction(k) { const f = { b: 300, s: 200, q: 700, t: 500 }[k] || 400; tone('triangle', f, f * 2, 0.18, 0.12); noise(0.2, 0.2, 'bandpass', f * 3, f, 2); },
    ult() { tone('sawtooth', 55, 110, 0.8, 0.25); tone('sine', 110, 220, 0.8, 0.3); noise(0.9, 0.4, 'lowpass', 300, 3000, 1); },
    bell() { [1, 2.76, 5.4, 8.93].forEach((m, i) => tone('sine', 98 * m, 98 * m * 0.995, 2.4 - i * 0.4, 0.28 / (i + 1))); },
    roar() { tone('sawtooth', 90, 45, 1.1, 0.3); noise(1.1, 0.4, 'lowpass', 700, 150, 3); },
    stomp() { tone('sine', 70, 25, 0.6, 0.9); noise(0.4, 0.5, 'lowpass', 500, 60, 0.7); },
    enemyShot() { tone('sine', 500, 800, 0.15, 0.05); },
    click() { tone('triangle', 800, 600, 0.05, 0.08); },
    win() { [0, 4, 7, 12, 16, 19, 24].forEach((s, i) => tone('triangle', 262 * Math.pow(2, s / 12), 262 * Math.pow(2, s / 12), 0.9, 0.1, i * 0.12)); },
    lose() { [0, -3, -7, -12].forEach((s, i) => tone('sawtooth', 220 * Math.pow(2, s / 12), 220 * Math.pow(2, s / 12), 0.9, 0.06, i * 0.3)); }
  };
  function play(name, arg, minGap) {
    if (!ac || ac.state !== 'running' || SAVE.settings.sfx <= 0) return;
    const now = ac.currentTime, gap = minGap === undefined ? 0.035 : minGap;
    if (last[name] && now - last[name] < gap) return;
    last[name] = now;
    try { S[name](arg); } catch (e) { /* ignorieren */ }
  }
  /* sehr einfache prozedurale Ambient-Musik: tiefe Flaechen in Moll + ferne Glocke */
  let musicOn = false, musicTimer = 0, chordIdx = 0;
  const CHORDS = [[0, 3, 7], [-4, 0, 3], [-2, 2, 5], [-5, -1, 2]];
  function musicTick(dt, intensity) {
    if (!ac || !musicOn || SAVE.settings.music <= 0) return;
    musicTimer -= dt;
    if (musicTimer > 0) return;
    musicTimer = 6;
    const base = 55, ch = CHORDS[chordIdx++ % CHORDS.length];
    const t = ac.currentTime;
    ch.forEach((s) => {
      const f = base * 2 * Math.pow(2, s / 12);
      [f, f * 1.005].forEach((ff) => {
        const o = ac.createOscillator(), g = ac.createGain(), fl = ac.createBiquadFilter();
        o.type = 'sawtooth'; o.frequency.value = ff; fl.type = 'lowpass'; fl.frequency.value = 380 + intensity * 500;
        g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(0.05, t + 2); g.gain.linearRampToValueAtTime(0.0001, t + 6.4);
        o.connect(fl); fl.connect(g); g.connect(musicBus); o.start(t); o.stop(t + 6.5);
      });
    });
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = 'sine'; o.frequency.value = base; g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(0.14, t + 1); g.gain.linearRampToValueAtTime(0.0001, t + 6.2);
    o.connect(g); g.connect(musicBus); o.start(t); o.stop(t + 6.3);
    if (intensity > 0.3) { // Herzschlag-Trommel
      for (let i = 0; i < 6; i++) {
        const tt = t + i * 1;
        const k = ac.createOscillator(), kg = ac.createGain();
        k.frequency.setValueAtTime(70, tt); k.frequency.exponentialRampToValueAtTime(35, tt + 0.2);
        kg.gain.setValueAtTime(0.0001, tt); kg.gain.exponentialRampToValueAtTime(0.18 * intensity, tt + 0.01); kg.gain.exponentialRampToValueAtTime(0.0001, tt + 0.25);
        k.connect(kg); kg.connect(musicBus); k.start(tt); k.stop(tt + 0.3);
        const k2 = ac.createOscillator(), kg2 = ac.createGain(), tt2 = tt + 0.22;
        k2.frequency.setValueAtTime(60, tt2); k2.frequency.exponentialRampToValueAtTime(30, tt2 + 0.2);
        kg2.gain.setValueAtTime(0.0001, tt2); kg2.gain.exponentialRampToValueAtTime(0.11 * intensity, tt2 + 0.01); kg2.gain.exponentialRampToValueAtTime(0.0001, tt2 + 0.22);
        k2.connect(kg2); kg2.connect(musicBus); k2.start(tt2); k2.stop(tt2 + 0.3);
      }
    }
  }
  return {
    init, play, applyVolumes, musicTick,
    startMusic() { musicOn = true; musicTimer = 0; },
    stopMusic() { musicOn = false; },
    get ready() { return !!ac; }
  };
})();
const sfx = (n, a, g) => AudioSys.play(n, a, g);
function haptic(ms) { try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) { /* iOS kann das nicht */ } }

/* ------------------------------------------------------------ Canvas-Setup */
const cv = document.getElementById('game');
const ctx = cv.getContext('2d', { alpha: false });
const VIEW = { cssW: 0, cssH: 0, dpr: 1, zoom: 1, w: 0, h: 0, scale: 1, dprCap: 2 };
function resizeCanvas() {
  VIEW.cssW = window.innerWidth; VIEW.cssH = window.innerHeight;
  VIEW.dpr = Math.min(window.devicePixelRatio || 1, VIEW.dprCap);
  cv.width = Math.round(VIEW.cssW * VIEW.dpr);
  cv.height = Math.round(VIEW.cssH * VIEW.dpr);
  cv.style.width = VIEW.cssW + 'px'; cv.style.height = VIEW.cssH + 'px';
  // gleiche sichtbare Weltflaeche auf jedem Geraet (~480 x 930 Einheiten)
  VIEW.zoom = Math.sqrt((VIEW.cssW * VIEW.cssH) / (480 * 930));
  VIEW.zoom = clamp(VIEW.zoom, 0.45, 2.4);
  VIEW.w = VIEW.cssW / VIEW.zoom; VIEW.h = VIEW.cssH / VIEW.zoom;
  VIEW.scale = VIEW.zoom * VIEW.dpr;
  if (typeof onResize === 'function') onResize();
}
window.addEventListener('resize', resizeCanvas);
window.addEventListener('orientationchange', () => setTimeout(resizeCanvas, 200));

/* ------------------------------------------------------------------ Eingabe */
const INPUT = {
  // virtueller Joystick (schwebend: erscheint dort, wo der Daumen aufsetzt)
  joy: { active: false, id: -1, ox: 0, oy: 0, x: 0, y: 0, dx: 0, dy: 0, mag: 0 },
  keys: {},
  dodgePressed: false, ultPressed: false,
  moveX: 0, moveY: 0
};
const JOY_R = 58; // CSS-Pixel
function joyStart(e) {
  if (!GAME || GAME.state !== 'play') return;
  AudioSys.init();
  const j = INPUT.joy;
  if (j.active) return;
  j.active = true; j.id = e.pointerId; j.ox = e.clientX; j.oy = e.clientY; j.x = j.ox; j.y = j.oy; j.dx = j.dy = j.mag = 0;
  try { cv.setPointerCapture(e.pointerId); } catch (er) { /* egal */ }
  e.preventDefault();
}
function joyMove(e) {
  const j = INPUT.joy;
  if (!j.active || e.pointerId !== j.id) return;
  j.x = e.clientX; j.y = e.clientY;
  let dx = j.x - j.ox, dy = j.y - j.oy;
  const d = Math.hypot(dx, dy);
  if (d > JOY_R) { // Joystick zieht mit dem Daumen mit — nie "abgerissen"
    j.ox += (dx / d) * (d - JOY_R); j.oy += (dy / d) * (d - JOY_R);
    dx = j.x - j.ox; dy = j.y - j.oy;
  }
  const dd = Math.hypot(dx, dy);
  const dead = 6;
  if (dd < dead) { j.dx = j.dy = j.mag = 0; } else {
    j.dx = dx / dd; j.dy = dy / dd;
    j.mag = clamp((dd - dead) / (JOY_R * 0.62 - dead), 0, 1);
  }
  e.preventDefault();
}
function joyEnd(e) {
  const j = INPUT.joy;
  if (!j.active || e.pointerId !== j.id) return;
  j.active = false; j.dx = j.dy = j.mag = 0; j.id = -1;
}
cv.addEventListener('pointerdown', joyStart, { passive: false });
cv.addEventListener('pointermove', joyMove, { passive: false });
cv.addEventListener('pointerup', joyEnd);
cv.addEventListener('pointercancel', joyEnd);
cv.addEventListener('lostpointercapture', joyEnd);
document.addEventListener('contextmenu', (e) => e.preventDefault());
document.addEventListener('gesturestart', (e) => e.preventDefault());
window.addEventListener('keydown', (e) => {
  INPUT.keys[e.code] = true;
  if (e.code === 'Space' || e.code === 'ShiftLeft') INPUT.dodgePressed = true;
  if (e.code === 'KeyE' || e.code === 'KeyQ') INPUT.ultPressed = true;
  if (e.code === 'Escape' && typeof togglePause === 'function') togglePause();
  AudioSys.init();
});

function tileNoise(size, cells, seed, octaves) {
  const out = new Float32Array(size * size);
  const rnd = mulberry(seed);
  let amp = 1, tot = 0, c = cells;
  for (let o = 0; o < (octaves || 4); o++) {
    const grid = new Float32Array(c * c);
    for (let i = 0; i < grid.length; i++) grid[i] = rnd();
    for (let y = 0; y < size; y++) {
      const gy = (y / size) * c, y0 = Math.floor(gy), fy = smooth(gy - y0);
      const y1 = (y0 + 1) % c;
      for (let x = 0; x < size; x++) {
        const gx = (x / size) * c, x0 = Math.floor(gx), fx = smooth(gx - x0);
        const x1 = (x0 + 1) % c;
        const a = grid[y0 * c + x0], b = grid[y0 * c + x1], cc = grid[y1 * c + x0], d = grid[y1 * c + x1];

'use strict';
/* ==========================================================================
   HELDEN — vier gemalte, skelettanimierte Figuren.
   Jede Figur wird pro Frame aus ihrer Pose neu gemalt (Umhang, Haare,
   Schal und Aufwertungs-Leuchten reagieren live auf Bewegung und Build).
   Koordinaten: Blick nach rechts, Fuesse bei y = 0, Einheit = Welt-Einheit.
   ========================================================================== */

/* ---------------------------------------------------------------- Pose */
function makePose(spec, st) {
  const run = st.run || 0, ph = st.phase || 0, t = st.t || 0;
  const cast = st.cast || 0, hurt = st.hurt || 0, dead = st.dead || 0, dodge = st.dodge || 0;
  const rooted = st.rooted || 0;
  const P = { t, run, ph, cast, hurt, dead, dodge, rooted, aim: st.aim || 0, spec };
  const breathe = Math.sin(t * 2.3) * 0.5 * (1 - run);
  const kneel = smooth(clamp(dead * 1.6, 0, 1));
  const crouch = (spec.crouch || 0) + rooted * 4 + dodge * 5;
  const stride = spec.stride * run * (1 - kneel);
  const lift = spec.lift * run * (1 - kneel);
  const bob = -(Math.abs(Math.cos(ph))) * 1.6 * run;
  P.hipX = 0;
  P.hipY = spec.hipY + bob + crouch + kneel * spec.legL * 0.75 + breathe * 0.3;
  P.lean = (spec.lean || 0) + 0.16 * run - hurt * 0.32 + cast * 0.06 + kneel * 0.45 + dodge * 0.35 - rooted * 0.05;
  const tor = spec.torso;
  P.neckX = P.hipX + Math.sin(P.lean) * tor;
  P.neckY = P.hipY - Math.cos(P.lean) * tor + breathe;
  const hl = P.lean * 0.7 - hurt * 0.35 + kneel * 0.3;
  P.headX = P.neckX + Math.sin(hl) * spec.headOff;
  P.headY = P.neckY - Math.cos(hl) * spec.headOff;
  P.headA = hl;
  // Schultern (vorne / hinten, leichte 3/4-Sicht)
  const sa = P.lean;
  const sx = Math.cos(sa), sy = Math.sin(sa);
  const shDrop = spec.shoulderDrop || 3;
  P.shF = [P.neckX + sx * spec.shoulderW * 0.5 - sy * shDrop, P.neckY + sy * spec.shoulderW * 0.5 + sx * shDrop];
  P.shB = [P.neckX - sx * spec.shoulderW * 0.5 - sy * shDrop, P.neckY - sy * spec.shoulderW * 0.5 + sx * shDrop];
  // Beine
  const legs = [];
  for (let i = 0; i < 2; i++) {
    const p = ph + i * Math.PI;
    const hx = P.hipX + (i === 0 ? 2 : -2) * (spec.hipSpread || 1);
    let fx = hx + Math.sin(p) * stride + (i === 0 ? 1.5 : -1.5) * (spec.stance || 1);
    let fy = -Math.max(0, Math.cos(p)) * lift;
    if (rooted > 0) { fx = lerp(fx, hx + (i === 0 ? 7 : -7), rooted); fy = lerp(fy, 0, rooted); }
    if (dodge > 0) { fx = lerp(fx, hx + (i === 0 ? 6 : -9), dodge); fy = lerp(fy, i === 0 ? 0 : -2, dodge); }
    if (kneel > 0) { fx = lerp(fx, hx + (i === 0 ? 7 : -9), kneel); fy = lerp(fy, 0, kneel); }
    const k = ik(hx, P.hipY, fx, fy, spec.legL, spec.legL2 || spec.legL, -1);
    legs.push({ hx, hy: P.hipY, kx: k[0], ky: k[1], fx: k[2], fy: k[3], lift: -fy });
  }
  P.legF = legs[0]; P.legB = legs[1];

  const arms = [];
  for (let i = 0; i < 2; i++) {
    const sh = i === 0 ? P.shF : P.shB;
    const p = ph + i * Math.PI;
    const swing = -Math.sin(p) * 0.75 * run;
    let ang = Math.PI / 2 + 0.15 + swing - P.lean * 0.4 + (spec.armRest || 0) * (i === 0 ? 1 : 0.6);
    const reach = (spec.armL + spec.armL2) * 0.94;

    if (st.guard !== undefined && i === 0) { hx = lerp(hx, sh[0] + 7, st.guard); hy = lerp(hy, sh[1] + 4, st.guard); }

      hx = lerp(hx, cx, cast); hy = lerp(hy, cy, cast);
    }
    if (rooted > 0 && !cast) { // Meditations-/Kampfhaltung: Handflaechen vor der Brust
      const cx = sh[0] + (i === 0 ? 8 : 5), cy = sh[1] + (i === 0 ? 3 : 8);
      hx = lerp(hx, cx, rooted); hy = lerp(hy, cy, rooted);
    }
    if (dodge > 0) { hx = lerp(hx, sh[0] - 8, dodge * 0.8); hy = lerp(hy, sh[1] + 4, dodge * 0.8); }
    if (hurt > 0) { hx = lerp(hx, sh[0] - 6, hurt * 0.6); hy = lerp(hy, sh[1] - 2, hurt * 0.6); }
    if (kneel > 0) { hx = lerp(hx, sh[0] + (i === 0 ? 5 : -2), kneel); hy = lerp(hy, sh[1] + reach * 0.95, kneel); }
    const e = ik(sh[0], sh[1], hx, hy, spec.armL, spec.armL2, 1);
    arms.push({ sx: sh[0], sy: sh[1], ex: e[0], ey: e[1], hx: e[2], hy: e[3] });
  }
  P.armF = arms[0]; P.armB = arms[1];
  return P;
}

// Umhang / Band-Kurve, die im Lauf nach hinten weht (deterministisch)
function flowCurve(ax, ay, len, n, flow, t, seed, droop, lift) {
  const pts = [[ax, ay]];
  let x = ax, y = ay;
  const seg = len / n;
  for (let i = 1; i <= n; i++) {
    const s = i / n;
    const wave = Math.sin(t * (6 + flow * 5) - s * 5 + seed) * (0.18 + flow * 0.32) * s;
    const back = lerp(droop === undefined ? 0.12 : droop, 1.25 + (lift || 0), flow) * Math.pow(s, 0.7);
    const a = Math.PI / 2 + back + wave;
    x += Math.cos(a) * seg; y += Math.sin(a) * seg;
    pts.push([x, y]);
  }
  return pts;
}

/* ============================================================ VORIAN

   gepanzerte Klauenhand. Adern auf der Ruestung gluehen mit jeder Blutstufe. */
const SPEC_VORIAN = { hipY: -25, torso: 22, headOff: 8.5, shoulderW: 13, legL: 12.5, legL2: 12.5, armL: 11, armL2: 11, stride: 7.5, lift: 4.5, lean: 0.04, shoulderDrop: 3.5, hipSpread: 1.2, armRest: 0.15 };
function drawVorian(g, P, H) {

  for (let i = cpB.length - 1; i >= 0; i--) {

    tail.push([cpB[i][0] + 3 + i * 0.35 + jag, cpB[i][1]]);

  g.lineTo(P.hipX - 3 - sw, P.hipY + 15.5);
  g.quadraticCurveTo(P.hipX - 8 - sw, P.hipY + 8, P.hipX - 7, P.hipY - 2);
  paint(g, lg(g, 0, P.hipY, 0, P.hipY + 15, [0, C.red, 1, C.redD]), 'rgba(0,0,0,0.5)', 0.8);

  g.beginPath(); g.moveTo(P.hipX + 5 + sw * 1.5, P.hipY + 14.2); g.lineTo(P.hipX + 1 + sw, P.hipY + 12.3); g.lineTo(P.hipX - 3 - sw, P.hipY + 14.7); g.stroke();

  for (let k = 1; k <= 3; k++) { g.beginPath(); g.moveTo(-7.5, -k * 4.2); g.quadraticCurveTo(0, -k * 4.2 + 2, 8.5, -k * 4.2 - 0.5); g.stroke(); }

  g.moveTo(1.5, -T * 0.7); g.lineTo(-3.5, -T * 0.62); g.moveTo(1.5, -T * 0.7); g.lineTo(6.5, -T * 0.66);
  g.stroke();
  glowDot(g, 1.5, -T * 0.6, 4 + glow * 4, C.redL, ga * pulse);

  // Guertel mit Schaedelschnalle
  g.fillStyle = '#1a1318'; g.fillRect(-7, -2.8, 14.5, 3);
  g.fillStyle = C.skin; g.beginPath(); g.ellipse(2.5, -1.3, 2.3, 2, 0, 0, TAU); g.fill();
  g.fillStyle = '#1a0a10'; g.fillRect(1.4, -1.8, 0.8, 0.8); g.fillRect(2.9, -1.8, 0.8, 0.8);
  g.restore();

  // --- vorderes Bein -------------------------------------------------
  drawArmoredLeg(g, P.legF, C, false);
  // --- Kopf -----------------------------------------------------------
  // hoher Stehkragen hinter dem Kopf
  g.save(); g.translate(P.neckX, P.neckY); g.rotate(P.lean * 0.6);
  g.beginPath();
  g.moveTo(-3, 2); g.lineTo(-11, -13); g.lineTo(-7.5, -9.5); g.lineTo(-7, -16); g.lineTo(-3.5, -9); g.lineTo(-1, -12.5); g.lineTo(2, 1.5); g.closePath();
  paint(g, lg(g, -8, -14, 0, 2, [0, '#3a0d18', 1, '#14050a']), 'rgba(0,0,0,0.6)', 0.7);
  g.strokeStyle = rgba(C.red, 0.7); g.lineWidth = 0.7;
  g.beginPath(); g.moveTo(-10, -12); g.lineTo(-3, 1); g.stroke();
  g.restore();
  drawVorianHead(g, P, C, H);
  // --- Schulterplatte vorne -------------------------------------------
  drawPauldron(g, P.shF[0], P.shF[1], P.lean, C, 1);
  // --- vorderer Arm ---------------------------------------------------
  drawClawArm(g, P.armF, C, false, P.cast);
}
function drawArmoredLeg(g, L, C, back) {
  const dk = back ? -0.35 : 0;
  // Oberschenkel
  limb(g, L.hx, L.hy, L.kx, L.ky, 3.4, 2.8);
  paint(g, lg(g, L.hx - 3, L.hy, L.hx + 3, L.ky, [0, shade(C.armor, dk + 0.1), 1, shade(C.armorD, dk)]), 'rgba(0,0,0,0.6)', 0.7);
  // Unterschenkel / Beinschiene
  limb(g, L.kx, L.ky, L.fx, L.fy - 2, 2.9, 2.3);
  paint(g, lg(g, L.kx - 3, L.ky, L.kx + 3, L.fy, [0, shade(C.armorL, dk), 0.5, shade(C.armor, dk), 1, shade(C.armorD, dk)]), 'rgba(0,0,0,0.6)', 0.7);
  // Kniekachel
  g.beginPath(); g.ellipse(L.kx + 0.8, L.ky, 2.8, 3.2, 0, 0, TAU);
  paint(g, rg(g, L.kx, L.ky - 1, 0, 3.4, [0, shade(C.armorL, dk + 0.15), 1, shade(C.armorD, dk)]), 'rgba(0,0,0,0.7)', 0.6);
  g.fillStyle = shade(C.red, dk); g.beginPath(); g.moveTo(L.kx + 2.5, L.ky - 1); g.lineTo(L.kx + 5, L.ky - 0.3); g.lineTo(L.kx + 2.5, L.ky + 1); g.fill();
  // Stiefel (spitz)
  g.beginPath();
  g.moveTo(L.fx - 3, L.fy - 3.5); g.lineTo(L.fx + 2, L.fy - 3.8); g.quadraticCurveTo(L.fx + 5, L.fy - 1.5, L.fx + 7.5, L.fy + 0.2);
  g.lineTo(L.fx - 3.5, L.fy + 0.2); g.closePath();
  paint(g, shade('#1c161f', dk), 'rgba(0,0,0,0.8)', 0.6);
}
function drawClawArm(g, A, C, back, cast) {
  const dk = back ? -0.38 : 0;
  limb(g, A.sx, A.sy, A.ex, A.ey, 3.2, 2.6);
  paint(g, lg(g, A.sx, A.sy, A.ex, A.ey, [0, shade(C.armor, dk), 1, shade(C.armorD, dk)]), 'rgba(0,0,0,0.6)', 0.7);
  limb(g, A.ex, A.ey, A.hx, A.hy, 2.8, 2.5);
  paint(g, lg(g, A.ex, A.ey, A.hx, A.hy, [0, shade(C.armorL, dk), 1, shade(C.armor, dk)]), 'rgba(0,0,0,0.6)', 0.7);
  // Stulpe
  g.beginPath(); g.ellipse(lerp(A.ex, A.hx, 0.55), lerp(A.ey, A.hy, 0.55), 3.3, 2.4, Math.atan2(A.hy - A.ey, A.hx - A.ex), 0, TAU);
  paint(g, shade(C.red, dk - 0.1), 'rgba(0,0,0,0.6)', 0.6);
  // Klauenhand
  const a = Math.atan2(A.hy - A.ey, A.hx - A.ex);
  g.save(); g.translate(A.hx, A.hy); g.rotate(a);
  g.beginPath(); g.ellipse(1.2, 0, 2.8, 2.3, 0, 0, TAU);
  paint(g, shade(C.armorL, dk), 'rgba(0,0,0,0.7)', 0.6);
  g.fillStyle = shade('#d8d0dc', dk);
  const open = cast;
  for (let k = -1; k <= 1; k++) {
    g.beginPath();
    const sp = k * (0.45 + open * 0.35);
    g.moveTo(3, k * 1.2); g.quadraticCurveTo(6.5, k * 1.4 + sp * 3, 7.5 + open, k * 1.4 + sp * 4.5); g.lineTo(3.5, k * 1.2 + 0.8); g.closePath(); g.fill();
  }
  g.restore();
  if (!back && cast > 0.05) { // Blutkugel in der Hand
    const r = 3 + cast * 3 + Math.sin(performance.now() / 70) * 0.5;
    const hx = A.hx + Math.cos(a) * 6, hy = A.hy + Math.sin(a) * 6;
    g.fillStyle = rg(g, hx - 1, hy - 1, 0, r, [0, '#ff8a96', 0.4, '#d0102a', 1, '#40000a']);
    g.beginPath(); g.arc(hx, hy, r, 0, TAU); g.fill();
    glowDot(g, hx, hy, r * 3, C.redL, 0.6 * cast);
  }
}
function drawPauldron(g, x, y, lean, C, s) {
  g.save(); g.translate(x, y); g.rotate(lean * 0.8); g.scale(s, s);
  for (let k = 2; k >= 0; k--) { // drei Lamellen
    g.beginPath();
    g.moveTo(-6.5 + k * 0.4, -2 + k * 2.6);
    g.quadraticCurveTo(0, -6 + k * 2.6, 7.5 - k * 0.6, -1.2 + k * 2.8);
    g.quadraticCurveTo(5, 3 + k * 2.6, 0, 3.2 + k * 2.4);
    g.quadraticCurveTo(-5, 3 + k * 2.4, -6.5 + k * 0.4, -2 + k * 2.6);
    paint(g, lg(g, -6, -5, 6, 4 + k * 2, [0, C.armorL, 0.5, C.armor, 1, C.armorD]), 'rgba(0,0,0,0.75)', 0.7);
    g.strokeStyle = rgba(C.red, 0.85); g.lineWidth = 0.6;
    g.beginPath(); g.moveTo(-5.8 + k * 0.4, 2.2 + k * 2.4); g.quadraticCurveTo(0, 3.6 + k * 2.4, 6.5 - k * 0.6, -0.4 + k * 2.8); g.stroke();
  }
  // Stacheln
  g.fillStyle = '#cfc8d6';
  const spikes = [[-3, -4.5, -5, -11.5], [0.5, -5.3, 0, -13], [4, -4.3, 5.2, -10.5]];
  for (const sp of spikes) {
    g.beginPath(); g.moveTo(sp[0] - 1.4, sp[1] + 0.8); g.lineTo(sp[2], sp[3]); g.lineTo(sp[0] + 1.4, sp[1] + 0.6); g.closePath();
    g.fillStyle = lg(g, sp[0], sp[1], sp[2], sp[3], [0, '#6b6474', 1, '#efe8f4']); g.fill();
    g.strokeStyle = 'rgba(0,0,0,0.7)'; g.lineWidth = 0.5; g.stroke();
  }
  g.restore();
}
function drawVorianHead(g, P, C, H) {
  const x = P.headX, y = P.headY, t = P.t;
  g.save(); g.translate(x, y); g.rotate(P.headA);
  // wehendes weisses Haar
  const flow = clamp(P.run + P.dodge, 0, 1);
  const hp = flowCurve(-2.5, -3, 14, 5, flow, t, 2.1, 0.55, -0.3);
  ribbon(g, hp, (s) => 3.6 * (1 - s) + 0.6);
  paint(g, lg(g, -3, -5, -12, 8, [0, C.hair, 1, '#9d97ad']), 'rgba(40,30,50,0.6)', 0.6);
  // Gesicht (Profil)
  g.beginPath();
  g.moveTo(-4.5, -5.5);
  g.quadraticCurveTo(-1, -8.2, 3.2, -6.2);
  g.quadraticCurveTo(4.6, -3.8, 4.2, -2.2);
  g.lineTo(6, -0.4);           // Nase
  g.lineTo(4.4, 0.4);

  g.quadraticCurveTo(3.4, 5, 1.2, 5.6);    // Kinn
  g.quadraticCurveTo(-3, 5.2, -4.8, 2);
  g.closePath();

  // Wangenschatten
  g.fillStyle = 'rgba(70,40,80,0.35)';
  g.beginPath(); g.moveTo(0.5, 0.5); g.quadraticCurveTo(3, 2.5, 1.5, 4.6); g.quadraticCurveTo(-0.5, 2.4, 0.5, 0.5); g.fill();
  // spitzes Ohr
  g.beginPath(); g.moveTo(-1.8, -1.6); g.lineTo(-6.2, -4.8); g.lineTo(-2.4, 1.2); g.closePath();
  paint(g, C.skinD, 'rgba(40,20,40,0.7)', 0.5);
  // Augenbraue & Auge
  g.strokeStyle = '#2a1a2a'; g.lineWidth = 0.9;
  g.beginPath(); g.moveTo(0.8, -3.6); g.lineTo(4, -2.6); g.stroke();
  eye(g, 2.6, -1.8, 0.95, C.eye);

  if (H.plain) { g.restore(); return; } // Mensch: ohne Krone
  // Krone mit Dornen
  const lvl = H.crown || 0;
  g.save(); g.translate(-0.3, -7.2); g.rotate(-0.08);
  g.beginPath();
  g.moveTo(-5, 1.2); g.lineTo(5, 0.4); g.lineTo(5, -1.2); g.lineTo(-5, -0.4); g.closePath();
  paint(g, lg(g, 0, -1, 0, 1, [0, '#e6d7aa', 1, '#6b5530']), 'rgba(0,0,0,0.7)', 0.5);
  const sp = [[-4.5, -5.5], [-2, -8], [0.6, -6], [3, -9], [5, -5.5]];
  for (let i = 0; i < sp.length; i++) {
    const bx = -4.5 + i * 2.35;
    g.beginPath(); g.moveTo(bx - 1, -0.6); g.lineTo(sp[i][0], sp[i][1] - lvl * 1.2); g.lineTo(bx + 1, -0.8); g.closePath();
    g.fillStyle = lg(g, bx, 0, sp[i][0], sp[i][1], [0, '#8b7448', 1, '#f5ecd0']); g.fill();
    g.strokeStyle = 'rgba(0,0,0,0.6)'; g.lineWidth = 0.4; g.stroke();
  }
  // Rubin
  g.fillStyle = rg(g, 0.6, -0.2, 0, 1.6, [0, '#ffb0b8', 0.5, '#e0102c', 1, '#500010']);

  if (lvl > 0) glowDot(g, 0.6, -0.2, 4 + lvl * 2, C.redL, 0.5);
  g.restore();

}

/* ============================================================ LIORA

const SPEC_LIORA = { hipY: -27, torso: 19, headOff: 8, shoulderW: 9, legL: 14, legL2: 13.5, armL: 10.5, armL2: 10.5, stride: 9, lift: 5, lean: 0.06, shoulderDrop: 2.5, armRest: 0.1 };

  // --- Pferdeschwanz (hinten)
  {
    const hx = P.headX - 3, hy = P.headY - 4;
    const hp = flowCurve(hx, hy, 24, 7, flow, t, 0.7, 0.35, 0.05);
    ribbon(g, hp, (s) => 3.2 * (1 - s * 0.8));
    paint(g, lg(g, hx, hy, hx - 10, hy + 22, [0, C.hairL, 0.5, C.hair, 1, '#050205']), 'rgba(0,0,0,0.5)', 0.5);
    g.strokeStyle = rgba(C.coatL, 0.8); g.lineWidth = 0.8;
    curvePath(g, hp.map((p) => [p[0] + 0.6, p[1]])); g.stroke();
  }
  // --- Rockschoesse hinten
  for (let k = 0; k < 2; k++) {
    const ax = P.hipX - 3 + k * 2, ay = P.hipY - 3;
    const cp = flowCurve(ax, ay, 22 - k * 2, 6, flow, t, k * 1.7, 0.18, -0.2);
    ribbon(g, cp, (s) => (4.2 - k) * (1 - s * 0.55));
    paint(g, lg(g, ax, ay, ax - 10, ay + 20, [0, k ? C.coatD : C.coat, 1, '#20030a']), 'rgba(0,0,0,0.6)', 0.6);
  }
  // --- hinteres Bein & Arm
  drawBootLeg(g, P.legB, C, true);
  drawSlimArm(g, P.armB, C, true);
  // --- Rumpf
  g.save(); g.translate(P.hipX, P.hipY); g.rotate(P.lean);
  const T = SPEC_LIORA.torso;
  // Mantel (Oberkoerper)
  g.beginPath();
  g.moveTo(-5, 3);
  g.bezierCurveTo(-6.5, -T * 0.4, -6, -T * 0.8, -4.5, -T - 0.5);
  g.lineTo(5, -T - 0.5);
  g.bezierCurveTo(6.5, -T * 0.7, 4.5, -T * 0.45, 4.5, 3);
  g.closePath();
  paint(g, lg(g, -5, -T, 6, 2, [0, C.coatL, 0.4, C.coat, 1, C.coatD]), 'rgba(0,0,0,0.6)', 0.8);
  // Korsett
  g.beginPath();
  g.moveTo(-3.5, 1); g.quadraticCurveTo(-4.5, -T * 0.4, -2.5, -T * 0.72); g.lineTo(4, -T * 0.72); g.quadraticCurveTo(5, -T * 0.4, 3.5, 1); g.closePath();
  paint(g, lg(g, -3, -T * 0.7, 4, 0, [0, C.blackL, 1, C.black]), 'rgba(0,0,0,0.6)', 0.6);
  g.strokeStyle = rgba(C.coatL, 0.9); g.lineWidth = 0.45;
  for (let k = 0; k < 5; k++) { const yy = -2 - k * 2.6; g.beginPath(); g.moveTo(0, yy); g.lineTo(2.2, yy - 1.3); g.moveTo(2.2, yy); g.lineTo(0, yy - 1.3); g.stroke(); }
  // Halstuch (Rueschen)
  g.fillStyle = '#efe6dc';
  g.beginPath(); g.moveTo(0.5, -T + 0.5); g.quadraticCurveTo(4, -T + 3, 2.2, -T + 6); g.quadraticCurveTo(3.8, -T + 7.5, 1.4, -T + 8.5); g.quadraticCurveTo(-0.5, -T + 5, 0.5, -T + 0.5); g.fill();
  g.strokeStyle = 'rgba(80,50,60,0.6)'; g.lineWidth = 0.4; g.stroke();
  // Blutphiolen am Guertel
  g.fillStyle = '#20121a'; g.fillRect(-5, 0.5, 10, 2);
  for (let k = 0; k < 3; k++) {
    const vx = -3.6 + k * 2.4;
    g.fillStyle = 'rgba(210,220,230,0.6)'; g.fillRect(vx, 1.8, 1.6, 3.4);
    g.fillStyle = rgba('#e0183a', 0.6 + rage * 0.4); g.fillRect(vx + 0.2, 3, 1.2, 2);
  }
  g.restore();
  // Vorderer Schoss (leicht vor dem Bein)
  {
    const ax = P.hipX + 2.5, ay = P.hipY - 2;
    const cp = flowCurve(ax, ay, 19, 5, flow * 0.8, t, 2.4, 0.02, -0.4);
    ribbon(g, cp, (s) => 3.4 * (1 - s * 0.5));
    paint(g, lg(g, ax, ay, ax, ay + 18, [0, C.coat, 1, C.coatD]), 'rgba(0,0,0,0.6)', 0.6);
  }
  drawBootLeg(g, P.legF, C, false);
  // --- Kopf
  drawLioraHead(g, P, C, H);
  // hoher Mantelkragen
  g.save(); g.translate(P.neckX, P.neckY); g.rotate(P.lean);
  g.beginPath(); g.moveTo(-4.5, 1.5); g.quadraticCurveTo(-7, -4, -5.5, -8); g.lineTo(-2.5, -3); g.lineTo(0, 1.5); g.closePath();
  paint(g, lg(g, -6, -8, -1, 1, [0, C.coatL, 1, C.coatD]), 'rgba(0,0,0,0.6)', 0.6);
  g.restore();
  // --- vorderer Arm mit Sichel
  drawSlimArm(g, P.armF, C, false);
  if (H.weapon) drawCompanionWeapon(g, P.armF, H.weapon, P); else drawSickle(g, P.armF, C, P, H);
}
function drawBootLeg(g, L, C, back) {
  const dk = back ? -0.4 : 0;
  limb(g, L.hx, L.hy, L.kx, L.ky, 2.8, 2.2);
  paint(g, lg(g, L.hx, L.hy, L.kx + 3, L.ky, [0, shade(C.blackL, dk), 1, shade(C.black, dk)]), 'rgba(0,0,0,0.6)', 0.6);
  limb(g, L.kx, L.ky, L.fx, L.fy - 1.5, 2.4, 1.8);
  paint(g, lg(g, L.kx - 2, L.ky, L.kx + 2, L.fy, [0, shade('#2e1c26', dk), 1, shade('#0c060a', dk)]), 'rgba(0,0,0,0.7)', 0.6);
  // Stiefelkrempe
  g.beginPath(); g.ellipse(L.kx + 0.3, L.ky + 1.5, 3, 1.6, Math.atan2(L.fy - L.ky, L.fx - L.kx), 0, TAU);
  paint(g, shade(C.coat, dk), 'rgba(0,0,0,0.6)', 0.5);
  g.beginPath(); g.moveTo(L.fx - 2, L.fy - 2.5); g.lineTo(L.fx + 1.5, L.fy - 2.8); g.quadraticCurveTo(L.fx + 4, L.fy - 0.8, L.fx + 5.5, L.fy + 0.2); g.lineTo(L.fx - 2.4, L.fy + 0.2); g.closePath();
  paint(g, shade('#140a10', dk), 'rgba(0,0,0,0.8)', 0.5);
  g.fillStyle = shade('#3a2a30', dk); g.fillRect(L.fx - 2.4, L.fy - 0.4, 2, 0.8);
}
function drawSlimArm(g, A, C, back) {
  const dk = back ? -0.4 : 0;
  limb(g, A.sx, A.sy, A.ex, A.ey, 2.6, 2.1);
  paint(g, lg(g, A.sx, A.sy, A.ex, A.ey, [0, shade(C.coatL, dk - 0.1), 1, shade(C.coat, dk)]), 'rgba(0,0,0,0.6)', 0.6);
  limb(g, A.ex, A.ey, A.hx, A.hy, 1.9, 1.5);
  paint(g, shade(C.band, dk), 'rgba(60,40,40,0.8)', 0.5);
  g.strokeStyle = shade('#8a7462', dk); g.lineWidth = 0.4;
  for (let k = 1; k < 4; k++) {
    const x = lerp(A.ex, A.hx, k / 4.3), y = lerp(A.ey, A.hy, k / 4.3);
    g.beginPath(); g.moveTo(x - 1.4, y - 0.8); g.lineTo(x + 1.4, y + 0.6); g.stroke();
  }
  g.fillStyle = rgba('#b0102a', 0.8); g.beginPath(); g.arc(lerp(A.ex, A.hx, 0.5), lerp(A.ey, A.hy, 0.5) + 0.6, 0.7, 0, TAU); g.fill();
  g.beginPath(); g.arc(A.hx, A.hy, 1.8, 0, TAU); paint(g, shade(C.skin, dk), 'rgba(60,40,40,0.8)', 0.5);
}
function drawSickle(g, A, C, P, H) {
  const a = Math.atan2(A.hy - A.ey, A.hx - A.ex) + (P.cast > 0 ? -0.6 * P.cast : -0.4);
  g.save(); g.translate(A.hx, A.hy); g.rotate(a);
  // Griff
  g.beginPath(); g.moveTo(-3, -0.8); g.lineTo(9, -0.8); g.lineTo(9, 0.8); g.lineTo(-3, 0.8); g.closePath();
  paint(g, lg(g, 0, -1, 0, 1, [0, '#5a3a2c', 1, '#1e120c']), 'rgba(0,0,0,0.8)', 0.5);
  g.fillStyle = C.coatL; g.fillRect(-1, -1, 1.2, 2); g.fillRect(3, -1, 1.2, 2);
  // Klinge (Knochen mit Blutschneide)
  g.beginPath();
  g.moveTo(8.5, -1.2);
  g.bezierCurveTo(12, -9, 4, -16, -5, -14.5);
  g.bezierCurveTo(2, -12.5, 7, -8, 6, -1);
  g.closePath();
  paint(g, lg(g, 8, -2, -4, -14, [0, '#8e8272', 0.35, C.bone, 1, '#fff8ee']), 'rgba(0,0,0,0.8)', 0.6);
  g.strokeStyle = rgba('#ff2844', 0.85 + (H.rage || 0) * 0.15); g.lineWidth = 1;
  g.beginPath(); g.moveTo(9, -2); g.bezierCurveTo(12, -9.5, 4, -16.2, -5, -14.6); g.stroke();
  // Tropfen
  const dt = (P.t * 1.3) % 1;
  g.fillStyle = '#c0102a'; g.beginPath(); g.arc(-4 + dt * 0.5, -14 + dt * 7, 0.7 * (1 - dt * 0.5), 0, TAU); g.fill();
  g.restore();
}
function drawLioraHead(g, P, C, H) {
  const x = P.headX, y = P.headY;
  g.save(); g.translate(x, y); g.rotate(P.headA);
  // Haar hinten
  g.beginPath(); g.moveTo(-5.5, 3); g.quadraticCurveTo(-6.5, -7, 0, -7.6); g.quadraticCurveTo(-3, -3, -2, 4); g.closePath();
  paint(g, C.hair, null);
  // Gesicht
  g.beginPath();
  g.moveTo(-3.8, -5.2); g.quadraticCurveTo(0, -7.6, 3, -5.3); g.quadraticCurveTo(4.2, -3, 3.8, -1.6);
  g.lineTo(5.2, 0); g.lineTo(3.9, 0.6); g.quadraticCurveTo(4.3, 1.6, 3.6, 2.4); g.quadraticCurveTo(2.8, 4.6, 0.8, 5);
  g.quadraticCurveTo(-2.8, 4.6, -4, 1.5); g.closePath();
  paint(g, lg(g, 2, -6, -3, 5, [0, '#fff4ee', 0.6, C.skin, 1, C.skinD]), 'rgba(60,30,40,0.7)', 0.55);
  // Lippen
  g.fillStyle = '#9a0f24'; g.beginPath(); g.moveTo(3.2, 1.9); g.lineTo(4.1, 2.1); g.lineTo(3.3, 2.6); g.fill();
  // Auge + Wimpern
  eye(g, 2.2, -1.5, 0.85 + (H.rage || 0) * 0.35, C.eye);
  g.strokeStyle = '#120810'; g.lineWidth = 0.7; g.beginPath(); g.moveTo(1, -2.3); g.quadraticCurveTo(2.6, -3, 3.8, -2.2); g.stroke();
  // Pony / Scheitel mit roter Straehne
  g.beginPath();
  g.moveTo(-5, -1); g.quadraticCurveTo(-5, -8.5, 1.5, -8); g.quadraticCurveTo(5, -7.5, 4.5, -3.5);
  g.quadraticCurveTo(2.5, -6, 0, -5.5); g.quadraticCurveTo(-2, -4, -2.5, 0); g.closePath();
  paint(g, lg(g, 0, -8, 0, 0, [0, C.hairL, 1, C.hair]), 'rgba(0,0,0,0.5)', 0.5);
  g.strokeStyle = '#d0203a'; g.lineWidth = 0.9;
  g.beginPath(); g.moveTo(-1, -7.5); g.quadraticCurveTo(2.5, -7, 3.8, -4); g.stroke();
  // Haarband
  g.fillStyle = '#b0142a'; g.beginPath(); g.ellipse(-4.2, -4.6, 1.2, 1.8, 0.4, 0, TAU); g.fill();
  g.restore();
}

/* ============================================================ NYX
   Der Schattenlaeufer — geduckt, spitze Kapuze, Knochenmaske, zwei
   Dolche im Rueckhandgriff und ein endlos langer, gluehender Schal. */
const SPEC_NYX = { hipY: -24, torso: 17, headOff: 8, shoulderW: 8.5, legL: 12.5, legL2: 12.5, armL: 9.5, armL2: 9.5, stride: 10, lift: 5.5, lean: 0.22, crouch: 1.5, shoulderDrop: 2.5, armRest: -0.2, stance: 1.6 };
function drawNyx(g, P, H) {
  const C = HERO_PAL.nyx, t = P.t, flow = clamp(P.run * 1.2 + P.dodge, 0, 1.4);
  const surge = H.flow || 0; // Schattenfluss 0..1
  // --- Schal (zwei lange Bahnen)
  for (let k = 0; k < 2; k++) {
    const ax = P.neckX - 1.5, ay = P.neckY + 1.2;
    const len = (30 - k * 7) * (0.62 + 0.38 * clamp(flow, 0, 1)) * (1 + surge * 0.35);
    const sp = flowCurve(ax, ay, len, 9, flow, t * 1.1, k * 2.3, 0.95, 0.15 + k * 0.1);
    ribbon(g, sp, (s) => (2.6 - k * 0.5) * (1 - s * 0.35));
    paint(g, lg(g, ax, ay, sp[sp.length - 1][0], sp[sp.length - 1][1], [0, C.scarf, 0.7, '#2a1650', 1, C.scarfL]), 'rgba(0,0,0,0.5)', 0.5);
    // leuchtende, zerfaserte Enden
    const e = sp[sp.length - 1];
    glowDot(g, e[0], e[1], 5 + surge * 4, C.scarfL, 0.45 + surge * 0.4);
  }
  drawWrapLeg(g, P.legB, C, true);
  drawDaggerArm(g, P.armB, C, true, P);
  // --- Rumpf mit kurzem, zerfetztem Umhang
  g.save(); g.translate(P.hipX, P.hipY); g.rotate(P.lean);
  const T = SPEC_NYX.torso;
  g.beginPath();
  g.moveTo(-4.5, 2); g.bezierCurveTo(-6, -T * 0.4, -5.5, -T * 0.8, -4, -T);
  g.lineTo(4, -T); g.bezierCurveTo(5.5, -T * 0.6, 4.5, -T * 0.3, 4, 2); g.closePath();
  paint(g, lg(g, -4, -T, 5, 2, [0, C.cloakL, 0.45, C.cloak, 1, C.cloakD]), 'rgba(0,0,0,0.6)', 0.7);
  // Riemen ueber der Brust
  g.strokeStyle = '#120e1c'; g.lineWidth = 1.6;
  g.beginPath(); g.moveTo(-4, -T + 1); g.lineTo(4, -2); g.stroke();
  g.fillStyle = '#8c86a8'; g.fillRect(-0.6, -T * 0.5 - 0.6, 1.4, 1.4);
  // Schattenkern (leuchtet mit Fluss)
  glowDot(g, 0.5, -T * 0.55, 3 + surge * 5, C.rim, 0.25 + surge * 0.6);
  g.restore();
  // Umhangfetzen um die Huefte
  for (let k = 0; k < 4; k++) {
    const ax = P.hipX - 4 + k * 2.4, ay = P.hipY - 1;
    const cp = flowCurve(ax, ay, 9 + (k % 2) * 3, 4, flow, t, k * 1.1, 0.12, -0.3);
    ribbon(g, cp, (s) => 1.8 * (1 - s));
    paint(g, k % 2 ? C.cloakD : C.cloak, 'rgba(0,0,0,0.5)', 0.4);
  }
  drawWrapLeg(g, P.legF, C, false);
  drawNyxHead(g, P, C, H);
  drawDaggerArm(g, P.armF, C, false, P);
}
function drawWrapLeg(g, L, C, back) {
  const dk = back ? -0.4 : 0;
  limb(g, L.hx, L.hy, L.kx, L.ky, 2.7, 2.1);
  paint(g, lg(g, L.hx, L.hy, L.kx, L.ky, [0, shade(C.cloakL, dk - 0.1), 1, shade(C.cloakD, dk)]), 'rgba(0,0,0,0.6)', 0.6);
  limb(g, L.kx, L.ky, L.fx, L.fy - 1.3, 2.2, 1.7);
  paint(g, shade(C.wrap, dk), 'rgba(0,0,0,0.7)', 0.6);
  g.strokeStyle = shade('#6a6080', dk); g.lineWidth = 0.4;
  for (let k = 1; k < 5; k++) { const x = lerp(L.kx, L.fx, k / 5.5), y = lerp(L.ky, L.fy, k / 5.5); g.beginPath(); g.moveTo(x - 1.8, y - 0.6); g.lineTo(x + 1.8, y + 0.5); g.stroke(); }
  g.beginPath(); g.moveTo(L.fx - 2.2, L.fy - 2.2); g.lineTo(L.fx + 1, L.fy - 2.4); g.quadraticCurveTo(L.fx + 3.6, L.fy - 0.8, L.fx + 4.6, L.fy + 0.2); g.lineTo(L.fx - 2.5, L.fy + 0.2); g.closePath();
  paint(g, shade('#16121e', dk), 'rgba(0,0,0,0.8)', 0.5);
}
function drawDaggerArm(g, A, C, back, P) {
  const dk = back ? -0.4 : 0;
  limb(g, A.sx, A.sy, A.ex, A.ey, 2.4, 1.9);
  paint(g, shade(C.cloak, dk), 'rgba(0,0,0,0.6)', 0.6);
  limb(g, A.ex, A.ey, A.hx, A.hy, 1.9, 1.6);
  paint(g, shade(C.wrap, dk), 'rgba(0,0,0,0.7)', 0.5);
  g.beginPath(); g.arc(A.hx, A.hy, 1.7, 0, TAU); paint(g, shade('#2a2436', dk), 'rgba(0,0,0,0.7)', 0.5);
  // Dolch im Rueckhandgriff: Klinge zeigt nach hinten/unten am Unterarm entlang
  const fa = Math.atan2(A.hy - A.ey, A.hx - A.ex);
  const a = fa + Math.PI * 0.92 + (P.cast * (back ? 0 : 1.6));
  g.save(); g.translate(A.hx, A.hy); g.rotate(a);
  g.fillStyle = '#1a1420'; g.fillRect(-2.2, -0.7, 2.6, 1.4);
  g.fillStyle = '#6a6484'; g.fillRect(0.2, -1.6, 0.9, 3.2);
  g.beginPath(); g.moveTo(1, -1); g.quadraticCurveTo(7, -1.6, 11, 0.8); g.quadraticCurveTo(6, 0.6, 1, 1); g.closePath();
  paint(g, lg(g, 1, -1, 10, 1, [0, shade(C.steelL, dk), 1, shade(C.steel, dk)]), 'rgba(0,0,0,0.8)', 0.4);
  g.save(); g.globalCompositeOperation = 'lighter';
  g.strokeStyle = rgba(C.rim, back ? 0.35 : 0.8); g.lineWidth = 0.5;
  g.beginPath(); g.moveTo(1.5, -1.2); g.quadraticCurveTo(7, -1.7, 10.8, 0.6); g.stroke();
  g.restore();
  g.restore();
}
function drawNyxHead(g, P, C, H) {
  g.save(); g.translate(P.headX, P.headY); g.rotate(P.headA);
  // Kapuze mit langer, nach hinten fallender Spitze
  const flow = clamp(P.run + P.dodge, 0, 1);
  g.beginPath();
  g.moveTo(-6, 5.5);
  g.quadraticCurveTo(-8, -3, -3, -8.2);
  g.quadraticCurveTo(-8 - flow * 3, -9 - flow, -14 - flow * 5, -5 + Math.sin(P.t * 7) * flow);
  g.quadraticCurveTo(-8, -6.5, -6.8, 2);
  g.quadraticCurveTo(-4, -8.6, 2.5, -8);
  g.quadraticCurveTo(6.8, -6.5, 6, -1);
  g.quadraticCurveTo(5.5, 3.5, 3.5, 6);
  g.lineTo(-6, 5.5);
  g.closePath();
  paint(g, lg(g, 2, -8, -8, 6, [0, C.cloakL, 0.5, C.cloak, 1, C.cloakD]), 'rgba(0,0,0,0.7)', 0.6);
  // dunkles Kapuzeninneres
  g.beginPath(); g.moveTo(-1, 5.5); g.quadraticCurveTo(-2.5, -5, 2.5, -6); g.quadraticCurveTo(5.8, -4.5, 5, 0.5); g.quadraticCurveTo(4.5, 4, 3, 5.5); g.closePath();
  paint(g, '#06030c', null);
  // Knochen-Halbmaske
  g.beginPath(); g.moveTo(0.4, -3.2); g.quadraticCurveTo(3.8, -4.6, 5.4, -2); g.lineTo(5.6, 0.8); g.quadraticCurveTo(3.5, 1.8, 1.4, 1.2); g.quadraticCurveTo(0, -0.8, 0.4, -3.2); g.closePath();
  paint(g, lg(g, 2, -4, 4, 1, [0, '#fff8ea', 0.5, C.mask, 1, C.maskD]), 'rgba(0,0,0,0.7)', 0.5);
  g.strokeStyle = 'rgba(60,40,40,0.8)'; g.lineWidth = 0.35;
  g.beginPath(); g.moveTo(1.6, 0.9); g.lineTo(2, -0.3); g.moveTo(3, 1.3); g.lineTo(3.2, 0); g.stroke();
  eye(g, 3.4, -1.6, 0.85 + (H.flow || 0) * 0.3, C.eye);
  g.restore();
}

/* ============================================================ SHEN
   Meister der drei Kraefte — breiter Strohhut, langer weisser Bart,
   Robe mit weiten Aermeln und roter Schaerpe. Qi-Tattoos leuchten mit
   jeder gesammelten Qi-Perle. */
const SPEC_SHEN = { hipY: -25, torso: 19, headOff: 8, shoulderW: 11, legL: 12.5, legL2: 12.5, armL: 10.5, armL2: 10.5, stride: 8, lift: 4, lean: 0.02, shoulderDrop: 3, stance: 1.3, armRest: 0.05 };
function drawShen(g, P, H) {
  const C = HERO_PAL.shen, t = P.t, flow = clamp(P.run * 1.1 + P.dodge, 0, 1.3);
  const qi = H.qi || 0; // 0..1
  // Schaerpenbaender hinten
  for (let k = 0; k < 2; k++) {
    const ax = P.hipX - 3, ay = P.hipY - 3;
    const sp = flowCurve(ax, ay, 20 - k * 4, 6, flow + P.rooted * 0.4, t, k * 1.9, 0.25, -0.1);
    ribbon(g, sp, (s) => 1.9 - k * 0.3);
    paint(g, lg(g, ax, ay, ax - 8, ay + 18, [0, C.sash, 1, '#4a0a12']), 'rgba(0,0,0,0.5)', 0.4);
  }
  drawRobeLeg(g, P.legB, C, true);
  drawSleeveArm(g, P.armB, C, true, P, qi);
  // Robe: Rumpf + Rockteil
  g.save(); g.translate(P.hipX, P.hipY); g.rotate(P.lean);
  const T = SPEC_SHEN.torso;
  const sw = Math.sin(P.ph) * 2 * P.run;
  // Rockteil
  g.beginPath();
  g.moveTo(-6, -2); g.lineTo(6, -2);
  g.quadraticCurveTo(8.5 + sw, 6, 7.5 + sw * 1.4, 14 - P.rooted * 2);
  g.lineTo(-7.5 - sw, 13.5 - P.rooted * 2);
  g.quadraticCurveTo(-8.5 - sw, 6, -6, -2); g.closePath();
  paint(g, lg(g, 0, -2, 0, 14, [0, C.robe, 1, C.robeD]), 'rgba(0,0,0,0.55)', 0.7);
  g.strokeStyle = rgba(C.gold, 0.8); g.lineWidth = 0.7;
  g.beginPath(); g.moveTo(7.2 + sw * 1.4, 13 - P.rooted * 2); g.lineTo(-7.2 - sw, 12.6 - P.rooted * 2); g.stroke();
  g.strokeStyle = 'rgba(0,0,0,0.35)'; g.lineWidth = 0.6;
  g.beginPath(); g.moveTo(1, -1); g.lineTo(1.5 + sw, 13); g.moveTo(-3, -1); g.lineTo(-4 - sw, 12.5); g.stroke();
  // Oberkoerper
  g.beginPath();
  g.moveTo(-6, 0); g.bezierCurveTo(-7.5, -T * 0.4, -7, -T * 0.8, -5.5, -T);
  g.lineTo(5.5, -T); g.bezierCurveTo(7.5, -T * 0.7, 7, -T * 0.4, 6, 0); g.closePath();
  paint(g, lg(g, -6, -T, 6, 0, [0, C.robeL, 0.45, C.robe, 1, C.robeD]), 'rgba(0,0,0,0.55)', 0.7);
  // Wickelkragen (weisses Unterkleid)
  g.beginPath(); g.moveTo(-1, -T); g.lineTo(3, -T); g.lineTo(5, -T * 0.45); g.lineTo(2.5, -T * 0.4); g.closePath();
  paint(g, lg(g, 0, -T, 3, -T * 0.4, [0, C.inner, 1, C.innerD]), 'rgba(0,0,0,0.5)', 0.5);
  g.strokeStyle = '#111'; g.lineWidth = 0.8; g.beginPath(); g.moveTo(3, -T); g.lineTo(5, -T * 0.45); g.stroke();
  // Schaerpe
  g.beginPath(); g.moveTo(-6.5, -1); g.lineTo(6.5, -1.5); g.lineTo(6.8, -5); g.lineTo(-6.8, -4.5); g.closePath();
  paint(g, lg(g, 0, -5, 0, -1, [0, C.sashL, 1, C.sash]), 'rgba(0,0,0,0.6)', 0.6);
  // Knoten
  g.beginPath(); g.arc(3.8, -3, 1.6, 0, TAU); paint(g, C.sash, 'rgba(0,0,0,0.6)', 0.5);
  // Gebetskette (grosse Perlen)
  for (let k = 0; k < 7; k++) {
    const a = 0.25 + k * 0.36;
    const bx = -1 + Math.cos(a) * 5, by = -T + 2 + Math.sin(a) * 6;
    g.beginPath(); g.arc(bx, by, 1.05, 0, TAU);
    paint(g, rg(g, bx - 0.3, by - 0.3, 0, 1.2, [0, '#7a5a40', 1, C.bead]), 'rgba(0,0,0,0.6)', 0.3);
  }
  // Qi-Siegel auf der Brust
  if (qi > 0) glowDot(g, 1, -T * 0.6, 3 + qi * 6, C.eye, 0.25 + qi * 0.5);
  g.restore();
  drawRobeLeg(g, P.legF, C, false);
  drawShenHead(g, P, C, H);
  drawSleeveArm(g, P.armF, C, false, P, qi);
}
function drawRobeLeg(g, L, C, back) {
  const dk = back ? -0.4 : 0;
  limb(g, L.hx, L.hy, L.kx, L.ky, 3.2, 2.8);
  paint(g, shade('#1c1c20', dk), 'rgba(0,0,0,0.6)', 0.6);
  limb(g, L.kx, L.ky, L.fx, L.fy - 1.5, 2.9, 2.2);
  paint(g, lg(g, L.kx, L.ky, L.fx, L.fy, [0, shade('#26262c', dk), 1, shade('#121216', dk)]), 'rgba(0,0,0,0.6)', 0.6);
  // Wickelgamaschen (hell)
  g.strokeStyle = shade(C.inner, dk - 0.2); g.lineWidth = 0.8;
  for (let k = 3; k < 6; k++) { const x = lerp(L.kx, L.fx, k / 6.5), y = lerp(L.ky, L.fy, k / 6.5); g.beginPath(); g.moveTo(x - 2, y - 0.5); g.lineTo(x + 2, y + 0.5); g.stroke(); }
  // Holzsandale
  g.beginPath(); g.moveTo(L.fx - 2.6, L.fy - 2); g.quadraticCurveTo(L.fx + 2, L.fy - 3, L.fx + 4.5, L.fy - 0.5); g.lineTo(L.fx + 4.5, L.fy + 0.3); g.lineTo(L.fx - 2.8, L.fy + 0.3); g.closePath();
  paint(g, shade(C.skin, dk - 0.1), 'rgba(0,0,0,0.7)', 0.5);
  g.fillStyle = shade('#4a3220', dk); g.fillRect(L.fx - 3, L.fy - 0.2, 7.8, 1.2);
}
function drawSleeveArm(g, A, C, back, P, qi) {
  const dk = back ? -0.4 : 0;
  // weiter Aermel haengt vom Oberarm
  const a = Math.atan2(A.ey - A.sy, A.ex - A.sx);
  g.save(); g.translate(A.sx, A.sy); g.rotate(a);
  const L = Math.hypot(A.ex - A.sx, A.ey - A.sy);
  const hang = 5 + (1 - Math.abs(Math.cos(a))) * 1;
  g.beginPath();
  g.moveTo(-1, -3); g.lineTo(L + 1, -3.2); g.quadraticCurveTo(L + 4, 2, L + 2.5, hang + 2); g.lineTo(L - 3, hang + 3.5); g.quadraticCurveTo(0, 4, -1, 3); g.closePath();
  paint(g, lg(g, 0, -3, 0, hang + 3, [0, shade(C.robeL, dk - 0.1), 0.5, shade(C.robe, dk), 1, shade(C.robeD, dk)]), 'rgba(0,0,0,0.6)', 0.6);
  g.strokeStyle = rgba(C.gold, back ? 0.35 : 0.7); g.lineWidth = 0.6;
  g.beginPath(); g.moveTo(L + 2.4, hang + 1.6); g.lineTo(L - 2.8, hang + 3); g.stroke();
  g.restore();
  // Unterarm (nackt, Qi-Tattoo)
  limb(g, A.ex, A.ey, A.hx, A.hy, 2.1, 1.8);
  paint(g, lg(g, A.ex, A.ey, A.hx, A.hy, [0, shade(C.skin, dk), 1, shade(C.skinD, dk)]), 'rgba(40,20,10,0.7)', 0.5);
  if (!back || qi > 0) {
    g.save(); g.globalCompositeOperation = 'lighter';
    g.strokeStyle = rgba(C.eye, (back ? 0.2 : 0.4) + qi * 0.6); g.lineWidth = 0.55;
    const mx = lerp(A.ex, A.hx, 0.5), my = lerp(A.ey, A.hy, 0.5);
    g.beginPath(); g.arc(mx, my, 1, 0, TAU); g.moveTo(lerp(A.ex, A.hx, 0.2), lerp(A.ey, A.hy, 0.2)); g.lineTo(lerp(A.ex, A.hx, 0.8), lerp(A.ey, A.hy, 0.8)); g.stroke();
    g.restore();
  }
  // offene Hand (Handflaeche)
  const ha = Math.atan2(A.hy - A.ey, A.hx - A.ex);
  g.save(); g.translate(A.hx, A.hy); g.rotate(ha + (P.cast > 0 ? -1.2 * P.cast : 0));
  g.beginPath(); g.moveTo(-0.5, -1.8); g.lineTo(3.2, -2); g.quadraticCurveTo(4.6, -0.2, 3.2, 1.8); g.lineTo(-0.5, 1.8); g.closePath();
  paint(g, shade(C.skin, dk + 0.05), 'rgba(40,20,10,0.7)', 0.5);
  g.restore();
  if (!back && P.cast > 0.05) {
    const hx = A.hx + Math.cos(ha) * 4, hy = A.hy + Math.sin(ha) * 4;
    glowDot(g, hx, hy, 6 + P.cast * 5, C.eye, 0.7 * P.cast);
    glowDot(g, hx, hy, 2.5, '#ffffff', 0.8 * P.cast);
  }
}
function drawShenHead(g, P, C, H) {
  const t = P.t;
  g.save(); g.translate(P.headX, P.headY); g.rotate(P.headA);
  const flow = clamp(P.run + P.dodge, 0, 1);
  // Zopf
  const hp = flowCurve(-3.5, -4, 12, 4, flow, t, 0.3, 0.6, -0.2);
  ribbon(g, hp, (s) => 1.4 * (1 - s * 0.5)); paint(g, '#d6d2ca', 'rgba(0,0,0,0.4)', 0.4);
  // Gesicht
  g.beginPath();
  g.moveTo(-3.8, -4.5); g.quadraticCurveTo(0, -6.8, 3.2, -5); g.quadraticCurveTo(4.4, -3, 4, -1.4);
  g.lineTo(5.4, 0.3); g.lineTo(4, 0.8); g.quadraticCurveTo(4.3, 2.4, 3.2, 3.5);
  g.quadraticCurveTo(0, 5, -3.8, 2); g.closePath();
  paint(g, lg(g, 2, -5, -3, 4, [0, '#e0b896', 0.6, C.skin, 1, C.skinD]), 'rgba(40,20,10,0.7)', 0.55);
  // Falten, Brauen (lang, weiss)
  g.strokeStyle = C.beard; g.lineWidth = 0.9;
  g.beginPath(); g.moveTo(0.5, -2.9); g.quadraticCurveTo(3, -3.6, 5.5, -2.2); g.stroke();
  // Auge: gesammelt, halb geschlossen -> leuchtet mit Qi
  const q = H.qi || 0;
  if (q > 0.05 || P.cast > 0) eye(g, 2.7, -1.5, 0.75 + q * 0.3, C.eye);
  else { g.strokeStyle = '#2a1a10'; g.lineWidth = 0.7; g.beginPath(); g.moveTo(1.8, -1.4); g.lineTo(3.6, -1.3); g.stroke(); }
  // langer Bart (weht)
  const bp = flowCurve(2.5, 2.5, 13, 5, flow * 0.7, t, 1.2, 0.05, -0.6);
  ribbon(g, bp, (s) => 2.4 * (1 - s * 0.8));
  paint(g, lg(g, 2, 2, 0, 14, [0, '#ffffff', 1, '#b9b4aa']), 'rgba(60,50,40,0.5)', 0.45);
  // Schnurrbart
  g.beginPath(); g.moveTo(3.2, 1.3); g.quadraticCurveTo(5, 2.5, 5.5, 5.5); g.quadraticCurveTo(4.2, 3.2, 2.4, 2.6); g.closePath(); paint(g, C.beard, null);
  // Strohhut: breit, flach-konisch — die Silhouette des Meisters
  g.save(); g.translate(0.4, -5.2); g.rotate(-0.06);
  g.beginPath();
  g.moveTo(-13.5, 1.4); g.quadraticCurveTo(-6, -2, 0, -7.6); g.quadraticCurveTo(6, -2, 13.5, 1.2);
  g.quadraticCurveTo(0, 3.2, -13.5, 1.4); g.closePath();
  paint(g, lg(g, -6, -7, 6, 2, [0, C.hatL, 0.5, C.hat, 1, C.hatD]), 'rgba(0,0,0,0.75)', 0.7);
  g.strokeStyle = 'rgba(40,25,10,0.55)'; g.lineWidth = 0.45;
  for (let k = -4; k <= 4; k++) { g.beginPath(); g.moveTo(0, -7.3); g.lineTo(k * 3.2, 1.8 - Math.abs(k) * 0.12); g.stroke(); }
  g.strokeStyle = rgba(C.sash, 0.9); g.lineWidth = 0.9;
  g.beginPath(); g.moveTo(-5.5, -2.2); g.quadraticCurveTo(0, -0.8, 5.5, -2.2); g.stroke();
  g.restore();
  g.restore();
}

const HERO_ART = {
  vorian: { spec: SPEC_VORIAN, draw: drawVorian, rim: HERO_PAL.vorian.rim, h: 66 },
  liora: { spec: SPEC_LIORA, draw: drawLiora, rim: HERO_PAL.liora.rim, h: 64 },
  nyx: { spec: SPEC_NYX, draw: drawNyx, rim: HERO_PAL.nyx.rim, h: 58 },
  shen: { spec: SPEC_SHEN, draw: drawShen, rim: HERO_PAL.shen.rim, h: 66 }
};

/* Rendert eine Heldenpose in ein Canvas (mit Kontur + Randlicht). */
const HERO_BOX = 120; // Welt-Einheiten
function renderHero(id, st, H, px, target, opts) {
  const art = HERO_ART[id];
  const S = Math.ceil(HERO_BOX * px);
  const raw = target && target.raw ? target.raw : mkCanvas(S, S);
  if (raw.width !== S) { raw.width = S; raw.height = S; }
  const g = raw.getContext('2d');
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.clearRect(0, 0, S, S);
  g.setTransform(px, 0, 0, px, S / 2, S * 0.78);
  g.lineCap = 'round'; g.lineJoin = 'round';
  const P = makePose(art.spec, st);
  art.draw(g, P, H || {});
  g.setTransform(1, 0, 0, 1, 0, 0);
  const out = target && target.out ? target.out : mkCanvas(S, S);
  if (out.width !== S) { out.width = S; out.height = S; }
  finishSprite(raw, {
    outline: Math.max(1.2, px * 0.62),
    rim: (H && H.rim) || art.rim, rimW: px * 0.75, rimA: 0.9,
    glow: opts && opts.glow ? ((H && H.rim) || art.rim) : null, glowA: 0.6,
    moonW: px * 0.55
  }, out);
  return { raw, out, P, S, anchorY: S * 0.78 };
}

// Waffen der Begleiter (Bogen, Schwert) statt Lioras Sichel
function drawCompanionWeapon(g, A, kind, P) {
  const a = Math.atan2(A.hy - A.ey, A.hx - A.ex);
  g.save(); g.translate(A.hx, A.hy);
  if (kind === 'bow') {
    g.rotate(P.cast > 0 ? P.aim : -0.2);
    g.strokeStyle = '#4a2e1a'; g.lineWidth = 1.8;
    g.beginPath(); g.arc(-3, 0, 12, -1.2, 1.2); g.stroke();
    g.strokeStyle = '#e8e0d0'; g.lineWidth = 0.5;
    g.beginPath(); g.moveTo(-3 + Math.cos(-1.2) * 12, Math.sin(-1.2) * 12); g.lineTo(-3 - P.cast * 5, 0); g.lineTo(-3 + Math.cos(1.2) * 12, Math.sin(1.2) * 12); g.stroke();
    if (P.cast > 0.2) { g.strokeStyle = '#d8d0c0'; g.lineWidth = 0.9; g.beginPath(); g.moveTo(-3 - P.cast * 5, 0); g.lineTo(12, 0); g.stroke(); }
  } else {
    g.rotate(a - 0.9 - P.cast * 1.4);
    g.fillStyle = '#2a2430'; g.fillRect(-2, -0.9, 4, 1.8);
    g.fillStyle = '#c9a24c'; g.fillRect(1.6, -2.6, 1.2, 5.2);
    g.beginPath(); g.moveTo(2.8, -1); g.lineTo(22, -0.4); g.lineTo(24, 0.3); g.lineTo(2.8, 1); g.closePath();
    paint(g, lg(g, 3, -1, 3, 1, [0, '#ffffff', 0.5, '#b8d8f0', 1, '#6a88a8']), 'rgba(0,0,0,0.7)', 0.4);
  }
  g.restore();
}

'use strict';
/* ==========================================================================
