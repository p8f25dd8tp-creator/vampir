const TABS = [
  ['skala', 'Machtskala'], ['helden', 'Helden'], ['begleiter', 'Begleiter'], ['etappen', 'Etappen'], ['bosse', 'Bosse'], ['gegner', 'Gegner']
];
const INTRO = {
  skala: 'Hier änderst du die <b>Namen der Machtstufen</b> und <b>ab welcher Zahl</b> sie gelten. Du kannst Stufen streichen oder neue hinzufügen. Die Skala geht von 1 bis 30.',
  helden: 'Trag den <b>echten deutschen Namen</b> ein und, wenn nötig, die neue <b>Start</b>- und <b>Höchstmacht</b> (1–30).',
  begleiter: 'Nur Namen: trag den <b>echten deutschen Namen</b> ein.',
  etappen: 'Titel der Etappe und die <b>Macht der normalen Kämpfe</b> darin.',
  bosse: 'Deutscher Name und <b>Macht neu</b> (1–30). ⏳ = Durchhalte-Kampf: dort zählt die Macht der Etappe.',
  gegner: 'Normale Gegner kämpfen mit der Macht ihrer Etappe. Hier geht es nur um die <b>Namen</b>.'
};
let tab = 'skala';
try { tab = localStorage.getItem('nb_tab') || 'skala'; } catch (e) {}
const edits = {};   // id -> {name, macht, start, max, notiz, ...}
const skala = {};   // id -> {ab, name, bsp, del}
let db = null, ready = false;

function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
function curSkala() {
  const rows = D.skala.map((r, i) => { const k = 's' + String(i + 1).padStart(2, '0'), e = skala[k] || {}; return { k, ab: e.ab !== undefined && e.ab !== '' ? +e.ab : r[0], name: e.name || r[1], del: !!e.del }; });
  for (const k in skala) if (k.startsWith('n') && !skala[k].del && skala[k].ab) rows.push({ k, ab: +skala[k].ab, name: skala[k].name || 'neue Stufe', del: false });
  return rows.filter((r) => !r.del).sort((a, b) => a.ab - b.ab);
}
function bandOf(m) { if (!m && m !== 0) return ''; let n = ''; for (const r of curSkala()) if (m >= r.ab) n = r.name; return n; }
function isChanged(o) { return !!o && Object.keys(o).some((k) => o[k] !== '' && o[k] != null && o[k] !== false); }

function setStatus(t, cls) { const s = document.getElementById('status'); s.textContent = t; s.className = 'status' + (cls ? ' ' + cls : ''); }

// Speichern: pro Dokument hoechstens ein Schreibvorgang gleichzeitig, gesammelt pro Pause
const pending = {}, timers = {}, busy = {};
function queue(col, id, obj) {
  pending[col + '/' + id] = obj; clearTimeout(timers[col + '/' + id]);
  setStatus('speichert …');
  timers[col + '/' + id] = setTimeout(() => flush(col, id), 600);
}
async function flush(col, id) {
  const key = col + '/' + id;
  if (busy[key]) { timers[key] = setTimeout(() => flush(col, id), 400); return; }
  const obj = pending[key]; if (!obj) return; delete pending[key];
  if (!db) { try { localStorage.setItem('nb_' + key, JSON.stringify(obj)); setStatus('nur auf diesem Gerät gespeichert', 'err'); } catch (e) { setStatus('Speichern nicht möglich', 'err'); } return; }
  busy[key] = true;
  try { await db.doc(key).set(Object.assign({}, obj, { t: Date.now() })); setStatus('gespeichert ✓', 'saved'); }
  catch (e) { setStatus(e && e.code === 'invalid_argument' ? 'Keine Schreibrechte' : 'Fehler beim Speichern – bitte nochmal', 'err'); }
  busy[key] = false;
}

function renderTabs() {
  const cnt = (k) => k === 'skala' ? D.skala.length : D[k].length;
  const chg = (k) => k === 'skala' ? Object.keys(skala).filter((x) => isChanged(skala[x])).length : D[k].filter((r) => isChanged(edits[r.id])).length;
  document.getElementById('tabs').innerHTML = TABS.map(([k, n]) => { const c = chg(k); return `<button class="tab" role="tab" aria-selected="${k === tab}" data-t="${k}">${n}<span class="c">${c ? '✎' + c : cnt(k)}</span></button>`; }).join('');
}
function field(label, key, val, type, ph) {
  const t = type === 'num' ? `<input inputmode="numeric" pattern="[0-9]*" data-k="${key}" value="${esc(val)}" placeholder="${esc(ph)}">` : type === 'area' ? `<textarea rows="1" data-k="${key}" placeholder="${esc(ph)}">${esc(val)}</textarea>` : `<input data-k="${key}" value="${esc(val)}" placeholder="${esc(ph)}" autocomplete="off" autocapitalize="words">`;
  return `<label class="f"><span>${label}</span>${t}</label>`;
}
function rowHtml(kind, r) {
  const e = edits[r.id] || {}, ch = isChanged(e) ? ' changed' : '';
  const mNew = e.macht !== undefined && e.macht !== '' ? +e.macht : null;
  if (kind === 'helden') {
    return `<div class="row${ch}" data-id="${r.id}"><div class="head"><div><div class="nm">${esc(r.n)}</div><div class="sub">${esc(r.s)} · im Buch: ${esc(r.b)}</div><div class="id">${r.id}</div></div><span class="badge">${r.a} → ${r.m}</span></div>
      <div class="fields hero">${field('Deutscher Name', 'name', e.name, 'text', r.n)}${field('Start', 'start', e.start, 'num', r.a)}${field('Höchst', 'max', e.max, 'num', r.m)}</div>
      <div class="band">${e.start || e.max ? `neu: ${e.start || r.a} ${bandOf(+(e.start || r.a))} → ${e.max || r.m} ${bandOf(+(e.max || r.m))}` : `jetzt: ${bandOf(r.a)} → ${bandOf(r.m)}`}</div>${field('Notiz', 'notiz', e.notiz, 'area', 'optional')}</div>`;
  }
  const hasM = r.m !== undefined;
  const badge = hasM ? `<span class="badge">${r.m} · ${esc(bandOf(r.m))}</span>` : '';
  const sub = kind === 'etappen' ? `Etappe ${r.e}` : kind === 'begleiter' ? esc(r.s) : esc(r.s);
  return `<div class="row${ch}" data-id="${r.id}"><div class="head"><div><div class="nm">${esc(r.n)}</div><div class="sub">${sub}</div><div class="id">${r.id}</div></div>${badge}</div>
    <div class="fields${hasM ? '' : ' nomacht'}">${field(kind === 'etappen' ? 'Titel neu' : 'Deutscher Name', 'name', e.name, 'text', r.n)}${hasM ? field('Macht neu', 'macht', e.macht, 'num', r.m) : ''}</div>
    ${hasM ? `<div class="band">${mNew ? 'neu: ' + mNew + ' · ' + esc(bandOf(mNew)) : ''}</div>` : ''}${field('Notiz', 'notiz', e.notiz, 'area', 'optional')}</div>`;
}
function skalaHtml() {
  const rows = D.skala.map((r, i) => {
    const k = 's' + String(i + 1).padStart(2, '0'), e = skala[k] || {}, ch = isChanged(e) ? ' changed' : '';
    return `<div class="row${ch}" data-sk="${k}"><div class="head"><div><div class="nm">ab ${r[0]} · ${esc(r[1])}</div><div class="sub">${esc(r[2])}</div></div></div>
      <div class="skhead">${field('ab Macht', 'ab', e.ab, 'num', r[0])}${field('Name neu', 'name', e.name, 'text', r[1])}</div>
      ${field('Beispiele neu', 'bsp', e.bsp, 'area', 'optional')}
      <button class="del${e.del ? ' on' : ''}" data-del="${k}">${e.del ? 'Gestrichen – zurückholen' : 'Stufe streichen'}</button></div>`;
  }).join('');
  const neu = Object.keys(skala).filter((k) => k.startsWith('n')).sort().map((k) => { const e = skala[k];
    return `<div class="row changed" data-sk="${k}"><div class="head"><div class="nm">Neue Stufe</div></div>
      <div class="skhead">${field('ab Macht', 'ab', e.ab, 'num', '')}${field('Name', 'name', e.name, 'text', 'z. B. Dämon')}</div>
      ${field('Beispiele', 'bsp', e.bsp, 'area', 'optional')}<button class="del${e.del ? ' on' : ''}" data-del="${k}">${e.del ? 'Gestrichen – zurückholen' : 'wieder entfernen'}</button></div>`; }).join('');
  const now = curSkala().map((r) => `${r.ab} ${esc(r.name)}`).join(' · ');
  return `<div class="list" style="padding:0">${rows}${neu}</div><button class="add" id="addStufe">+ Neue Stufe hinzufügen</button><p class="intro" style="margin-top:14px"><b>Skala mit deinen Änderungen:</b><br>${now}</p>`;
}
function render() {
  renderTabs();
  document.getElementById('intro').innerHTML = INTRO[tab];
  const main = document.getElementById('main'), q = document.getElementById('q').value.trim().toLowerCase(), only = document.getElementById('onlyChanged').checked;
  document.querySelector('.tools').hidden = tab === 'skala';
  if (tab === 'skala') { main.innerHTML = skalaHtml(); return; }
  let rows = D[tab].filter((r) => (!q || (r.n + ' ' + r.id + ' ' + (r.s || '') + ' ' + ((edits[r.id] || {}).name || '') + (r.e ? ' etappe ' + r.e : '')).toLowerCase().includes(q)) && (!only || isChanged(edits[r.id])));
  if (!rows.length) { main.innerHTML = '<div class="empty">Nichts gefunden.</div>'; return; }
  if (tab === 'bosse' || tab === 'gegner') {
    const by = {}; rows.forEach((r) => (by[r.e] = by[r.e] || []).push(r));
    main.innerHTML = Object.keys(by).map((e) => { const c = by[e].filter((r) => isChanged(edits[r.id])).length;
      return `<details class="grp" ${q || only || openGrp.has(tab + e) ? 'open' : ''} data-g="${tab + e}"><summary>Etappe ${e}: ${esc(D.etn[e - 1])}<small>${by[e].length}${c ? ' · ✎' + c : ''}</small></summary><div class="list">${by[e].map((r) => rowHtml(tab, r)).join('')}</div></details>`; }).join('');
  } else main.innerHTML = `<div class="list" style="padding:0">${rows.map((r) => rowHtml(tab, r)).join('')}</div>`;
}
const openGrp = new Set();

document.getElementById('tabs').addEventListener('click', (ev) => { const b = ev.target.closest('.tab'); if (!b) return; tab = b.dataset.t; try { localStorage.setItem('nb_tab', tab); } catch (e) {} render(); window.scrollTo(0, 0); });
document.getElementById('q').addEventListener('input', render);
document.getElementById('onlyChanged').addEventListener('change', render);
document.getElementById('main').addEventListener('toggle', (ev) => { const d = ev.target; if (d.dataset && d.dataset.g) { if (d.open) openGrp.add(d.dataset.g); else openGrp.delete(d.dataset.g); } }, true);
document.getElementById('main').addEventListener('input', (ev) => {
  const inp = ev.target; if (!inp.dataset.k) return;
  let v = inp.value;
  if (['macht', 'start', 'max', 'ab'].includes(inp.dataset.k)) { v = v.replace(/[^0-9]/g, ''); if (v !== '') v = String(Math.max(1, Math.min(30, +v))); if (inp.value !== v && inp.value.replace(/[^0-9]/g, '') !== inp.value) inp.value = v; }
  const row = inp.closest('.row');
  if (row.dataset.sk) { const k = row.dataset.sk; skala[k] = Object.assign({}, skala[k], { [inp.dataset.k]: v }); queue('skala', k, skala[k]); row.classList.toggle('changed', isChanged(skala[k]) || k.startsWith('n')); }
  else { const id = row.dataset.id; edits[id] = Object.assign({}, edits[id], { [inp.dataset.k]: v }); queue('edits', id, edits[id]); row.classList.toggle('changed', isChanged(edits[id]));
    const band = row.querySelector('.band');
    if (band && inp.dataset.k === 'macht') band.textContent = v ? 'neu: ' + v + ' · ' + bandOf(+v) : '';
    if (band && (inp.dataset.k === 'start' || inp.dataset.k === 'max')) { const r = D.helden.find((h) => h.id === id), e = edits[id]; band.textContent = `neu: ${e.start || r.a} ${bandOf(+(e.start || r.a))} → ${e.max || r.m} ${bandOf(+(e.max || r.m))}`; } }
  renderTabs();
});
document.getElementById('main').addEventListener('change', (ev) => { if (tab === 'skala' && ev.target.dataset.k) render(); });
document.getElementById('main').addEventListener('click', (ev) => {
  const d = ev.target.closest('[data-del]'); if (d) { const k = d.dataset.del; skala[k] = Object.assign({}, skala[k], { del: !(skala[k] || {}).del }); queue('skala', k, skala[k]); render(); return; }
  if (ev.target.id === 'addStufe') { const k = 'n' + Date.now(); skala[k] = { ab: '', name: '', bsp: '', del: false }; queue('skala', k, skala[k]); render(); }
});

render();
(async () => {
  try { db = window.claude && window.claude.use ? await window.claude.use('db') : null; } catch (e) { db = null; }
  if (!db) {
    document.getElementById('warn').innerHTML = '<div class="note">Speichern im Netz ist in dieser Ansicht nicht verfügbar. Deine Eingaben bleiben nur auf diesem Gerät. Öffne die Seite über claude.ai, damit Claude sie lesen kann.</div>';
    for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (!k || !k.startsWith('nb_')) continue; const [col, id] = k.slice(3).split('/'); try { const v = JSON.parse(localStorage.getItem(k)); if (col === 'edits') edits[id] = v; if (col === 'skala') skala[id] = v; } catch (e) {} }
    setStatus('nur lokal'); render(); return;
  }
  const strip = (o) => { const c = Object.assign({}, o); delete c.t; return c; };
  let first = { e: true, s: true };
  db.collection('edits').onSnapshot((snap) => {
    const active = document.activeElement && document.activeElement.closest && document.activeElement.closest('.row');
    snap.docs.forEach((d) => { if (!pending['edits/' + d.id]) edits[d.id] = strip(d.data()); });
    if (first.e || !active) render(); else renderTabs(); first.e = false; setStatus('bereit · wird automatisch gespeichert', 'saved');
  }, () => setStatus('Verbindung verloren – bitte neu laden', 'err'));
  db.collection('skala').onSnapshot((snap) => {
    const active = document.activeElement && document.activeElement.closest && document.activeElement.closest('.row');
    snap.docs.forEach((d) => { if (!pending['skala/' + d.id]) skala[d.id] = strip(d.data()); });
    if (first.s || !active) render(); else renderTabs(); first.s = false;
  }, () => setStatus('Verbindung verloren – bitte neu laden', 'err'));
})();
